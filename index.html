<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Invitaciones Digitales</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <script>
      tailwind.config = {
        theme: {
          extend: {
            fontFamily: {
              sans: ['Inter', 'sans-serif'],
              mono: ['JetBrains Mono', 'monospace'],
            },
            colors: {
              gemini: {
                50: '#f0f9ff',
                100: '#e0f2fe',
                400: '#38bdf8',
                500: '#0ea5e9',
                600: '#0284c7',
                900: '#0c4a6e',
              }
            }
          },
        },
      }
    </script>
    <style>
      body {
        background-color: #fdf2f8; /* pink-50 */
        color: #1f2937; /* gray-800 */
      }
      /* Custom scrollbar for modern feel */
      ::-webkit-scrollbar {
        width: 8px;
        height: 8px;
      }
      ::-webkit-scrollbar-track {
        background: #fce7f3; /* pink-100 */
      }
      ::-webkit-scrollbar-thumb {
        background: #f9a8d4; /* pink-300 */
        border-radius: 4px;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: #f472b6; /* pink-400 */
      }
      /* ============================================================
         .landing-prose — tipografía para el HTML generado por IA en las
         páginas de producto (ProductLandingView). El CDN de Tailwind no
         incluye el plugin typography (las clases `prose` no existen), por
         lo que el contenido inyectado se estiliza aquí de forma explícita.
         El acento (checks/enlaces) usa --lp-accent (color primario de la
         plantilla, asignado inline por el componente).
         ============================================================ */
      .landing-prose {
        color: inherit;
        font-size: 1.0625rem;
        line-height: 1.75;
      }
      .landing-prose p {
        margin: 0 0 1rem;
      }
      .landing-prose p:last-child {
        margin-bottom: 0;
      }
      .landing-prose h3 {
        font-size: 1.125rem;
        font-weight: 600;
        color: inherit;
        margin: 1.4rem 0 0.6rem;
      }
      .landing-prose h3:first-child {
        margin-top: 0;
      }
      .landing-prose ul {
        margin: 0 0 1rem;
        padding: 0;
        list-style: none;
      }
      .landing-prose ul:last-child {
        margin-bottom: 0;
      }
      .landing-prose ul li {
        position: relative;
        padding-left: 1.6rem;
        margin-bottom: 0.5rem;
      }
      .landing-prose ul li:last-child {
        margin-bottom: 0;
      }
      .landing-prose ul li::before {
        content: '✓';
        position: absolute;
        left: 0;
        top: 0;
        color: var(--lp-accent, #e11d48);
        font-weight: 700;
      }
      .landing-prose ol {
        margin: 0 0 1rem 1.4rem;
        padding: 0;
        list-style: decimal;
      }
      .landing-prose ol li {
        margin-bottom: 0.5rem;
      }
      .landing-prose strong {
        font-weight: 600;
      }
      .landing-prose em {
        font-style: italic;
      }
      .landing-prose a {
        color: var(--lp-accent, #e11d48);
        text-decoration: underline;
      }
      /* Variante centrada para secciones con layout centrado (hero, cta, etc.) */
      .landing-prose--center {
        text-align: center;
      }
      .landing-prose--center ul {
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 0.4rem 1.4rem;
        margin-bottom: 1rem;
      }
      .landing-prose--center ul li {
        padding-left: 1.6rem;
        margin-bottom: 0;
      }
      /* Variante lista con viñetas neutras (para FAQ fallback y bloques de texto largo) */
      .landing-prose--flat {
        text-align: left;
        font-size: 1rem;
        color: #4b5563; /* gray-600 */
      }
    </style>
  <script type="importmap">
{
  "imports": {
    "react": "https://aistudiocdn.com/react@^19.2.1",
    "react-dom/": "https://aistudiocdn.com/react-dom@^19.2.1/",
    "react/": "https://aistudiocdn.com/react@^19.2.1/",
    "@google/genai": "https://aistudiocdn.com/@google/genai@^1.32.0",
    "lucide-react": "https://aistudiocdn.com/lucide-react@^0.556.0"
  }
}
</script>
<!-- CSS eliminado - se usa Tailwind CDN -->
</head>
  <body>
    <div id="root"></div>
  <script type="module" src="/index.tsx"></script>
</body>
</html>
