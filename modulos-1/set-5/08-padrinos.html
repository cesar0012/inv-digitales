  <script>
    (function () {
      var root = document.currentScript ? document.currentScript.closest('section') : document.querySelector('.ne-padrinos');
      if (!root) return;
      root.classList.add('ne-js');
      window.setTimeout(function () { root.classList.add('esta-visto'); }, 2500); // red de seguridad: nunca dejar contenido oculto
      var creditos = Array.prototype.slice.call(root.querySelectorAll('[data-ne-credito]'));
      var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
      if (reduce || !('IntersectionObserver' in window)) {
        creditos.forEach(function (c) { c.classList.add('esta-visto'); });
        return;
      }
      var io = new IntersectionObserver(function (entries) {
        entries.forEach(function (entry) {
          if (!entry.isIntersecting) return;
          var i = creditos.indexOf(entry.target);
          entry.target.style.transitionDelay = (Math.max(i, 0) * 0.1).toFixed(2) + 's';
          entry.target.classList.add('esta-visto');
          io.unobserve(entry.target);
        });
      }, { threshold: 0.25 });
      creditos.forEach(function (c) { io.observe(c); });
    })();
  </script>
