  <style>
    .ne-regalos {
      --primary-color: #f2f4fa;
      --secondary-color: #9aa3b8;
      --accent-color: #ff4d7d;
      --bg-color: #14161d;
      --surface-color: #1b1e27;
      --surface-border-color: rgba(255, 255, 255, 0.14);
      --text-color: #f2f4fa;

      position: relative;
      isolation: isolate;
      box-sizing: border-box;
      padding: clamp(3rem, 8vw, 6rem) clamp(1rem, 5vw, 4rem);
      background-color: var(--bg-color);
      background-image: url('https://loremflickr.com/1600/900/dark,gift');
      background-size: cover;
      background-position: center;
      color: var(--text-color);
    }
    .ne-regalos *,
    .ne-regalos *::before,
    .ne-regalos *::after { box-sizing: border-box; }

    .ne-regalos::before {
      content: '';
      position: absolute;
      inset: 0;
      z-index: -1;
      background: color-mix(in srgb, var(--bg-color) 90%, transparent);
    }

    .ne-regalos__panel {
      width: min(100%, 660px);
      margin: 0 auto;
      padding: clamp(2rem, 5vw, 3.2rem) clamp(1.4rem, 4.5vw, 3rem);
      background: color-mix(in srgb, var(--surface-color) 92%, transparent);
      border: 1px solid var(--surface-border-color);
      box-shadow: 0 28px 60px rgba(0, 0, 0, 0.5);
    }

    .ne-regalos__cabecera {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 1rem;
      margin-bottom: 0.6rem;
      border-bottom: 1px solid var(--surface-border-color);
      padding-bottom: 0.8rem;
    }
    .ne-regalos__titulo {
      margin: 0;
      font-family: Georgia, 'Times New Roman', serif;
      font-weight: 400;
      font-size: clamp(1.6rem, 3.6vw, 2.2rem);
      color: var(--primary-color);
    }
    .ne-regalos__folio {
      font-family: 'Courier New', monospace;
      font-size: clamp(0.6rem, 1.1vw, 0.7rem);
      letter-spacing: 0.3em;
      color: var(--secondary-color);
    }
    .ne-regalos__intro {
      margin: 0 0 1.5rem;
      font-family: Arial, Helvetica, sans-serif;
      font-size: clamp(0.84rem, 1.5vw, 0.94rem);
      line-height: 1.7;
      color: var(--secondary-color);
    }

    .ne-regalos__lista { display: grid; gap: 0; border-top: 1px solid var(--surface-border-color); margin-bottom: 1.6rem; }
    .ne-regalos__fila {
      display: grid;
      grid-template-columns: auto 1fr auto;
      gap: 0.9rem;
      align-items: center;
      padding: clamp(0.85rem, 2.2vw, 1.1rem) 0.3rem;
      border-bottom: 1px solid var(--surface-border-color);
      transition: opacity 0.5s ease, transform 0.5s ease;
    }
    .ne-regalos.ne-js .ne-regalos__fila { opacity: 0; transform: translateX(-12px); }
    .ne-regalos .ne-regalos__fila.esta-visto { opacity: 1; transform: none; }
    .ne-regalos__check {
      width: 16px;
      height: 16px;
      border: 1px solid var(--secondary-color);
      display: grid;
      place-items: center;
      color: var(--accent-color);
      font-size: 0.7rem;
      line-height: 1;
    }
    .ne-regalos__nombre {
      font-family: Georgia, 'Times New Roman', serif;
      font-size: clamp(0.92rem, 1.75vw, 1.04rem);
      color: var(--primary-color);
    }
    .ne-regalos__via {
      font-family: 'Courier New', monospace;
      font-size: clamp(0.58rem, 1.1vw, 0.66rem);
      letter-spacing: 0.22em;
      text-transform: uppercase;
      color: var(--secondary-color);
    }

    .ne-regalos__zona-boton { text-align: center; }
    .ne-regalos__boton {
      position: relative;
      min-width: 230px;
      padding: 0.85rem 2rem;
      border: 1px solid var(--accent-color);
      background: transparent;
      color: var(--accent-color);
      font-family: 'Courier New', monospace;
      font-size: clamp(0.68rem, 1.3vw, 0.78rem);
      letter-spacing: 0.32em;
      text-transform: uppercase;
      cursor: pointer;
      box-shadow: inset 0 0 16px color-mix(in srgb, var(--accent-color) 15%, transparent);
      transition: background 0.4s ease, color 0.4s ease, box-shadow 0.4s ease;
    }
    .ne-regalos__boton:hover { box-shadow: inset 0 0 24px color-mix(in srgb, var(--accent-color) 30%, transparent), 0 0 20px color-mix(in srgb, var(--accent-color) 30%, transparent); }
    .ne-regalos__boton.esta-listo { background: var(--accent-color); color: var(--bg-color); box-shadow: 0 0 30px color-mix(in srgb, var(--accent-color) 60%, transparent); }
    .ne-regalos__nota {
      margin-top: 0.9rem;
      font-family: 'Courier New', monospace;
      font-size: clamp(0.68rem, 1.3vw, 0.76rem);
      letter-spacing: 0.14em;
      color: var(--secondary-color);
    }

    @media (max-width: 520px) {
      .ne-regalos__fila { grid-template-columns: auto 1fr; }
      .ne-regalos__via { grid-column: 2; }
    }

    @media (prefers-reduced-motion: reduce) {
      .ne-regalos * { transition: none !important; }
      .ne-regalos__fila { opacity: 1 !important; transform: none !important; }
    }
  </style>

  <div class="ne-regalos__panel">

  <script>
    (function () {
      var root = document.currentScript ? document.currentScript.closest('section') : document.querySelector('.ne-regalos');
      if (!root) return;
      root.classList.add('ne-js');
      window.setTimeout(function () { root.classList.add('esta-visto'); }, 2500); // red de seguridad: nunca dejar contenido oculto

      var filas = Array.prototype.slice.call(root.querySelectorAll('[data-ne-fila]'));
      var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
      if (('IntersectionObserver' in window) && !reduce) {
        var io = new IntersectionObserver(function (entries) {
          entries.forEach(function (entry) {
            if (!entry.isIntersecting) return;
            filas.forEach(function (fila, i) { fila.style.transitionDelay = (i * 0.11).toFixed(2) + 's'; });
            filas.forEach(function (fila) { fila.classList.add('esta-visto'); });
            io.disconnect();
          });
        }, { threshold: 0.3 });
        io.observe(root.querySelector('[data-ne-lista]') || root);
      } else {
        filas.forEach(function (fila) { fila.classList.add('esta-visto'); });
      }

      var boton = root.querySelector('[data-ne-boton]');
      var texto = root.querySelector('[data-ne-boton-texto]');
      if (boton && texto) {
        boton.addEventListener('click', function () {
          var listo = boton.classList.toggle('esta-listo');
          texto.textContent = listo ? 'Regalo agendado' : 'Agendar regalo';
        });
      }
    })();
  </script>
