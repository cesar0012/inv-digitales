<section
  class="ne-confirmacion"
  data-gemini-id="confirmacion-texto"
  memory_type="background"
  memory_usage="protected"
  memory_source="generated"
  path="placeholder"
>
  <style>
    .ne-confirmacion {
      --primary-color: #f2f4fa;
      --secondary-color: #9aa3b8;
      --accent-color: #ff4d7d;
      --bg-color: #14161d;
      --surface-color: #1b1e27;
      --surface-border-color: rgba(255, 255, 255, 0.14);
      --text-color: #f2f4fa;

      position: relative;
      isolation: isolate;
      overflow: hidden;
      box-sizing: border-box;
      min-height: 72svh;
      display: grid;
      place-items: center;
      padding: clamp(3rem, 8vw, 6rem) clamp(1rem, 5vw, 4rem);
      background-color: var(--bg-color);
      background-image: url('https://loremflickr.com/1600/900/neon,dark');
      background-size: cover;
      background-position: center;
      color: var(--text-color);
      text-align: center;
    }
    .ne-confirmacion *,
    .ne-confirmacion *::before,
    .ne-confirmacion *::after { box-sizing: border-box; }

    .ne-confirmacion::before {
      content: '';
      position: absolute;
      inset: 0;
      z-index: -1;
      background: color-mix(in srgb, var(--bg-color) 90%, transparent);
    }

    .ne-confirmacion__marco {
      position: relative;
      width: min(100%, 640px);
      padding: clamp(2.2rem, 5.5vw, 3.5rem) clamp(1.4rem, 4.5vw, 3rem);
      background: color-mix(in srgb, var(--surface-color) 92%, transparent);
      border: 1px solid var(--surface-border-color);
      box-shadow: 0 30px 64px rgba(0, 0, 0, 0.5);
    }
    .ne-confirmacion__marco::before {
      content: '';
      position: absolute;
      inset: 8px;
      border: 1px dashed var(--surface-border-color);
      pointer-events: none;
    }

    .ne-confirmacion__etiqueta {
      margin: 0 0 0.8rem;
      display: inline-block;
      padding: 0.3rem 1rem;
      border: 1px solid var(--accent-color);
      color: var(--accent-color);
      font-family: 'Courier New', monospace;
      font-size: clamp(0.58rem, 1.1vw, 0.66rem);
      letter-spacing: 0.4em;
      text-transform: uppercase;
      box-shadow: 0 0 14px color-mix(in srgb, var(--accent-color) 30%, transparent);
    }
    .ne-confirmacion__titulo {
      margin: 0 0 1rem;
      font-family: Georgia, 'Times New Roman', serif;
      font-weight: 400;
      font-size: clamp(1.7rem, 3.8vw, 2.4rem);
      line-height: 1.15;
      color: var(--primary-color);
      text-shadow: 0 0 18px color-mix(in srgb, var(--accent-color) 30%, transparent);
    }
    .ne-confirmacion__texto {
      margin: 0 auto 1.4rem;
      max-width: 46ch;
      font-family: Arial, Helvetica, sans-serif;
      font-size: clamp(0.86rem, 1.55vw, 0.96rem);
      line-height: 1.8;
      color: var(--secondary-color);
    }

    .ne-confirmacion__limite {
      display: inline-flex;
      align-items: center;
      gap: 0.8rem;
      font-family: 'Courier New', monospace;
      font-size: clamp(0.72rem, 1.4vw, 0.84rem);
      letter-spacing: 0.2em;
      color: var(--text-color);
    }
    .ne-confirmacion__limite::before,
    .ne-confirmacion__limite::after {
      content: '';
      width: 34px;
      height: 1px;
      background: var(--accent-color);
      box-shadow: 0 0 8px var(--accent-color);
    }
    .ne-confirmacion__limite time {
      color: var(--accent-color);
      text-shadow: 0 0 12px color-mix(in srgb, var(--accent-color) 80%, transparent);
    }

    @media (max-width: 560px) {
      .ne-confirmacion { min-height: 62svh; }
      .ne-confirmacion__marco { padding: 2.2rem 1.2rem; }
    }
  </style>

  <div class="ne-confirmacion__marco">
    <p class="ne-confirmacion__etiqueta" memory_type="text" memory_usage="custom" memory_key="confirmacion-etiqueta">RSVP</p>
    <h2 class="ne-confirmacion__titulo" memory_type="text" memory_usage="custom" memory_key="confirmacion-titulo">Tu nombre en la lista</h2>
    <p class="ne-confirmacion__texto" memory_type="text" memory_usage="custom" memory_key="confirmacion-texto">
      La edición sale a la luz una sola vez. Confirma con el enlace de tu invitación digital
      y tu lugar quedará reservado en esta historia nocturna.
    </p>
    <p class="ne-confirmacion__limite" memory_type="text" memory_usage="custom" memory_key="confirmacion-rotulo">
      Confirma antes del <time datetime="YYYY-MM-DD" memory_type="text" memory_usage="custom" memory_key="confirmacion-fecha">DD de mes</time>
    </p>
  </div>

  <script>
    var moduleMetadata = {
      module_type: 'confirmacion',
      module_name: 'confirmacion-texto',
      style_name: 'Neón Editorial — Confirmación',
      descripcion: 'Marco editorial con doble fileto punteado, etiqueta RSVP de neón y fecha límite entre reglas luminosas; sin formularios.',
      tags: ['confirmacion', 'rsvp', 'neon', 'editorial', 'fecha limite', 'nocturno'],
      tipo: 'confirmacion'
    };
  </script>
</section>
