  <style>
    .ne-padres {
      --primary-color: #f2f4fa;
      --secondary-color: #9aa3b8;
      --accent-color: #ff4d7d;
      --bg-color: #14161d;
      --surface-color: #1b1e27;
      --surface-border-color: rgba(255, 255, 255, 0.14);
      --text-color: #f2f4fa;

      position: relative;
      isolation: isolate;
      box-sizing: border-box;
      padding: clamp(3rem, 8vw, 6rem) clamp(1rem, 5vw, 4rem);
      background-color: var(--bg-color);
      background-image: url('https://loremflickr.com/1600/900/dark,texture');
      background-size: cover;
      background-position: center;
      color: var(--text-color);
    }
    .ne-padres *,
    .ne-padres *::before,
    .ne-padres *::after { box-sizing: border-box; }

    .ne-padres::before {
      content: '';
      position: absolute;
      inset: 0;
      z-index: -1;
      background: color-mix(in srgb, var(--bg-color) 90%, transparent);
    }

    .ne-padres__cabecera {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 1rem;
      width: min(100%, 880px);
      margin: 0 auto clamp(1.8rem, 4vw, 2.6rem);
      border-bottom: 1px solid var(--surface-border-color);
      padding-bottom: 0.9rem;
    }
    .ne-padres__titulo {
      margin: 0;
      font-family: Georgia, 'Times New Roman', serif;
      font-weight: 400;
      font-size: clamp(1.6rem, 3.6vw, 2.3rem);
      color: var(--primary-color);
    }
    .ne-padres__folio {
      font-family: 'Courier New', monospace;
      font-size: clamp(0.6rem, 1.1vw, 0.7rem);
      letter-spacing: 0.3em;
      color: var(--secondary-color);
    }
    .ne-padres__intro {
      width: min(100%, 880px);
      margin: 0 auto clamp(2rem, 5vw, 3rem);
      font-family: Arial, Helvetica, sans-serif;
      font-size: clamp(0.84rem, 1.5vw, 0.94rem);
      line-height: 1.7;
      color: var(--secondary-color);
    }

    .ne-padres__grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: clamp(1.4rem, 4vw, 2.6rem);
      width: min(100%, 880px);
      margin: 0 auto;
    }

    .ne-padres__ficha {
      position: relative;
      padding: clamp(1.6rem, 3.6vw, 2.3rem) clamp(1.2rem, 3vw, 1.9rem);
      background: color-mix(in srgb, var(--surface-color) 92%, transparent);
      border: 1px solid var(--surface-border-color);
      box-shadow: 0 22px 48px rgba(0, 0, 0, 0.45);
      transition: opacity 0.5s ease, transform 0.5s cubic-bezier(0.22, 0.8, 0.3, 1), border-color 0.5s ease;
    }
    .ne-padres.ne-js .ne-padres__ficha { opacity: 0; transform: translateY(20px); }
    .ne-padres .ne-padres__ficha.esta-visto { opacity: 1; transform: none; }
    .ne-padres__ficha:hover { border-color: color-mix(in srgb, var(--accent-color) 60%, transparent); }
    .ne-padres__ficha::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 2px;
      background: linear-gradient(90deg, var(--accent-color), transparent);
      box-shadow: 0 0 12px color-mix(in srgb, var(--accent-color) 70%, transparent);
    }

    .ne-padres__retrato {
      width: clamp(100px, 14vw, 132px);
      margin: 0 auto 1rem;
      padding: 4px;
      border: 1px solid var(--surface-border-color);
      border-radius: 50%;
      box-shadow: 0 0 18px color-mix(in srgb, var(--accent-color) 25%, transparent);
    }
    .ne-padres__retrato img {
      color: transparent;
      display: block;
      width: 100%;
      height: auto;
      aspect-ratio: 1 / 1;
      border-radius: 50%;
      object-fit: cover;
      filter: saturate(0.95);
    }

    .ne-padres__rol {
      margin: 0 0 0.35rem;
      font-family: 'Courier New', monospace;
      font-size: clamp(0.58rem, 1.05vw, 0.66rem);
      letter-spacing: 0.4em;
      text-transform: uppercase;
      color: var(--accent-color);
    }
    .ne-padres__nombres {
      margin: 0;
      font-family: Georgia, 'Times New Roman', serif;
      font-size: clamp(1.06rem, 2.2vw, 1.36rem);
      line-height: 1.3;
      color: var(--primary-color);
    }

    @media (max-width: 740px) {
      .ne-padres__grid { grid-template-columns: 1fr; max-width: 400px; }
    }

    @media (prefers-reduced-motion: reduce) {
      .ne-padres * { transition: none !important; }
      .ne-padres__ficha { opacity: 1 !important; transform: none !important; }
    }
  </style>

  <header class="ne-padres__cabecera" memory_type="text" memory_usage="custom" memory_key="padres-intro">
    <h2 class="ne-padres__titulo" memory_type="text" memory_usage="custom" memory_key="padres-titulo">Dos casas, una portada</h2>
    <span class="ne-padres__folio" memory_type="text" memory_usage="custom" memory_key="padres-folio">FAM / 2026</span>

  <p class="ne-padres__intro" memory_type="text" memory_usage="custom" memory_key="padres-texto">Detrás de cada edición nocturna hay dos familias que encendieron la primera luz.</p>

  <script>
    (function () {
      var root = document.currentScript ? document.currentScript.closest('section') : document.querySelector('.ne-padres');
      if (!root) return;
      root.classList.add('ne-js');
      window.setTimeout(function () { root.classList.add('esta-visto'); }, 2500); // red de seguridad: nunca dejar contenido oculto
      var fichas = Array.prototype.slice.call(root.querySelectorAll('[data-ne-ficha]'));
      var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
      if (reduce || !('IntersectionObserver' in window)) {
        fichas.forEach(function (f) { f.classList.add('esta-visto'); });
        return;
      }
      var io = new IntersectionObserver(function (entries) {
        entries.forEach(function (entry) {
          if (!entry.isIntersecting) return;
          var i = fichas.indexOf(entry.target);
          entry.target.style.transitionDelay = (Math.max(i, 0) * 0.14).toFixed(2) + 's';
          entry.target.classList.add('esta-visto');
          io.unobserve(entry.target);
        });
      }, { threshold: 0.25 });
      fichas.forEach(function (f) { io.observe(f); });
    })();
  </script>
