<section class="ne-cd2" data-gemini-id="countdown-flip-neon" path="placeholder" memory_source="generated" memory_type="background" memory_usage="protected" data-countdown-target="YYYY-MM-DDTHH:MM:SS">
<style>
.ne-cd2 { --primary-color:#f2f4fa; --secondary-color:#9aa3b8; --accent-color:#ff4d7d; --bg-color:#14161d; --surface-color:#1b1e27; --surface-border-color:rgba(255,255,255,.14); --text-color:#f2f4fa;

.ne-cd2__tapa-sup { align-items:end; }

.ne-cd2__tapa-sup span { transform:translateY(28%); }
.ne-cd2__tapa-inf span { transform:translateY(-28%); }

.ne-cd2__rotulo { margin-top:.55rem; display:block; font-family:'Courier New',monospace; font-size:clamp(.54rem,1.05vw,.62rem); letter-spacing:.38em; text-transform:uppercase; color:var(--secondary-color); }
.ne-cd2__scan { position:absolute; inset:0; z-index:0; background:repeating-linear-gradient(0deg, rgba(255,255,255,.02) 0 1px, transparent 1px 4px); pointer-events:none; }
@media (max-width:560px){ .ne-cd2__flips { flex-wrap:wrap; } }
@media (prefers-reduced-motion:reduce){ .ne-cd2__cambio .ne-cd2__tapa-sup { animation:none; } }
</style>
<div style="position:relative; z-index:2;">

  </div>
</div>
<span class="ne-cd2__scan" aria-hidden="true"></span>
<script>
(function(){ var el=null; try{ el=document.currentScript.closest('[data-gemini-id^="countdown"]'); }catch(e){} if(!el) el=document.querySelector('[data-gemini-id^="countdown"]'); if(!el) return;

</script>
