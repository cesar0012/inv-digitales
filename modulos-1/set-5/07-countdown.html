<section
  class="ne-countdown"
  data-gemini-id="countdown-editorial-neon"
  path="placeholder"
  memory_source="generated"
  memory_type="background"
  memory_usage="protected"
  data-countdown-target="YYYY-MM-DDTHH:MM:SS"
>
  <style>
    .ne-countdown {
      position: relative;
      isolation: isolate;
      overflow: hidden;
      box-sizing: border-box;
      min-height: 640px;
      display: grid;
      place-items: center;
      padding: clamp(3rem, 7vw, 5rem) clamp(1rem, 5vw, 3rem);
      background-color: var(--bg-color, #14161d);
      background-image: url('https://loremflickr.com/1600/900/neon,night');
      background-size: cover;
      background-position: center;
      color: var(--text-color, #f2f4fa);
      text-align: center;
    }
    .ne-countdown *,
    .ne-countdown *::before,
    .ne-countdown *::after { box-sizing: border-box; }

    .ne-countdown::before {
      content: '';
      position: absolute;
      inset: 0;
      z-index: -1;
      background: color-mix(in srgb, var(--bg-color, #14161d) 90%, transparent);
    }

    .ne-countdown__etiqueta {
      margin: 0 0 0.6rem;
      font-family: 'Courier New', monospace;
      font-size: clamp(0.6rem, 1.15vw, 0.68rem);
      letter-spacing: 0.46em;
      text-transform: uppercase;
      color: var(--accent-color, #ff4d7d);
      text-shadow: 0 0 14px color-mix(in srgb, var(--accent-color, #ff4d7d) 70%, transparent);
    }
    .ne-countdown__titulo {
      margin: 0 0 0.4rem;
      font-family: Georgia, 'Times New Roman', serif;
      font-weight: 400;
      font-size: clamp(1.8rem, 4.2vw, 2.8rem);
      color: var(--primary-color, #f2f4fa);
    }
    .ne-countdown__fecha {
      display: block;
      margin-bottom: clamp(1.6rem, 4vw, 2.4rem);
      font-family: 'Courier New', monospace;
      font-size: clamp(0.74rem, 1.5vw, 0.88rem);
      letter-spacing: 0.32em;
      text-transform: uppercase;
      color: var(--secondary-color, #9aa3b8);
    }

    .ne-countdown__tablero {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: clamp(0.7rem, 2vw, 1.2rem);
      max-width: 680px;
      margin: 0 auto;
    }
    .ne-countdown__celda {
      position: relative;
      padding: clamp(1.2rem, 3vw, 1.8rem) 0.4rem clamp(1rem, 2.4vw, 1.4rem);
      background: color-mix(in srgb, var(--surface-color, #1b1e27) 92%, transparent);
      border: 1px solid var(--surface-border-color, rgba(255, 255, 255, 0.14));
      box-shadow: 0 18px 40px rgba(0, 0, 0, 0.45);
      overflow: hidden;
    }
    .ne-countdown__celda::after {
      content: '';
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      height: 2px;
      background: var(--accent-color, #ff4d7d);
      box-shadow: 0 0 12px var(--accent-color, #ff4d7d);
      opacity: 0.7;
    }
    .ne-countdown__numero {
      display: block;
      font-family: Georgia, 'Times New Roman', serif;
      font-size: clamp(1.9rem, 5.2vw, 3.1rem);
      font-variant-numeric: tabular-nums;
      line-height: 1;
      color: var(--primary-color, #f2f4fa);
      text-shadow: 0 0 20px color-mix(in srgb, var(--accent-color, #ff4d7d) 40%, transparent);
    }
    .ne-countdown__rotulo {
      display: block;
      margin-top: 0.5rem;
      font-family: 'Courier New', monospace;
      font-size: clamp(0.54rem, 1.05vw, 0.62rem);
      letter-spacing: 0.38em;
      text-transform: uppercase;
      color: var(--secondary-color, #9aa3b8);
    }

    .ne-countdown__segundero {
      display: inline-flex;
      align-items: center;
      gap: 0.7rem;
      margin-top: clamp(1.4rem, 3.4vw, 2rem);
      padding: 0.5rem 1.4rem;
      border: 1px solid var(--surface-border-color, rgba(255, 255, 255, 0.14));
      font-family: 'Courier New', monospace;
      font-size: clamp(0.8rem, 1.6vw, 0.95rem);
      letter-spacing: 0.24em;
      color: var(--accent-color, #ff4d7d);
      text-shadow: 0 0 10px color-mix(in srgb, var(--accent-color, #ff4d7d) 80%, transparent);
    }
    .ne-countdown__punto {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--accent-color, #ff4d7d);
      box-shadow: 0 0 10px var(--accent-color, #ff4d7d);
      animation: neCountdownLatido 1s steps(2) infinite;
    }
    @keyframes neCountdownLatido { 50% { opacity: 0.25; } }

    @media (max-width: 560px) {
      .ne-countdown__tablero { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .ne-countdown { min-height: 580px; }
    }

    @media (prefers-reduced-motion: reduce) {
      .ne-countdown__punto { animation: none; }
    }
  </style>

  <div class="ne-countdown__contenido">
    <p class="ne-countdown__etiqueta" memory_type="text" memory_usage="custom" memory_key="countdown-etiqueta">Próxima edición</p>
    <h2 class="ne-countdown__titulo" memory_type="text" memory_usage="custom" memory_key="countdown-titulo">Cuenta regresiva</h2>
    <time class="ne-countdown__fecha" datetime="YYYY-MM-DDTHH:MM:SS" memory_type="text" memory_usage="custom" memory_key="countdown-fecha">Fecha del evento</time>

    <div class="ne-countdown__tablero" aria-label="Cuenta regresiva">
      <div class="ne-countdown__celda"><span class="ne-countdown__numero" data-countdown-unit="days">--</span><span class="ne-countdown__rotulo">Días</span></div>
      <div class="ne-countdown__celda"><span class="ne-countdown__numero" data-countdown-unit="hours">--</span><span class="ne-countdown__rotulo">Horas</span></div>
      <div class="ne-countdown__celda"><span class="ne-countdown__numero" data-countdown-unit="minutes">--</span><span class="ne-countdown__rotulo">Min</span></div>
      <div class="ne-countdown__celda"><span class="ne-countdown__numero" data-countdown-unit="seconds">--</span><span class="ne-countdown__rotulo">Seg</span></div>
    </div>

    <p class="ne-countdown__segundero" aria-hidden="true">
      <span class="ne-countdown__punto"></span>
      <span data-ne-live>EN VIVO EN</span>
    </p>
  </div>

  <script>
    (function () {
      var el = null;
      try { el = document.currentScript.closest('[data-gemini-id^="countdown"]'); } catch (e) {}
      if (!el) el = document.querySelector('[data-gemini-id^="countdown"]');
      if (!el) return;

      var live = el.querySelector('[data-ne-live]');
      var target = NaN;
      var attr = el.getAttribute('data-countdown-target');
      if (attr && attr.indexOf('YYYY') === -1) { var p = new Date(attr); if (!isNaN(p.getTime())) target = p.getTime(); }
      if (isNaN(target) && window.__countdownTarget) { var p1 = new Date(window.__countdownTarget); if (!isNaN(p1.getTime())) target = p1.getTime(); }
      if (isNaN(target) && window.countdown_target) { var p2 = new Date(window.countdown_target); if (!isNaN(p2.getTime())) target = p2.getTime(); }

      var intervalId = null;
      (window.__countdownIntervals = window.__countdownIntervals || []).forEach(clearInterval);
      window.__countdownIntervals = [];

      function pad2(n) { return n < 10 ? '0' + n : '' + n; }
      function setUnit(unit, value) {
        var node = el.querySelector('[data-countdown-unit="' + unit + '"]');
        if (node) node.textContent = value;
      }
      function tick() {
        if (!Number.isFinite(target)) return;
        var diff = Math.max(target - Date.now(), 0);
        setUnit('days', Math.floor(diff / 86400000));
        setUnit('hours', pad2(Math.floor((diff % 86400000) / 3600000)));
        setUnit('minutes', pad2(Math.floor((diff % 3600000) / 60000)));
        var s = Math.floor((diff % 60000) / 1000);
        setUnit('seconds', pad2(s));
        if (live) live.textContent = 'EN VIVO EN ' + pad2(Math.floor(diff / 1000));
        if (diff === 0 && intervalId !== null) {
          clearInterval(intervalId);
          intervalId = null;
          window.__countdownIntervals = [];
        }
      }
      function start(newTarget) {
        if (newTarget) { var p = new Date(newTarget); if (!isNaN(p.getTime())) target = p.getTime(); }
        (window.__countdownIntervals || []).forEach(clearInterval);
        window.__countdownIntervals = [];
        intervalId = null;
        if (!Number.isFinite(target)) return;
        tick();
        if (target > Date.now()) {
          intervalId = setInterval(tick, 1000);
          window.__countdownIntervals.push(intervalId);
        }
      }
      start();
      window.updateCountdown = start;
    })();
  </script>

  <script>
    var moduleMetadata = {
      module_type: 'countdown',
      module_name: 'countdown-editorial-neon',
      style_name: 'Tablero de Neón',
      descripcion: 'Tablero nocturno de cuatro celdas con reglas de neón, numerales con glow y letrero EN VIVO que late cada segundo.',
      tags: ['countdown', 'cuenta regresiva', 'neon', 'tablero', 'glow', 'nocturno'],
      tipo: 'countdown'
    };
  </script>
</section>
