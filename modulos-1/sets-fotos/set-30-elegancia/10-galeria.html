  <style>
    @import url('https://fonts.googleapis.com/css2?family=Jost:ital,wght@0,200;0,300;0,400;1,200;1,300&family=Manrope:wght@200;300;400;500&display=swap');

    .em-gal, .em-gal *, .em-gal *::before, .em-gal *::after { box-sizing: border-box; }
    .em-gal {
      --t-bg: var(--bg-color, #ffffff);
      --t-tx: var(--text-color, #2b2b2b);
      --t-p: var(--primary-color, #b76e79);
      --t-s: var(--secondary-color, #8a837f);
      --t-a: var(--accent-color, #e4c6ba);
      --t-display: var(--font-script, 'Jost', 'Helvetica Neue', Arial, sans-serif);
      --t-text: var(--font-heading, 'Manrope', 'Helvetica Neue', Arial, sans-serif);
      position: relative;
      isolation: isolate;
      min-height: clamp(34rem, 70vw, 56rem);
      display: grid;
      place-items: center;
      padding: clamp(5rem, 10vw, 8rem) clamp(1.25rem, 6vw, 5rem);
      overflow: hidden;
      background-color: var(--t-bg);
      color: var(--t-tx);
      font-family: var(--t-text);
    }
    .em-gal__paper { position: absolute; inset: 0; width: 100%; height: 100%; z-index: -1; pointer-events: none; mix-blend-mode: multiply; opacity: .36; }
    .em-gal__inner { width: min(100%, 60rem); display: grid; gap: clamp(2.6rem, 5vw, 4rem); }
    .em-gal__head { display: flex; flex-wrap: wrap; align-items: end; justify-content: space-between; gap: 1rem 3rem; }
    .em-gal__head-text { display: grid; gap: 1rem; }
    .em-gal__eyebrow {
      margin: 0;
      display: flex;
      align-items: center;
      gap: .8rem;
      font-family: var(--t-display);
      font-style: italic;
      font-weight: 300;
      font-size: 1.05rem;
      color: var(--t-s);
    }
    .em-gal__eyebrow::before { content: ''; width: 2.2rem; height: 1px; background: var(--t-p); }
    .em-gal__title { margin: 0; font-family: var(--t-display); font-weight: 200; font-size: clamp(2.3rem, 4.6vw, 3.6rem); line-height: 1.04; letter-spacing: -.02em; }
    .em-gal__lead { margin: 0; max-width: 20rem; font-weight: 300; line-height: 1.7; color: var(--t-s); }

    .em-gal__grid {
      list-style: none;
      margin: 0;
      padding: 0;
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(min(100%, 17rem), 1fr));
      grid-auto-flow: dense;
      gap: clamp(.75rem, 1.4vw, 1rem);
    }
    .em-gal__tile { position: relative; }
    .em-gal__figure { margin: 0; height: 100%; background: color-mix(in srgb, var(--t-a) 40%, var(--t-bg)); overflow: hidden; }
    .em-gal__open {
      position: relative;
      display: block;
      width: 100%;
      height: 100%;
      padding: 0;
      border: 0;
      background: none;
      cursor: zoom-in;
      overflow: hidden;
    }
    .em-gal__open img { color: transparent; display: block; width: 100%; height: auto; aspect-ratio: 1; object-fit: cover; transition: transform .5s cubic-bezier(.2, .8, .2, 1), filter .4s ease; filter: grayscale(.2); }
    .em-gal__open::after {
      content: '';
      position: absolute;
      left: 50%;
      top: 50%;
      width: 3.2rem;
      height: 3.2rem;
      margin: -1.6rem 0 0 -1.6rem;
      border-radius: 50%;
      border: 1px solid var(--t-bg);
      opacity: 0;
      transform: scale(.7);
      transition: opacity .35s ease, transform .4s cubic-bezier(.2, .8, .2, 1);
    }
    .em-gal__open:hover img, .em-gal__open:focus-visible img { transform: scale(1.04); filter: none; }
    .em-gal__open:hover::after, .em-gal__open:focus-visible::after { opacity: 1; transform: none; }
    .em-gal__open:focus-visible { outline: 1px solid var(--t-p); outline-offset: 3px; }

    @media (min-width: 1000px) {
      .em-gal__tile--big { grid-column: span 2; grid-row: span 2; }
    }

    .em-gal__dialog {
      width: min(92vw, 62rem);
      max-height: 92vh;
      padding: 0;
      border: 0;
      background: transparent;
      overflow: visible;
    }
    .em-gal__dialog::backdrop { background: color-mix(in srgb, var(--t-bg) 94%, transparent); }
    .em-gal__dialog[open] { animation: em-gal-in .4s cubic-bezier(.2, .8, .2, 1); }
    @keyframes em-gal-in { from { opacity: 0; transform: scale(.96); } to { opacity: 1; transform: none; } }
    .em-gal__stage { display: grid; gap: 1rem; justify-items: center; }
    .em-gal__big { display: block; max-width: 100%; max-height: 78vh; width: auto; height: auto; object-fit: contain; background: color-mix(in srgb, var(--t-a) 40%, var(--t-bg)); min-width: min(60vw, 30rem); aspect-ratio: 4 / 3; }
    .em-gal__bar { display: flex; align-items: center; gap: 1.6rem; font-family: var(--t-display); font-weight: 300; color: var(--t-tx); }
    .em-gal__nav {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 2.8rem;
      height: 2.8rem;
      padding: 0;
      border-radius: 50%;
      border: 1px solid color-mix(in srgb, var(--t-tx) 30%, transparent);
      background: var(--t-bg);
      color: var(--t-tx);
      font-family: var(--t-display);
      font-weight: 300;
      font-size: 1.2rem;
      line-height: 1;
      cursor: pointer;
      transition: border-color .3s ease, color .3s ease;
    }
    .em-gal__nav:hover, .em-gal__nav:focus-visible { border-color: var(--t-p); color: var(--t-p); outline: none; }
    .em-gal__count { min-width: 3.5rem; text-align: center; font-variant-numeric: tabular-nums; }

    /* Entrance per tile: a clean upward wipe. Each transition <= .5s */
    .em-gal--anim .em-gal__tile { clip-path: inset(100% 0 0 0); }
    .em-gal--anim .em-gal__tile.is-in { clip-path: inset(0 0 0 0); transition: clip-path .5s cubic-bezier(.6, 0, .2, 1) var(--d, 0s); }
    .em-gal--anim .em-gal__head { opacity: 0; }
    .em-gal--anim.is-in .em-gal__head { opacity: 1; transition: opacity .45s ease; }

    @media (prefers-reduced-motion: reduce) {
      .em-gal *, .em-gal *::before, .em-gal *::after { animation: none !important; transition: none !important; }
    }
  </style>

  <script>
    (function () {
      var SEL = '[data-gemini-id="galeria-elegancia"]';
      var root = null;
      try { root = document.currentScript && document.currentScript.closest(SEL); } catch (e) {}
      if (!root) root = document.querySelector(SEL);
      if (!root || root.__tInit) return;
      root.__tInit = true;
      var RM = !!(window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches);

      /* Own lightbox on <dialog> (escapes stacking contexts) */
      var opens = root.querySelectorAll('[data-em-open]');
      var dlg = root.querySelector('[data-em-dialog]');
      var big = root.querySelector('[data-em-big]');
      var count = root.querySelector('[data-em-count]');
      var cur = 0;
      function show(i) {
        cur = (i + opens.length) % opens.length;
        var im = opens[cur].querySelector('img');
        big.src = im.currentSrc || im.src;
        big.alt = im.alt;
        count.textContent = (cur + 1) + ' / ' + opens.length;
      }
      if (dlg && dlg.showModal) {
        for (var i = 0; i < opens.length; i++) (function (k) {
          opens[k].addEventListener('click', function () { show(k); dlg.showModal(); });
        })(i);
        root.querySelector('[data-em-prev]').addEventListener('click', function () { show(cur - 1); });
        root.querySelector('[data-em-next]').addEventListener('click', function () { show(cur + 1); });
        root.querySelector('[data-em-close]').addEventListener('click', function () { dlg.close(); });
        dlg.addEventListener('click', function (e) { if (e.target === dlg) dlg.close(); });
        dlg.addEventListener('keydown', function (e) {
          if (e.key === 'ArrowLeft') show(cur - 1);
          if (e.key === 'ArrowRight') show(cur + 1);
        });
      }

      if (RM || !('IntersectionObserver' in window)) return;   /* reduced motion = static final state */

      var tiles = root.querySelectorAll('[data-em-tile]');
      root.classList.add('em-gal--anim');
      void root.offsetWidth;
      /* Observe the grid (a fully clipped tile never reports as intersecting) and stagger tiles */
      var grid = root.querySelector('[data-em-grid]');
      var hio = new IntersectionObserver(function (en) {
        if (en[0].isIntersecting) { hio.disconnect(); root.classList.add('is-in'); }
      }, { threshold: .2 });
      hio.observe(root);
      var io = new IntersectionObserver(function (en) {
        if (!en[0].isIntersecting) return;
        io.disconnect();
        for (var k = 0; k < tiles.length; k++) {
          tiles[k].style.setProperty('--d', (k * 0.09) + 's');
          tiles[k].classList.add('is-in');
        }
        setTimeout(function () {
          root.classList.remove('em-gal--anim', 'is-in');
          for (var k = 0; k < tiles.length; k++) { tiles[k].classList.remove('is-in'); tiles[k].style.removeProperty('--d'); }
        }, 1600);
      }, { threshold: .08 });
      io.observe(grid);
    })();
