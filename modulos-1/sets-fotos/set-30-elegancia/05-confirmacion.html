    .em-rsvp, .em-rsvp *, .em-rsvp *::before, .em-rsvp *::after { box-sizing: border-box; }
    .em-rsvp {

      --line: color-mix(in srgb, var(--t-tx) 22%, transparent);
      position: relative;
      isolation: isolate;
      min-height: clamp(34rem, 64vw, 50rem);
      display: grid;
      place-items: center;
      padding: clamp(5rem, 10vw, 8rem) clamp(1.25rem, 6vw, 5rem);
      overflow: hidden;
      background-color: var(--t-bg);
      background-image: url('https://loremflickr.com/1600/1000/wedding,stationery,white?lock=3051');
      background-size: cover;
      background-position: center;
      color: var(--t-tx);
      font-family: var(--t-text);
    }
    .em-rsvp::before {
      content: '';
      position: absolute;
      inset: 0;
      z-index: -1;
      background: linear-gradient(180deg, color-mix(in srgb, var(--t-bg) 95%, transparent), color-mix(in srgb, var(--t-bg) 97%, transparent));

    .em-rsvp__paper { position: absolute; inset: 0; width: 100%; height: 100%; z-index: -1; pointer-events: none; mix-blend-mode: multiply; opacity: .36; }

      align-items: center;

      font-weight: 300;
      font-size: 1.05rem;
      color: var(--t-s);

    .em-rsvp__eyebrow::before { content: ''; width: 2.2rem; height: 1px; background: var(--t-p); }
    .em-rsvp__title { margin: 0; font-family: var(--t-display); font-weight: 200; font-size: clamp(2.3rem, 4.6vw, 3.6rem); line-height: 1.04; letter-spacing: -.02em; }

    .em-rsvp__deadline { margin: .4rem 0 0; font-family: var(--t-display); font-weight: 300; font-size: 1.05rem; color: var(--t-p); }

    .em-rsvp__input:focus + .em-rsvp__bar { transform: none; }

      width: 1.15rem;
      height: 1.15rem;
      border-radius: 50%;
      border: 1px solid var(--t-tx);

    .em-rsvp__circle::after {

    .em-rsvp__radio:checked + .em-rsvp__circle { border-color: var(--t-p); }

    .em-rsvp__radio:focus-visible + .em-rsvp__circle { outline: 1px solid var(--t-p); outline-offset: 3px; }

    .em-rsvp__actions { display: flex; flex-wrap: wrap; align-items: center; gap: 1.4rem 2rem; }
    .em-rsvp__btn {
      position: relative;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: .8rem;
      min-height: 3.2rem;
      min-width: 15rem;
      padding: 0 1.8rem;
      border: 1px solid var(--t-tx);
      background: var(--t-tx);
      color: var(--t-bg);
      font-family: var(--t-text);

    .em-rsvp__btn:hover { background: transparent; color: var(--t-tx); }
    .em-rsvp__btn:active { transform: scale(.98); }
    .em-rsvp__btn:focus-visible { outline: 1px solid var(--t-p); outline-offset: 4px; }
    .em-rsvp__state { display: none; align-items: center; gap: .7rem; }
    .em-rsvp__btn[data-state="idle"] .em-rsvp__state--idle,
    .em-rsvp__btn[data-state="loading"] .em-rsvp__state--loading,

    @keyframes em-rsvp-spin { to { transform: rotate(360deg); } }
    @keyframes em-rsvp-draw { to { stroke-dashoffset: 0; } }
    .em-rsvp__thanks {

    @media (prefers-reduced-motion: reduce) {
