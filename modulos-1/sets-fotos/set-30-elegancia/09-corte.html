    .em-cor, .em-cor *, .em-cor *::before, .em-cor *::after { box-sizing: border-box; }
    .em-cor {
      --t-bg: var(--bg-color, #ffffff);
      --t-tx: var(--text-color, #2b2b2b);
      --t-p: var(--primary-color, #b76e79);
      --t-s: var(--secondary-color, #8a837f);
      --t-a: var(--accent-color, #e4c6ba);
      --t-display: var(--font-script, 'Jost', 'Helvetica Neue', Arial, sans-serif);
      --t-text: var(--font-heading, 'Manrope', 'Helvetica Neue', Arial, sans-serif);
      position: relative;
      isolation: isolate;
      min-height: clamp(34rem, 64vw, 50rem);
      display: grid;
      place-items: center;
      padding: clamp(5rem, 10vw, 8rem) clamp(1.25rem, 6vw, 5rem);
      overflow: hidden;
      background-color: var(--t-bg);
      color: var(--t-tx);
      font-family: var(--t-text);
    }
    .em-cor__paper { position: absolute; inset: 0; width: 100%; height: 100%; z-index: -1; pointer-events: none; mix-blend-mode: multiply; opacity: .36; }
    .em-cor__inner {
      width: min(100%, 68rem);
      display: grid;
      grid-template-columns: minmax(0, 1.05fr) minmax(0, 1fr);
      gap: clamp(3rem, 8vw, 7rem);
      align-items: center;
    }
    .em-cor__media { position: relative; }
    .em-cor__frame { position: relative; overflow: hidden; background: color-mix(in srgb, var(--t-a) 40%, var(--t-bg)); }
    .em-cor__figure { margin: 0; }
    .em-cor__figure img { color: transparent; display: block; width: 100%; height: auto; aspect-ratio: 4 / 5; object-fit: cover; }
    .em-cor__curtain {
      position: absolute;
      inset: 0;
      background: var(--t-bg);
      transform: scaleX(0);
      transform-origin: right;
      pointer-events: none;
    }
    .em-cor__ring {
      position: absolute;
      right: clamp(-3.5rem, -5vw, -1.5rem);
      top: clamp(-3.5rem, -5vw, -1.5rem);
      width: clamp(7rem, 15vw, 11rem);
      height: auto;
      aspect-ratio: 1;
      overflow: visible;
      pointer-events: none;
    }
    .em-cor__ring circle { fill: none; stroke: var(--t-p); stroke-width: .6; stroke-dasharray: 100; stroke-dashoffset: 0; }

    .em-cor__text { display: grid; gap: 1.1rem; }
    .em-cor__eyebrow {
      margin: 0;
      display: flex;
      align-items: center;
      gap: .8rem;
      font-family: var(--t-display);
      font-style: italic;
      font-weight: 300;
      font-size: 1.05rem;
      color: var(--t-s);
    }
    .em-cor__eyebrow::before { content: ''; width: 2.2rem; height: 1px; background: var(--t-p); }
    .em-cor__title { margin: 0; font-family: var(--t-display); font-weight: 200; font-size: clamp(2.3rem, 4.6vw, 3.6rem); line-height: 1.04; letter-spacing: -.02em; }
    .em-cor__lead { margin: 0; max-width: 26rem; font-weight: 300; line-height: 1.75; color: var(--t-s); }
    .em-cor__groups { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 2rem; margin-top: 1.2rem; }
    .em-cor__group { display: grid; gap: .9rem; align-content: start; padding-top: 1.1rem; border-top: 1px solid color-mix(in srgb, var(--t-tx) 14%, transparent); }
    .em-cor__group-title { margin: 0; font-family: var(--t-display); font-style: italic; font-weight: 300; font-size: 1rem; color: var(--t-p); }
    .em-cor__names { list-style: none; margin: 0; padding: 0; display: grid; gap: .5rem; }
    .em-cor__name { font-family: var(--t-display); font-weight: 300; font-size: 1.12rem; }

    @media (max-width: 860px) {
      .em-cor__inner { grid-template-columns: 1fr; }
      .em-cor__media { width: min(100%, 26rem); justify-self: center; }
      .em-cor__ring { right: -1.2rem; top: -1.2rem; width: 6.5rem; }
    }
    @media (max-width: 420px) {
      .em-cor__groups { grid-template-columns: 1fr; }
    }

    /* Entrance: curtain lifts off the photo, ring draws, text follows. Each transition <= .5s */
    .em-cor--anim .em-cor__curtain { transform: none; }
    .em-cor--anim .em-cor__figure img { color: transparent; transform: scale(1.1); }
    .em-cor--anim .em-cor__ring circle { stroke-dashoffset: 100; }
    .em-cor--anim .em-cor__text { opacity: 0; transform: translateX(14px); }
    .em-cor--anim.is-in .em-cor__curtain { transform: scaleX(0); transition: transform .5s cubic-bezier(.7, 0, .2, 1); }
    .em-cor--anim.is-in .em-cor__figure img { color: transparent; transform: none; transition: transform .5s cubic-bezier(.2, .8, .2, 1) .15s; }
    .em-cor--anim.is-in .em-cor__ring circle { stroke-dashoffset: 0; transition: stroke-dashoffset .5s cubic-bezier(.6, 0, .2, 1) .45s; }
    .em-cor--anim.is-in .em-cor__text { opacity: 1; transform: none; transition: opacity .45s ease .35s, transform .5s cubic-bezier(.2, .8, .2, 1) .35s; }

    @media (prefers-reduced-motion: reduce) {
      .em-cor *, .em-cor *::before, .em-cor *::after { animation: none !important; transition: none !important; }
    }
  </style>
