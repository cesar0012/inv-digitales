  <style>
    @import url('https://fonts.googleapis.com/css2?family=Rye&family=IM+Fell+English:ital@0;1&display=swap');

    .vq-gal, .vq-gal *, .vq-gal *::before, .vq-gal *::after { box-sizing: border-box; }
    .vq-gal {
      --t-bg: var(--bg-color, #24140c);
      --t-tx: var(--text-color, #f4e7cf);
      --t-p: var(--primary-color, #c99a3e);
      --t-s: var(--secondary-color, #7a4a2a);
      --t-a: var(--accent-color, #a3302a);
      --t-display: var(--font-script, 'Rye', serif);
      --t-text: var(--font-heading, 'IM Fell English', Georgia, serif);

      --rope-b: color-mix(in srgb, var(--t-p) 50%, var(--t-bg));
      --paper: color-mix(in srgb, var(--t-tx) 90%, var(--t-p));
      position: relative;
      isolation: isolate;
      min-height: clamp(24rem, 60vw, 40rem);
      display: grid;
      place-items: center;
      padding: clamp(4rem, 9vw, 7rem) clamp(1rem, 5vw, 4rem);
      overflow: hidden;
      background-color: var(--t-bg);
      background-image:
        radial-gradient(60% 40% at 50% 0%, color-mix(in srgb, var(--t-s) 50%, transparent), transparent 70%),
        radial-gradient(35% 35% at 100% 100%, color-mix(in srgb, var(--t-a) 14%, transparent), transparent 70%);
      color: var(--t-tx);
      text-align: center;
      font-family: var(--t-text);

    .vq-gal__content { width: min(100%, 70rem); }
    .vq-gal__eyebrow { margin: 0; font-style: italic; color: var(--t-p); font-size: clamp(1.1rem, 2.2vw, 1.35rem); }

    .vq-gal__tile {

      box-shadow: 0 16px 30px -16px color-mix(in srgb, var(--t-bg) 95%, transparent);
      transform: rotate(var(--vq-r, 0deg));
      cursor: zoom-in;
      transition: transform .35s cubic-bezier(.3, 1.4, .5, 1), box-shadow .35s ease;
    }
    .vq-gal__tile:nth-child(3n+1) { --vq-r: -1.4deg; }
    .vq-gal__tile:nth-child(3n+2) { --vq-r: 1.1deg; }
    .vq-gal__tile:nth-child(3n) { --vq-r: -.5deg; }
    .vq-gal__tile:hover, .vq-gal__tile:focus-visible { transform: rotate(0deg) translateY(-4px) scale(1.02); box-shadow: 0 24px 40px -18px color-mix(in srgb, var(--t-bg) 95%, transparent); z-index: 1; }
    .vq-gal__tile:focus-visible { outline: 3px solid var(--t-p); outline-offset: 3px; }

    .vq-gal__tile img { display: block; width: 100%; height: auto; aspect-ratio: 4 / 5; object-fit: cover; color: transparent; background: linear-gradient(150deg, var(--t-s), color-mix(in srgb, var(--t-s) 40%, var(--t-bg))); filter: sepia(.65) contrast(1.05) brightness(.95); transition: filter .4s ease; }
    .vq-gal__tile--wide img { aspect-ratio: 16 / 10; }
    .vq-gal__tile:hover img, .vq-gal__tile:focus-visible img { filter: sepia(0) contrast(1); }
    .vq-gal__tile::after { content: ''; position: absolute; left: 50%; top: -.5rem; width: 3.4rem; height: 1.1rem; margin-left: -1.7rem; background: color-mix(in srgb, var(--t-p) 55%, transparent); transform: rotate(-3deg); }

    .vq-gal__dialog { width: min(92vw, 56rem); max-height: 92vh; padding: .8rem .8rem 1rem; border: 0; background: var(--paper); color: var(--t-bg); box-shadow: 0 40px 80px -20px #000; }
    .vq-gal__dialog::backdrop { background: color-mix(in srgb, var(--t-bg) 88%, transparent); }
    .vq-gal__dialog[open] { animation: vq-gal-in .35s cubic-bezier(.2, .9, .3, 1.1); }
    @keyframes vq-gal-in { from { opacity: 0; transform: scale(.92) rotate(-2deg); } to { opacity: 1; transform: none; } }
    .vq-gal__big { display: block; width: 100%; height: auto; max-height: 78vh; aspect-ratio: 3 / 2; object-fit: contain; background: color-mix(in srgb, var(--t-s) 30%, var(--t-bg)); }
    .vq-gal__bar { display: flex; align-items: center; justify-content: space-between; gap: 1rem; margin-top: .7rem; }
    .vq-gal__btn { display: inline-flex; align-items: center; justify-content: center; min-width: 2.8rem; min-height: 2.8rem; padding: 0 .8rem; border: 2px solid var(--t-s); background: transparent; color: var(--t-bg); font-family: var(--t-display); font-size: 1rem; cursor: pointer; transition: background-color .25s ease, color .25s ease; }
    .vq-gal__btn:hover, .vq-gal__btn:focus-visible { background: var(--t-s); color: var(--t-tx); }
    .vq-gal__count { font-style: italic; }

    /* Entrance: each old photo "develops" from blank sepia and settles on the board */
    .vq-gal--anim .vq-gal__head { opacity: 0; transition: opacity .45s ease; }
    .vq-gal--anim .vq-gal__tile { opacity: 0; transform: rotate(calc(var(--vq-r, 0deg) * 6)) scale(.9); transition: opacity .35s ease, transform .5s cubic-bezier(.2, .9, .3, 1.15); }
    .vq-gal--anim .vq-gal__tile img { filter: sepia(1) brightness(1.7) contrast(.4); transition: filter .5s ease .15s; }
    .vq-gal--anim .vq-gal__tile[data-in] { opacity: 1; transform: rotate(var(--vq-r, 0deg)); }
    .vq-gal--anim .vq-gal__tile[data-in] img { filter: sepia(.65) contrast(1.05) brightness(.95); }
    .vq-gal--anim.is-in .vq-gal__head { opacity: 1; }

    @media (max-width: 560px) {
      .vq-gal__tile--wide { grid-column: auto; }
      .vq-gal__tile--wide img { aspect-ratio: 4 / 5; }
    }
    @media (prefers-reduced-motion: reduce) {
      .vq-gal *, .vq-gal *::before, .vq-gal *::after { animation: none !important; transition: none !important; }
    }
  </style>

  <script>
    (function () {
      var SEL = '[data-gemini-id="galeria-vaquera"]';
      var root = null;
      try { root = document.currentScript && document.currentScript.closest(SEL); } catch (e) {}

      if (!root || root.__tInit) return;

      /* Own lightbox: <dialog> + showModal; the large image is created here, not in the markup */
      var tiles = root.querySelectorAll('[data-vq-tile]');
      var dlg = root.querySelector('[data-vq-dialog]');
      var stage = root.querySelector('[data-vq-stage]');
      var count = root.querySelector('[data-vq-count]');
      var big = document.createElement('img');
      big.className = 'vq-gal__big';
      big.alt = '';
      if (stage) stage.appendChild(big);
      var cur = 0;
      function show(i) {
        cur = (i + tiles.length) % tiles.length;
        var img = tiles[cur].querySelector('img');
        big.src = img.currentSrc || img.src;
        big.alt = img.alt;
        if (count) count.textContent = (cur + 1) + ' / ' + tiles.length;
      }
      function open(i) {
        show(i);
        if (dlg && dlg.showModal) dlg.showModal();
        else if (dlg) dlg.setAttribute('open', '');
      }
      for (var i = 0; i < tiles.length; i++) {
        (function (k) {
          tiles[k].addEventListener('click', function () { open(k); });
          tiles[k].addEventListener('keydown', function (e) { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); open(k); } });
        })(i);
      }
      if (dlg) {
        dlg.querySelector('[data-vq-prev]').addEventListener('click', function () { show(cur - 1); });
        dlg.querySelector('[data-vq-next]').addEventListener('click', function () { show(cur + 1); });
        dlg.querySelector('[data-vq-close]').addEventListener('click', function () { dlg.close ? dlg.close() : dlg.removeAttribute('open'); });

        dlg.addEventListener('keydown', function (e) { if (e.key === 'ArrowLeft') show(cur - 1); if (e.key === 'ArrowRight') show(cur + 1); });

        en.forEach(function (e, idx) {
