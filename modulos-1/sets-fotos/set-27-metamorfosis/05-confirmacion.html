  <style>
    @import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;1,300;1,400&family=Pinyon+Script&display=swap');

    .mm-rsvp, .mm-rsvp *, .mm-rsvp *::before, .mm-rsvp *::after { box-sizing: border-box; }
    .mm-rsvp {
      --mm-bg: var(--bg-color, #1a0e26);
      --mm-tx: var(--text-color, #faf2fb);
      --mm-p: var(--primary-color, #f2a9cf);
      --mm-s: var(--secondary-color, #8fd0f5);
      --mm-a: var(--accent-color, #e5c07e);
      --mm-script: var(--font-script, 'Pinyon Script', 'Great Vibes', cursive);
      --mm-serif: var(--font-heading, 'Cormorant Garamond', 'Cormorant', Georgia, serif);
      --panel: color-mix(in srgb, var(--mm-bg) 85%, transparent);
      position: relative;
      isolation: isolate;
      min-height: clamp(24rem, 60vw, 40rem);
      display: grid;
      place-items: center;
      padding: clamp(4rem, 9vw, 7rem) clamp(1rem, 5vw, 4rem);
      overflow: hidden;
      background-color: var(--mm-bg);
      background-image: url('https://loremflickr.com/1600/1000/flowers,butterfly?lock=2705');
      background-size: cover;
      background-position: center;
      color: var(--mm-tx);
      text-align: center;
      font-family: var(--mm-serif);
    }
    .mm-rsvp::before {
      content: '';
      position: absolute;
      inset: 0;
      z-index: -1;
      background:

        radial-gradient(40% 40% at 50% 100%, color-mix(in srgb, var(--mm-s) 14%, transparent), transparent 70%),

    }
    .mm-rsvp__burst { position: absolute; inset: 0; z-index: 5; width: 100%; height: 100%; pointer-events: none; }

    .mm-rsvp__card {
      position: relative;
      width: min(100%, 34rem);
      padding: clamp(2rem, 5vw, 3.2rem) clamp(1.3rem, 5vw, 3rem);
      border-radius: 2rem;
      background: linear-gradient(180deg, color-mix(in srgb, var(--mm-bg) 62%, transparent), color-mix(in srgb, var(--mm-bg) 78%, transparent));
      -webkit-backdrop-filter: blur(16px) saturate(140%);
      backdrop-filter: blur(16px) saturate(140%);
      box-shadow: 0 40px 80px -30px color-mix(in srgb, #000 75%, transparent), inset 0 1px 0 color-mix(in srgb, var(--mm-tx) 12%, transparent);
    }
    .mm-rsvp__card::before {
      content: '';
      position: absolute;
      inset: 0;
      padding: 1.2px;
      border-radius: inherit;
      background: conic-gradient(from var(--mm-rot, 0deg), var(--mm-s), var(--mm-p), var(--mm-a), color-mix(in srgb, var(--mm-a) 20%, transparent), var(--mm-s));
      -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
      -webkit-mask-composite: xor;
      mask: linear-gradient(#000 0 0) content-box exclude, linear-gradient(#000 0 0);
      pointer-events: none;
    }
    .mm-rsvp__title {
      margin: 0 0 .5rem;
      font-weight: 300;
      font-size: clamp(2.1rem, 5vw, 3.2rem);
      line-height: 1.08;

    .mm-rsvp__lead {
      margin: 0 auto 2rem;
      max-width: 32ch;
      font-style: italic;
      font-weight: 300;
      font-size: clamp(1.05rem, 2vw, 1.25rem);

    .mm-rsvp__form { display: grid; gap: 1.4rem; text-align: left; }

    /* Campo con etiqueta flotante */

    .mm-rsvp__input {

      width: 100%;
      min-height: 3.2rem;
      padding: 1.25rem .2rem .45rem;
      border: 0;
      border-bottom: 1px solid color-mix(in srgb, var(--mm-tx) 30%, transparent);
      border-radius: 0;
      background: transparent;
      color: var(--mm-tx);
      font: 400 1.2rem/1.3 var(--mm-serif);
      outline: none;
      resize: vertical;
      transition: border-color .3s ease;
    }
    textarea.mm-rsvp__input { min-height: 5.2rem; }
    .mm-rsvp__label {
      position: absolute;
      left: .2rem;
      top: 1.1rem;
      font-size: 1.15rem;
      font-style: italic;
      color: color-mix(in srgb, var(--mm-tx) 62%, transparent);
      pointer-events: none;
      transform-origin: 0 0;
      transition: transform .3s cubic-bezier(.2, .8, .2, 1), color .3s ease;

    .mm-rsvp__input:focus + .mm-rsvp__label,

    .mm-rsvp__field::after {
      content: '';
      position: absolute;
      left: 0;
      right: 0;
      bottom: 0;
      height: 2px;
      background: linear-gradient(90deg, var(--mm-s), var(--mm-p), var(--mm-a));
      transform: scaleX(0);
      transition: transform .4s cubic-bezier(.2, .8, .2, 1);
    }
    .mm-rsvp__field:focus-within::after { transform: scaleX(1); }
    .mm-rsvp__field.is-error { animation: mmRsvpShake .42s ease; }
    .mm-rsvp__field.is-error .mm-rsvp__input { border-bottom-color: var(--mm-p); }
    @keyframes mmRsvpShake { 20% { transform: translateX(-8px); } 40% { transform: translateX(7px); } 60% { transform: translateX(-5px); } 80% { transform: translateX(3px); } }

    /* Asistencia: dos alas */
    .mm-rsvp__set { margin: 0; padding: 0; border: 0; }
    .mm-rsvp__legend { margin-bottom: .7rem; padding: 0; font-style: italic; font-size: 1.1rem; color: color-mix(in srgb, var(--mm-tx) 70%, transparent); }
    .mm-rsvp__choices { display: grid; grid-template-columns: 1fr 1fr; gap: .7rem; }
    .mm-rsvp__choice { position: relative; display: block; cursor: pointer; }
    .mm-rsvp__choice input { position: absolute; opacity: 0; pointer-events: none; }
    .mm-rsvp__pill {
      display: grid;
      justify-items: center;
      gap: .35rem;
      min-height: 100%;
      padding: .95rem .6rem .85rem;
      border-radius: 1.1rem;
      border: 1px solid color-mix(in srgb, var(--mm-tx) 22%, transparent);
      background: color-mix(in srgb, var(--mm-bg) 40%, transparent);
      font-size: 1.12rem;
      line-height: 1.2;
      text-align: center;

      color: var(--mm-bg);
      border-color: transparent;
      background: linear-gradient(135deg, var(--mm-s), var(--mm-p) 55%, var(--mm-a));
      box-shadow: 0 12px 30px -12px color-mix(in srgb, var(--mm-p) 80%, transparent);
    }
    .mm-rsvp__mini {
      position: relative;
      width: 2.2rem;
      height: 1.4rem;
      transform-style: preserve-3d;
      transform: perspective(200px) rotateX(45deg);

    .mm-rsvp__mini i + i { transform: rotateY(150deg); }

    .mm-rsvp__mini path { fill: currentColor; fill-opacity: .25; stroke: currentColor; stroke-width: 4; }

    .mm-rsvp__choice input:checked + .mm-rsvp__pill .mm-rsvp__mini i + i { animation-name: mmRsvpFlapL; }
    @keyframes mmRsvpFlapR { to { transform: rotateY(78deg); } }
    @keyframes mmRsvpFlapL { to { transform: rotateY(102deg); } }

    /* Acompañantes */
    .mm-rsvp__row { display: flex; align-items: center; justify-content: space-between; gap: 1rem; padding-bottom: .9rem; border-bottom: 1px solid color-mix(in srgb, var(--mm-tx) 30%, transparent); }

      border-radius: 999px;

    .mm-rsvp__submit > * { grid-area: 1 / 1; transition: opacity .25s ease, transform .3s cubic-bezier(.3, 1.4, .5, 1); }
    .mm-rsvp__spin, .mm-rsvp__check { opacity: 0; transform: scale(.5); }
    .mm-rsvp__spin { position: relative; width: 2.2rem; height: 1.4rem; transform-style: preserve-3d; }
    .mm-rsvp__spin i { position: absolute; top: 0; left: 50%; width: 50%; transform-origin: 0 50%; animation: mmRsvpFlapR .2s ease-in-out infinite alternate; }
    .mm-rsvp__spin i + i { animation-name: mmRsvpFlapL; }

    .mm-rsvp__spin path { fill: var(--mm-bg); fill-opacity: .8; }

    .mm-rsvp__check path { stroke-dasharray: 30; stroke-dashoffset: 30; transition: stroke-dashoffset .45s ease .1s; }
    .mm-rsvp__submit.is-loading, .mm-rsvp__submit.is-done { width: 3.6rem; padding: 0; pointer-events: none; }
    .mm-rsvp__submit.is-loading .mm-rsvp__txt, .mm-rsvp__submit.is-done .mm-rsvp__txt { opacity: 0; transform: scale(.7); }
    .mm-rsvp__submit.is-loading .mm-rsvp__spin { opacity: 1; transform: perspective(200px) rotateX(40deg); }
    .mm-rsvp__submit.is-done .mm-rsvp__check { opacity: 1; transform: none; }
    .mm-rsvp__submit.is-done .mm-rsvp__check path { stroke-dashoffset: 0; }
    .mm-rsvp__msg {
      min-height: 1.5em;
      margin: .9rem 0 0;
      font-style: italic;
      font-size: 1.12rem;
      text-align: center;
      color: color-mix(in srgb, var(--mm-a) 80%, var(--mm-tx));

    @media (prefers-reduced-motion: reduce) {

    }

    (function () {
