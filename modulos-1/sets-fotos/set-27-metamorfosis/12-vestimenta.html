  <style>
    @import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;1,300;1,400&family=Pinyon+Script&display=swap');

    .mm-vest, .mm-vest *, .mm-vest *::before, .mm-vest *::after { box-sizing: border-box; }
    .mm-vest {
      --mm-bg: var(--bg-color, #1a0e26);
      --mm-tx: var(--text-color, #faf2fb);
      --mm-p: var(--primary-color, #f2a9cf);
      --mm-s: var(--secondary-color, #8fd0f5);
      --mm-a: var(--accent-color, #e5c07e);
      --mm-script: var(--font-script, 'Pinyon Script', 'Great Vibes', cursive);
      --mm-serif: var(--font-heading, 'Cormorant Garamond', 'Cormorant', Georgia, serif);
      --panel: color-mix(in srgb, var(--mm-bg) 85%, transparent);
      --mm-neutral: color-mix(in srgb, var(--mm-tx) 22%, var(--mm-bg));
      position: relative;
      isolation: isolate;
      min-height: clamp(24rem, 60vw, 40rem);
      display: grid;
      place-items: center;
      padding: clamp(4rem, 9vw, 7rem) clamp(1rem, 5vw, 4rem);
      overflow: hidden;
      background-color: var(--mm-bg);
      background-image: url('https://loremflickr.com/1600/1000/gown,fashion?lock=2712');
      background-size: cover;
      background-position: center;
      color: var(--mm-tx);
      text-align: center;
      font-family: var(--mm-serif);
    }
    .mm-vest::before {
      content: '';
      position: absolute;
      inset: 0;
      z-index: -1;
      background:
        radial-gradient(50% 40% at 50% 55%, color-mix(in srgb, var(--mm-p) 16%, transparent), transparent 70%),
        radial-gradient(40% 40% at 0% 0%, color-mix(in srgb, var(--mm-s) 12%, transparent), transparent 70%),
        linear-gradient(180deg, color-mix(in srgb, var(--mm-bg) 86%, transparent), color-mix(in srgb, var(--mm-bg) 94%, transparent));
    }
    .mm-vest__content { width: min(100%, 62rem); }
    .mm-vest__eyebrow { margin: 0 0 .35rem; font-style: italic; font-size: clamp(1.05rem, 2vw, 1.3rem); color: color-mix(in srgb, var(--mm-p) 70%, var(--mm-tx)); }
    .mm-vest__title {
      margin: 0;
      font-family: var(--mm-script);
      font-weight: 400;
      font-size: clamp(3.4rem, 9vw, 5.6rem);
      line-height: 1.05;
      color: var(--mm-tx);
      text-shadow: 0 0 26px color-mix(in srgb, var(--mm-p) 40%, transparent);
    }
    .mm-vest__lead { max-width: 36ch; margin: .6rem auto 0; font-style: italic; font-weight: 300; font-size: clamp(1.05rem, 1.9vw, 1.25rem); line-height: 1.5; color: color-mix(in srgb, var(--mm-tx) 80%, transparent); }

    /* ---------- Paleta: cada color es una mariposa ---------- */
    .mm-vest__palette {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: clamp(1rem, 3vw, 2.2rem) clamp(.8rem, 3vw, 2.4rem);
      margin: clamp(2.2rem, 5vw, 3.2rem) 0 clamp(2rem, 5vw, 3rem);
      padding: 0;
      list-style: none;
    }
    .mm-vest__sw { display: grid; justify-items: center; gap: .55rem; }
    .mm-vest__pick {
      display: grid;
      justify-items: center;
      gap: .55rem;
      padding: .4rem .3rem;
      border: 0;
      border-radius: 1rem;
      background: none;
      color: inherit;
      font: inherit;
      cursor: pointer;
    }
    .mm-vest__pick:focus-visible { outline: 2px solid var(--mm-a); outline-offset: 2px; }
    .mm-vest__bf {
      position: relative;
      width: clamp(5.6rem, 10vw, 7.4rem);
      aspect-ratio: 1.55 / 1;
      transform-style: preserve-3d;
      transform: perspective(420px) rotateX(38deg);
      transition: transform .4s cubic-bezier(.3, 1.4, .5, 1);
    }
    .mm-vest__pick:hover .mm-vest__bf { transform: perspective(420px) rotateX(22deg) translateY(-6px) scale(1.06); }
    .mm-vest__w {
      position: absolute;
      top: -6%;
      left: 50%;
      width: 50%;
      transform-origin: 0 50%;
      transform: rotateY(var(--mm-o, 16deg));
      transition: transform .5s cubic-bezier(.2, 1.2, .4, 1);
    }
    .mm-vest__w--l { --mm-o: 164deg; }
    .mm-vest__pick:hover .mm-vest__w, .mm-vest__pick:focus-visible .mm-vest__w { animation: mmVestBreatheR .3s ease-in-out infinite alternate; animation-delay: var(--mm-d, 0s); }
    .mm-vest__pick:hover .mm-vest__w--l, .mm-vest__pick:focus-visible .mm-vest__w--l { animation-name: mmVestBreatheL; }
    @keyframes mmVestBreatheR { from { transform: rotateY(12deg); } to { transform: rotateY(62deg); } }
    @keyframes mmVestBreatheL { from { transform: rotateY(168deg); } to { transform: rotateY(118deg); } }
    .mm-vest__w svg { display: block; width: 100%; height: auto; overflow: visible; filter: drop-shadow(0 6px 14px color-mix(in srgb, var(--c) 45%, transparent)); }
    .mm-vest__w .f { fill: var(--c); stroke: color-mix(in srgb, var(--mm-a) 80%, transparent); stroke-width: 2; transition: fill .45s ease; }
    .mm-vest__w .h { fill: color-mix(in srgb, var(--c) 72%, var(--mm-bg)); stroke: color-mix(in srgb, var(--mm-a) 80%, transparent); stroke-width: 2; transition: fill .45s ease; }
    .mm-vest__w .v { fill: none; stroke: color-mix(in srgb, #fff 45%, transparent); stroke-width: 1.1; }
    .mm-vest__body { position: absolute; left: 50%; top: 10%; width: 5%; height: 62%; margin-left: -2.5%; border-radius: 999px; background: color-mix(in srgb, var(--mm-bg) 60%, var(--mm-a)); transform: translateZ(1px); }
    .mm-vest__name { font-style: italic; font-size: clamp(1.02rem, 1.8vw, 1.15rem); line-height: 1.2; }
    .mm-vest__hex { font-size: .92rem; letter-spacing: .1em; font-variant-numeric: lining-nums; color: color-mix(in srgb, var(--mm-tx) 58%, transparent); text-transform: lowercase; }
    .mm-vest__pick.is-copied .mm-vest__hex { color: var(--mm-a); }

    /* Aparición: de gris a color mientras se despliegan (≤ 0.5s cada una) */
    .mm-vest--anim .mm-vest__sw { opacity: 0; transform: translateY(18px); transition: opacity .4s ease, transform .45s cubic-bezier(.2, .8, .2, 1); }
    .mm-vest--anim .mm-vest__sw .mm-vest__w { transform: rotateY(88deg); }
    .mm-vest--anim .mm-vest__sw .mm-vest__w--l { transform: rotateY(92deg); }
    .mm-vest--anim .mm-vest__sw .f, .mm-vest--anim .mm-vest__sw .h { fill: var(--mm-neutral); }
    .mm-vest--anim .mm-vest__sw.is-in { opacity: 1; transform: none; }
    .mm-vest--anim .mm-vest__sw.is-in .mm-vest__w { transform: rotateY(var(--mm-o, 16deg)); }
    .mm-vest--anim .mm-vest__sw.is-color .f { fill: var(--c); }
    .mm-vest--anim .mm-vest__sw.is-color .h { fill: color-mix(in srgb, var(--c) 72%, var(--mm-bg)); }

    /* ---------- Guía damas / caballeros ---------- */
    .mm-vest__guide {
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      align-items: center;
      gap: clamp(1rem, 4vw, 2.6rem);
      max-width: 44rem;
      margin: 0 auto;
    }
    .mm-vest__who { display: grid; grid-template-columns: auto 1fr; align-items: center; gap: .9rem; text-align: left; }
    .mm-vest__who--r { grid-template-columns: 1fr auto; text-align: right; }
    .mm-vest__who--r .mm-vest__ico { order: 2; }
    .mm-vest__ico { display: grid; place-items: center; width: 3.4rem; height: 3.4rem; border-radius: 50%; color: var(--mm-a); box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--mm-a) 55%, transparent); }
    .mm-vest__ico svg { width: 1.7rem; height: 1.7rem; fill: none; stroke: currentColor; stroke-width: 1.4; stroke-linecap: round; stroke-linejoin: round; }
    .mm-vest__whoname { margin: 0; font-style: italic; font-size: 1.05rem; color: color-mix(in srgb, var(--mm-tx) 65%, transparent); }
    .mm-vest__whatwear { margin: .1rem 0 0; font-weight: 500; font-size: clamp(1.2rem, 2.2vw, 1.45rem); line-height: 1.25; }
    .mm-vest__divider { width: 1px; height: 3.4rem; background: linear-gradient(180deg, transparent, var(--mm-a), transparent); }
    .mm-vest__reserve {
      display: inline-flex;
      align-items: center;
      gap: .8rem;
      margin-top: clamp(2rem, 5vw, 2.8rem);
      padding: .75rem 1.4rem;
      border-radius: 999px;
      background: color-mix(in srgb, var(--mm-bg) 60%, transparent);
      box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--mm-p) 40%, transparent);
      -webkit-backdrop-filter: blur(8px);
      backdrop-filter: blur(8px);
    }
    .mm-vest__no {
      position: relative;
      flex: none;
      width: 1.6rem;
      height: 1.6rem;
      border-radius: 50%;
      background: conic-gradient(var(--mm-tx) 0 50%, var(--mm-p) 0);
      box-shadow: 0 0 0 2px var(--mm-bg), 0 0 0 3px color-mix(in srgb, var(--mm-tx) 50%, transparent);
    }
    .mm-vest__no::after { content: ''; position: absolute; left: 50%; top: -15%; width: 2px; height: 130%; margin-left: -1px; background: var(--mm-a); transform: rotate(45deg); }
    .mm-vest__reserve p { margin: 0; font-style: italic; font-size: clamp(1rem, 1.8vw, 1.15rem); text-align: left; }

    @media (max-width: 640px) {
      .mm-vest__guide { grid-template-columns: 1fr; }
      .mm-vest__divider { width: 40%; height: 1px; margin: 0 auto; background: linear-gradient(90deg, transparent, var(--mm-a), transparent); }
      .mm-vest__who, .mm-vest__who--r { grid-template-columns: auto 1fr; text-align: left; justify-self: center; }
      .mm-vest__who--r .mm-vest__ico { order: 0; }
    }
    @media (prefers-reduced-motion: reduce) {
      .mm-vest *, .mm-vest *::before, .mm-vest *::after { animation: none !important; transition: none !important; }
    }
  </style>

  <div class="mm-vest__content">

  <script>
    (function () {
      var SEL = '[data-gemini-id="vestimenta-metamorfosis"]';
      var root = null;
      try { root = document.currentScript && document.currentScript.closest(SEL); } catch (e) {}
      if (!root) root = document.querySelector(SEL);
      if (!root || root.__mmInit) return;
      root.__mmInit = true;
      var RM = !!(window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches);
      var list = root.querySelector('[data-mm-palette]');
      if (!list) return;

      /* Muestras generadas en JS a partir de data-palette="Nombre:#hex, ..." */
      var WING = '<svg viewBox="0 0 100 120"><path class="f" d="M0 46C8 18 38-2 72 2C94 5 99 26 88 42C77 56 40 58 0 54Z"/><path class="h" d="M0 56C28 56 58 64 64 86C69 104 54 116 38 110C20 104 6 84 0 60Z"/><path class="v" d="M2 50Q40 26 80 8M2 51Q46 38 92 28M2 52Q44 50 86 44M2 58Q34 72 58 102M2 59Q26 80 40 110"/></svg>';
      var raw = (list.getAttribute('data-palette') || '').split(',');
      var items = [];
      list.innerHTML = '';
      raw.forEach(function (entry, i) {
        var parts = entry.split(':');
        var name = (parts.length > 1 ? parts[0] : '').trim();
        var hex = (parts.length > 1 ? parts[1] : parts[0]).trim();
        if (!hex) return;
        var li = document.createElement('li');
        li.className = 'mm-vest__sw';
        li.style.setProperty('--c', hex);
        li.innerHTML =
          '<button class="mm-vest__pick" type="button" aria-label="' + (name || 'Color') + ' ' + hex + ', copiar código">' +
            '<span class="mm-vest__bf" aria-hidden="true">' +
              '<span class="mm-vest__w mm-vest__w--l" style="--mm-d:-' + (i * .13).toFixed(2) + 's">' + WING + '</span>' +
              '<span class="mm-vest__w" style="--mm-d:-' + (i * .13).toFixed(2) + 's">' + WING + '</span>' +
              '<span class="mm-vest__body"></span>' +
            '</span>' +
            (name ? '<span class="mm-vest__name">' + name + '</span>' : '') +
            '<span class="mm-vest__hex">' + hex + '</span>' +
          '</button>';
        list.appendChild(li);
        items.push(li);
      });

      items.forEach(function (li) {
        var b = li.querySelector('.mm-vest__pick'), hexEl = li.querySelector('.mm-vest__hex'), hex = hexEl.textContent;
        b.addEventListener('click', function () {
          var done = function () {
            b.classList.add('is-copied'); hexEl.textContent = 'copiado';
            setTimeout(function () { b.classList.remove('is-copied'); hexEl.textContent = hex; }, 1400);
          };
          if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(hex).then(done, function () {});
        });
      });

      if (RM || !('IntersectionObserver' in window)) return;
      root.classList.add('mm-vest--anim');
      function reveal() {
        items.forEach(function (li, i) {
          setTimeout(function () { li.classList.add('is-in'); }, i * 110);
          setTimeout(function () { li.classList.add('is-color'); }, 180 + i * 110);
        });
        setTimeout(function () {
          root.classList.remove('mm-vest--anim');
          items.forEach(function (li) { li.classList.remove('is-in', 'is-color'); });
        }, 900 + items.length * 110);
      }
      var shown = false;
      var io = new IntersectionObserver(function (en) {
        if (en[0].isIntersecting && !shown) { shown = true; reveal(); io.disconnect(); }
      }, { threshold: .3 });
      io.observe(list);
    })();
  </script>
