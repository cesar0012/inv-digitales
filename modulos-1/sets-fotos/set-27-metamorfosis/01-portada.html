          d.y -= d.v * dt * (1 - d.z * .5); if (d.y < -.05) { d.y = 1.05; d.x = Math.random(); }
          var x = d.x * W + Math.sin(time * .4 + d.tw) * 18 * d.z + yaw * 40 * d.z, y = d.y * H;
          var r = 5 + 9 * d.z;
          bx.globalAlpha = (.25 + .35 * Math.sin(time * 1.7 + d.tw)) * d.z;
          bx.drawImage(dots[d.c], x - r, y - r, r * 2, r * 2);
        }
        bx.globalCompositeOperation = 'source-over';
        bx.globalAlpha = 1;
      }
      function stepBfly(b, time, dt, tx, ty) {
        var dx = tx - b.px, dy = ty - b.py;
        b.px = tx; b.py = ty;
        var tr = clamp(Math.atan2(dy, dx) + Math.PI / 2, -.75, .75);
        if (Math.abs(dx) + Math.abs(dy) > .05) b.rot += (tr - b.rot) * .06;
        var glide = .5 + .5 * Math.sin(time * .6 + b.p1);
        b.ph += dt * b.fr * (.45 + .55 * glide);
        var flap = .08 + .92 * Math.pow(.5 + .5 * Math.cos(b.ph), 1.3);
        b.open = flap + (.85 - flap) * (1 - glide) * .55;
        b.yaw = clamp(dx * .08, -.5, .5);
      }
      function drawFlock(time, dt) {
        var base = clamp(W * .056, 40, 86);
        for (var i = 0; i < flock.length; i++) {
          var b = flock[i];
          var X = b.ox + b.ax * Math.sin(time * b.w1 * 6.283 + b.p1) + .08 * Math.sin(time * 1.3 + b.p3);
          var Y = b.oy + b.ay * Math.sin(time * b.w2 * 6.283 + b.p2) + .05 * Math.cos(time * 1.7 + b.p1);
          b.z = clamp(b.oz + b.az * Math.sin(time * b.w3 * 6.283 + b.p3), 0, 1);
          var sx = W / 2 + X * W * .48 + yaw * 70 * (1.1 - b.z);
          var sy = H / 2 + Y * H * .46 - pitch * 50 * (1.1 - b.z);
          var e = eout(clamp((time - b.born) / 1.8, 0, 1));
          b.x = cx + (sx - cx) * e; b.y = cy - scale * .2 + (sy - cy + scale * .2) * e;
          b.vis = e;
        }
        flock.sort(function (a, b) { return b.z - a.z; });
        for (var j = 0; j < flock.length; j++) {
          var f = flock[j];
          if (f.vis <= 0) continue;
          stepBfly(f, time, dt, f.x, f.y);
          var depth = 1.25 - f.z * .7;
          bfly(bx, f.x, f.y, base * depth * (.25 + .75 * f.vis), f.rot, f.open, f.yaw, f.pair, (.45 + .55 * (1 - f.z)) * Math.min(1, f.vis * 2));
        }
      }
      function drawBursts(time, dt) {
        for (var i = bursts.length - 1; i >= 0; i--) {
          var b = bursts[i];
          b.life -= dt / 3.2;
          if (b.life <= 0) { bursts.splice(i, 1); continue; }
          b.vx *= .985; b.vy = b.vy * .985 - 26 * dt;
          b.x += b.vx * dt; b.y += b.vy * dt;
          b.ph += dt * 11;
          var flap = .08 + .92 * Math.pow(.5 + .5 * Math.cos(b.ph), 1.3);
          var rot = clamp(Math.atan2(b.vy, b.vx) + Math.PI / 2, -.8, .8);
          bfly(bx, b.x, b.y, b.s * (1 - (1 - b.life) * .3), rot, flap, clamp(b.vx * .004, -.5, .5), b.pair, Math.min(1, b.life * 1.6));
        }
      }
      function drawFront(time) {
        fx.setTransform(DPR, 0, 0, DPR, 0, 0);
        fx.clearRect(0, 0, W, H);
        if (time < 3.2) return;
        var big = clamp(W * .26, 160, 360);
        var canBlur = 'filter' in fx;
        if (canBlur) fx.filter = 'blur(' + Math.round(big / 64) + 'px)';
        for (var i = 0; i < bokeh.length; i++) {
          var k = bokeh[i];
          var u = (k.p + (time - 3.2) * k.sp) % 1;
          var x = -big + u * (W + big * 2), y = H * k.y + Math.sin(u * 9 + i) * H * .06;
          var flap = .15 + .85 * Math.pow(.5 + .5 * Math.cos(time * 4.2 + i * 2), 1.4);
          var a = Math.sin(u * Math.PI) * (canBlur ? .24 : .14);
          bfly(fx, x, y, big, .35 + Math.sin(time * .5 + i) * .15, flap, .2, k.pair, a);
        }
        if (canBlur) fx.filter = 'none';
      }

      function frame(now) {
        raf = 0;
        if (!running) return;
        var dt = last ? Math.min(.05, (now - last) / 1000) : .016;
        last = now; clock += dt;
        var time = clock;
        var auto = touchLike ? Math.sin(time * .32) * .22 : 0;
        yaw += (tyaw + auto - yaw) * .05; pitch += (tpitch - pitch) * .05;

        bx.setTransform(DPR, 0, 0, DPR, 0, 0);
        bx.clearRect(0, 0, W, H);
        var hs = scale * 2.6;
        bx.globalCompositeOperation = 'lighter';
        bx.globalAlpha = .22 * eout(clamp(time / 2, 0, 1)) * (.85 + .15 * Math.sin(time * 1.2));
        bx.drawImage(halo, cx - hs, cy - scale * 1.1 - hs * .7, hs * 2, hs * 1.4);
        bx.globalCompositeOperation = 'source-over'; bx.globalAlpha = 1;
        drawDust(time, dt);
        drawFiligree(time, time < 2.6 ? 1 : Math.max(.58, 1 - (time - 2.6) * .3));
        drawFlock(time, dt);
        drawBursts(time, dt);
        drawFront(time);

        if (tilt) tilt.style.transform = 'perspective(1000px) rotateY(' + (yaw * 7).toFixed(2) + 'deg) rotateX(' + (pitch * 7).toFixed(2) + 'deg)';
        if (cue) cue.style.transform = 'translateY(' + ((Math.sin(time * 1.6) * .5 + .5) * 46).toFixed(1) + 'px)';
        if (time > glintAt && tilt) {
          glintAt = time + 6.5;
          tilt.classList.toggle('is-glint');

      }
      function play() { if (running || RM) return; running = true; last = 0; raf = requestAnimationFrame(frame); }
      function pause() { running = false; if (raf) cancelAnimationFrame(raf); raf = 0; }

      function revealSequence() {
        root.classList.add('mm-portada--anim');
        var at = [1000, 1250, 1600, 1850, 2050, 2500];
        steps.forEach(function (el, i) { setTimeout(function () { el.classList.add('is-on'); }, at[Math.min(i, at.length - 1)]); });
        setTimeout(function () {
          root.classList.remove('mm-portada--anim');
          steps.forEach(function (el) { el.classList.remove('is-on'); });
        }, 3400);
      }

      function staticFrame() {
        bx.setTransform(DPR, 0, 0, DPR, 0, 0); bx.clearRect(0, 0, W, H);
        drawFiligree(10, .8);
        var base = clamp(W * .05, 30, 66);
        flock.slice(0, 6).forEach(function (b, i) {
          var x = W / 2 + b.ox * W * .46, y = H / 2 + b.oy * H * .44;
          bfly(bx, x, y, base * (1.2 - b.oz * .6), (i % 2 ? .3 : -.3), .9, 0, b.pair, .7);
        });
      }

      size(); build();
      if (RM) {
        staticFrame();
      } else {
        revealSequence();
        root.addEventListener('pointermove', function (e) {
          var r = root.getBoundingClientRect();
          tyaw = ((e.clientX - r.left) / r.width - .5) * .7;
          tpitch = ((e.clientY - r.top) / r.height - .5) * -.4;
        }, { passive: true });
        root.addEventListener('pointerleave', function () { tyaw = 0; tpitch = 0; }, { passive: true });
        root.addEventListener('pointerdown', function (e) {
          var r = root.getBoundingClientRect(), x = e.clientX - r.left, y = e.clientY - r.top;
          for (var i = 0; i < 5 && bursts.length < 30; i++) {
            var a = -Math.PI / 2 + (i - 2) * .45 + (Math.random() - .5) * .3, v = 120 + Math.random() * 90;
            bursts.push({ x: x, y: y, vx: Math.cos(a) * v, vy: Math.sin(a) * v, life: 1, ph: Math.random() * 6, s: clamp(W * .04, 26, 46), pair: pairs[i % 3] });
          }
        }, { passive: true });
      }

      if ('ResizeObserver' in window) {
        var rw = 0, rh = 0;
        new ResizeObserver(function () {
          var r = root.getBoundingClientRect();
          if (Math.abs(r.width - rw) < 2 && Math.abs(r.height - rh) < 60) return;
          rw = r.width; rh = r.height; size();
          if (RM) { build(); staticFrame(); }
        }).observe(root);
      }
      if ('IntersectionObserver' in window) {
        new IntersectionObserver(function (en) {
          en.forEach(function (x) { if (x.isIntersecting) { started = true; play(); } else pause(); });
        }, { threshold: 0 }).observe(root);
      } else play();
      document.addEventListener('visibilitychange', function () { if (document.hidden) pause(); else if (started) play(); });
    })();
