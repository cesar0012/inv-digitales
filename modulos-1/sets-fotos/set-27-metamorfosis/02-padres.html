    @import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;1,300;1,400&family=Pinyon+Script&display=swap');

      position: relative;

      place-items: center;
      padding: clamp(4rem, 9vw, 7rem) clamp(1rem, 5vw, 4rem);
      overflow: hidden;
      background-color: var(--mm-bg);
      background-image:
        radial-gradient(40% 50% at 50% 55%, color-mix(in srgb, var(--mm-p) 14%, transparent), transparent 70%),
        radial-gradient(35% 45% at 12% 30%, color-mix(in srgb, var(--mm-s) 10%, transparent), transparent 70%),
        radial-gradient(35% 45% at 88% 75%, color-mix(in srgb, var(--mm-a) 9%, transparent), transparent 70%),
        linear-gradient(color-mix(in srgb, var(--mm-bg) 76%, transparent), color-mix(in srgb, var(--mm-bg) 76%, transparent)),
        url('https://loremflickr.com/1600/1000/butterfly,flowers') center/cover;
      color: var(--mm-tx);
      text-align: center;
      font-family: var(--mm-serif);
    }
    .mm-padres__content { position: relative; z-index: 1; width: min(100%, 64rem); }
    .mm-padres__head { margin-bottom: clamp(2rem, 5vw, 3.5rem); }
    .mm-padres__eyebrow {
      margin: 0 0 .35rem;
      font-style: italic;
      font-size: clamp(1.05rem, 2vw, 1.3rem);
      color: color-mix(in srgb, var(--mm-p) 70%, var(--mm-tx));
    }
    .mm-padres__title {
      margin: 0;
      font-weight: 300;
      font-size: clamp(2.3rem, 5.4vw, 3.8rem);
      line-height: 1.05;
      letter-spacing: .01em;
      color: var(--mm-tx);
    }

    /* Par de alas */
    .mm-padres__wings {
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      align-items: center;
      gap: clamp(.5rem, 2vw, 1.5rem);
      perspective: 1400px;
      transform-style: preserve-3d;
      will-change: transform;
    }
    .mm-padres__card {
      --hinge: 100% 50%;
      position: relative;
      display: grid;
      justify-items: center;
      gap: .4rem;
      align-self: stretch;
      padding: clamp(2rem, 4vw, 3rem) clamp(1.2rem, 3vw, 2.4rem) clamp(2.2rem, 4vw, 3.2rem);
      border: 1px solid transparent;
      border-radius: 62% 10% 10% 46% / 44% 12% 12% 56%;
      background:
        repeating-conic-gradient(from 180deg at var(--hinge), transparent 0deg 8.6deg, color-mix(in srgb, var(--mm-a) 11%, transparent) 8.6deg 9deg) padding-box,
        radial-gradient(120% 90% at var(--hinge), color-mix(in srgb, var(--mm-p) 16%, transparent), color-mix(in srgb, var(--mm-bg) 70%, transparent) 70%) padding-box,
        linear-gradient(140deg, color-mix(in srgb, var(--mm-s) 70%, transparent), color-mix(in srgb, var(--mm-p) 60%, transparent), color-mix(in srgb, var(--mm-a) 80%, transparent)) border-box;
      -webkit-backdrop-filter: blur(10px);
      backdrop-filter: blur(10px);
      box-shadow: 0 30px 60px -30px color-mix(in srgb, #000 70%, transparent), inset 0 0 40px color-mix(in srgb, var(--mm-p) 8%, transparent);
      transform-origin: right center;
      transform-style: preserve-3d;
    }
    .mm-padres__card--r {
      --hinge: 0% 50%;
      border-radius: 10% 62% 46% 10% / 12% 44% 56% 12%;
      transform-origin: left center;
    }
    .mm-padres__portrait {
      position: relative;
      width: clamp(8.5rem, 17vw, 11.5rem);
      aspect-ratio: 1 / 1;
      margin-bottom: .6rem;
    }
    .mm-padres__ring {
      position: absolute;
      inset: -7px;
      border-radius: 50%;
      background: conic-gradient(from var(--mm-rot, 0deg), var(--mm-s), var(--mm-p), var(--mm-a), color-mix(in srgb, var(--mm-s) 30%, var(--mm-p)), var(--mm-s));
      -webkit-mask: radial-gradient(farthest-side, transparent calc(100% - 3px), #000 calc(100% - 2.5px));
      mask: radial-gradient(farthest-side, transparent calc(100% - 3px), #000 calc(100% - 2.5px));
      filter: drop-shadow(0 0 8px color-mix(in srgb, var(--mm-p) 60%, transparent));
    }
    .mm-padres__photo {
      position: absolute;
      inset: 0;
      margin: 0;
      overflow: hidden;
      border-radius: 50%;
      background: color-mix(in srgb, var(--mm-tx) 8%, var(--mm-bg));
    }
    .mm-padres__photo img {
      display: block;
      width: 100%;
      height: 100%;
      aspect-ratio: 1 / 1;
      object-fit: cover;
    }
    .mm-padres__name {
      margin: 0;
      font-family: var(--mm-script);
      font-weight: 400;
      font-size: clamp(2.1rem, 4.2vw, 3rem);
      line-height: 1.1;
      color: var(--mm-tx);
      text-shadow: 0 0 18px color-mix(in srgb, var(--mm-a) 35%, transparent);
    }
    .mm-padres__role {
      margin: 0;
      font-style: italic;
      font-size: clamp(1rem, 1.8vw, 1.2rem);
      color: color-mix(in srgb, var(--mm-a) 85%, var(--mm-tx));
    }

    /* Eje central: el cuerpo de la mariposa */
    .mm-padres__axis {
      position: relative;
      display: grid;
      place-items: center;
      align-self: stretch;
      width: clamp(3rem, 6vw, 4.5rem);
    }
    .mm-padres__axis::before {
      content: '';
      position: absolute;
      top: 8%;
      bottom: 8%;
      left: 50%;
      width: 1px;
      background: linear-gradient(180deg, transparent, var(--mm-a), transparent);
    }
    .mm-padres__bf {
      position: relative;
      width: 4.4rem;
      height: 2.8rem;
      transform-style: preserve-3d;
      transform: perspective(260px) rotateX(52deg);
    }
    .mm-padres__bf i {
      position: absolute;
      top: 0;
      left: 50%;
      width: 50%;
      transform-origin: 0 50%;
      animation: mmPadresFlapR .36s ease-in-out infinite alternate;
    }
    .mm-padres__bf i + i { animation-name: mmPadresFlapL; }
    .mm-padres__bf svg { display: block; width: 100%; height: auto; overflow: visible; }
    .mm-padres__bf path { stroke: var(--mm-a); stroke-width: 3; }
    .mm-padres__bf path:first-child { fill: var(--mm-p); }
    .mm-padres__bf path:last-child { fill: var(--mm-s); }
    @keyframes mmPadresFlapR { from { transform: rotateY(10deg); } to { transform: rotateY(68deg); } }
    @keyframes mmPadresFlapL { from { transform: rotateY(170deg); } to { transform: rotateY(112deg); } }

    .mm-padres__flit {
      position: absolute;
      top: 0;
      left: 0;
      z-index: 2;
      width: 1.9rem;
      height: 1.25rem;
      pointer-events: none;
      opacity: .75;
      transform-style: preserve-3d;
      will-change: transform;
    }
    .mm-padres__flit .mm-padres__bf { width: 100%; height: 100%; }

    .mm-padres__note {
      max-width: 38ch;
      margin: clamp(2rem, 5vw, 3rem) auto 0;
      font-style: italic;
      font-weight: 300;
      font-size: clamp(1.1rem, 2vw, 1.35rem);
      line-height: 1.55;
      color: color-mix(in srgb, var(--mm-tx) 85%, transparent);
      text-wrap: balance;
    }

    /* Entrada: las alas se despliegan desde el cuerpo (≤ 0.5s) */
    .mm-padres--anim .mm-padres__card { opacity: 0; transform: rotateY(-82deg); transition: transform .5s cubic-bezier(.2, .9, .25, 1.05), opacity .35s ease; }
    .mm-padres--anim .mm-padres__card--r { transform: rotateY(82deg); transition-delay: .12s; }
    .mm-padres--anim .mm-padres__axis { opacity: 0; transform: scale(.4); transition: transform .45s cubic-bezier(.3, 1.5, .5, 1) .28s, opacity .3s ease .28s; }
    .mm-padres--anim .mm-padres__head,
    .mm-padres--anim .mm-padres__note { opacity: 0; transform: translateY(12px); transition: opacity .5s ease, transform .5s ease; }
    .mm-padres--anim .mm-padres__note { transition-delay: .45s; }
    .mm-padres--anim.is-in .mm-padres__card,
    .mm-padres--anim.is-in .mm-padres__axis,
    .mm-padres--anim.is-in .mm-padres__head,
    .mm-padres--anim.is-in .mm-padres__note { opacity: 1; transform: none; }

    @media (max-width: 720px) {
      .mm-padres__wings { grid-template-columns: 1fr; gap: 0; }
      .mm-padres__card { border-radius: 46% 46% 14% 14% / 30% 30% 12% 12%; --hinge: 50% 100%; transform-origin: center bottom; }
      .mm-padres__card--r { border-radius: 14% 14% 46% 46% / 12% 12% 30% 30%; --hinge: 50% 0%; transform-origin: center top; }
      .mm-padres__axis { width: 100%; min-height: 4.5rem; }
      .mm-padres__axis::before { top: 50%; bottom: auto; left: 12%; right: 12%; width: auto; height: 1px; background: linear-gradient(90deg, transparent, var(--mm-a), transparent); }
      .mm-padres--anim .mm-padres__card { transform: rotateX(82deg); }
      .mm-padres--anim .mm-padres__card--r { transform: rotateX(-82deg); }
    }
    @media (prefers-reduced-motion: reduce) {
      .mm-padres *, .mm-padres *::before, .mm-padres *::after { animation: none !important; transition: none !important; }
    }
