    /* Twinkle-in: blur + brightness flash, staggered per card */
    .ne-pa--anim .ne-pa__head { opacity: 0; filter: blur(8px); transition: opacity .5s ease, filter .5s ease; }

          ctx.quadraticCurveTo(x - s * .14, y - s * .14, x, y - s);
          ctx.fill();

        function spawn(now) {

          shots.push({ x: W * (.35 + Math.random() * .7), y: -10 + Math.random() * H * .4, dx: -Math.cos(th), dy: Math.sin(th), dist: (W + H) * (.25 + Math.random() * .15), len: 90 + Math.random() * 110, born: now, life: 950 + Math.random() * 450 });

      var halos = root.querySelectorAll('[data-ne-halo]');
