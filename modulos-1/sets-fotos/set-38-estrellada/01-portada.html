  <script>
    (function () {
      var SEL = '[data-gemini-id="portada-nombre"]';
      var root = null;

      var stage = root.querySelector('[data-ne-stage]');
      var moon = root.querySelector('[data-ne-moon]');
      var title = root.querySelector('[data-ne-reveal]');
      var glints = root.querySelectorAll('[data-ne-glint]');
      var ctx = cv && cv.getContext ? cv.getContext('2d') : null;
      var cs = getComputedStyle(root);
      var cA = cs.getPropertyValue('--t-a').trim() || '#eef3ff';
      var cP = cs.getPropertyValue('--t-p').trim() || '#c4ccda';
      var dpr = Math.min(window.devicePixelRatio || 1, 2);
      var W = 1, H = 1, F = 1, AY = 1.15, stars = [], dust = [], shots = [];
      var nextShot = 0, nextDust = 0, rot = 0, mx = .5, my = .5, px = .5, py = .5;
      var last = 0, raf = 0, on = false, revealAt = 0, revealing = false;

      function star(fresh) {
        return { x: (Math.random() * 2 - 1) * 1.6, y: (Math.random() * 2 - 1) * AY, z: fresh ? 1.1 : .06 + Math.random() * 1.04, ph: Math.random() * 6.283, sp: .6 + Math.random() * 1.8, g: Math.random() < .16 };
      }
      function size() {
        if (!ctx) return;
        var r = root.getBoundingClientRect();
        W = Math.max(1, r.width); H = Math.max(1, r.height);
        cv.width = Math.round(W * dpr); cv.height = Math.round(H * dpr);
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
        F = W * .42; AY = 1.2 * Math.max(1, H / W * 1.1);
        var n = Math.min(520, Math.round(W * H / 2600));
        stars = [];
        for (var i = 0; i < n; i++) stars.push(star(false));
      }
      function sparkle(x, y, s, a, col) {
        ctx.globalAlpha = Math.max(0, Math.min(1, a)); ctx.fillStyle = col;
        ctx.beginPath(); ctx.moveTo(x, y - s);
        ctx.quadraticCurveTo(x + s * .14, y - s * .14, x + s, y);
        ctx.quadraticCurveTo(x + s * .14, y + s * .14, x, y + s);
        ctx.quadraticCurveTo(x - s * .14, y + s * .14, x - s, y);
        ctx.quadraticCurveTo(x - s * .14, y - s * .14, x, y - s);
        ctx.fill();

        return { x: tr.left - rr.left, y: tr.top - rr.top, w: tr.width, h: tr.height };
      }
      function addDust(x, y, now, spread) {

      function draw(now, dt) {

        rot += dt * .000028;
        var cr = Math.cos(rot), sr = Math.sin(rot), ox = (px - .5) * .22, oy = (py - .5) * .14;
        for (var i = 0; i < stars.length; i++) {

          if (dt) { s.z -= dt * .000034; if (s.z < .06) { stars[i] = s = star(true); } }

          if (sx < -12 || sx > W + 12 || sy < -12 || sy > H + 12) continue;
          var near = 1.1 - s.z, tw = .6 + .4 * Math.sin(t * s.sp + s.ph), a = Math.min(1, near * 1.35) * tw;
          if (s.g && s.z < .6) sparkle(sx, sy, 1.2 + near * 4.6 * tw, a, cA);
          else { ctx.globalAlpha = a; ctx.fillStyle = s.g ? cA : cP; ctx.beginPath(); ctx.arc(sx, sy, .3 + near * 1.4, 0, 6.283); ctx.fill(); }
        }
        if (dt) {
          if (!nextShot) nextShot = now + 1600;

            var th = .45 + Math.random() * .18;

            nextShot = now + 3800 + Math.random() * 4200;
          }
          for (var j = shots.length - 1; j >= 0; j--) {
            var sh = shots[j], k = (now - sh.born) / sh.life;
            if (k >= 1) { shots.splice(j, 1); continue; }
            var hx = sh.x + sh.dx * k * sh.dist, hy = sh.y + sh.dy * k * sh.dist, tl = sh.len * Math.min(1, k * 3);
            var g = ctx.createLinearGradient(hx, hy, hx - sh.dx * tl, hy - sh.dy * tl);

            if (k2 >= 1) revealing = false;
          } else if (now > nextDust) {
            addDust(b.x + b.w * (.08 + Math.random() * .84), b.y + b.h * (.25 + Math.random() * .55), now, .4);
            nextDust = now + 110 + Math.random() * 160;
          }
          for (var q = dust.length - 1; q >= 0; q--) {
            var p = dust[q], kk = (now - p.born) / p.life;
            if (kk >= 1) { dust.splice(q, 1); continue; }
            p.x += p.vx * dt; p.y += p.vy * dt;
            sparkle(p.x, p.y, p.s * (1 - kk * .5), Math.sin(kk * Math.PI), cA);
          }
          /* Metallic sheen sweeping across the cursive name */
          var cyc = (t % 6.5) / 4;
          stage.style.setProperty('--sheen', (cyc > 1 ? 100 : cyc * 100).toFixed(2) + '%');
          /* 3D moon tilt follows the pointer with a slow dreamy sway */
          if (moon) {
            moon.style.transform = 'rotateX(' + ((py - .5) * -18 + Math.sin(t * .5) * 3).toFixed(2) + 'deg) rotateY(' + ((px - .5) * 26 + 10 + Math.sin(t * .37) * 6).toFixed(2) + 'deg)';
          }

      if (RM) { draw(1000, 0); return; }  /* reduced motion: one static starfield, everything visible */

      function loop(now) {

      function start() { if (on) return; on = true; last = 0; raf = requestAnimationFrame(loop); }

    })();
