    .ne-rs, .ne-rs *, .ne-rs *::before, .ne-rs *::after { box-sizing: border-box; }
    .ne-rs {
      --t-bg: var(--bg-color, #0a1535);
      --t-tx: var(--text-color, #f3f6fd);
      --t-p: var(--primary-color, #c4ccda);
      --t-s: var(--secondary-color, #1d3170);
      --t-a: var(--accent-color, #eef3ff);
      --t-display: var(--font-script, 'Great Vibes', cursive);
      --t-text: var(--font-heading, 'Cormorant Garamond', Georgia, serif);
      --t-soft: color-mix(in srgb, var(--t-tx) 80%, transparent);
      --t-line: color-mix(in srgb, var(--t-p) 45%, transparent);

      isolation: isolate;
      min-height: clamp(32rem, 60vw, 46rem);

      place-items: center;
      padding: clamp(4rem, 9vw, 7rem) clamp(1rem, 5vw, 4rem);
      overflow: hidden;
      background-color: var(--t-bg);
      background-image: url('https://loremflickr.com/1600/1000/night,stars,sky?lock=3306');
      background-size: cover;
      background-position: center;
      color: var(--t-tx);
      text-align: center;
      font-family: var(--t-text);
    }
    .ne-rs::before {
      content: '';
      position: absolute;
      inset: 0;
      z-index: -1;
      background:
        radial-gradient(ellipse 60% 50% at 50% 55%, color-mix(in srgb, var(--t-s) 55%, transparent), transparent 70%),
        linear-gradient(180deg, color-mix(in srgb, var(--t-bg) 88%, transparent), color-mix(in srgb, var(--t-bg) 95%, transparent));

    .ne-rs__sky { position: absolute; inset: 0; width: 100%; height: 100%; z-index: 0; pointer-events: none; }

    .ne-rs__panel {
      position: relative;
      z-index: 1;
      width: min(100%, 40rem);
      padding: clamp(2.2rem, 5vw, 3.4rem) clamp(1.3rem, 5vw, 3.2rem) clamp(2rem, 4vw, 2.8rem);
      border-radius: 2rem;
      border: 1px solid color-mix(in srgb, var(--t-p) 35%, transparent);
      background:
        radial-gradient(circle at 12% 0%, color-mix(in srgb, var(--t-a) 10%, transparent), transparent 40%),

    .ne-rs__spin { width: 1.3rem; height: 1.3rem; }
