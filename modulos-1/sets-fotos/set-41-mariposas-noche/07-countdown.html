      function pad(n) { return n < 10 ? '0' + n : '' + n; }
      function updateCountdown() {
        var d = Math.max(0, target - Date.now());
        var v = { days: Math.floor(d / 864e5), hours: Math.floor(d / 36e5) % 24, minutes: Math.floor(d / 6e4) % 60, seconds: Math.floor(d / 1e3) % 60 };
        for (var u in units) if (units[u]) units[u].textContent = pad(v[u]);
        if (secBox && !RM) { secBox.setAttribute('data-pop', ''); setTimeout(function () { secBox.removeAttribute('data-pop'); }, 260); }
      }
      if (window.__countdownIntervals) window.__countdownIntervals.forEach(function (id) { clearInterval(id); });
      window.__countdownIntervals = [];
      window.updateCountdown = updateCountdown;
      updateCountdown();
      window.__countdownIntervals.push(setInterval(updateCountdown, 1000));

      if (RM || !IO) return;   /* reduced motion = static final state */
      var tilt = root.querySelector('[data-tilt]');
      root.classList.add('jmcd--anim');
      var io = new IntersectionObserver(function (en) {
        if (en[0].isIntersecting && en[0].intersectionRatio > .25) {
          io.disconnect(); root.classList.add('is-in');
          setTimeout(function () { root.classList.remove('jmcd--anim', 'is-in'); }, 1100);
        }
      }, { threshold: [0, .25, .5] });
      io.observe(root);
      /* The big butterfly breathes: wings open/close slowly in 3D */
      loop(function (t) {
        if (!tilt) return;
        tilt.style.setProperty('--f', (9 + 9 * Math.sin(t * .0016)).toFixed(2));
        tilt.style.setProperty('--tx', (14 + 4 * Math.sin(t * .0007)).toFixed(2) + 'deg');
        tilt.style.setProperty('--tz', (Math.sin(t * .0005) * 2).toFixed(2) + 'deg');
      });
    })();
