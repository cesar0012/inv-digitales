  <script>
    (function () {
      var SEL = '[data-gemini-id="confirmacion-texto"]';
      var root = null;
      try { root = document.currentScript && document.currentScript.closest(SEL); } catch (e) {}
      if (!root || !root.getAttribute) root = document.querySelector(SEL);
      if (!root || root.__tInit) return;
      root.__tInit = true;
      var RM = !!(window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches);

      var form = root.querySelector('[data-ptr-form]');
      var btn = root.querySelector('[data-ptr-submit]');
      var nameIn = root.querySelector('[data-ptr-name]');
      var live = root.querySelector('[data-ptr-live]');
      var burst = root.querySelector('[data-ptr-burst]');
      var timer = 0;

      function petals() {
        if (RM) return;
        for (var i = 0; i < 14; i++) {
          var p = document.createElement('i');
          p.className = 'ptr-con__petal';
          var a = (i / 14) * 6.283 + Math.random() * .4, d = 60 + Math.random() * 70;
          p.style.setProperty('--dx', (Math.cos(a) * d * 1.8).toFixed(1) + 'px');
          p.style.setProperty('--dy', (Math.sin(a) * d * .8 - 20).toFixed(1) + 'px');
          p.style.setProperty('--rot', (Math.random() * 360).toFixed(0) + 'deg');
          burst.appendChild(p);
        }
        requestAnimationFrame(function () { requestAnimationFrame(function () {
          [].forEach.call(burst.children, function (c) { c.setAttribute('data-go', ''); });
        }); });
        setTimeout(function () { burst.innerHTML = ''; }, 700);
      }
      form.addEventListener('submit', function (e) {
        e.preventDefault();
        if (btn.getAttribute('data-state') === 'loading') return;
        if (!nameIn.value.trim()) {
          nameIn.removeAttribute('data-invalid');
          void nameIn.offsetWidth;
          nameIn.setAttribute('data-invalid', '');
          nameIn.focus();
          live.textContent = 'Escribe tu nombre para confirmar.';
          return;
        }
        nameIn.removeAttribute('data-invalid');
        btn.setAttribute('data-state', 'loading');
        btn.setAttribute('aria-busy', 'true');
        live.textContent = 'Enviando tu confirmación…';
        clearTimeout(timer);
        timer = setTimeout(function () {
          btn.setAttribute('data-state', 'done');
          btn.removeAttribute('aria-busy');
          live.textContent = 'Confirmación recibida. ¡Gracias!';
          petals();
        }, 1400);
      });
      form.addEventListener('input', function () {
        nameIn.removeAttribute('data-invalid');
        if (btn.getAttribute('data-state') === 'done') { btn.setAttribute('data-state', 'idle'); live.textContent = ''; }
      });

      if (RM || !('IntersectionObserver' in window)) return;   /* reduced motion = static final state */
      root.classList.add('ptr-con--anim');
      var io = new IntersectionObserver(function (en) {
        if (en[0].isIntersecting && en[0].intersectionRatio > .25) {
          io.disconnect();
          root.classList.add('is-in');
          setTimeout(function () { root.classList.remove('ptr-con--anim', 'is-in'); }, 1300);
        }
      }, { threshold: [0, .25, .5] });
      io.observe(root);
    })();
  </script>
