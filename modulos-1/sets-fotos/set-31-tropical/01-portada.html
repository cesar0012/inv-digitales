  <script>
    (function () {
      var SEL = '[data-gemini-id="portada-nombre"]';
      var root = null;
      try { root = document.currentScript && document.currentScript.closest(SEL); } catch (e) {}
      if (!root) root = document.querySelector(SEL);
      if (!root || root.__tInit) return;
      root.__tInit = true;
      var RM = !!(window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches);

      var cv = root.querySelector('[data-ptr-sky]');
      var ctx = cv && cv.getContext ? cv.getContext('2d') : null;
      var layers = [].slice.call(root.querySelectorAll('[data-ptr-layer]'));
      var card = root.querySelector('[data-ptr-card]');
      var names = root.querySelector('[data-ptr-reveal]');
      var cs = getComputedStyle(root);
      function col(n, f) { var v = (cs.getPropertyValue(n) || '').trim(); return v || f; }
      var C = { p: col('--t-p', '#1BB3AE'), s: col('--t-s', '#138A6B'), a: col('--t-a', '#FF7A63') };

      /* ---------- canvas: petals, leaves and drops with manual perspective projection ---------- */
      var W = 0, H = 0, parts = [], F = 640;
      function size() {
        if (!ctx) return;
        var d = Math.min(window.devicePixelRatio || 1, 2);
        W = cv.clientWidth; H = cv.clientHeight;
        cv.width = Math.round(W * d); cv.height = Math.round(H * d);
        ctx.setTransform(d, 0, 0, d, 0, 0);
      }
      function make(i) {
        var k = i % 8, type = k < 3 ? 'petal' : k < 5 ? 'leaf' : k < 7 ? 'drop' : 'glint';
        return {
          x: (Math.random() * 2 - 1) * 1000, y: (Math.random() * 2 - 1) * 700, z: 260 + Math.random() * 1150,
          r: Math.random() * 6.28, vr: (Math.random() - .5) * .018, ph: Math.random() * 6.28, type: type,
          s: type === 'petal' ? 9 + Math.random() * 7 : type === 'leaf' ? 13 + Math.random() * 9 : type === 'drop' ? 12 + Math.random() * 18 : 2 + Math.random() * 2.2
        };
      }
      function seed() { parts = []; var n = W < 700 ? 26 : 50; for (var i = 0; i < n; i++) parts.push(make(i)); }
      var mx = 0, my = 0, tmx = 0, tmy = 0, hasPointer = false;
      function drawParts(t, move) {
        if (!ctx) return;
        ctx.clearRect(0, 0, W, H);
        var cx = W / 2, cy = H / 2;
        parts.sort(function (a, b) { return b.z - a.z; });
        for (var i = 0; i < parts.length; i++) {
          var p = parts[i];
          if (move) {
            if (p.type === 'drop' || p.type === 'glint') p.y -= .22; else p.y += .32;
            p.x += Math.sin(t * .0005 + p.ph) * .4;
            p.r += p.vr;
            if (p.y > 720) p.y = -720; if (p.y < -720) p.y = 720;
          }
          var k = F / p.z;
          var sx = cx + (p.x - mx * 140) * k, sy = cy + (p.y - my * 90) * k;
          if (sx < -60 || sx > W + 60 || sy < -60 || sy > H + 60) continue;
          var al = Math.max(.12, Math.min(.85, 1.3 - p.z / 1300));
          var s = p.s * k;
          ctx.save();
          ctx.translate(sx, sy);
          ctx.globalAlpha = al;
          if (p.type === 'petal') {
            ctx.rotate(p.r);
            ctx.scale(1, .45 + .55 * Math.abs(Math.cos(t * .0012 + p.ph)));
            ctx.fillStyle = C.a; ctx.globalAlpha = al * .55;
            ctx.beginPath(); ctx.ellipse(0, 0, s, s * .62, 0, 0, 6.283); ctx.fill();
            ctx.fillStyle = '#ffffff'; ctx.globalAlpha = al * .45;
            ctx.beginPath(); ctx.ellipse(-s * .15, -s * .1, s * .55, s * .3, 0, 0, 6.283); ctx.fill();
          } else if (p.type === 'leaf') {
            ctx.rotate(p.r);
            ctx.scale(1, .5 + .5 * Math.abs(Math.sin(t * .001 + p.ph)));
            ctx.fillStyle = C.s; ctx.globalAlpha = al * .6;
            ctx.beginPath(); ctx.moveTo(-s, 0); ctx.quadraticCurveTo(0, -s * .55, s, 0); ctx.quadraticCurveTo(0, s * .55, -s, 0); ctx.fill();
            ctx.strokeStyle = '#ffffff'; ctx.globalAlpha = al * .35; ctx.lineWidth = Math.max(.6, s * .06);
            ctx.beginPath(); ctx.moveTo(-s * .9, 0); ctx.lineTo(s * .9, 0); ctx.stroke();
          } else if (p.type === 'drop') {
            var g = ctx.createRadialGradient(0, 0, 0, 0, 0, s);
            g.addColorStop(0, C.p); g.addColorStop(1, 'rgba(255,255,255,0)');
            ctx.globalAlpha = al * .32; ctx.fillStyle = g;
            ctx.beginPath(); ctx.arc(0, 0, s, 0, 6.283); ctx.fill();
          } else {
            ctx.rotate(t * .0008 + p.ph);
            ctx.fillStyle = '#ffffff'; ctx.globalAlpha = al * (.5 + .5 * Math.sin(t * .003 + p.ph));
            ctx.beginPath(); ctx.moveTo(0, -s * 2); ctx.lineTo(s * .45, 0); ctx.lineTo(0, s * 2); ctx.lineTo(-s * .45, 0); ctx.closePath(); ctx.fill();
          }
          ctx.restore();
        }
      }

      size(); seed();
      if (RM || !('IntersectionObserver' in window)) { drawParts(0, false); return; }   /* reduced motion = static final state */

      /* ---------- pop-up diorama + title reveal ---------- */
      root.classList.add('ptr-por--anim');
      names.style.setProperty('--rv', '-20');
      var t0 = 0, started = false, revealDone = false, running = false, raf = 0;
      function easeBack(x) { var c1 = 1.5, c3 = c1 + 1; return 1 + c3 * Math.pow(x - 1, 3) + c1 * Math.pow(x - 1, 2); }
      function apply(t) {
        var el = started ? t - t0 : 0;
        mx += (tmx - mx) * .05; my += (tmy - my) * .05;
        if (!hasPointer) { tmx = Math.sin(t * .00035) * .35; tmy = Math.cos(t * .0003) * .2; }
        for (var i = 0; i < layers.length; i++) {
          var L = layers[i], z = +L.getAttribute('data-z'), dl = +L.getAttribute('data-delay'), sw = +L.getAttribute('data-sway');
          var q = Math.max(0, Math.min(1, (el - dl) / 900));
          var fold = 88 * (1 - easeBack(q));
          var rz = sw * Math.sin(t * .0009 + i * 1.7);
          L.style.transform = 'translate3d(' + (-mx * z * .06).toFixed(2) + 'px,' + (-my * z * .04).toFixed(2) + 'px,' + z + 'px) rotateX(' + (fold - my * 2).toFixed(2) + 'deg) rotateY(' + (mx * 4).toFixed(2) + 'deg) rotateZ(' + rz.toFixed(2) + 'deg)';
          L.style.opacity = q > 0 ? 1 : 0;
        }
        var qc = Math.max(0, Math.min(1, (el - 200) / 900));
        card.style.transform = 'rotateX(' + (40 * (1 - easeBack(qc)) - my * 3).toFixed(2) + 'deg) rotateY(' + (mx * 5).toFixed(2) + 'deg)';
        if (started && !revealDone) {
          var qr = Math.max(0, Math.min(1, (el - 700) / 1500));
          names.style.setProperty('--rv', (-20 + 140 * (1 - Math.pow(1 - qr, 2))).toFixed(1));
          if (el > 1300) root.classList.add('is-text');
          if (qr >= 1) finish();
        }
      }
      function loop(t) {
        if (!running) return;
        if (started && !t0) t0 = t;
        apply(t);
        drawParts(t, true);
        raf = requestAnimationFrame(loop);
      }
      function finish() {
        if (revealDone) return;
        revealDone = true;
        names.style.removeProperty('--rv');
        root.classList.remove('ptr-por--anim', 'is-in', 'is-text');
      }
      function play() { if (!running && !document.hidden) { running = true; raf = requestAnimationFrame(loop); } }
      function stop() {
        running = false; cancelAnimationFrame(raf);
        if (started && !revealDone) { finish(); t0 = -1e6; apply(performance.now()); }   /* never leave text hidden off-screen */
      }
      apply(0);
      var io = new IntersectionObserver(function (en) {
        if (en[0].isIntersecting) {
          if (!started && en[0].intersectionRatio > .2) { started = true; root.classList.add('is-in'); }
          play();
        } else stop();
      }, { threshold: [0, .2, .5] });
      io.observe(root);
      document.addEventListener('visibilitychange', function () { if (document.hidden) stop(); else if (started) play(); });
      root.addEventListener('pointermove', function (e) {
        if (e.pointerType === 'touch') return;
        hasPointer = true;
        var r = root.getBoundingClientRect();
        tmx = ((e.clientX - r.left) / r.width - .5) * 2;
        tmy = ((e.clientY - r.top) / r.height - .5) * 2;
      });
      root.addEventListener('pointerleave', function () { tmx = 0; tmy = 0; });
      var rs; window.addEventListener('resize', function () { clearTimeout(rs); rs = setTimeout(function () { size(); seed(); }, 150); });
    })();
  </script>
