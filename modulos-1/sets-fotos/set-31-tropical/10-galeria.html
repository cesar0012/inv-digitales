    }
    .ptr-gal__item:nth-child(3n+2) .ptr-gal__fig { background: linear-gradient(140deg, color-mix(in srgb, var(--t-a) 28%, var(--t-bg)), var(--t-sand)); }

      right: .8rem;
      bottom: .8rem;
      width: 2.4rem;
      height: 2.4rem;

    .ptr-gal__btn--prev { left: -1.2rem; top: 50%; translate: 0 -50%; }
    .ptr-gal__btn--next { right: -1.2rem; top: 50%; translate: 0 -50%; }
    .ptr-gal__btn--close { right: -1rem; top: -1rem; background: var(--t-a); color: var(--t-bg); }

  <script>
    (function () {
      var SEL = '[data-gemini-id="galeria-tropical"]';
      var root = null;
      try { root = document.currentScript && document.currentScript.closest(SEL); } catch (e) {}
      if (!root) root = document.querySelector(SEL);
      if (!root || root.__tInit) return;
      root.__tInit = true;
      var RM = !!(window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches);

      /* Lightbox (works with or without motion) */
      var figs = [].slice.call(root.querySelectorAll('[data-ptr-open]'));
      var dlg = root.querySelector('[data-ptr-dialog]');
      var big = root.querySelector('[data-ptr-big]');
      var cap = root.querySelector('[data-ptr-cap]');
      var idx = 0, lastFocus = null;
      function show(i) {
        idx = (i + figs.length) % figs.length;
        var im = figs[idx].querySelector('img');
        big.src = im.currentSrc || im.src;
        big.alt = im.alt || '';
        cap.textContent = im.alt || '';
      }
      function open(i) {
        lastFocus = document.activeElement;
        show(i);
        if (dlg.showModal) { if (!dlg.open) dlg.showModal(); } else dlg.setAttribute('open', '');
      }
      function close() { if (dlg.close) dlg.close(); else dlg.removeAttribute('open'); }
      figs.forEach(function (f, i) {
        f.setAttribute('aria-label', 'Ampliar foto ' + (i + 1));
        f.addEventListener('click', function () { open(i); });
        f.addEventListener('keydown', function (e) { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); open(i); } });
      });
      root.querySelector('[data-ptr-prev]').addEventListener('click', function () { show(idx - 1); });
      root.querySelector('[data-ptr-next]').addEventListener('click', function () { show(idx + 1); });
      root.querySelector('[data-ptr-close]').addEventListener('click', close);
      dlg.addEventListener('click', function (e) { if (e.target === dlg) close(); });
      dlg.addEventListener('keydown', function (e) { if (e.key === 'ArrowLeft') show(idx - 1); if (e.key === 'ArrowRight') show(idx + 1); });
      dlg.addEventListener('close', function () { if (lastFocus && lastFocus.focus) lastFocus.focus(); });
      var sx = null;
      dlg.addEventListener('touchstart', function (e) { sx = e.touches[0].clientX; }, { passive: true });
      dlg.addEventListener('touchend', function (e) { if (sx === null) return; var dx = e.changedTouches[0].clientX - sx; if (Math.abs(dx) > 40) show(idx + (dx < 0 ? 1 : -1)); sx = null; });

      if (RM || !('IntersectionObserver' in window)) return;   /* reduced motion = static final state */
      root.classList.add('ptr-gal--anim');
      var tiles = [].slice.call(root.querySelectorAll('[data-ptr-tile]'));
      var left = tiles.length;
      var io = new IntersectionObserver(function (en) {
        en.forEach(function (e) {
          if (e.isIntersecting && e.intersectionRatio > .2) {
            io.unobserve(e.target);
            e.target.setAttribute('data-in', '');
            if (--left === 0) setTimeout(function () {
              root.classList.remove('ptr-gal--anim');
              tiles.forEach(function (t) { t.removeAttribute('data-in'); });
            }, 1300);
          }
        });
      }, { threshold: [0, .2, .5] });
      tiles.forEach(function (t) { io.observe(t); });
    })();
