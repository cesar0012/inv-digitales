  <style>
    @import url('https://fonts.googleapis.com/css2?family=Poiret+One&family=Josefin+Sans:wght@300;400;600&display=swap');

    .gzpa, .gzpa *, .gzpa *::before, .gzpa *::after { box-sizing: border-box; }
    .gzpa {
      --t-bg: var(--bg-color, #07080a);
      --t-tx: var(--text-color, #f4ecd8);
      --t-p: var(--primary-color, #d4af37);
      --t-s: var(--secondary-color, #f1d98a);
      --t-a: var(--accent-color, #0e7a57);
      --t-display: var(--font-script, 'Poiret One', 'Didot', serif);
      --t-text: var(--font-heading, 'Josefin Sans', 'Futura', sans-serif);
      --gzpa-foil: linear-gradient(100deg, color-mix(in srgb, var(--t-p) 55%, #000), var(--t-p) 25%, var(--t-s) 45%, var(--t-p) 65%, color-mix(in srgb, var(--t-p) 55%, #000));
      position: relative;
      isolation: isolate;
      min-height: clamp(30rem, 60vw, 44rem);
      display: grid;
      place-items: center;
      padding: clamp(4rem, 9vw, 7rem) clamp(1rem, 5vw, 4rem);
      overflow: hidden;
      background-color: var(--t-bg);
      background-image:
        linear-gradient(180deg, color-mix(in srgb, var(--t-a) 14%, transparent), transparent 40%, transparent 60%, color-mix(in srgb, var(--t-a) 14%, transparent)),
        repeating-linear-gradient(90deg, transparent 0 46px, color-mix(in srgb, var(--t-p) 7%, transparent) 46px 47px);
      color: var(--t-tx);
      text-align: center;
      font-family: var(--t-text);
    }
    .gzpa__content { width: min(100%, 62rem); display: grid; gap: clamp(2rem, 5vw, 3.4rem); }
    .gzpa__head { display: grid; justify-items: center; gap: .8rem; }
    .gzpa__title {
      margin: 0;
      font-family: var(--t-display);
      font-weight: 400;
      font-size: clamp(2.2rem, 5.4vw, 3.8rem);
      line-height: 1.05;
      color: var(--t-p);
      background: var(--gzpa-foil);
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .gzpa__lead { margin: 0; max-width: 34rem; font-weight: 300; font-size: clamp(1rem, 2vw, 1.15rem); line-height: 1.6; }
    .gzpa__rule { width: min(16rem, 60%); height: auto; color: var(--t-p); }

    .gzpa__grid { position: relative; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: clamp(2.5rem, 7vw, 6rem); }
    /* Central axis with a jewel */
    .gzpa__grid::before {
      content: '';
      position: absolute;
      left: 50%;
      top: 8%;
      bottom: 8%;
      width: 1px;
      background: linear-gradient(180deg, transparent, var(--t-p), transparent);
    }
    .gzpa__grid::after {
      content: '';
      position: absolute;
      left: 50%;
      top: 38%;
      width: 14px;
      height: 14px;
      transform: translate(-50%, -50%) rotate(45deg);
      background: var(--t-a);
      border: 1px solid var(--t-p);
      box-shadow: 0 0 16px color-mix(in srgb, var(--t-a) 80%, transparent);
    }
    .gzpa__col { display: grid; justify-items: center; align-content: start; gap: 1.2rem; }

    .gzpa__medal {
      position: relative;
      width: clamp(11rem, 24vw, 15rem);
      aspect-ratio: 1;
      display: grid;
      place-items: center;
      margin: clamp(2.4rem, 5vw, 3.4rem) 0 clamp(2rem, 4vw, 2.8rem);
    }
    .gzpa__rays {
      position: absolute;
      inset: -22%;
      border-radius: 50%;
      background: repeating-conic-gradient(from 0deg, color-mix(in srgb, var(--t-p) 70%, transparent) 0deg 1.4deg, transparent 1.4deg 7.5deg);
      -webkit-mask-image: radial-gradient(circle, transparent 0 52%, #000 53% 64%, transparent 70%);
      mask-image: radial-gradient(circle, transparent 0 52%, #000 53% 64%, transparent 70%);
      transform: rotate(var(--gzpa-rot, 0deg));
    }
    .gzpa__ring {
      position: absolute;
      inset: -7%;
      border-radius: 50%;
      border: 1px solid var(--t-p);
      box-shadow: inset 0 0 0 5px var(--t-bg), inset 0 0 0 6px color-mix(in srgb, var(--t-p) 60%, transparent);
    }
    .gzpa__figure {
      position: relative;
      margin: 0;
      width: 100%;
      border-radius: 50%;
      overflow: hidden;
      border: 2px solid var(--t-p);
      box-shadow: 0 0 0 6px var(--t-bg), 0 0 30px color-mix(in srgb, var(--t-a) 45%, transparent);
      background: radial-gradient(circle, color-mix(in srgb, var(--t-a) 45%, var(--t-bg)), var(--t-bg));
    }
    .gzpa__figure img { display: block; width: 100%; height: auto; aspect-ratio: 1 / 1; object-fit: cover; filter: sepia(.25) contrast(1.05); }

    .gzpa__role {
      margin: 0 0 .7rem;
      font-family: var(--t-display);
      font-weight: 400;
      font-size: clamp(1.5rem, 3vw, 2rem);
      color: var(--t-s);
    }
    .gzpa__names { display: grid; gap: .5rem; }
    .gzpa__name { margin: 0; font-size: clamp(1.05rem, 2vw, 1.25rem); font-weight: 400; }
    .gzpa__amp { width: 2.4rem; height: auto; color: var(--t-p); justify-self: center; }

    /* Entrance: medallions bloom on the axis, names slide outward from the center */
    .gzpa--anim .gzpa__rays { opacity: 0; scale: .5; transition: opacity .45s ease, scale .5s cubic-bezier(.2, .8, .2, 1); }
    .gzpa--anim .gzpa__ring { opacity: 0; scale: 1.25; transition: opacity .4s ease, scale .5s cubic-bezier(.2, .8, .2, 1); }
    .gzpa--anim .gzpa__figure { opacity: 0; scale: .85; transition: opacity .45s ease, scale .5s cubic-bezier(.3, 1.3, .5, 1); }
    .gzpa--anim .gzpa__col--l .gzpa__text { opacity: 0; transform: translateX(40px); transition: opacity .45s ease, transform .5s cubic-bezier(.2, .8, .2, 1); }
    .gzpa--anim .gzpa__col--r .gzpa__text { opacity: 0; transform: translateX(-40px); transition: opacity .45s ease, transform .5s cubic-bezier(.2, .8, .2, 1); }
    .gzpa--anim .gzpa__col.is-in .gzpa__rays,
    .gzpa--anim .gzpa__col.is-in .gzpa__ring,
    .gzpa--anim .gzpa__col.is-in .gzpa__figure { opacity: 1; scale: 1; }
    .gzpa--anim .gzpa__col.is-in .gzpa__ring { transition-delay: .1s; }
    .gzpa--anim .gzpa__col.is-in .gzpa__figure { transition-delay: .18s; }
    .gzpa--anim .gzpa__col.is-in .gzpa__text { opacity: 1; transform: none; transition-delay: .32s; }

    @media (max-width: 720px) {
      .gzpa__grid { grid-template-columns: 1fr; }
      .gzpa__grid::before, .gzpa__grid::after { display: none; }
    }
    @media (prefers-reduced-motion: reduce) {
      .gzpa *, .gzpa *::before, .gzpa *::after { animation: none !important; transition: none !important; }
    }
  </style>
