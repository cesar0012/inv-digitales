<section
  class="gzga"
  data-gemini-id="galeria-gatsby"
  memory_type="background"

 memory_source="generated" path="placeholder">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Poiret+One&family=Josefin+Sans:wght@300;400;600&display=swap');

    .gzga, .gzga *, .gzga *::before, .gzga *::after { box-sizing: border-box; }
    .gzga {
      --t-bg: var(--bg-color, #07080a);
      --t-tx: var(--text-color, #f4ecd8);
      --t-p: var(--primary-color, #d4af37);
      --t-s: var(--secondary-color, #f1d98a);
      --t-a: var(--accent-color, #0e7a57);
      --t-display: var(--font-script, 'Poiret One', 'Didot', serif);
      --t-text: var(--font-heading, 'Josefin Sans', 'Futura', sans-serif);
      --gzga-foil: linear-gradient(100deg, color-mix(in srgb, var(--t-p) 55%, #000), var(--t-p) 25%, var(--t-s) 45%, var(--t-p) 65%, color-mix(in srgb, var(--t-p) 55%, #000));
      position: relative;
      isolation: isolate;
      min-height: clamp(30rem, 60vw, 44rem);
      display: grid;
      place-items: center;
      padding: clamp(4rem, 9vw, 7rem) clamp(1rem, 5vw, 4rem);
      overflow: hidden;
      background-color: var(--t-bg);
      background-image:
        repeating-conic-gradient(from 0deg at 50% 0%, color-mix(in srgb, var(--t-p) 6%, transparent) 0deg 1deg, transparent 1deg 6deg),
        radial-gradient(ellipse 70% 50% at 50% 100%, color-mix(in srgb, var(--t-a) 18%, transparent), transparent 70%);
      color: var(--t-tx);
      text-align: center;
      font-family: var(--t-text);
    }
    .gzga__content { width: min(100%, 68rem); display: grid; gap: clamp(2rem, 5vw, 3rem); }
    .gzga__head { display: grid; gap: .7rem; justify-items: center; }
    .gzga__title {
      margin: 0;
      font-family: var(--t-display);
      font-weight: 400;
      font-size: clamp(2.3rem, 5.4vw, 3.8rem);
      line-height: 1.05;
      color: var(--t-p);
      background: var(--gzga-foil);
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .gzga__lead { margin: 0; max-width: 34rem; font-weight: 300; line-height: 1.6; font-size: clamp(1rem, 2vw, 1.12rem); }

    .gzga__grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(min(100%, 14rem), 1fr));
      grid-auto-flow: dense;
      gap: clamp(.6rem, 1.4vw, 1rem);
      padding: clamp(.8rem, 2vw, 1.2rem);
      border: 1px solid color-mix(in srgb, var(--t-p) 60%, transparent);
      box-shadow: inset 0 0 0 5px var(--t-bg), inset 0 0 0 6px color-mix(in srgb, var(--t-p) 30%, transparent);
    }
    .gzga__tile {
      position: relative;
      margin: 0;
      overflow: hidden;
      cursor: zoom-in;
      background: radial-gradient(circle at 50% 40%, color-mix(in srgb, var(--t-a) 40%, var(--t-bg)), var(--t-bg));
      outline: none;
    }
    .gzga__tile--wide { grid-column: span 2; }
    .gzga__tile img {
      display: block;
      width: 100%;
      height: auto;
      min-height: 100%;
      aspect-ratio: 4 / 5;
      object-fit: cover;
      filter: sepia(.2) contrast(1.05) brightness(.92);
      clip-path: polygon(0 0, 200% 0, 0 200%);
      transition: transform .5s cubic-bezier(.2, .8, .2, 1), filter .4s ease, clip-path .5s cubic-bezier(.65, 0, .25, 1);
    }
    .gzga__tile--wide img { aspect-ratio: 8 / 5; }
    .gzga__tile::after {
      content: '';
      position: absolute;
      inset: 8px;
      border: 1px solid color-mix(in srgb, var(--t-s) 70%, transparent);
      opacity: .55;
      pointer-events: none;
      transition: inset .35s ease, opacity .35s ease;
    }
    .gzga__tile::before {
      content: '';
      position: absolute;
      left: 50%;
      bottom: 3px;
      z-index: 1;
      width: 10px;
      height: 10px;
      transform: translateX(-50%) rotate(45deg);
      background: var(--t-p);
      opacity: 0;
      transition: opacity .3s ease;
    }
    .gzga__tile:hover img, .gzga__tile:focus-visible img { transform: scale(1.06); filter: sepia(0) contrast(1.05) brightness(1); }
    .gzga__tile:hover::after, .gzga__tile:focus-visible::after { inset: 12px; opacity: 1; }
    .gzga__tile:hover::before, .gzga__tile:focus-visible::before { opacity: 1; }

    /* Lightbox */
    .gzga__dialog {
      width: min(92vw, 60rem);
      max-height: 92vh;
      padding: clamp(.8rem, 2vw, 1.2rem);
      border: 1px solid var(--t-p);
      background: var(--t-bg);
      color: var(--t-tx);
      box-shadow: inset 0 0 0 6px var(--t-bg), inset 0 0 0 7px color-mix(in srgb, var(--t-p) 55%, transparent), 0 40px 100px rgba(0, 0, 0, .7);
      overflow: visible;
    }
    .gzga__dialog::backdrop { background: color-mix(in srgb, #000 82%, transparent); -webkit-backdrop-filter: blur(4px); backdrop-filter: blur(4px); }
    .gzga__dialog[open] { animation: gzga-pop .4s cubic-bezier(.2, .9, .3, 1.2); }
    .gzga__big { display: block; width: 100%; height: auto; max-height: 76vh; object-fit: contain; aspect-ratio: auto; background: #000; }
    .gzga__bar { display: flex; align-items: center; justify-content: space-between; gap: 1rem; padding-top: .8rem; }
    .gzga__cap { margin: 0; font-family: var(--t-display); font-size: 1.3rem; color: var(--t-s); text-align: center; flex: 1; }
    .gzga__nav {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 2.8rem;
      height: 2.8rem;
      padding: 0;
      border: 1px solid var(--t-p);
      background: transparent;
      color: var(--t-p);
      cursor: pointer;
      transform: rotate(45deg);
      transition: background-color .25s ease, color .25s ease;
    }
    .gzga__nav svg { width: 1.1rem; height: 1.1rem; transform: rotate(-45deg); }
    .gzga__nav:hover, .gzga__nav:focus-visible { background: var(--t-p); color: var(--t-bg); }
    .gzga__close { position: absolute; top: -1.2rem; right: -1.2rem; background: var(--t-bg); }

    @keyframes gzga-pop {
      0% { opacity: 0; transform: scale(.92); }
      100% { opacity: 1; transform: none; }
    }

    /* Entrance: each tile is unveiled with a diagonal gold-edged wipe */
    .gzga--anim .gzga__tile img { clip-path: polygon(0 0, 0 0, 0 0); }
    .gzga--anim .gzga__tile::after { opacity: 0; inset: 30px; }
    .gzga--anim .gzga__tile.is-in img { clip-path: polygon(0 0, 200% 0, 0 200%); }
    .gzga--anim .gzga__tile.is-in::after { opacity: .55; inset: 8px; }

    @media (max-width: 600px) {
      .gzga__grid { grid-template-columns: repeat(auto-fit, minmax(min(100%, 8.5rem), 1fr)); }
    }
    @media (max-width: 340px) {
      .gzga__tile--wide { grid-column: auto; }
      .gzga__tile--wide img { aspect-ratio: 4 / 5; }
    }
    @media (prefers-reduced-motion: reduce) {
      .gzga *, .gzga *::before, .gzga *::after { animation: none !important; transition: none !important; }
      .gzga__dialog[open] { animation: none !important; }
    }
  </style>

  <script>
    (function () {
      var SEL = '[data-gemini-id="galeria-gatsby"]';
      var root = null;
      try { root = document.currentScript && document.currentScript.closest(SEL); } catch (e) {}
      if (!root) root = document.querySelector(SEL);
      if (!root || root.__tInit) return;
      root.__tInit = true;
      var RM = !!(window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches);

      /* Lightbox (dialog + showModal escapes any stacking context) */
      var tiles = [].slice.call(root.querySelectorAll('[data-gzga-tile]'));
      var dlg = root.querySelector('[data-gzga-dialog]');
      var big = root.querySelector('[data-mm-big]');
      var cap = root.querySelector('[data-gzga-cap]');
      var idx = 0;
      function show(i) {
        idx = (i + tiles.length) % tiles.length;
        var img = tiles[idx].querySelector('img');
        if (!img || !big) return;
        big.src = img.currentSrc || img.src;
        big.alt = img.alt || '';
        if (cap) cap.textContent = img.alt || '';
      }
      function open(i) {
        if (!dlg || typeof dlg.showModal !== 'function') return;
        show(i);
        if (!dlg.open) dlg.showModal();
      }
      tiles.forEach(function (t, i) {
        t.addEventListener('click', function () { open(i); });
        t.addEventListener('keydown', function (e) { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); open(i); } });
      });
      if (dlg) {
        var prev = dlg.querySelector('[data-gzga-prev]'), next = dlg.querySelector('[data-gzga-next]'), close = dlg.querySelector('[data-gzga-close]');
        if (prev) prev.addEventListener('click', function () { show(idx - 1); });
        if (next) next.addEventListener('click', function () { show(idx + 1); });
        if (close) close.addEventListener('click', function () { dlg.close(); });
        dlg.addEventListener('click', function (e) { if (e.target === dlg) dlg.close(); });
        dlg.addEventListener('keydown', function (e) {
          if (e.key === 'ArrowLeft') show(idx - 1);
          if (e.key === 'ArrowRight') show(idx + 1);
        });
      }

      if (RM || !('IntersectionObserver' in window)) return;
      root.classList.add('gzga--anim');
      var queue = [], timer = 0, done = 0;
      function flush() {
        timer = 0;
        var el = queue.shift();
        if (!el) return;
        el.classList.add('is-in');
        if (++done === tiles.length) setTimeout(function () {
          root.classList.remove('gzga--anim');
          tiles.forEach(function (t) { t.classList.remove('is-in'); });
        }, 900);
        if (queue.length) timer = setTimeout(flush, 110);
      }
      var io = new IntersectionObserver(function (en) {
        en.forEach(function (e) { if (e.isIntersecting) { io.unobserve(e.target); queue.push(e.target); } });
        queue.sort(function (a, b) { return tiles.indexOf(a) - tiles.indexOf(b); });
        if (!timer) flush();
      }, { threshold: .25 });
      tiles.forEach(function (t) { io.observe(t); });
    })();
  </script>
