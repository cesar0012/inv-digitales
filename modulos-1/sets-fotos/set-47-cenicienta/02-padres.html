    .cnc-pad__medal { position: relative; width: min(100%, 13rem); margin-bottom: .6rem; }
    .cnc-pad__ring { position: absolute; inset: -9px; width: calc(100% + 18px); height: calc(100% + 18px); pointer-events: none; overflow: visible; }

    .cnc-pad__role { margin: 0; font-size: 1.05rem; color: color-mix(in srgb, var(--t-tx) 72%, var(--t-a)); }
    .cnc-pad__msg { margin: 0; max-width: 36rem; font-size: clamp(1.02rem, 2vw, 1.2rem); line-height: 1.6; text-wrap: balance; }

    .cnc-pad--anim .cnc-pad__head, .cnc-pad--anim .cnc-pad__msg { opacity: 0; transition: opacity .5s ease; }
    .cnc-pad--anim.is-in .cnc-pad__head { opacity: 1; }

    .cnc-pad--anim .cnc-pad__card { opacity: 0; transform: translateY(18px) scale(.97); transition: opacity .45s ease, transform .5s cubic-bezier(.2, .8, .2, 1); }

    .cnc-pad--anim .cnc-pad__ring circle:first-child { stroke-dasharray: 340; stroke-dashoffset: 340; transition: stroke-dashoffset .5s ease-out; transition-delay: .25s; }
    .cnc-pad--anim .cnc-pad__card[data-cnc-lit] .cnc-pad__ring circle:first-child { stroke-dashoffset: 0; }

    @media (max-width: 640px) {

    }
    @media (prefers-reduced-motion: reduce) {
