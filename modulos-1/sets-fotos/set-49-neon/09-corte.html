    .dn-co, .dn-co *, .dn-co *::before, .dn-co *::after { box-sizing: border-box; }
    .dn-co {
      --t-bg: var(--bg-color, #07060c);

      display: grid;
      place-items: center;
      padding: clamp(4rem, 9vw, 7rem) clamp(1rem, 5vw, 4rem);
      overflow: hidden;
      background-color: var(--t-bg);
      color: var(--t-tx);
      font-family: var(--t-text);

    .dn-co::before {

      inset: 0;
      z-index: -1;
      background:

    }
    .dn-co__figure { margin: 0; }

    .dn-co__bars { display: none; position: absolute; inset: .6rem; border-radius: 1.3rem; overflow: hidden; pointer-events: none; }
    .dn-co__bars span {
      flex: 1;
      background: var(--t-p);
      box-shadow: inset 0 0 18px #fff8;
      transition: transform .5s cubic-bezier(.7, 0, .2, 1);
      transition-delay: calc(var(--i, 0) * .08s + .15s);

    .dn-co__bars span:nth-child(3n+2) { background: var(--t-s); }
    .dn-co__bars span:nth-child(3n) { background: var(--t-a); }
    .dn-co--anim .dn-co__bars { display: flex; }
    .dn-co--anim.is-in .dn-co__bars span { transform: translateY(-101%); }
    .dn-co--anim.is-in .dn-co__bars span:nth-child(even) { transform: translateY(101%); }

    .dn-co__title {
      --g: var(--t-p);
      margin: 0;
      font-family: var(--t-display);
      font-weight: 400;
      font-size: clamp(3.2rem, 8vw, 5.6rem);
      line-height: 1;
      color: color-mix(in srgb, var(--g) 28%, #fff);
      text-shadow: 0 0 .02em #fff, 0 0 .1em var(--g), 0 0 .3em var(--g);

    .dn-co__lead { margin: .8rem 0 1.8rem; font-size: clamp(1.05rem, 2.2vw, 1.25rem); line-height: 1.5; color: color-mix(in srgb, var(--t-tx) 80%, transparent); }
    .dn-co__groups { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 1.6rem; }
    .dn-co__group { --g: var(--t-a); }
    .dn-co__group:nth-child(2) { --g: var(--t-s); }

      text-shadow: 0 0 8px var(--g), 0 0 20px var(--g);
      border-bottom: 2px solid var(--g);
      box-shadow: 0 6px 10px -6px var(--g);
    }
    .dn-co__group ul { list-style: none; margin: 0; padding: 0; display: grid; gap: .45rem; }
    .dn-co__group li { font-size: 1.08rem; }

    @media (max-width: 760px) {
      .dn-co__content { grid-template-columns: 1fr; }
      .dn-co__frame { width: min(86%, 22rem); justify-self: center; }
      .dn-co__text { text-align: center; }
    }
    @media (prefers-reduced-motion: reduce) {
