    @import url('https://fonts.googleapis.com/css2?family=Neonderthaw&family=Tilt+Neon&display=swap');

    .dn-rs, .dn-rs *, .dn-rs *::before, .dn-rs *::after { box-sizing: border-box; }
    .dn-rs {
      --t-bg: var(--bg-color, #07060c);
      --t-tx: var(--text-color, #fbf4ff);
      --t-p: var(--primary-color, #ff2bd6);

    .dn-rs::before {

    @keyframes dnRsOn { 0% { opacity: .4; } 25% { opacity: 1; } 40% { opacity: .5; } 70%, 100% { opacity: 1; } }

    .dn-rs--anim .dn-rs__form { opacity: 0; }
    .dn-rs--anim.is-in .dn-rs__form { animation: dnRsOn .5s linear both; }

    @media (max-width: 760px) {

    }
    @media (prefers-reduced-motion: reduce) {

  <script>
    (function () {
      var SEL = '[data-gemini-id="confirmacion-texto"]';

      try { root = document.currentScript && document.currentScript.closest(SEL); } catch (e) {}

      if (!root || root.__tInit) return;

        requestAnimationFrame(charge);

      if (RM || !('IntersectionObserver' in window)) return;
      root.classList.add('dn-rs--anim');

          setTimeout(function () { root.classList.remove('dn-rs--anim', 'is-in'); }, 1200);
