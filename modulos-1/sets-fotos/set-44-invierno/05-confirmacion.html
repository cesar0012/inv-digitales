    .inv-con::before {

      backdrop-filter: blur(10px);
      box-shadow: 0 30px 60px color-mix(in srgb, var(--t-s) 18%, transparent), inset 0 0 0 1px color-mix(in srgb, #ffffff 85%, transparent);

    .inv-con__title {

      background-position: 30% 50%;

    .inv-con__text { margin: 0; font-weight: 300; font-size: clamp(1rem, 1.8vw, 1.1rem); line-height: 1.6; color: color-mix(in srgb, var(--t-tx) 85%, var(--t-s)); }

    .inv-con__opt { position: relative; display: flex; align-items: center; gap: .6rem; min-height: 3rem; padding: .6rem .8rem; cursor: pointer;

    .inv-con__opt:has(input:checked) .inv-con__gem polygon { fill: var(--t-p); }
    .inv-con__opt:has(input:focus-visible) { outline: 2px solid var(--t-s); outline-offset: 2px; }
    .inv-con__optlabel { font-size: .98rem; color: var(--t-tx); }

    .inv-con__btn {
      position: relative;
      display: inline-flex; align-items: center; justify-content: center; gap: .6rem;
      min-height: 3.2rem;
      padding: .8rem 1.6rem;

      cursor: pointer;
      transition: transform .3s ease, filter .3s ease;

    .inv-con__btn:hover { transform: translateY(-2px); filter: brightness(1.08); }
    .inv-con__btn:focus-visible { outline: 2px solid var(--t-tx); outline-offset: 3px; }
    .inv-con__spin, .inv-con__check { display: none; width: 1.25rem; height: 1.25rem; }
    .inv-con__busy, .inv-con__sent { display: none; }
    .inv-con__btn[data-inv-state="loading"] { pointer-events: none; filter: saturate(.7); }
    .inv-con__btn[data-inv-state="loading"] .inv-con__spin { display: block; animation: inv-con-turn .5s linear infinite; }
    .inv-con__btn[data-inv-state="loading"] .inv-con__idle { display: none; }
    .inv-con__btn[data-inv-state="loading"] .inv-con__busy { display: inline; }
    .inv-con__btn[data-inv-state="done"] { background: linear-gradient(135deg, var(--t-p), var(--t-s)); animation: inv-con-seal .45s cubic-bezier(.3, 1.4, .5, 1); }
    .inv-con__btn[data-inv-state="done"] .inv-con__check { display: block; }
    .inv-con__btn[data-inv-state="done"] .inv-con__idle { display: none; }
    .inv-con__btn[data-inv-state="done"] .inv-con__sent { display: inline; }
    @keyframes inv-con-turn { from { transform: rotate(0deg); } to { transform: rotate(60deg); } }
    @keyframes inv-con-seal { 0% { transform: scale(.92); } 60% { transform: scale(1.05); } 100% { transform: none; } }
    .inv-con__thanks { margin: 0; font-family: var(--t-display); font-style: italic; font-size: 1.1rem; color: var(--t-s); }
    .inv-con__thanks[hidden] { display: none; }

    .inv-con--anim [data-inv-in] { opacity: 0; transform: translateY(14px); filter: blur(4px); transition: opacity .45s ease, transform .5s cubic-bezier(.2, .8, .2, 1), filter .45s ease; }
    .inv-con--anim.is-in [data-inv-in] { opacity: 1; transform: none; filter: none; }
    .inv-con--anim.is-in [data-inv-in="2"] { transition-delay: .15s; }

    @media (max-width: 760px) {

    @media (max-width: 420px) {

    }
    @media (prefers-reduced-motion: reduce) {

    }

  <script>
    (function () {
      var SEL = '[data-gemini-id="confirmacion-texto"]';
      var root = null;
      try { root = document.currentScript && document.currentScript.closest(SEL); } catch (e) {}
      if (!root) root = document.querySelector(SEL);
      if (!root || root.__tInit) return;
      root.__tInit = true;
      var RM = !!(window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches);

      /* Simulated RSVP (no network): idle -> loading -> done. Only data-* attributes and [hidden] change. */
      var form = root.querySelector('[data-inv-form]');
      var btn = root.querySelector('[data-inv-submit]');
      var thanks = root.querySelector('[data-inv-thanks]');
      if (form && btn) {
        form.addEventListener('submit', function (e) {
          e.preventDefault();
          if (btn.getAttribute('data-inv-state') !== 'idle') return;
          var ok = true;
          form.querySelectorAll('[data-inv-required]').forEach(function (f) {
            if (!f.value.trim()) { f.setAttribute('data-inv-invalid', ''); ok = false; } else { f.removeAttribute('data-inv-invalid'); }
          });
          if (!ok) { var first = form.querySelector('[data-inv-invalid]'); if (first) first.focus(); return; }
          btn.setAttribute('data-inv-state', 'loading');
          setTimeout(function () {
            btn.setAttribute('data-inv-state', 'done');
            if (thanks) thanks.hidden = false;
          }, RM ? 200 : 1400);
        });
        form.addEventListener('input', function (e) { if (e.target && e.target.value && e.target.value.trim()) e.target.removeAttribute('data-inv-invalid'); });
      }

      if (RM || !('IntersectionObserver' in window)) return;   /* reduced motion = static final state */
      root.classList.add('inv-con--anim');
      var io = new IntersectionObserver(function (en) {
        if (en[0].isIntersecting && en[0].intersectionRatio > .2) {
          io.disconnect();
          root.classList.add('is-in');
          setTimeout(function () { root.classList.remove('inv-con--anim', 'is-in'); }, 1200);
        }
      }, { threshold: [0, .2, .5] });
      io.observe(root);
    })();
  </script>
