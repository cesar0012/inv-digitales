    .inv-por, .inv-por *, .inv-por *::before, .inv-por *::after { box-sizing: border-box; }
    .inv-por {
      --t-bg: var(--bg-color, #eef5fb);

      --snow: color-mix(in srgb, var(--t-bg) 55%, #ffffff);
      --ice: color-mix(in srgb, var(--t-p) 65%, #ffffff);

      isolation: isolate;

      place-items: start center;

      overflow: hidden;
      background-color: var(--night);
      background-image: url('https://loremflickr.com/1600/1000/ice,castle?lock=3401');
      background-size: cover;
      background-position: center;
      color: var(--snow);
      text-align: center;
      font-family: var(--t-text);

    .inv-por::before {
      content: '';

      inset: 0;

  <script>
    (function () {
      var SEL = '[data-gemini-id="portada-nombre"]';
      var root = null;
      try { root = document.currentScript && document.currentScript.closest(SEL); } catch (e) {}
      if (!root) root = document.querySelector(SEL);
      if (!root || root.__tInit) return;
      root.__tInit = true;
      var RM = !!(window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches);

      var cv = root.querySelector('[data-inv-snow]');

      var scene = root.querySelector('[data-inv-scene]');
      var W = 0, H = 0, DPR = 1, S = 1, flakes = [], dust = [];

      /* Six-fold crystal geometry in local unit space: [x1,y1,x2,y2] segments */
      function arms(full) {
        var seg = [], k, th, c, s, t, bl, j, sg;
        for (k = 0; k < 6; k++) {
          th = k * Math.PI / 3; c = Math.cos(th); s = Math.sin(th);
          seg.push([0, 0, c, s]);
          if (!full) continue;
          var br = [[.42, .3], [.7, .2]];
          for (j = 0; j < br.length; j++) {
            t = br[j][0]; bl = br[j][1];
            for (sg = -1; sg <= 1; sg += 2) {
              var a2 = th + sg * Math.PI / 3;
              seg.push([c * t, s * t, c * t + Math.cos(a2) * bl, s * t + Math.sin(a2) * bl]);
            }
          }
        }
        return seg;
      }
      var GEO = [arms(false), arms(true)];

      function size() {
        var r = root.getBoundingClientRect();
        DPR = Math.min(window.devicePixelRatio || 1, 2);
        W = Math.max(1, r.width); H = Math.max(1, r.height);
        if (cv) { cv.width = Math.round(W * DPR); cv.height = Math.round(H * DPR); }
        S = Math.max(W, H) * .8;
      }
      function spawn(f, anywhere) {
        f.z = .7 + Math.random() * 1.6;
        var hw = (W / 2) * f.z / S * 1.15, hh = (H / 2 + 40) * f.z / S;
        f.x = (Math.random() * 2 - 1) * hw;
        f.y = anywhere ? (Math.random() * 2 - 1) * hh : -hh - Math.random() * hh * .3;
        f.r = .012 + Math.random() * .022;
        f.a = Math.random() * 6.28; f.b = Math.random() * 6.28;
        f.va = (Math.random() - .5) * .7; f.vb = (Math.random() - .5) * 1.1;
        f.vy = .025 + Math.random() * .035; f.ph = Math.random() * 6.28;
        f.g = Math.random() < .4 ? 0 : 1;
        return f;
      }
      function build() {
        var n = W < 640 ? 46 : 92;
        flakes = []; dust = [];
        for (var i = 0; i < n; i++) flakes.push(spawn({}, true));
        for (var d = 0; d < n; d++) dust.push({ x: Math.random(), y: Math.random(), r: .4 + Math.random() * 1.2, v: .01 + Math.random() * .02, ph: Math.random() * 6.28 });
      }

      var camX = 0, camY = 0, tx = 0, ty = 0, mx = 0, my = 0;
      function proj(x, y, z) { return [W / 2 + (x - camX) * S / z, H / 2 + (y - camY) * S / z]; }

      function draw(t, dt) {
        if (!ctx) return;
        ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
        ctx.clearRect(0, 0, W, H);
        ctx.globalCompositeOperation = 'lighter';
        var i, f, d;
        for (i = 0; i < dust.length; i++) {
          d = dust[i];
          d.y += d.v * dt; if (d.y > 1.02) { d.y = -.02; d.x = Math.random(); }
          ctx.fillStyle = 'rgba(230,244,255,' + (.25 + .2 * Math.sin(t * 1.3 + d.ph)) + ')';
          ctx.beginPath(); ctx.arc(d.x * W + Math.sin(t * .4 + d.ph) * 8, d.y * H, d.r, 0, 6.283); ctx.fill();
        }
        ctx.lineCap = 'round';
        for (i = 0; i < flakes.length; i++) {
          f = flakes[i];
          f.y += f.vy * dt; f.x += Math.sin(t * .5 + f.ph) * .006 * dt;
          f.a += f.va * dt; f.b += f.vb * dt;
          if (f.y > (H / 2 + 50) * f.z / S + camY) spawn(f, false);
          var ca = Math.cos(f.a), sa = Math.sin(f.a), cb = Math.cos(f.b), sb = Math.sin(f.b);
          var geo = GEO[f.g], al = Math.max(.14, Math.min(.95, 1.15 - f.z / 2.1));
          ctx.strokeStyle = 'rgba(236,248,255,' + al.toFixed(3) + ')';

          for (var k = 0; k < geo.length; k++) {
