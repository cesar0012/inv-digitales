    .inv-pad__grid {

      list-style: none;
      margin: 0;
      padding: 0;

      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));

    .inv-pad__frame {

      color: var(--t-s);
      transform: rotate(var(--inv-rot, 0deg));
      overflow: visible;
    }
    .inv-pad__item:nth-child(2) .inv-pad__frame { transform: rotate(calc(var(--inv-rot, 0deg) * -1 + 30deg)); }
    .inv-pad__figure {
      position: relative;
      margin: 0;
      width: 78%;

      overflow: hidden;
      background: radial-gradient(circle at 35% 30%, #ffffff, color-mix(in srgb, var(--t-p) 45%, var(--t-bg)));

    .inv-pad__note { margin: 0; max-width: 36rem; font-weight: 300; font-size: clamp(1rem, 1.9vw, 1.15rem); line-height: 1.65; color: color-mix(in srgb, var(--t-tx) 85%, var(--t-s)); }

    /* Entrance: frost clears per item (stagger), transitions <= .5s */
    .inv-pad--anim [data-inv-item], .inv-pad--anim [data-inv-fade] {
      opacity: 0; transform: scale(.94); filter: blur(6px);
      transition: opacity .45s ease, transform .5s cubic-bezier(.2, .8, .2, 1), filter .45s ease;
    }
    .inv-pad--anim.is-in [data-inv-item], .inv-pad--anim.is-in [data-inv-fade] { opacity: 1; transform: none; filter: none; }
    .inv-pad--anim.is-in [data-inv-item]:nth-child(2) { transition-delay: .18s; }
    .inv-pad--anim.is-in [data-inv-fade] { transition-delay: .36s; }

    @media (max-width: 560px) {

      .inv-pad__grid::before { display: none; }
      .inv-pad__medal { width: min(70%, 13rem); }
    }
    @media (prefers-reduced-motion: reduce) {
      .inv-pad *, .inv-pad *::before, .inv-pad *::after { animation: none !important; transition: none !important; }
    }
