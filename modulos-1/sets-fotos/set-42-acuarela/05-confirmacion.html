    .wa-cf__title { margin: 0; padding: 0 .25em .08em; font-family: var(--t-display); font-weight: 400; font-size: clamp(2.7rem, 5.6vw, 4.3rem); line-height: 1.08; color: var(--t-tx); }

    .wa-cf {
      padding: clamp(5rem, 10vw, 8rem) clamp(1.1rem, 5vw, 4rem);
      background-image: url('https://loremflickr.com/1600/1000/flowers,stationery,pastel?lock=3351');
      background-size: cover;
      background-position: center;
      text-align: center;
    }
    .wa-cf::before {
      content: '';
      position: absolute;
      inset: 0;
      z-index: -1;
      background: radial-gradient(110% 90% at 50% 50%, color-mix(in srgb, var(--t-bg) 84%, transparent), color-mix(in srgb, var(--t-bg) 94%, transparent));
    }
    .wa-cf__card { position: relative; z-index: 1; max-width: 38rem; margin: 0 auto; }
    .wa-cf__paper { position: absolute; inset: 0; border-radius: 5px; background: var(--t-paper); box-shadow: var(--t-shadow); }
    .wa-cf__card .wa-cf__flora { inset: -15% -20%; width: 140%; height: 130%; }

    .wa-cf__field { display: grid; gap: .35rem; }
    .wa-cf__lbl { font-style: italic; font-size: 1.08rem; color: var(--t-ink); }
    .wa-cf__input {
      width: 100%;
      min-height: 3rem;
      padding: .7rem 1rem;
      border: 0;
      border-radius: 14px;
      font: 500 1.1rem/1.4 var(--t-text);
      color: var(--t-tx);
      background: color-mix(in srgb, var(--t-s) 9%, var(--t-paper));
      box-shadow: inset 0 .15rem .6rem color-mix(in srgb, var(--t-tx) 9%, transparent);
      transition: box-shadow .35s ease, background-color .35s ease;
      resize: vertical;

    .wa-cf__input:focus { outline: none; background: color-mix(in srgb, var(--t-p) 10%, var(--t-paper)); box-shadow: inset 0 .15rem .6rem color-mix(in srgb, var(--t-tx) 8%, transparent), 0 0 0 4px color-mix(in srgb, var(--t-p) 38%, transparent); }
    .wa-cf__attend { margin: 0; padding: 0; border: 0; display: grid; gap: .5rem; }

    .wa-cf__opts { display: flex; flex-wrap: wrap; gap: .7rem; }
    .wa-cf__opt { position: relative; flex: 1 1 12rem; display: block; cursor: pointer; }
    .wa-cf__opt input { position: absolute; opacity: 0; width: 1px; height: 1px; }
    .wa-cf__pill {
      position: relative;
      isolation: isolate;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 3.1rem;
      padding: .6rem 1rem;
      border-radius: 999px;
      overflow: hidden;
      text-align: center;
      font-weight: 600;
      background: color-mix(in srgb, var(--t-m) 10%, var(--t-paper));
      box-shadow: inset 0 .15rem .6rem color-mix(in srgb, var(--t-tx) 8%, transparent);
      transition: color .35s ease, transform .3s ease;
    }
    .wa-cf__pill::before {
      content: '';
      position: absolute;
      inset: -30% -10%;
      z-index: -1;
      border-radius: 44% 56% 61% 39% / 52% 38% 62% 48%;
      background: radial-gradient(closest-side, color-mix(in srgb, var(--wa-pig, var(--t-p)) 75%, var(--t-paper)), color-mix(in srgb, var(--wa-pig, var(--t-p)) 30%, transparent) 75%, transparent);
      transform: scale(0) rotate(-20deg);
      transition: transform .5s cubic-bezier(.2, .8, .2, 1);
    }

    .wa-cf__opt:hover .wa-cf__pill { transform: translateY(-1px); }

      isolation: isolate;
      justify-self: center;
      min-height: 3.3rem;
      min-width: min(100%, 17rem);
      margin-top: .6rem;
      padding: .75rem 2rem;
      border: 0;
      border-radius: 999px;
      cursor: pointer;
      font: 600 1.15rem/1.2 var(--t-text);
      color: var(--t-tx);
      background: radial-gradient(130% 160% at 25% 30%, color-mix(in srgb, var(--t-p) 55%, var(--t-paper)), color-mix(in srgb, var(--t-s) 40%, var(--t-paper)));
