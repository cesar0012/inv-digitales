    .wa-ub {

    .wa-ub__flora { position: absolute; inset: 0; width: 100%; height: 100%; z-index: 0; pointer-events: none; display: block; }

      background-size: cover;
      background-position: center;

    .wa-ub::before {
      content: '';
      position: absolute;
      inset: 0;
      z-index: -1;

    .wa-ub__info { text-align: left; }
    .wa-ub__info .wa-ub__title { padding-left: 0; }
    .wa-ub__venue { margin: 1rem 0 .3rem; font-size: clamp(1.45rem, 2.4vw, 1.8rem); font-weight: 600; line-height: 1.2; }
    .wa-ub__address { margin: 0; font-style: normal; color: var(--t-ink); }
    .wa-ub__times { margin: 1.1rem 0 0; padding: 0; list-style: none; display: grid; gap: .35rem; }
    .wa-ub__times li { display: flex; flex-wrap: wrap; gap: .2rem .6rem; align-items: baseline; }
    .wa-ub__when { font-weight: 600; color: color-mix(in srgb, var(--t-a) 70%, var(--t-tx)); }
    .wa-ub__btn {
      position: relative;
      isolation: isolate;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: .6rem;
      min-height: 3.1rem;
      margin-top: 1.8rem;
      padding: .7rem 1.9rem;
      border-radius: 999px;
      color: var(--t-tx);
      font: 600 1.08rem/1.2 var(--t-text);
      text-decoration: none;
      background: radial-gradient(120% 140% at 30% 40%, color-mix(in srgb, var(--t-p) 42%, var(--t-paper)), color-mix(in srgb, var(--t-p) 18%, var(--t-paper)) 70%);
      box-shadow: 0 .8rem 1.6rem -1rem color-mix(in srgb, var(--t-p) 80%, var(--t-tx)), inset 0 0 1.2rem color-mix(in srgb, var(--t-paper) 60%, transparent);
      transition: transform .35s cubic-bezier(.2, .8, .2, 1), box-shadow .35s ease;
    }
    .wa-ub__btn::before {
      content: '';
      position: absolute;
      inset: -8% -6%;
      z-index: -1;
      border-radius: 46% 54% 52% 48% / 58% 44% 56% 42%;
      background: radial-gradient(closest-side, color-mix(in srgb, var(--t-s) 40%, transparent), transparent);
      opacity: 0;
      transform: scale(.7);
      transition: opacity .4s ease, transform .45s cubic-bezier(.2, .8, .2, 1);
    }
    .wa-ub__btn:hover, .wa-ub__btn:focus-visible { transform: translateY(-2px); }
    .wa-ub__btn:hover::before, .wa-ub__btn:focus-visible::before { opacity: 1; transform: scale(1.12); }
    .wa-ub__btn:focus-visible { outline: 3px solid color-mix(in srgb, var(--t-a) 60%, transparent); outline-offset: 4px; }
    .wa-ub__btn[data-wa-press] { animation: wa-ub-press .45s ease; }

    .wa-ub--anim .wa-ub__map { opacity: 0; transform: rotate(-2deg) scale(.96); transition: opacity .5s ease, transform .5s cubic-bezier(.2, .8, .2, 1); }
    .wa-ub--anim .wa-ub__map[data-wa-on] { opacity: 1; transform: none; }

    @media (max-width: 820px) {
      .wa-ub__wrap { grid-template-columns: 1fr; }
      .wa-ub__info { text-align: center; }
      .wa-ub__times li { justify-content: center; }
    }
    @media (prefers-reduced-motion: reduce) {
      .wa-ub *, .wa-ub *::before, .wa-ub *::after { animation: none !important; transition: none !important; }
    }
