      var cv = root.querySelector('[data-po-field]');
      var rig = root.querySelector('[data-po-rig]');
      var ink = root.querySelector('[data-po-ink]');
      var hang = root.querySelector('[data-po-hang]');
      var ctx = cv && cv.getContext ? cv.getContext('2d') : null;
      var Wd = 0, Ht = 0, DPR = 1, plumes = [], seeds = [], C = {};

      function rnd(a, b) { return a + Math.random() * (b - a); }

      function palette() {

        C.a = themeColor('var(--t-a)'); C.s = themeColor('var(--t-s)'); C.p = themeColor('var(--t-p)');
        C.wood = themeColor('var(--t-wood)');

      function build() {
        var r = root.getBoundingClientRect();

        cv.width = Math.round(Wd * DPR); cv.height = Math.round(Ht * DPR);

        plumes = [];
        for (var i = 0; i < count; i++) {
          var z = rnd(1.25, 7.2);
          var half = (Wd / 2) / F * z * 1.08;
          var f = []; for (var k = 0; k < 30; k++) f.push(rnd(.55, 1));
          plumes.push({ x: rnd(-half, half), z: z, h: rnd(.32, .78), w: rnd(.05, .09), ph: rnd(0, 6.28), sp: rnd(.7, 1.3),
            lean: rnd(-.08, .08), n: 30, f: f, col: [C.sand, C.cream, C.sand, C.cream, C.a][i % 5], al: Math.max(.2, Math.min(.85, 1.15 - z / 6.5)) });
        }
        plumes.sort(function (a, b) { return b.z - a.z; });
        seeds = [];
        for (var j = 0; j < (Wd < 700 ? 16 : 30); j++) seeds.push({ x: rnd(0, Wd), y: rnd(0, Ht), v: rnd(.15, .5), r: rnd(2, 4.5), ph: rnd(0, 6.28), c: [C.s, C.a, C.cream][j % 3] });
      }
      function draw(t) {
        if (!ctx) return;
        ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
        ctx.clearRect(0, 0, Wd, Ht);

        ctx.lineCap = 'round';
        for (var i = 0; i < plumes.length; i++) {
          var p = plumes[i], s = F / p.z;

          var sway = Math.sin(t * .0009 * p.sp + p.ph) * .1 + Math.sin(t * .0023 + p.ph * 1.7) * .03 + wind / p.z * 2;
          var tx = bx + (sway + p.lean) * h, ty = by - h, mx = bx + (tx - bx) * .2, my = by - h * .55;

          ctx.beginPath(); ctx.moveTo(bx, by); ctx.quadraticCurveTo(mx, my, tx, ty); ctx.stroke();

          for (k = 0; k <= 10; k++) {
            q = .42 + .58 * k / 10; iq = 1 - q;
            px = iq * iq * bx + 2 * iq * q * mx + q * q * tx; py = iq * iq * by + 2 * iq * q * my + q * q * ty;
            ddx = 2 * iq * (mx - bx) + 2 * q * (tx - mx); ddy = 2 * iq * (my - by) + 2 * q * (ty - my); mm = Math.hypot(ddx, ddy) || 1;
            env = Math.pow(Math.sin(Math.PI * Math.min(1, k / 10 * .9 + .1)), .75) * p.w * s * .62;
            Lp.push(px + ddy / mm * env, py - ddx / mm * env); Rp.push(px - ddy / mm * env, py + ddx / mm * env);
          }
          ctx.globalAlpha = p.al * .42; ctx.fillStyle = p.col;
          ctx.beginPath(); ctx.moveTo(Lp[0], Lp[1]);
          for (k = 2; k < Lp.length; k += 2) ctx.lineTo(Lp[k], Lp[k + 1]);
          ctx.lineTo(tx, ty - p.w * s * .45);
          for (k = Rp.length - 2; k >= 0; k -= 2) ctx.lineTo(Rp[k], Rp[k + 1]);

          ctx.globalAlpha = p.al * .85;
          ctx.strokeStyle = p.col; ctx.lineWidth = Math.max(.6, s * .0045);
          ctx.beginPath();

            px = iq * iq * bx + 2 * iq * q * mx + q * q * tx; py = iq * iq * by + 2 * iq * q * my + q * q * ty;
            ddx = 2 * iq * (mx - bx) + 2 * q * (tx - mx); ddy = 2 * iq * (my - by) + 2 * q * (ty - my); mm = Math.hypot(ddx, ddy) || 1;
            ddx /= mm; ddy /= mm;
            env = Math.pow(Math.sin(Math.PI * Math.min(1, u * .9 + .1)), .7) * p.w * s * p.f[k];
            var sd = (k & 1) ? 1 : -1, ln = env * 1.25;
            ctx.moveTo(px, py);
            ctx.quadraticCurveTo(px + ddx * ln * .35 - sd * ddy * env * .5, py + ddy * ln * .35 + sd * ddx * env * .5,
                                 px + ddx * ln - sd * ddy * env * .6 + sway * env * .4, py + ddy * ln + sd * ddx * env * .6);
          }
          ctx.stroke();
        }
        for (var j = 0; j < seeds.length; j++) {
          var d = seeds[j];
          var x = (d.x + t * .02 * d.v * 3 + wind * 300) % (Wd + 40) - 20, y = d.y + Math.sin(t * .0012 + d.ph) * 14 - (t * .006 * d.v) % Ht;
          if (y < -10) y += Ht + 20;
          ctx.globalAlpha = .55; ctx.fillStyle = d.c;
          ctx.beginPath(); ctx.ellipse(x, y, d.r, d.r * .45, t * .001 + d.ph, 0, 6.283); ctx.fill();
        }
        ctx.globalAlpha = 1;
      }
      palette(); build();
      if ('ResizeObserver' in window) new ResizeObserver(function () { build(); if (RM) draw(0); }).observe(root);
      if (RM) { draw(0); return; }

      /* 3D rig: unfolds on entry, then follows the pointer */
      var t0 = 0, started = false;
      function ease(x) { x = Math.max(0, Math.min(1, x)); return 1 - Math.pow(1 - x, 3); }
      root.addEventListener('pointermove', function (e) {
        var r = root.getBoundingClientRect();
        ptr.tx = (e.clientX - r.left) / r.width; ptr.ty = (e.clientY - r.top) / r.height;
      });
      root.addEventListener('pointerleave', function () { ptr.tx = .5; ptr.ty = .5; });
      entrance('bh-po', { r: .1, ms: 2700, on: function () { started = true; t0 = performance.now(); } });
      if (!HAS_IO) started = true;
      loop(root, function (t) {
        ptr.x += (ptr.tx - ptr.x) * .05; ptr.y += (ptr.ty - ptr.y) * .05;
        draw(t);
        var e = started ? ease((t - t0) / 1500) : 0;
        var ink_r = started ? ease((t - t0 - 350) / 1700) : 0;
        if (ink) ink.style.setProperty('--r', ink_r.toFixed(3));
        var idle = Math.sin(t * .0006) * 1.6;
        var ry = (ptr.x - .5) * 12 + idle - 22 * (1 - e), rx = (.5 - ptr.y) * 8 + 14 * (1 - e);
        rig.style.setProperty('--sp', e.toFixed(3));
        rig.style.transform = 'translateZ(' + (-170 * (1 - e)).toFixed(1) + 'px) rotateX(' + rx.toFixed(2) + 'deg) rotateY(' + ry.toFixed(2) + 'deg)';
        if (hang) hang.style.transform = 'rotate(' + (Math.sin(t * .0011) * 1.8 + (ptr.x - .5) * 3).toFixed(2) + 'deg)';
      });

    })();
