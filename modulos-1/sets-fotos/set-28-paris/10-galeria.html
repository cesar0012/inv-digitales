  <style>
    @import url('https://fonts.googleapis.com/css2?family=Parisienne&family=Bodoni+Moda:ital,wght@0,400;0,500;0,600;1,400;1,500&display=swap');

    .np-ga, .np-ga *, .np-ga *::before, .np-ga *::after { box-sizing: border-box; }
    .np-ga {
      --t-bg: var(--bg-color, #0d0b10);
      --t-tx: var(--text-color, #f8eee8);
      --t-p: var(--primary-color, #f0c4c0);
      --t-s: var(--secondary-color, #8a6e78);
      --t-a: var(--accent-color, #d4af6a);
      --t-display: var(--font-script, 'Parisienne', 'Snell Roundhand', cursive);
      --t-text: var(--font-heading, 'Bodoni Moda', 'Didot', Georgia, serif);
      position: relative;
      isolation: isolate;
      min-height: clamp(36rem, 70vw, 56rem);
      display: grid;
      justify-items: center;
      align-content: start;
      padding: clamp(3.5rem, 7vw, 6rem) clamp(1rem, 4vw, 3.5rem) clamp(4rem, 8vw, 6rem);
      overflow: hidden;
      background-color: var(--t-bg);
      background-image: radial-gradient(80% 40% at 50% 0%, color-mix(in srgb, var(--t-a) 9%, transparent), transparent 70%);
      color: var(--t-tx);
      text-align: center;
      font-family: var(--t-text);
    }
    .np-ga__head { width: min(100%, 40rem); }
    .np-ga__title {
      margin: 0;
      font-family: var(--t-display);
      font-weight: 400;
      font-size: clamp(2.8rem, 6vw, 4.4rem);
      line-height: 1.05;
    }
    .np-ga__lead { margin: .4rem 0 0; font-style: italic; color: var(--t-p); }
    .np-ga__garland { display: block; width: min(100%, 72rem); height: 4.5rem; margin: .8rem 0 .4rem; color: var(--t-a); overflow: visible; }
    .np-ga__grid {
      width: min(100%, 72rem);
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(min(100%, 14rem), 1fr));
      grid-auto-flow: dense;
      grid-auto-rows: clamp(8.5rem, 15vw, 12.5rem);
      gap: clamp(.6rem, 1.4vw, 1rem);
      margin: 0;
      padding: 0;
      list-style: none;
    }
    .np-ga__tile {
      position: relative;
      overflow: hidden;
      border: 1px solid color-mix(in srgb, var(--t-a) 35%, transparent);
      background: color-mix(in srgb, var(--t-s) 35%, var(--t-bg));
    }
    .np-ga__tile--tall { grid-row: span 2; }
    .np-ga__tile--wide { grid-column: span 2; }
    .np-ga__fig { margin: 0; height: 100%; }
    .np-ga__fig img {
      display: block;
      width: 100%;
      height: 100%;
      min-height: 100%;
      aspect-ratio: 4 / 3;
      object-fit: cover;
      overflow: hidden;
      transition: transform .5s cubic-bezier(.2, .8, .2, 1), filter .45s ease;
    }
    .np-ga__tile::before {
      content: '';
      position: absolute;
      top: .55rem;
      left: 50%;
      z-index: 2;
      width: .55rem;
      height: .55rem;
      margin-left: -.275rem;
      border-radius: 50%;
      background: var(--t-tx);
      box-shadow: 0 0 10px 3px color-mix(in srgb, var(--t-a) 75%, transparent);
      transition: opacity .4s ease, box-shadow .4s ease;
      pointer-events: none;
    }
    .np-ga__tile::after {
      content: '';
      position: absolute;
      inset: .45rem;
      border: 1px solid var(--t-a);
      opacity: 0;
      transition: opacity .35s ease, inset .35s ease;
      pointer-events: none;
    }
    .np-ga__open {
      position: absolute;
      inset: 0;
      z-index: 3;
      width: 100%;
      height: 100%;
      padding: 0;
      border: 0;
      background: transparent;
      cursor: zoom-in;
    }
    .np-ga__open:focus-visible { outline: 2px solid var(--t-p); outline-offset: -4px; }
    .np-ga__tile:hover .np-ga__fig img { transform: scale(1.05); }
    .np-ga__tile:hover::after, .np-ga__tile:focus-within::after { opacity: .9; inset: .7rem; }

    /* Tiles switch on like bulbs, one by one */
    .np-ga--anim .np-ga__tile:not([data-np-on]) .np-ga__fig img { filter: brightness(.15) saturate(.2); transform: scale(.97); }
    .np-ga--anim .np-ga__tile:not([data-np-on])::before { opacity: .15; box-shadow: none; }

    .np-ga__dialog {
      width: min(94vw, 64rem);
      max-height: 92vh;
      padding: 0;
      border: 1px solid color-mix(in srgb, var(--t-a) 60%, transparent);
      background: var(--t-bg);
      color: var(--t-tx);
      overflow: visible;
    }
    .np-ga__dialog[open] { animation: np-ga-zoom .35s cubic-bezier(.2, .8, .2, 1); }
    .np-ga__dialog::backdrop { background: color-mix(in srgb, var(--t-bg) 88%, transparent); -webkit-backdrop-filter: blur(4px); backdrop-filter: blur(4px); }
    .np-ga__stage { position: relative; display: grid; place-items: center; }
    .np-ga__big { display: block; width: 100%; height: auto; max-height: 80vh; object-fit: contain; background: color-mix(in srgb, var(--t-s) 30%, var(--t-bg)); }
    .np-ga__bar { display: flex; align-items: center; justify-content: space-between; gap: 1rem; padding: .7rem 1rem; font-style: italic; color: var(--t-p); }
    .np-ga__btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 2.6rem;
      height: 2.6rem;
      padding: 0;
      border: 1px solid color-mix(in srgb, var(--t-a) 60%, transparent);
      border-radius: 50%;
      background: color-mix(in srgb, var(--t-bg) 70%, transparent);
      color: var(--t-tx);
      font: inherit;
      font-size: 1.2rem;
      cursor: pointer;
      transition: background-color .3s ease, color .3s ease, transform .3s ease;
    }
    .np-ga__btn:hover, .np-ga__btn:focus-visible { background: var(--t-a); color: var(--t-bg); }
    .np-ga__btn:focus-visible { outline: 2px solid var(--t-p); outline-offset: 2px; }
    .np-ga__nav { display: flex; gap: .5rem; }
    .np-ga__close { position: absolute; top: -1.3rem; right: -1.3rem; z-index: 2; }
    @keyframes np-ga-zoom { from { opacity: 0; transform: scale(.94); } to { opacity: 1; transform: none; } }

    @media (max-width: 560px) {
      .np-ga__grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .np-ga__tile--wide { grid-column: span 2; }
      .np-ga__close { top: .5rem; right: .5rem; }
    }
    @media (prefers-reduced-motion: reduce) {
      .np-ga *, .np-ga *::before, .np-ga *::after, .np-ga__dialog { animation: none !important; transition: none !important; }
    }
  </style>

  <script>
    (function () {
      var SEL = '[data-gemini-id="galeria-paris"]';
      var root = null;
      try { root = document.currentScript && document.currentScript.closest(SEL); } catch (e) {}
      if (!root) root = document.querySelector(SEL);
      if (!root || root.__tInit) return;
      root.__tInit = true;
      var RM = !!(window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches);
      var NS = 'http://www.w3.org/2000/svg';
      var tiles = [].slice.call(root.querySelectorAll('[data-np-tile]'));

      /* ---------- Lightbox: native <dialog> + showModal() ---------- */
      var dlg = root.querySelector('[data-np-dialog]'), big = root.querySelector('[data-np-big]'), count = root.querySelector('[data-np-count]');
      var idx = 0, lastBtn = null;
      function show(i) {
        idx = (i + tiles.length) % tiles.length;
        var img = tiles[idx].querySelector('img');
        if (img && big) { big.src = img.currentSrc || img.src; big.alt = img.alt || ''; }
        if (count) count.textContent = (idx + 1) + ' / ' + tiles.length;
      }
      function open(i, btn) {
        if (!dlg) return;
        lastBtn = btn; show(i);
        if (typeof dlg.showModal === 'function') dlg.showModal(); else dlg.setAttribute('open', '');
      }
      function close() { if (!dlg) return; if (typeof dlg.close === 'function') dlg.close(); else dlg.removeAttribute('open'); }
      tiles.forEach(function (t, i) {
        var b = t.querySelector('[data-np-open]');
        if (b) b.addEventListener('click', function () { open(i, b); });
      });
      if (dlg) {
        dlg.addEventListener('click', function (e) { if (e.target === dlg) close(); });
        dlg.addEventListener('close', function () { if (lastBtn) lastBtn.focus(); });
        dlg.addEventListener('keydown', function (e) {
          if (e.key === 'ArrowRight') show(idx + 1);
          if (e.key === 'ArrowLeft') show(idx - 1);
        });
        var c = dlg.querySelector('[data-np-close]'), p = dlg.querySelector('[data-np-prev]'), n = dlg.querySelector('[data-np-next]');
        if (c) c.addEventListener('click', close);
        if (p) p.addEventListener('click', function () { show(idx - 1); });
        if (n) n.addEventListener('click', function () { show(idx + 1); });
      }

      /* ---------- Garland above the mosaic ---------- */
      var svg = root.querySelector('[data-np-garland]'), wire = null, bulbs = [], W = 1, H = 1;
      if (svg) {
        wire = document.createElementNS(NS, 'path');
        wire.setAttribute('fill', 'none'); wire.setAttribute('stroke', 'currentColor'); wire.setAttribute('stroke-opacity', '.55');
        svg.appendChild(wire);
        for (var i = 0; i < 21; i++) {
          var g = document.createElementNS(NS, 'g');
          var h = document.createElementNS(NS, 'circle'); h.setAttribute('r', 12); h.setAttribute('cy', 8); h.setAttribute('fill', 'url(#np28-ga-bulb)');
          var l = document.createElementNS(NS, 'line'); l.setAttribute('y2', 5); l.setAttribute('stroke', 'currentColor'); l.setAttribute('stroke-width', '1.4');
          var cc = document.createElementNS(NS, 'circle'); cc.setAttribute('r', 2.6); cc.setAttribute('cy', 8); cc.style.fill = 'var(--t-tx)';
          g.appendChild(h); g.appendChild(l); g.appendChild(cc); svg.appendChild(g);
          bulbs.push({ g: g, h: h, ph: Math.random() * 6.283, sp: .5 + Math.random() });
        }
      }
      function size() { if (!svg) return; W = svg.clientWidth || 1; H = svg.clientHeight || 1; svg.setAttribute('viewBox', '0 0 ' + W.toFixed(0) + ' ' + H.toFixed(0)); }
      function draw(t, still) {
        if (!svg) return;
        var sw = still ? 0 : Math.sin(t * .0007);
        var x1 = 0, y1 = H * .1, x2 = W, y2 = H * .1, cx = W / 2 + sw * W * .015, cy = y1 + 2 * H * .45 * (1 + (still ? 0 : .05 * Math.sin(t * .0009)));
        wire.setAttribute('d', 'M' + x1 + ' ' + y1.toFixed(1) + ' Q' + cx.toFixed(1) + ' ' + cy.toFixed(1) + ' ' + x2.toFixed(1) + ' ' + y2.toFixed(1));
        bulbs.forEach(function (b, i) {
          var u = (i + .5) / bulbs.length, v = 1 - u;
          var x = v * v * x1 + 2 * v * u * cx + u * u * x2, y = v * v * y1 + 2 * v * u * cy + u * u * y2;
          b.g.setAttribute('transform', 'translate(' + x.toFixed(1) + ' ' + y.toFixed(1) + ') rotate(' + (sw * 6 * Math.sin(u * Math.PI)).toFixed(2) + ')');
          b.h.setAttribute('opacity', still ? '.8' : (.5 + .5 * Math.sin(t * .0021 * b.sp + b.ph)).toFixed(2));
        });
      }
      size(); draw(0, true);
      window.addEventListener('resize', function () { size(); draw(performance.now(), RM); });

      if (RM || !('IntersectionObserver' in window)) return;

      /* Entrance: each tile switches on like a bulb, in a shuffled order */
      root.classList.add('np-ga--anim');
      var order = tiles.map(function (_, i) { return i; }).sort(function () { return Math.random() - .5; });
      var io = new IntersectionObserver(function (en) {
        if (en[0].isIntersecting && en[0].intersectionRatio > .15) {
          io.disconnect();
          order.forEach(function (ti, k) { setTimeout(function () { tiles[ti].setAttribute('data-np-on', ''); }, 120 + k * 140); });
          setTimeout(function () {
            root.classList.remove('np-ga--anim');
            tiles.forEach(function (t) { t.removeAttribute('data-np-on'); });
          }, 120 + order.length * 140 + 600);
        }
      }, { threshold: [0, .15, .4] });
      io.observe(root);

      var vis = false, raf = 0;
      function loop(t) { raf = 0; if (!vis || document.hidden) return; draw(t, false); raf = requestAnimationFrame(loop); }
      function kick() { if (!raf && vis && !document.hidden) raf = requestAnimationFrame(loop); }
      new IntersectionObserver(function (en) { vis = en[0].isIntersecting; kick(); }).observe(svg || root);
      document.addEventListener('visibilitychange', kick);
    })();
  </script>
