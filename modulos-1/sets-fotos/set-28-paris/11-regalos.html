    @keyframes np-rg-spin { to { transform: rotate(360deg); } }
    @keyframes np-rg-tie { from { stroke-dashoffset: 160; } to { stroke-dashoffset: 0; } }
    @keyframes np-rg-pop { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
