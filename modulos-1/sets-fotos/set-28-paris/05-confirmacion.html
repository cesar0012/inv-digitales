    .np-rs__seal svg { width: 1.2rem; height: 1.2rem; }

    .np-rs__form[data-np-state="sent"] .np-rs__seal [data-np-mono] { display: none; }
    .np-rs__form[data-np-state="sent"] .np-rs__seal [data-np-check] { display: block; }
    .np-rs__form[data-np-state="sent"] .np-rs__submit { background: color-mix(in srgb, var(--t-a) 25%, transparent); }
    .np-rs__form[data-np-state="loading"] [data-np-label-idle],
    .np-rs__form[data-np-state="sent"] [data-np-label-idle] { display: none; }
    .np-rs__busy, .np-rs__done-label { display: none; }
    .np-rs__form[data-np-state="loading"] .np-rs__busy { display: inline; }
    .np-rs__form[data-np-state="sent"] .np-rs__done-label { display: inline; }
    .np-rs__success {

      padding: .9rem 1.1rem;
