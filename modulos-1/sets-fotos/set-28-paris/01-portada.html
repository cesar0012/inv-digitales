          ctx.globalAlpha = .9; ctx.fillStyle = IVORY; ctx.beginPath(); ctx.arc(tx, ty, 2.2, 0, 6.283); ctx.fill();
        }
        /* the hourly sparkle (scintillement) */
        if (sparkle > 0) {
          for (var j = 0; j < SPARKS.length; j++) {
            var sp = SPARKS[j], qq = SEGS[sp.i];
            var X = qq[0] + (qq[3] - qq[0]) * sp.u, Y = qq[1] + (qq[4] - qq[1]) * sp.u, Z = qq[2] + (qq[5] - qq[2]) * sp.u;
            var I = Math.pow(Math.max(0, Math.sin(t * .012 * sp.sp + sp.ph)), 8) * sparkle;
            if (I < .05) continue;
            var rx = X * ca - Z * sa, rz = X * sa + Z * ca, kk = Sz * D / (D + rz);
            var sx = cx + rx * kk, sy = cy - (Y - .5) * kk;
            ctx.fillStyle = GOLD; ctx.globalAlpha = .28 * I; ctx.beginPath(); ctx.arc(sx, sy, 5, 0, 6.283); ctx.fill();
            ctx.fillStyle = IVORY; ctx.globalAlpha = I; ctx.beginPath(); ctx.arc(sx, sy, 1.5, 0, 6.283); ctx.fill();
          }
        }
        ctx.globalAlpha = 1; ctx.globalCompositeOperation = 'source-over';
      }

      readColors(); resize();

      if (RM || !HAS_IO) {
        /* Reduced motion (or no observer): static final state */
        if (lights) lights.draw(0, true);
        render(0, 1.05, .55, 0);
        window.addEventListener('resize', function () { resize(); if (lights) lights.draw(0, true); render(0, 1.05, .55, 0); });
        return;
      }

      var ease = function (x) { return 1 - Math.pow(1 - x, 3); };
      var vis = false, raf = 0, last = 0, ang = .45, buildStart = 0, revealing = false;
      var tx = 0, ty = 0, cxT = 0, cyT = 0;

      function loop(now) {
        raf = 0;
        if (!vis || document.hidden) { last = 0; return; }
        var dt = last ? Math.min(50, now - last) : 16; last = now;
        ang += dt * .00011;
        var build = buildStart ? ease(Math.min(1, (now - buildStart) / 1900)) * 1.05 : 0;
        var sparkle = 0;
        if (buildStart && now - buildStart > 1700) {
          var cyc = (now - buildStart - 1700) % 12000;
          sparkle = cyc < 4200 ? Math.min(1, cyc / 300, (4200 - cyc) / 500) : 0;
        }
        if (revealing) {
          var r = Math.max(0, Math.min(1, (now - buildStart - 350) / 1700));
          root.style.setProperty('--np-rv', ease(r).toFixed(3));
          root.style.setProperty('--np-sheen', r > 0 && r < 1 ? '1' : '0');
          if (r >= 1) { revealing = false; root.style.removeProperty('--np-rv'); root.style.removeProperty('--np-sheen'); }
        }
        cxT += (tx - cxT) * .06; cyT += (ty - cyT) * .06;
        var drift = Math.sin(now * .0004) * .8;
        if (world) world.style.transform = 'rotateX(' + (cyT * -4).toFixed(2) + 'deg) rotateY(' + (cxT * 6 + drift).toFixed(2) + 'deg)';
        if (lights) lights.draw(now, false);
        render(now, build, ang, sparkle);
        raf = requestAnimationFrame(loop);
      }
      function kick() { if (!raf && vis && !document.hidden) raf = requestAnimationFrame(loop); }

      root.addEventListener('pointermove', function (e) {
        var r = root.getBoundingClientRect();
        tx = ((e.clientX - r.left) / r.width - .5) * 2; ty = ((e.clientY - r.top) / r.height - .5) * 2;
      });
      root.addEventListener('pointerleave', function () { tx = 0; ty = 0; });
      document.addEventListener('visibilitychange', kick);
      window.addEventListener('resize', function () { readColors(); resize(); });

      root.classList.add('np-pt--anim');
      root.style.setProperty('--np-rv', '0');
      var started = false;
      new IntersectionObserver(function (en) {
        vis = en[0].isIntersecting;
        if (vis && !started && en[0].intersectionRatio > .2) {
          started = true; buildStart = performance.now(); revealing = true;
          root.classList.add('is-in');
          setTimeout(function () { root.classList.remove('np-pt--anim', 'is-in'); }, 2600);
        }
        kick();
      }, { threshold: [0, .2, .5] }).observe(root);
    })();
  </script>
