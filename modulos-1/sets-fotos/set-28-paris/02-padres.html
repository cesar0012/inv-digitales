    /* Entrance: cameos drop on their cords and settle (<= .5s each, staggered) */
    .np-pa--anim .np-pa__head { opacity: 0; transform: translateY(10px); transition: opacity .45s ease, transform .45s ease; }
    .np-pa--anim .np-pa__card { opacity: 0; transform: translateY(-48px) rotate(-5deg); transition: opacity .4s ease, transform .5s cubic-bezier(.34, 1.56, .64, 1); }

    .np-pa--anim.is-in .np-pa__head { opacity: 1; transform: none; }
    .np-pa--anim.is-in .np-pa__item::before { transform: none; transition-delay: .2s; }
    .np-pa--anim.is-in .np-pa__card { opacity: 1; transform: none; transition-delay: .4s; }
    .np-pa--anim.is-in .np-pa__item:nth-child(2) .np-pa__card { transform: none; transition-delay: .65s; }
    .np-pa--anim.is-in .np-pa__item:nth-child(2)::before { transition-delay: .45s; }

    @media (max-width: 640px) {
      .np-pa__list { grid-template-columns: 1fr; gap: 3.2rem; }
      .np-pa__item:nth-child(2) { margin-top: 0; }
      .np-pa__item:nth-child(2) { --np-cord: 2rem; }
    }
    @media (prefers-reduced-motion: reduce) {

      function build() {
