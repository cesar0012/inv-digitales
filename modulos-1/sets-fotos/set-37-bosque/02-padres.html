    .be-pad, .be-pad *, .be-pad *::before, .be-pad *::after { box-sizing: border-box; }
    .be-pad {
      --t-bg: var(--bg-color, #F3F5EA);
      --t-tx: var(--text-color, #24483B);
      --t-p: var(--primary-color, #2F7A5A);
      --t-s: var(--secondary-color, #7D9A58);

      isolation: isolate;

      color: var(--t-tx);
      text-align: center;
      font-family: var(--t-text);

    .be-pad-lf { fill: var(--t-s); }
    .be-pad-lf2 { fill: var(--t-p); }
    .be-pad-wire { stroke: color-mix(in srgb, var(--t-a) 70%, transparent); stroke-width: .8; }

      font-size: clamp(3rem, 7vw, 4.8rem);
      line-height: 1.3;
      color: var(--t-p);

    .be-pad__text { margin: 0 auto; max-width: 32rem; font-size: clamp(1.05rem, 1.8vw, 1.18rem); line-height: 1.6; }

    .be-pad__grid {

      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: clamp(2.5rem, 6vw, 5rem);
      max-width: 52rem;

      align-items: start;

      position: absolute;
      inset: 9.5%;

      border-radius: 50%;
      overflow: hidden;
      background: color-mix(in srgb, var(--t-s) 30%, var(--t-bg));

    }
    .be-pad__figure img { display: block; color: transparent; width: 100%; height: auto; aspect-ratio: 1; object-fit: cover; }
    .be-pad__wreath { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; pointer-events: none; }
    .be-pad__person:nth-child(2) .be-pad__wreath { transform: scaleX(-1); }
    .be-pad__name {

      font-family: var(--t-display);
      font-weight: 400;
      font-size: clamp(2rem, 4vw, 2.6rem);
      line-height: 1.35;

    .be-pad--anim .be-pad__person[data-be-in] .be-pad__figure { opacity: 1; transform: none; }

  <script>
    (function () {
      var SEL = '[data-gemini-id="padres-padre"]';
      var root = null;
      try { root = document.currentScript && document.currentScript.closest(SEL); } catch (e) {}
      if (!root) root = document.querySelector(SEL);
      if (!root || root.__tInit) return;
      root.__tInit = true;
      var RM = !!(window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches);
      if (RM || !('IntersectionObserver' in window)) return;   /* reduced motion = static final state */

      var people = [].slice.call(root.querySelectorAll('[data-be-person]'));
      var bulbs = [].slice.call(root.querySelectorAll('[data-be-bulb]'));
      var wl = root.querySelector('[data-be-wing="l"]'), wr = root.querySelector('[data-be-wing="r"]');

      /* vine stems draw themselves (rAF, not CSS) */
      function draw(stem, delay, dur) {
        var len = stem.getTotalLength ? stem.getTotalLength() : 0; if (!len) return;
        stem.style.strokeDasharray = len; stem.style.strokeDashoffset = len;
        var t0 = performance.now() + delay;
        (function step(now) {
          var k = Math.min(1, Math.max(0, (now - t0) / dur));
          stem.style.strokeDashoffset = (len * (1 - (1 - Math.pow(1 - k, 3)))).toFixed(1);
          if (k < 1) requestAnimationFrame(step); else { stem.style.strokeDasharray = ''; stem.style.strokeDashoffset = ''; }
        })(performance.now());
      }
      [].slice.call(root.querySelectorAll('[data-be-stem]')).forEach(function (s) {
        var len = s.getTotalLength ? s.getTotalLength() : 0; if (len) { s.style.strokeDasharray = len; s.style.strokeDashoffset = len; }
      });

      root.classList.add('be-pad--anim');
      var io = new IntersectionObserver(function (en) {
        if (en[0].isIntersecting && en[0].intersectionRatio > .2) {
          io.disconnect();
          root.classList.add('is-in');
          draw(root.querySelector('.be-pad__garland [data-be-stem]'), 0, 1100);
          people.forEach(function (p, i) {
            setTimeout(function () { p.setAttribute('data-be-in', ''); }, 250 + i * 320);
            draw(p.querySelector('[data-be-stem]'), 250 + i * 320, 1000);
          });
          setTimeout(function () {
            root.classList.remove('be-pad--anim', 'is-in');
            people.forEach(function (p) { p.removeAttribute('data-be-in'); });
          }, 2600);
        }
      }, { threshold: [0, .2, .5] });
      io.observe(root);

      /* resting butterfly breathes its wings, garland bulbs twinkle — paused off-screen */
      var vis = false, running = false;
      new IntersectionObserver(function (en) { vis = en[0].isIntersecting; go(); }).observe(root);
      document.addEventListener('visibilitychange', go);
      function go() { if (!running && vis && !document.hidden) { running = true; requestAnimationFrame(loop); } }
      function loop(t) {
        if (!vis || document.hidden) { running = false; return; }
        var a = 22 + 38 * Math.pow(.5 + .5 * Math.sin(t * .0021), 2);
        if (wl) { wl.style.transform = 'rotateY(' + a.toFixed(1) + 'deg)'; wr.style.transform = 'rotateY(' + (-a).toFixed(1) + 'deg)'; }
        for (var i = 0; i < bulbs.length; i++) bulbs[i].style.opacity = (.5 + .5 * Math.sin(t * .0028 + i * 1.7)).toFixed(2);
        requestAnimationFrame(loop);
      }
    })();
