    .be-port, .be-port *, .be-port *::before, .be-port *::after { box-sizing: border-box; }
    .be-port {
      --t-bg: var(--bg-color, #F3F5EA);
      --t-tx: var(--text-color, #24483B);
      --t-p: var(--primary-color, #2F7A5A);
      --t-s: var(--secondary-color, #7D9A58);
      --t-a: var(--accent-color, #C9A447);
      --t-l: var(--lilac-color, #B8A2DA);
      --t-display: var(--font-script, 'Ballet', cursive);
      --t-text: var(--font-heading, 'EB Garamond', Georgia, serif);
      position: relative;
      isolation: isolate;
      min-height: max(40rem, 100svh);
      display: grid;
      place-items: center;
      padding: clamp(4.5rem, 9vw, 6rem) clamp(1rem, 4vw, 3rem) clamp(5rem, 9vw, 7rem);
      overflow: hidden;
      background-color: var(--t-bg);
      background-image: url('https://loremflickr.com/1600/1000/enchanted,forest,lights?lock=3301');
      background-size: cover;
      background-position: center;
      color: var(--t-tx);
      text-align: center;
      font-family: var(--t-text);
    }
    /* Misty clearing tint: luminous center, soft emerald edges (never dark) */
    .be-port::before {
      content: '';
      position: absolute;
      inset: 0;
      z-index: -2;
      background:
        radial-gradient(ellipse 58% 52% at 50% 44%, color-mix(in srgb, var(--t-bg) 92%, transparent) 0%, color-mix(in srgb, var(--t-bg) 55%, transparent) 55%, transparent 80%),
        linear-gradient(180deg,
          color-mix(in srgb, color-mix(in srgb, var(--t-bg) 86%, var(--t-a)) 90%, transparent) 0%,
          color-mix(in srgb, color-mix(in srgb, var(--t-bg) 70%, var(--t-s)) 90%, transparent) 55%,
          color-mix(in srgb, color-mix(in srgb, var(--t-bg) 50%, var(--t-p)) 92%, transparent) 100%);
    }
    .be-port__forest {
      position: absolute;
      inset: 0;
      z-index: -1;
      width: 100%;
      height: 100%;
      display: block;
      pointer-events: none;
    }

    .be-port__stage {
      position: relative;
      z-index: 1;
      width: min(100%, 35rem);
      perspective: 1100px;
      margin-top: clamp(2.5rem, 6vw, 3.5rem);
    }
    .be-port__arch {
      position: relative;
      transform-style: preserve-3d;
      padding: clamp(5rem, 12vw, 7rem) clamp(1.25rem, 5vw, 3rem) clamp(2.4rem, 5vw, 3.2rem);
      border-radius: 999px 999px 1.75rem 1.75rem;
    }
    .be-port__glass {
      position: absolute;
      inset: 0;
      border-radius: inherit;
      background: linear-gradient(180deg, color-mix(in srgb, var(--t-bg) 62%, transparent), color-mix(in srgb, var(--t-bg) 84%, transparent));
      border: 1px solid color-mix(in srgb, var(--t-a) 60%, transparent);
      box-shadow:
        0 0 0 7px color-mix(in srgb, var(--t-bg) 32%, transparent),
        0 0 0 8px color-mix(in srgb, var(--t-a) 30%, transparent),
        0 40px 90px -40px color-mix(in srgb, var(--t-p) 70%, transparent),
        inset 0 0 70px color-mix(in srgb, var(--t-a) 20%, transparent);
      backdrop-filter: blur(7px);
      -webkit-backdrop-filter: blur(7px);
      transform: translateZ(-10px);
    }
    .be-port__inner { position: relative; transform: translateZ(12px); }

    .be-port__crown {
      position: absolute;
      left: 50%;
      top: 0;
      width: 107%;
      height: auto;
      margin-top: calc(-6% - .45rem);
      transform: translateX(-50%) translateZ(18px);
      overflow: visible;
      pointer-events: none;
    }
    .be-port__climb {
      position: absolute;
      bottom: -1.2rem;
      width: clamp(4.5rem, 14vw, 7rem);
      height: auto;
      overflow: visible;
      transform: translateZ(16px);
      pointer-events: none;
    }
    .be-port__climb--l { left: clamp(-2.6rem, -5vw, -1.4rem); }
    .be-port__climb--r { right: clamp(-2.6rem, -5vw, -1.4rem); transform: translateZ(16px) scaleX(-1); }

    .be-port-stem { fill: none; stroke: var(--t-p); stroke-width: 1.6; stroke-linecap: round; }
    .be-port-tendril { fill: none; stroke: var(--t-s); stroke-width: 1.1; stroke-linecap: round; }
    .be-port-lf { fill: var(--t-s); }
    .be-port-lf2 { fill: var(--t-p); }
    .be-port-wire { stroke: color-mix(in srgb, var(--t-a) 70%, transparent); stroke-width: .8; }
    .be-port-bulb { fill: color-mix(in srgb, var(--t-a) 70%, #fff8dc); }

    .be-port__kicker {
      margin: 0;
      font-style: italic;
      font-size: clamp(1.15rem, 2.4vw, 1.45rem);
      color: var(--t-p);

    .be-port__spark { color: var(--t-a); font-style: normal; padding: 0 .45em; }
    .be-port__name {
      margin: .15em 0 .1em;
      font-family: var(--t-display);

      font-size: clamp(3.1rem, 9vw, 6.2rem);

      overflow-wrap: anywhere;
    }
    .be-port__divider { display: block; width: min(13rem, 70%); height: auto; margin: .4rem auto 1rem; overflow: visible; }
    .be-port__msg {
      margin: 0 auto 1.4rem;
      max-width: 26rem;
      font-size: clamp(1.05rem, 2vw, 1.2rem);
      line-height: 1.55;

    .be-port__date {
      display: inline-block;
      font-size: clamp(1.2rem, 2.6vw, 1.5rem);
      font-weight: 500;
      color: var(--t-p);
      padding: .35rem 1.1rem;
      border-radius: 999px;
      background: color-mix(in srgb, var(--t-a) 16%, transparent);
      box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--t-a) 45%, transparent);
    }
    .be-port__place { margin: .9rem 0 0; font-style: italic; font-size: 1.05rem; opacity: .85; }

    .be-port__flutter { position: absolute; inset: 0; z-index: 2; pointer-events: none; perspective: 900px; }
    .be-port__bfly {
      position: absolute;
      width: 88px;
      height: 72px;
      transform-style: preserve-3d;
      transform: rotate(-18deg) rotateX(48deg);
    }
    .be-port__bfly--1 { left: 12%; top: 26%; }
    .be-port__bfly--2 { left: 80%; top: 58%; width: 66px; height: 54px; }
    .be-port__bfly--3 { left: 72%; top: 14%; width: 50px; height: 41px; }
    .be-port__wing { position: absolute; top: 0; width: 50%; height: 100%; }
    .be-port__wing svg { display: block; width: 100%; height: 100%; overflow: visible; }
    .be-port__wing--l { left: 0; transform-origin: 100% 50%; transform: rotateY(28deg); }
    .be-port__wing--r { right: 0; transform-origin: 0 50%; transform: rotateY(-28deg); }
    .be-port__wing--r svg { transform: scaleX(-1); }
    .be-port-wing-f, .be-port-wing-h { stroke: color-mix(in srgb, var(--t-a) 75%, #fff); stroke-width: .8; }
    .be-port-wing-v { fill: none; stroke: rgba(255, 255, 255, .55); stroke-width: .6; }
    .be-port__thorax {
      position: absolute;
      left: 50%;
      top: 22%;
      width: 3px;
      height: 58%;
      margin-left: -1.5px;
      border-radius: 3px;
      background: color-mix(in srgb, var(--t-p) 70%, var(--t-a));
    }

    .be-port__cue {
      position: absolute;
      z-index: 1;
      left: 50%;
      bottom: clamp(1.2rem, 3vw, 2rem);
      transform: translateX(-50%);
      margin: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: .35rem;
      font-style: italic;
      font-size: .98rem;
      color: var(--t-p);
    }
    .be-port__cue-leaf { width: 22px; height: 22px; display: block; }
    .be-port__cue-leaf path { fill: var(--t-a); }

    /* Entrance (JS adds --anim; content stays visible without JS). Every transition <= .5s */
    .be-port--anim .be-port__stage { opacity: 0; transform: translateY(18px) scale(.97); transition: opacity .5s ease, transform .5s cubic-bezier(.2, .8, .2, 1); }
    .be-port--anim.is-in .be-port__stage { opacity: 1; transform: none; }
    .be-port--anim .be-port__name { -webkit-mask-image: linear-gradient(95deg, #000 0, #000 calc(var(--be-rev, 0) * 1% - 14%), transparent calc(var(--be-rev, 0) * 1%)); mask-image: linear-gradient(95deg, #000 0, #000 calc(var(--be-rev, 0) * 1% - 14%), transparent calc(var(--be-rev, 0) * 1%)); }
    .be-port--anim .be-port__kicker,

    .be-port--anim.is-in .be-port__kicker { opacity: 1; transition-delay: .3s; }
    .be-port--anim.is-named .be-port__divider { opacity: 1; }
    .be-port--anim.is-named .be-port__msg { opacity: 1; transform: none; transition-delay: .1s; }
    .be-port--anim.is-named .be-port__date { opacity: 1; transform: none; transition-delay: .22s; }
    .be-port--anim.is-named .be-port__place { opacity: 1; transform: none; transition-delay: .34s; }
    .be-port--anim.is-named .be-port__cue { opacity: 1; transition-delay: .5s; }
    .be-port--anim .be-port-lf, .be-port--anim .be-port-lf2 { transform: scale(0); transition: transform .4s cubic-bezier(.3, 1.5, .5, 1); transition-delay: calc(var(--i) * 45ms + .35s); }

          if (dt) { m.z -= m.v * dt; m.y -= m.v * .35 * dt; m.x += Math.sin(t * .0007 + m.ph) * .004 * dt; }
          if (m.z < .9) { m.z = 24; m.y = -6 + rnd() * 8; m.x = (rnd() - .5) * 16; }
          if (m.y < -7) m.y = 2;
          var dz2 = m.z - camZ; if (dz2 < .5) continue;
          var s3 = f / dz2, sx = cx + (m.x - camX) * s3, sy = cy + (m.y - camY) * s3;
          var tw2 = .5 + .5 * Math.sin(t * .004 + m.ph), sz2 = Math.max(3, m.s * s3) * (.7 + .6 * tw2);
          ctx.globalAlpha = (.35 + .6 * tw2) * Math.min(1, (24 - m.z) / 4);
          ctx.drawImage(SP[m.c], sx - sz2 / 2, sy - sz2 / 2, sz2, sz2);
        }
        /* wand trail from the name reveal */
        for (var n = trail.length - 1; n >= 0; n--) {
          var p = trail[n]; p.life -= .018 * dt; if (p.life <= 0) { trail.splice(n, 1); continue; }
          p.x += p.vx * dt; p.y += p.vy * dt; p.vy += .035 * dt;
          ctx.globalAlpha = p.life; var ps = p.size * (.4 + p.life * .8);
          ctx.drawImage(SP[p.c], p.x - ps / 2, p.y - ps / 2, ps, ps);

      }

      function flutter(t) {
        for (var i = 0; i < flies.length; i++) {
          var b = flies[i];
          var x = (b.bx + b.ax * Math.sin(t * b.fx + b.ph)) * W, y = (b.by + b.ay * Math.sin(t * b.fy + b.ph * 1.3) + .015 * Math.sin(t * .006 + i)) * H;
          var vx = x - b.px, vy = y - b.py; b.px = x; b.py = y;
          if (Math.abs(vx) + Math.abs(vy) > .05) { var hd = Math.atan2(vy, vx) * 57.3 + 90, dh = ((hd - b.h + 540) % 360) - 180; b.h += dh * .05; }
          var flap = 14 + 58 * (.5 + .5 * Math.sin(t * .019 + b.ph));
          b.el.style.transform = 'translate3d(' + x.toFixed(1) + 'px,' + y.toFixed(1) + 'px,0) rotate(' + b.h.toFixed(1) + 'deg) rotateX(52deg)';
          b.l.style.transform = 'rotateY(' + flap.toFixed(1) + 'deg)';
          b.r.style.transform = 'rotateY(' + (-flap).toFixed(1) + 'deg)';
        }
      }

      if ('ResizeObserver' in window) new ResizeObserver(size).observe(cv); else window.addEventListener('resize', size);
      size();
      if (RM || !('IntersectionObserver' in window)) { frame(0, 0); return; }   /* reduced motion = one still frame */

      /* pointer parallax: camera + arch tilt */
      root.addEventListener('pointermove', function (e) {
        var r = root.getBoundingClientRect();
        var nx = (e.clientX - r.left) / r.width - .5, ny = (e.clientY - r.top) / r.height - .5;
        tcx = nx * 1.2; tcy = ny * .5;
      });
      root.addEventListener('pointerleave', function () { tcx = 0; tcy = 0; });

      for (var fi = 0; fi < flies.length; fi++) { flies[fi].el.style.left = '0'; flies[fi].el.style.top = '0'; }

      /* entrance: arch appears, then a fairy wand writes the name */
      var revStart = 0, named = false, entered = false;
      root.classList.add('be-port--anim');
      root.style.setProperty('--be-rev', '0');
      var io = new IntersectionObserver(function (en) {
        if (!entered && en[0].isIntersecting && en[0].intersectionRatio > .2) {
          entered = true; root.classList.add('is-in'); revStart = performance.now() + 520;
          setTimeout(function () { if (!named) finishReveal(); }, 2400);   /* completes even if scrolled away mid-reveal */
        }
      }, { threshold: [0, .2, .5] });
      io.observe(root);

      function finishReveal() {
        if (named) return;
        named = true; root.style.setProperty('--be-rev', '120'); root.classList.add('is-named'); io.disconnect();
        setTimeout(function () { root.classList.remove('be-port--anim', 'is-in', 'is-named'); root.style.removeProperty('--be-rev'); }, 1600);
      }
      function reveal(now) {
        if (!entered || named) return;
        var k = (now - revStart) / 1700;
        if (k < 0) return;
        if (k >= 1) { finishReveal(); return; }
        var e = k < .5 ? 2 * k * k : 1 - Math.pow(-2 * k + 2, 2) / 2;
        root.style.setProperty('--be-rev', (e * 118).toFixed(2));
        var rr = root.getBoundingClientRect(), nr = nameEl.getBoundingClientRect();
        var hx = nr.left - rr.left + nr.width * Math.min(1, e * 1.02), hy = nr.top - rr.top + nr.height * (.5 + .18 * Math.sin(k * 18));
        for (var q = 0; q < 3; q++) trail.push({ x: hx, y: hy, vx: (Math.random() - .5) * 1.6, vy: -Math.random() * 1.6, life: 1, size: 8 + Math.random() * 14, c: Math.random() < .7 ? 0 : 1 });
      }

      var vis = true, running = false;
      var vio = new IntersectionObserver(function (en) { vis = en[0].isIntersecting; if (vis) start(); });
      vio.observe(root);
      document.addEventListener('visibilitychange', start);
      function start() { if (!running && vis && !document.hidden) { running = true; last = performance.now(); requestAnimationFrame(loop); } }
      function loop(t) {
        if (!vis || document.hidden) { running = false; return; }
        var dt = Math.min(3, (t - last) / 16.67); last = t;
        frame(t, dt); flutter(t); reveal(t);
        rx += ((-tcy * 7) - rx) * .06 * dt; ry += ((tcx * 9) - ry) * .06 * dt;
        arch.style.transform = 'rotateX(' + rx.toFixed(2) + 'deg) rotateY(' + ry.toFixed(2) + 'deg)';
        for (var bi = 0; bi < bulbs.length; bi++) bulbs[bi].style.opacity = (.55 + .45 * Math.sin(t * .0032 + bi * 1.9)).toFixed(2);
        if (cue) cue.style.transform = 'translateY(' + (Math.sin(t * .003) * 4).toFixed(1) + 'px) rotate(' + (Math.sin(t * .0021) * 12).toFixed(1) + 'deg)';
        requestAnimationFrame(loop);
      }
      start();
    })();
