    .pv-vest, .pv-vest *, .pv-vest *::before, .pv-vest *::after { box-sizing: border-box; }
    .pv-vest {
      --bg: var(--bg-color, #16233b);
      --tx: var(--text-color, #f6f1e7);
      --p: var(--primary-color, #f4a259);

      color: var(--tx); text-align: center; font-family: var(--sans);

    .pv-vest::before {

      border-radius: 0 0 100% 100% / 0 0 100% 100%;
      animation: pvVestAla .8s ease-in-out infinite alternate;
    }
    @keyframes pvVestAla { from { transform: scaleX(.8); } to { transform: scaleX(1.15); } }

    .pv-vest--anim [data-pv-step] { opacity: 0; transform: translateY(18px); transition: opacity .55s ease, transform .55s cubic-bezier(.2, .8, .2, 1); }
    .pv-vest--anim [data-pv-step].is-on { opacity: 1; transform: none; }
    .pv-vest :focus-visible { outline: 2px solid var(--p); outline-offset: 4px; }

    @media (prefers-reduced-motion: reduce) {
      .pv-vest *, .pv-vest *::before, .pv-vest *::after { animation: none !important; transition: none !important; }
    }
