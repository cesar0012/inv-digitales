  <script>
    (function () {
      var SEL = '[data-gemini-id="galeria-rustico"]';
      var root = null;
      try { root = document.currentScript && document.currentScript.closest(SEL); } catch (e) {}
      if (!root) root = document.querySelector(SEL);
      if (!root || root.__tInit) return;
      root.__tInit = true;
      var RM = !!(window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches);
      var HAS_IO = 'IntersectionObserver' in window;

      var tiles = [].slice.call(root.querySelectorAll('[data-rr-tile]'));
      var lb = root.querySelector('[data-rr-lb]'), big = lb.querySelector('[data-mm-big]'), count = root.querySelector('[data-rr-count]'), cur = 0;
      function show(i) {
        cur = (i + tiles.length) % tiles.length;
        var im = tiles[cur].querySelector('img');
        big.src = im.currentSrc || im.src; big.alt = im.alt;
        count.textContent = (cur + 1) + ' / ' + tiles.length;
      }
      function open(i) { show(i); if (lb.showModal) { if (!lb.open) lb.showModal(); } else lb.setAttribute('open', ''); }
      function close() { if (lb.close) lb.close(); else lb.removeAttribute('open'); }
      tiles.forEach(function (t, i) {
        t.addEventListener('click', function () { open(i); });
        t.addEventListener('keydown', function (e) { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); open(i); } });
      });
      root.querySelector('[data-rr-prev]').addEventListener('click', function () { show(cur - 1); });
      root.querySelector('[data-rr-next]').addEventListener('click', function () { show(cur + 1); });
      root.querySelector('[data-rr-close]').addEventListener('click', close);
      lb.addEventListener('click', function (e) { if (e.target === lb) close(); });
      lb.addEventListener('keydown', function (e) { if (e.key === 'ArrowLeft') show(cur - 1); if (e.key === 'ArrowRight') show(cur + 1); });

      if (RM || !HAS_IO) return;   /* reduced motion: tiles already pinned */
      root.classList.add('rr-ga--anim');
      var left = tiles.length;
      tiles.forEach(function (t, i) {
        var io = new IntersectionObserver(function (en) {
          if (!en[0].isIntersecting) return;
          io.disconnect();
          setTimeout(function () {
            t.setAttribute('data-in', '');
            if (--left === 0) setTimeout(function () {
              root.classList.remove('rr-ga--anim');
              tiles.forEach(function (x) { x.removeAttribute('data-in'); });
            }, 700);
          }, (i % 3) * 110);
        }, { threshold: .2 });
        io.observe(t);
      });

    })();
