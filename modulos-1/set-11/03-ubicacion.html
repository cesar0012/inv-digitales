    .su-ubicacion__rotulo {

    .su-ubicacion__dato {

      font-size: clamp(0.88rem, 1.6vw, 1rem);
      line-height: 1.6;

    }
    .su-ubicacion__boton {
      justify-self: start;
      display: inline-block;
      padding: 0.75rem 1.7rem;
      background: var(--primary-color);
      color: var(--bg-color);
      font-family: Arial, Helvetica, sans-serif;
      font-size: clamp(0.66rem, 1.25vw, 0.76rem);
      letter-spacing: 0.28em;
      text-transform: uppercase;
      text-decoration: none;
      transition: background 0.4s ease;
    }
    .su-ubicacion__boton:hover { background: var(--accent-color); }

    .su-ubicacion__marco {
      position: relative;
      margin: 0;
    }
    .su-ubicacion__marco img {
      display: block;
      width: 100%;
      height: auto;
      aspect-ratio: 4 / 3;
      object-fit: cover;
      filter: grayscale(1) contrast(1.08);
    }
    .su-ubicacion__cruz {
      position: absolute;
      z-index: 2;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 44px;
      height: 44px;
      pointer-events: none;
    }
    .su-ubicacion__cruz::before,
    .su-ubicacion__cruz::after {
      content: '';
      position: absolute;
      background: var(--accent-color);
    }
    .su-ubicacion__cruz::before { left: 50%; top: 0; bottom: 0; width: 2px; transform: translateX(-50%); }
    .su-ubicacion__cruz::after { top: 50%; left: 0; right: 0; height: 2px; transform: translateY(-50%); }
    .su-ubicacion__circular {
      position: absolute;
      z-index: 2;
      top: 50%;
      left: 50%;
      width: 84px;
      height: 84px;
      transform: translate(-50%, -50%);
      border: 1.5px solid var(--accent-color);
      border-radius: 50%;
      animation: suUbicacionFija 3.2s ease-in-out infinite;
      pointer-events: none;
    }
    @keyframes suUbicacionFija {
      0%, 100% { opacity: 0.9; transform: translate(-50%, -50%) scale(1); }
      50% { opacity: 0.4; transform: translate(-50%, -50%) scale(1.08); }
    }
    .su-ubicacion__mapa {
      margin: 1rem 0 0;
      overflow: hidden;
      outline: 1px solid var(--surface-border-color);
    }
    .su-ubicacion__mapa iframe {
      display: block;
      width: 100%;
      aspect-ratio: 16 / 8;
      border: 0;
      filter: grayscale(1) contrast(1.05);
    }

    @media (max-width: 820px) {
      .su-ubicacion__grid { grid-template-columns: 1fr; }
    }

    @media (prefers-reduced-motion: reduce) {
      .su-ubicacion * { animation: none !important; transition: none !important; }
    }
