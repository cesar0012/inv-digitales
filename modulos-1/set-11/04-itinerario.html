    .su-itinerario__fila {

      gap: clamp(0.9rem, 2.6vw, 1.8rem);

    }
    .su-itinerario.su-js .su-itinerario__fila { opacity: 0; transform: translateX(-14px); }
    .su-itinerario .su-itinerario__fila.esta-visto { opacity: 1; transform: none; }
    .su-itinerario__fila::before {
      content: '';
      position: absolute;
      left: 0;
      top: 0;
      bottom: 0;
      width: 0;
      background: var(--accent-color);
      transition: width 0.5s cubic-bezier(0.22, 0.8, 0.3, 1);

    .su-itinerario__fila.esta-visto::before { width: 4px; }

    .su-itinerario__num {

    .su-itinerario__hora {

    }

    @media (max-width: 560px) {
      .su-itinerario__fila { grid-template-columns: 1fr auto; }
      .su-itinerario__num { display: none; }
    }

    @media (prefers-reduced-motion: reduce) {
      .su-itinerario * { transition: none !important; }
      .su-itinerario__fila { opacity: 1 !important; transform: none !important; }

  <script>
    (function () {
      var root = document.currentScript ? document.currentScript.closest('section') : document.querySelector('.su-itinerario');
      if (!root) return;
      root.classList.add('su-js');
      window.setTimeout(function () { root.classList.add('esta-visto'); }, 2500); // red de seguridad: nunca dejar contenido oculto
      var filas = Array.prototype.slice.call(root.querySelectorAll('[data-su-fila]'));
      var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
      if (reduce || !('IntersectionObserver' in window)) {
        filas.forEach(function (f) { f.classList.add('esta-visto'); });
        return;
      }
      var io = new IntersectionObserver(function (entries) {
        entries.forEach(function (entry) {
          if (!entry.isIntersecting) return;
          var i = filas.indexOf(entry.target);
          entry.target.style.transitionDelay = (Math.max(i, 0) * 0.12).toFixed(2) + 's';
          entry.target.classList.add('esta-visto');
          io.unobserve(entry.target);
        });
      }, { threshold: 0.25 });
      filas.forEach(function (f) { io.observe(f); });
    })();
  </script>
