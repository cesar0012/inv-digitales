      font-size: clamp(0.84rem, 1.5vw, 0.94rem);

    .su-regalos__lista { display: grid; gap: 0; border-top: 1px solid var(--surface-border-color); margin-bottom: 1.6rem; }
    .su-regalos__fila {
      display: grid;

    .su-regalos.su-js .su-regalos__fila { opacity: 0; transform: translateX(-12px); }
    .su-regalos .su-regalos__fila.esta-visto { opacity: 1; transform: none; }

    .su-regalos__via {

      font-weight: 700;
      font-size: clamp(0.66rem, 1.3vw, 0.78rem);
      letter-spacing: 0.3em;

      cursor: pointer;
      transition: background 0.4s ease;
    }
    .su-regalos__boton:hover { background: var(--accent-color); }
    .su-regalos__boton.esta-listo { background: var(--accent-color); }
    .su-regalos__nota {
      margin-top: 0.8rem;
      font-family: 'Courier New', monospace;
      font-size: clamp(0.64rem, 1.25vw, 0.74rem);
      letter-spacing: 0.14em;
      color: var(--secondary-color);
      text-align: left;
    }

    @media (max-width: 520px) {
      .su-regalos__fila { grid-template-columns: auto 1fr; }
      .su-regalos__via { grid-column: 2; }
      .su-regalos__zona-boton { text-align: center; }
    }

    @media (prefers-reduced-motion: reduce) {
      .su-regalos * { transition: none !important; }
      .su-regalos__fila { opacity: 1 !important; transform: none !important; }
    }

  <script>
    (function () {
      var root = document.currentScript ? document.currentScript.closest('section') : document.querySelector('.su-regalos');
      if (!root) return;
      root.classList.add('su-js');
      window.setTimeout(function () { root.classList.add('esta-visto'); }, 2500); // red de seguridad: nunca dejar contenido oculto

      var filas = Array.prototype.slice.call(root.querySelectorAll('[data-su-fila]'));
      var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
      if (('IntersectionObserver' in window) && !reduce) {
        var io = new IntersectionObserver(function (entries) {
          entries.forEach(function (entry) {
            if (!entry.isIntersecting) return;
            filas.forEach(function (fila, i) { fila.style.transitionDelay = (i * 0.11).toFixed(2) + 's'; });
            filas.forEach(function (fila) { fila.classList.add('esta-visto'); });
            io.disconnect();
          });
        }, { threshold: 0.3 });
        io.observe(root.querySelector('[data-su-lista]') || root);
      } else {
        filas.forEach(function (fila) { fila.classList.add('esta-visto'); });
      }

      var boton = root.querySelector('[data-su-boton]');
      var texto = root.querySelector('[data-su-boton-texto]');
      if (boton && texto) {
        boton.addEventListener('click', function () {
          var listo = boton.classList.toggle('esta-listo');
          texto.textContent = listo ? 'Regalo agendado' : 'Agendar regalo';
        });
      }
    })();
  </script>
