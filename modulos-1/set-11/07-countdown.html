<section
  class="su-countdown"
  data-gemini-id="countdown-suizo-grid"
  path="placeholder"
  memory_source="generated"
  memory_type="background"
  memory_usage="protected"
  data-countdown-target="YYYY-MM-DDTHH:MM:SS"
>
  <style>
    .su-countdown {
      background-image: url('https://loremflickr.com/1600/900/grid,minimal');
      background-size: cover;
      background-position: center;
      position: relative;
      isolation: isolate;
      overflow: hidden;
      box-sizing: border-box;
      min-height: 640px;
      display: grid;
      place-items: center;
      padding: clamp(3rem, 7vw, 5rem) clamp(1rem, 5vw, 3rem);
      background-color: var(--bg-color, #f2f2ef);
      color: var(--text-color, #17171a);
      text-align: center;
    }
    .su-countdown *,
    .su-countdown *::before,
    .su-countdown *::after { box-sizing: border-box; }

    .su-countdown::before {
      content: '';
      position: absolute;
      inset: 0;
      z-index: -1;
      background: color-mix(in srgb, var(--bg-color, #f2f2ef) 97%, transparent);
    }

    .su-countdown__contenido { width: min(100%, 780px); }

    .su-countdown__etiqueta {
      margin: 0 0 0.6rem;
      font-family: Arial, Helvetica, sans-serif;
      font-size: clamp(0.6rem, 1.15vw, 0.68rem);
      letter-spacing: 0.44em;
      text-transform: uppercase;
      color: var(--secondary-color, #75757c);
    }
    .su-countdown__titulo {
      margin: 0 0 0.4rem;
      font-family: Arial, Helvetica, sans-serif;
      font-weight: 700;
      font-size: clamp(1.7rem, 4vw, 2.7rem);
      text-transform: uppercase;
      letter-spacing: -0.01em;
      color: var(--primary-color, #17171a);
    }
    .su-countdown__titulo em { font-style: normal; color: var(--accent-color, #d43d2a); }
    .su-countdown__fecha {
      display: block;
      margin-bottom: clamp(1.6rem, 4vw, 2.4rem);
      font-family: 'Courier New', monospace;
      font-size: clamp(0.74rem, 1.5vw, 0.88rem);
      letter-spacing: 0.3em;
      text-transform: uppercase;
      color: var(--secondary-color, #75757c);
    }

    .su-countdown__cifras {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      border: 2px solid var(--primary-color, #17171a);
    }
    .su-countdown__cifra {
      position: relative;
      padding: clamp(1.4rem, 3.6vw, 2.3rem) 0.4rem clamp(1rem, 2.4vw, 1.5rem);
      border-right: 1px solid var(--surface-border-color, rgba(23, 23, 26, 0.16));
    }
    .su-countdown__cifra:last-child { border-right: 0; }
    .su-countdown__numero {
      display: block;
      font-family: Arial, Helvetica, sans-serif;
      font-weight: 700;
      font-size: clamp(2.2rem, 6.5vw, 4.2rem);
      font-variant-numeric: tabular-nums;
      line-height: 0.95;
      letter-spacing: -0.02em;
      color: var(--primary-color, #17171a);
    }
    .su-countdown__rotulo {
      display: block;
      margin-top: 0.6rem;
      padding-top: 0.5rem;
      border-top: 1px solid var(--surface-border-color, rgba(23, 23, 26, 0.16));
      font-family: Arial, Helvetica, sans-serif;
      font-size: clamp(0.54rem, 1.05vw, 0.62rem);
      letter-spacing: 0.34em;
      text-transform: uppercase;
      color: var(--secondary-color, #75757c);
    }
    .su-countdown__cifra--segundos .su-countdown__numero { color: var(--accent-color, #d43d2a); }

    .su-countdown__regla {
      position: relative;
      height: 26px;
      margin-top: clamp(1.2rem, 3vw, 1.8rem);
      background:
        repeating-linear-gradient(90deg, var(--primary-color, #17171a) 0 1px, transparent 1px 10%) 0 0 / 100% 8px no-repeat,
        linear-gradient(var(--primary-color, #17171a), var(--primary-color, #17171a)) 0 100% / 100% 1.5px no-repeat;
      opacity: 0.7;
    }
    .su-countdown__cursor {
      position: absolute;
      top: 0;
      left: 0;
      width: 3px;
      height: 100%;
      background: var(--accent-color, #d43d2a);
      transition: left 0.5s linear;
    }

    @media (max-width: 560px) {
      .su-countdown__cifras { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .su-countdown__cifra:nth-child(2) { border-right: 0; }
      .su-countdown__cifra:nth-child(-n + 2) { border-bottom: 1px solid var(--surface-border-color, rgba(23, 23, 26, 0.16)); }
      .su-countdown { min-height: 580px; }
    }

    @media (prefers-reduced-motion: reduce) {
      .su-countdown__cursor { transition: none; }
    }
  </style>

  <div class="su-countdown__contenido">
    <p class="su-countdown__etiqueta" memory_type="text" memory_usage="custom" memory_key="countdown-etiqueta">Fig. 05 — Cuenta regresiva</p>
    <h2 class="su-countdown__titulo" memory_type="text" memory_usage="custom" memory_key="countdown-titulo">Faltan <em>exactamente</em></h2>
    <time class="su-countdown__fecha" datetime="YYYY-MM-DDTHH:MM:SS" memory_type="text" memory_usage="custom" memory_key="countdown-fecha">Fecha del evento</time>

    <div class="su-countdown__cifras" aria-label="Cuenta regresiva">
      <div class="su-countdown__cifra"><span class="su-countdown__numero" data-countdown-unit="days">--</span><span class="su-countdown__rotulo">Días</span></div>
      <div class="su-countdown__cifra"><span class="su-countdown__numero" data-countdown-unit="hours">--</span><span class="su-countdown__rotulo">Horas</span></div>
      <div class="su-countdown__cifra"><span class="su-countdown__numero" data-countdown-unit="minutes">--</span><span class="su-countdown__rotulo">Min</span></div>
      <div class="su-countdown__cifra su-countdown__cifra--segundos"><span class="su-countdown__numero" data-countdown-unit="seconds">--</span><span class="su-countdown__rotulo">Seg</span></div>
    </div>

    <div class="su-countdown__regla" aria-hidden="true">
      <span class="su-countdown__cursor" data-su-cursor></span>
    </div>
  </div>

  <script>
    (function () {
      var el = null;
      try { el = document.currentScript.closest('[data-gemini-id^="countdown"]'); } catch (e) {}
      if (!el) el = document.querySelector('[data-gemini-id^="countdown"]');
      if (!el) return;

      var cursor = el.querySelector('[data-su-cursor]');
      var target = NaN;
      var attr = el.getAttribute('data-countdown-target');
      if (attr && attr.indexOf('YYYY') === -1) { var p = new Date(attr); if (!isNaN(p.getTime())) target = p.getTime(); }
      if (isNaN(target) && window.__countdownTarget) { var p1 = new Date(window.__countdownTarget); if (!isNaN(p1.getTime())) target = p1.getTime(); }
      if (isNaN(target) && window.countdown_target) { var p2 = new Date(window.countdown_target); if (!isNaN(p2.getTime())) target = p2.getTime(); }

      var intervalId = null;
      (window.__countdownIntervals = window.__countdownIntervals || []).forEach(clearInterval);
      window.__countdownIntervals = [];

      function pad2(n) { return n < 10 ? '0' + n : '' + n; }
      function setUnit(unit, value) {
        var node = el.querySelector('[data-countdown-unit="' + unit + '"]');
        if (node) node.textContent = value;
      }
      function tick() {
        if (!Number.isFinite(target)) return;
        var diff = Math.max(target - Date.now(), 0);
        setUnit('days', Math.floor(diff / 86400000));
        setUnit('hours', pad2(Math.floor((diff % 86400000) / 3600000)));
        setUnit('minutes', pad2(Math.floor((diff % 3600000) / 60000)));
        var s = Math.floor((diff % 60000) / 1000);
        setUnit('seconds', pad2(s));
        if (cursor) cursor.style.left = ((s / 60) * 100).toFixed(2) + '%';
        if (diff === 0 && intervalId !== null) {
          clearInterval(intervalId);
          intervalId = null;
          window.__countdownIntervals = [];
        }
      }
      function start(newTarget) {
        if (newTarget) { var p = new Date(newTarget); if (!isNaN(p.getTime())) target = p.getTime(); }
        (window.__countdownIntervals || []).forEach(clearInterval);
        window.__countdownIntervals = [];
        intervalId = null;
        if (!Number.isFinite(target)) return;
        tick();
        if (target > Date.now()) {
          intervalId = setInterval(tick, 1000);
          window.__countdownIntervals.push(intervalId);
        }
      }
      start();
      window.updateCountdown = start;
    })();
  </script>

  <script>
    var moduleMetadata = {
      module_type: 'countdown',
      module_name: 'countdown-suizo-grid',
      style_name: 'Cifras Suizas',
      descripcion: 'Cuadrícula de cifras gigantes con divisores finos, segundos destacados en rojo y regla con cursor que recorre cada minuto.',
      tags: ['countdown', 'cuenta regresiva', 'suizo', 'cifras', 'regla', 'grid'],
      tipo: 'countdown'
    };
  </script>
</section>
