    .hb-ubicacion {

      color: var(--text-color);

    .hb-ubicacion *,
    .hb-ubicacion *::before,
    .hb-ubicacion *::after { box-sizing: border-box; }

    .hb-ubicacion::before {

      z-index: -1;
      background: color-mix(in srgb, var(--bg-color) 88%, transparent);

    .hb-ubicacion__grid {

    .hb-ubicacion__etiqueta {

    .hb-ubicacion__titulo {

    .hb-ubicacion__marcador {

      align-items: center;
      gap: 0.6rem;
      margin-bottom: 1.4rem;
      font-size: 0.78rem;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--text-color);
    }
    .hb-ubicacion__punto {
      position: relative;
      width: 14px;
      height: 14px;
      border-radius: 50%;
      background: var(--accent-color);
    }
    .hb-ubicacion__onda {
      position: absolute;
      inset: -7px;
      border: 1.5px solid var(--accent-color);
      border-radius: 50%;
      opacity: 0;
      transform: scale(0.4);
    }
    .hb-ubicacion.esta-visto .hb-ubicacion__onda { animation: hbUbicacionPulso 1.8s ease-out infinite; }
    @keyframes hbUbicacionPulso {
      0% { opacity: 0.9; transform: scale(0.4); }
      70% { opacity: 0.15; transform: scale(1.25); }
      100% { opacity: 0; transform: scale(1.35); }
    }

    .hb-ubicacion__boton {
      display: inline-block;
      padding: 0.75rem 1.7rem;
      border: 1px solid var(--primary-color);
      outline: 1px solid var(--surface-border-color);
      outline-offset: 4px;
      font-family: Georgia, 'Times New Roman', serif;
      font-size: clamp(0.74rem, 1.4vw, 0.84rem);
      letter-spacing: 0.24em;
      text-transform: uppercase;
      text-decoration: none;
      color: var(--primary-color);
      background: var(--surface-color);
      transition: background 0.4s ease, color 0.4s ease, transform 0.4s ease;
    }
    .hb-ubicacion__boton:hover { background: var(--primary-color); color: var(--bg-color); transform: translateY(-2px); }

    .hb-ubicacion__marco {
      position: relative;
      padding: 10px;
      background: var(--surface-color);
      border: 1px solid var(--surface-border-color);

    .hb-ubicacion__marco-titulo {

      margin: 0 0 10px;
      font-family: Georgia, 'Times New Roman', serif;
      font-size: 0.62rem;
      letter-spacing: 0.28em;
      text-transform: uppercase;
      color: var(--secondary-color);
    }
    .hb-ubicacion__mapa {
      margin: 0;
      overflow: hidden;
      border: 1px solid var(--surface-border-color);
    }
    .hb-ubicacion__mapa iframe {
      display: block;
      width: 100%;
      aspect-ratio: 16 / 10;
      border: 0;
      filter: saturate(0.82) contrast(0.98);
    }

    .hb-ubicacion__rosa {
      position: absolute;
      top: -18px;
      right: -16px;
      width: 46px;
      color: var(--accent-color);
      background: var(--surface-color);
      border: 1px solid var(--surface-border-color);
      border-radius: 50%;
      padding: 6px;
      box-shadow: 0 8px 18px rgba(35, 48, 31, 0.18);
    }

    @media (max-width: 880px) {
      .hb-ubicacion__grid { grid-template-columns: 1fr; }
      .hb-ubicacion__info { text-align: center; }
      .hb-ubicacion__direccion { border-left: 0; padding-left: 0; }
    }

    @media (prefers-reduced-motion: reduce) {
      .hb-ubicacion * { animation: none !important; transition: none !important; }
    }
  </style>

  <script>
    (function () {
      var root = document.currentScript ? document.currentScript.closest('section') : document.querySelector('.hb-ubicacion');
      if (!root) return;
      var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
      if (reduce) { root.classList.add('esta-visto'); return; }
      if (!('IntersectionObserver' in window)) { root.classList.add('esta-visto'); return; }
