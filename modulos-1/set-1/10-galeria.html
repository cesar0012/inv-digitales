<section
  class="hb-galeria"
  data-gemini-id="galeria-herbario-laminas"
>
  <style>
    .hb-galeria {
      --primary-color: #23301f;
      --secondary-color: #5c6657;
      --accent-color: #7d8f6e;
      --bg-color: #f6f4ec;
      --surface-color: #fffdf6;
      --surface-border-color: rgba(35, 48, 31, 0.22);
      --text-color: #23301f;

      position: relative;
      isolation: isolate;
      box-sizing: border-box;
      padding: clamp(3rem, 8vw, 6rem) clamp(1rem, 5vw, 4rem);
      background-color: var(--bg-color);
      color: var(--text-color);
    }
    .hb-galeria *,
    .hb-galeria *::before,
    .hb-galeria *::after { box-sizing: border-box; }

    .hb-galeria__cabecera {
      display: flex;
      flex-wrap: wrap;
      align-items: baseline;
      justify-content: space-between;
      gap: 0.8rem;
      width: min(100%, 1080px);
      margin: 0 auto clamp(1.8rem, 4vw, 2.8rem);
      border-bottom: 1px solid var(--surface-border-color);
      padding-bottom: 1rem;
    }
    .hb-galeria__titulo {
      margin: 0;
      font-family: Georgia, 'Times New Roman', serif;
      font-weight: 400;
      font-size: clamp(1.7rem, 3.8vw, 2.4rem);
      color: var(--primary-color);
    }
    .hb-galeria__nota {
      margin: 0;
      font-family: Georgia, 'Times New Roman', serif;
      font-size: clamp(0.68rem, 1.3vw, 0.78rem);
      letter-spacing: 0.22em;
      text-transform: uppercase;
      color: var(--secondary-color);
    }

    .hb-galeria__mosaico {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(min(220px, 100%), 1fr));
      gap: clamp(0.9rem, 2.4vw, 1.5rem);
      width: min(100%, 1080px);
      margin: 0 auto;
    }

    .hb-galeria__pieza {
      position: relative;
      margin: 0;
      padding: 7px 7px 26px;
      background: var(--surface-color);
      border: 1px solid var(--surface-border-color);
      box-shadow: 0 12px 28px rgba(35, 48, 31, 0.13);
      cursor: pointer;
      transition: opacity 0.5s ease, transform 0.5s cubic-bezier(0.22, 0.8, 0.3, 1), box-shadow 0.5s ease;
    }
    .hb-galeria.hb-js .hb-galeria__pieza { opacity: 0; transform: translateY(16px); }
    .hb-galeria.esta-visto .hb-galeria__pieza { opacity: 1; transform: none; }
    .hb-galeria__pieza:hover { box-shadow: 0 20px 40px rgba(35, 48, 31, 0.2); }
    .hb-galeria.hb-js .hb-galeria__pieza:nth-child(odd) { transform: translateY(16px) rotate(-1.1deg); }
    .hb-galeria.esta-visto .hb-galeria__pieza:nth-child(odd) { transform: rotate(-1.1deg); }
    .hb-galeria.hb-js .hb-galeria__pieza:nth-child(even) { transform: translateY(16px) rotate(1deg); }
    .hb-galeria.esta-visto .hb-galeria__pieza:nth-child(even) { transform: rotate(1deg); }

    .hb-galeria__pieza img {
      color: transparent;
      display: block;
      width: 100%;
      height: auto;
      aspect-ratio: 4 / 3;
      object-fit: cover;
      filter: saturate(0.9);
    }
    .hb-galeria__num {
      position: absolute;
      bottom: 6px;
      left: 9px;
      font-family: Georgia, 'Times New Roman', serif;
      font-size: 0.58rem;
      letter-spacing: 0.24em;
      color: var(--secondary-color);
    }
    .hb-galeria__lupa {
      position: absolute;
      top: 12px;
      right: 12px;
      width: 26px;
      height: 26px;
      display: grid;
      place-items: center;
      border-radius: 50%;
      background: color-mix(in srgb, var(--bg-color) 88%, transparent);
      color: var(--primary-color);
      opacity: 0;
      transition: opacity 0.4s ease;
    }
    .hb-galeria__pieza:hover .hb-galeria__lupa { opacity: 1; }

    .hb-galeria__lightbox {
      position: fixed;
      inset: 0;
      z-index: 9999;
      display: none;
      place-items: center;
      padding: clamp(1rem, 4vw, 3rem);
      background: color-mix(in srgb, var(--primary-color) 78%, black);
    }
    .hb-galeria__lightbox.abierto { display: grid; }
    .hb-galeria__lightbox img {
      max-width: min(920px, 92vw);
      max-height: 82svh;
      width: auto;
      height: auto;
      border: 6px solid var(--surface-color);
      box-shadow: 0 30px 80px rgba(0, 0, 0, 0.5);
    }
    .hb-galeria__cerrar {
      position: absolute;
      top: clamp(0.8rem, 2.5vw, 1.6rem);
      right: clamp(0.8rem, 2.5vw, 1.6rem);
      width: 44px;
      height: 44px;
      border: 1px solid var(--surface-color);
      border-radius: 50%;
      background: transparent;
      color: var(--surface-color);
      font-size: 1.2rem;
      line-height: 1;
      cursor: pointer;
      transition: transform 0.4s ease, background 0.4s ease;
    }
    .hb-galeria__cerrar:hover { transform: rotate(90deg); background: color-mix(in srgb, var(--surface-color) 18%, transparent); }

    @media (max-width: 560px) {
      .hb-galeria__mosaico { grid-template-columns: repeat(auto-fit, minmax(min(150px, 100%), 1fr)); gap: 0.7rem; }
      .hb-galeria__pieza { padding: 5px 5px 20px; }
    }

    @media (prefers-reduced-motion: reduce) {
      .hb-galeria * { transition: none !important; }
      .hb-galeria__pieza { opacity: 1; transform: none; }
      .hb-galeria__pieza:nth-child(odd) { transform: rotate(-1.1deg); }
      .hb-galeria__pieza:nth-child(even) { transform: rotate(1deg); }
    }
  </style>

  <script>
    (function () {
      var root = document.currentScript ? document.currentScript.closest('section') : document.querySelector('.hb-galeria');
      if (!root) return;
      root.classList.add('hb-js');
      window.setTimeout(function () { root.classList.add('esta-visto'); }, 2500); // red de seguridad: nunca dejar contenido oculto

      var piezas = Array.prototype.slice.call(root.querySelectorAll('[data-hb-pieza]'));
      var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
      if (('IntersectionObserver' in window) && !reduce) {
        var io = new IntersectionObserver(function (entries) {
          entries.forEach(function (entry) {
            if (!entry.isIntersecting) return;
            var i = piezas.indexOf(entry.target);
            entry.target.style.transitionDelay = (Math.min(i, 5) * 0.08).toFixed(2) + 's';
            root.classList.add('esta-visto');
            io.unobserve(entry.target);
          });
        }, { threshold: 0.18 });
        piezas.forEach(function (p) { io.observe(p); });
      } else {
        root.classList.add('esta-visto');
      }

      var lightbox = document.createElement('div');
      lightbox.className = 'hb-galeria__lightbox';
      lightbox.setAttribute('role', 'dialog');
      lightbox.setAttribute('aria-modal', 'true');
      lightbox.setAttribute('aria-label', 'Vista ampliada');
      lightbox.innerHTML =
        '<img alt="" />' +
        '<button type="button" class="hb-galeria__cerrar" aria-label="Cerrar">×</button>';
      root.appendChild(lightbox);
      var imgAmpliada = lightbox.querySelector('img');
      var botonCerrar = lightbox.querySelector('.hb-galeria__cerrar');

      function abrir(fig) {
        var foto = fig.querySelector('img');
        if (!foto) return;
        imgAmpliada.src = foto.src;
        imgAmpliada.alt = foto.alt;
        lightbox.classList.add('abierto');
      }
      function cerrar() { lightbox.classList.remove('abierto'); }

      piezas.forEach(function (fig) {
        fig.addEventListener('click', function () { abrir(fig); });
        fig.addEventListener('keydown', function (e) {
          if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); abrir(fig); }
        });
      });
      botonCerrar.addEventListener('click', cerrar);
      lightbox.addEventListener('click', function (e) { if (e.target === lightbox) cerrar(); });
    })();
  </script>
