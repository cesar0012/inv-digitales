>
  <style>
    .ci-padres {
      --primary-color: #f3ead8;
      --secondary-color: #b3a488;
      --accent-color: #e8a13c;
      --bg-color: #191512;
      --surface-color: #221d18;
      --surface-border-color: rgba(243, 234, 216, 0.16);
      --text-color: #f3ead8;

      position: relative;
      isolation: isolate;
      box-sizing: border-box;
      padding: clamp(3rem, 8vw, 6rem) clamp(1rem, 5vw, 4rem);
      background-color: var(--bg-color);
      background-image: url('https://loremflickr.com/1600/900/vintage,film');
      background-size: cover;
      background-position: center;
      color: var(--text-color);
    }
    .ci-padres *,
    .ci-padres *::before,
    .ci-padres *::after { box-sizing: border-box; }

    .ci-padres::before {
      content: '';
      position: absolute;
      inset: 0;
      z-index: -1;
      background: color-mix(in srgb, var(--bg-color) 91%, transparent);
    }

    .ci-padres__cabecera {
      width: min(100%, 880px);
      margin: 0 auto clamp(1.8rem, 4vw, 2.6rem);
      border-bottom: 1px solid var(--surface-border-color);
      padding-bottom: 0.9rem;
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 1rem;
    }
    .ci-padres__titulo {
      margin: 0;
      font-family: Georgia, 'Times New Roman', serif;
      font-weight: 400;
      font-size: clamp(1.6rem, 3.6vw, 2.3rem);
      color: var(--primary-color);
    }
    .ci-padres__bobina {
      font-family: 'Courier New', monospace;
      font-size: clamp(0.6rem, 1.1vw, 0.7rem);
      letter-spacing: 0.3em;
      color: var(--accent-color);
    }
    .ci-padres__intro {
      width: min(100%, 880px);
      margin: 0 auto clamp(2rem, 5vw, 3rem);
      font-family: Georgia, 'Times New Roman', serif;
      font-style: italic;
      font-size: clamp(0.86rem, 1.55vw, 0.96rem);
      line-height: 1.7;
      color: var(--secondary-color);
    }

    .ci-padres__cintas {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: clamp(1.4rem, 4vw, 2.6rem);
      width: min(100%, 880px);
      margin: 0 auto;
    }

    .ci-padres__cinta {
      position: relative;
      display: grid;
      grid-template-columns: 18px 1fr;
      background: var(--surface-color);
      border: 1px solid var(--surface-border-color);
      box-shadow: 0 22px 46px rgba(0, 0, 0, 0.5);
      transition: opacity 0.5s ease, transform 0.5s cubic-bezier(0.22, 0.8, 0.3, 1);
    }
    .ci-padres.ci-js .ci-padres__cinta { opacity: 0; transform: translateY(20px); }
    .ci-padres .ci-padres__cinta.esta-visto { opacity: 1; transform: none; }

    .ci-padres__perforaciones {
      background:
        radial-gradient(circle, var(--bg-color) 0 4px, transparent 4.5px) 50% 0 / 100% 26px repeat-y;
      border-right: 1px solid var(--surface-border-color);
    }

    .ci-padres__contenido { padding: clamp(1.4rem, 3.4vw, 2rem); text-align: center; }
    .ci-padres__retrato {
      width: clamp(96px, 13.5vw, 124px);
      margin: 0 auto 0.9rem;
      padding: 4px;
      border: 1px solid var(--accent-color);
      border-radius: 50%;
      box-shadow: 0 0 18px color-mix(in srgb, var(--accent-color) 25%, transparent);
    }
    .ci-padres__retrato img {
      color: transparent;
      display: block;
      width: 100%;
      height: auto;
      aspect-ratio: 1 / 1;
      border-radius: 50%;
      object-fit: cover;
      filter: sepia(0.2) saturate(1.02);
    }

    .ci-padres__rol {
      margin: 0 0 0.3rem;
      font-family: 'Courier New', monospace;
      font-size: clamp(0.56rem, 1.05vw, 0.64rem);
      letter-spacing: 0.38em;
      text-transform: uppercase;
      color: var(--accent-color);
    }
    .ci-padres__nombres {
      margin: 0;
      font-family: Georgia, 'Times New Roman', serif;
      font-size: clamp(1.02rem, 2.05vw, 1.28rem);
      line-height: 1.3;
      color: var(--primary-color);
    }

    @media (max-width: 740px) {
      .ci-padres__cintas { grid-template-columns: 1fr; max-width: 380px; }
    }

    @media (prefers-reduced-motion: reduce) {
      .ci-padres * { transition: none !important; }
      .ci-padres__cinta { opacity: 1 !important; transform: none !important; }
    }
  </style>

  <header class="ci-padres__cabecera" memory_type="text" memory_usage="custom" memory_key="padres-intro">
    <h2 class="ci-padres__titulo" memory_type="text" memory_usage="custom" memory_key="padres-titulo">Reparto de origen</h2>
    <span class="ci-padres__bobina" memory_type="text" memory_usage="custom" memory_key="padres-bobina">BOBINA 01 · REEL A</span>
  </header>
  <p class="ci-padres__intro" memory_type="text" memory_usage="custom" memory_key="padres-texto">Todo gran filme empieza con dos familias frente a la cámara.</p>

  <div class="ci-padres__cintas">
    <article class="ci-padres__cinta" data-ci-cinta>

      <div class="ci-padres__contenido">

          <img src="https://loremflickr.com/380/380/family,vintage" alt="Retrato de la familia de la novia" path="placeholder" data-library-category="bodas" data-asset-type="retrato-familia" loading="lazy" />
          <figcaption hidden>Familia uno</figcaption>
        </figure>
        <div memory_type="text" memory_usage="custom" memory_key="padres-bloque-uno">
          <p class="ci-padres__rol">Padres de la novia</p>
          <h3 class="ci-padres__nombres">Nombre Papá &amp; Nombre Mamá</h3>
        </div>
      </div>
    </article>

    <article class="ci-padres__cinta" data-ci-cinta>
      <span class="ci-padres__perforaciones" aria-hidden="true"></span>
      <div class="ci-padres__contenido">
        <figure class="ci-padres__retrato" memory_type="image" memory_usage="custom" memory_source="library" memory_key="padres-retrato-dos">
          <img src="https://loremflickr.com/380/380/parents,retro" alt="Retrato de la familia del novio" path="placeholder" data-library-category="bodas" data-asset-type="retrato-familia" loading="lazy" />
          <figcaption hidden>Familia dos</figcaption>
        </figure>
        <div memory_type="text" memory_usage="custom" memory_key="padres-bloque-dos">
          <p class="ci-padres__rol">Padres del novio</p>
          <h3 class="ci-padres__nombres">Nombre Papá &amp; Nombre Mamá</h3>
        </div>
      </div>
    </article>
  </div>

  <script>
    (function () {
      var root = document.currentScript ? document.currentScript.closest('section') : document.querySelector('.ci-padres');
      if (!root) return;
      root.classList.add('ci-js');
      window.setTimeout(function () { root.classList.add('esta-visto'); }, 2500); // red de seguridad: nunca dejar contenido oculto
      var cintas = Array.prototype.slice.call(root.querySelectorAll('[data-ci-cinta]'));
      var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
      if (reduce || !('IntersectionObserver' in window)) {
        cintas.forEach(function (c) { c.classList.add('esta-visto'); });
        return;
      }
      var io = new IntersectionObserver(function (entries) {
        entries.forEach(function (entry) {
          if (!entry.isIntersecting) return;
          var i = cintas.indexOf(entry.target);
          entry.target.style.transitionDelay = (Math.max(i, 0) * 0.15).toFixed(2) + 's';
          entry.target.classList.add('esta-visto');
          io.unobserve(entry.target);
        });
      }, { threshold: 0.25 });
      cintas.forEach(function (c) { io.observe(c); });
    })();
  </script>

    };
  </script>
