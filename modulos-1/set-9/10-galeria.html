<section
  class="ci-galeria"
  data-gemini-id="galeria-cine-contactos"
>
  <style>
    .ci-galeria {
      --primary-color: #f3ead8;
      --secondary-color: #b3a488;
      --accent-color: #e8a13c;
      --bg-color: #191512;
      --surface-color: #221d18;
      --surface-border-color: rgba(243, 234, 216, 0.16);
      --text-color: #f3ead8;

      position: relative;
      isolation: isolate;
      box-sizing: border-box;
      padding: clamp(3rem, 8vw, 6rem) clamp(1rem, 5vw, 4rem);
      background-color: var(--bg-color);
      color: var(--text-color);
    }
    .ci-galeria *,
    .ci-galeria *::before,
    .ci-galeria *::after { box-sizing: border-box; }

    .ci-galeria__cabecera {
      width: min(100%, 1060px);
      margin: 0 auto clamp(1.8rem, 4vw, 2.6rem);
      border-bottom: 1px solid var(--surface-border-color);
      padding-bottom: 0.9rem;
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 1rem;
    }
    .ci-galeria__titulo {
      margin: 0;
      font-family: Georgia, 'Times New Roman', serif;
      font-weight: 400;
      font-size: clamp(1.6rem, 3.6vw, 2.3rem);
      color: var(--primary-color);
    }
    .ci-galeria__hoja {
      font-family: 'Courier New', monospace;
      font-size: clamp(0.6rem, 1.1vw, 0.7rem);
      letter-spacing: 0.3em;
      color: var(--accent-color);
    }

    .ci-galeria__contactos {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(min(220px, 100%), 1fr));
      gap: clamp(0.9rem, 2.4vw, 1.4rem);
      width: min(100%, 1060px);
      margin: 0 auto;
    }

    .ci-galeria__fotograma {
      position: relative;
      margin: 0;
      padding: 8px;
      background: var(--surface-color);
      border: 1px solid var(--surface-border-color);
      cursor: pointer;
      transition: opacity 0.5s ease, transform 0.5s cubic-bezier(0.22, 0.8, 0.3, 1), box-shadow 0.4s ease;
    }
    .ci-galeria.ci-js .ci-galeria__fotograma { opacity: 0; transform: translateY(18px); }
    .ci-galeria .ci-galeria__fotograma.esta-visto { opacity: 1; transform: none; }
    .ci-galeria__fotograma:hover { box-shadow: 0 0 24px color-mix(in srgb, var(--accent-color) 25%, transparent), 0 18px 40px rgba(0, 0, 0, 0.5); }

    .ci-galeria__fotograma img {
      color: transparent;
      display: block;
      width: 100%;
      height: auto;
      aspect-ratio: 16 / 10;
      object-fit: cover;
      filter: sepia(0.24) contrast(1.05);
    }
    .ci-galeria__codigo {
      display: flex;
      justify-content: space-between;
      padding-top: 7px;
      font-family: 'Courier New', monospace;
      font-size: 0.58rem;
      letter-spacing: 0.22em;
      color: var(--secondary-color);
    }
    .ci-galeria__codigo b { color: var(--accent-color); font-weight: 400; }

    .ci-galeria__lightbox {
      position: fixed;
      inset: 0;
      z-index: 9999;
      display: none;
      place-items: center;
      padding: clamp(1rem, 4vw, 3rem);
      background: rgba(0, 0, 0, 0.92);
    }
    .ci-galeria__lightbox.abierto { display: grid; }
    .ci-galeria__lightbox img {
      max-width: min(920px, 92vw);
      max-height: 82svh;
      width: auto;
      height: auto;
      border: 6px solid var(--surface-color);
      box-shadow: 0 30px 80px rgba(0, 0, 0, 0.6);
    }
    .ci-galeria__cerrar {
      position: absolute;
      top: clamp(0.8rem, 2.5vw, 1.6rem);
      right: clamp(0.8rem, 2.5vw, 1.6rem);
      width: 44px;
      height: 44px;
      border: 1px solid var(--accent-color);
      border-radius: 50%;
      background: transparent;
      color: var(--accent-color);
      font-size: 1.2rem;
      line-height: 1;
      cursor: pointer;
      transition: transform 0.4s ease, background 0.4s ease;
    }
    .ci-galeria__cerrar:hover { transform: rotate(90deg); background: color-mix(in srgb, var(--accent-color) 20%, transparent); }

    @media (max-width: 560px) {
      .ci-galeria__contactos { grid-template-columns: repeat(auto-fit, minmax(min(150px, 100%), 1fr)); gap: 0.7rem; }
    }

    @media (prefers-reduced-motion: reduce) {
      .ci-galeria * { transition: none !important; }
      .ci-galeria__fotograma { opacity: 1 !important; transform: none !important; }
    }
  </style>

  <header class="ci-galeria__cabecera" memory_type="text" memory_usage="custom" memory_key="galeria-cabecera">
    <h2 class="ci-galeria__titulo" memory_type="text" memory_usage="custom" memory_key="galeria-titulo">Hoja de contactos</h2>
    <span class="ci-galeria__hoja" memory_type="text" memory_usage="custom" memory_key="galeria-hoja">12 EXP · 35MM</span>
  </header>

  <div class="ci-galeria__contactos">
    <figure class="ci-galeria__fotograma" data-ci-fotograma memory_type="image" memory_usage="custom" memory_source="library" memory_key="galeria-foto-1" tabindex="0" role="button" aria-label="Ampliar fotograma uno">
      <img src="https://loremflickr.com/560/350/indie,couple" alt="Fotograma uno" path="placeholder" data-library-category="bodas" data-asset-type="galeria" loading="lazy" />
      <span class="ci-galeria__codigo"><span>FR-01</span><b>OK</b></span>
      <figcaption hidden>Fotograma uno</figcaption>
    </figure>
    <figure class="ci-galeria__fotograma" data-ci-fotograma memory_type="image" memory_usage="custom" memory_source="library" memory_key="galeria-foto-2" tabindex="0" role="button" aria-label="Ampliar fotograma dos">
      <img src="https://loremflickr.com/560/350/cinema,dinner" alt="Fotograma dos" path="placeholder" data-library-category="bodas" data-asset-type="galeria" loading="lazy" />
      <span class="ci-galeria__codigo"><span>FR-02</span><b>OK</b></span>
      <figcaption hidden>Fotograma dos</figcaption>
    </figure>
    <figure class="ci-galeria__fotograma" data-ci-fotograma memory_type="image" memory_usage="custom" memory_source="library" memory_key="galeria-foto-3" tabindex="0" role="button" aria-label="Ampliar fotograma tres">
      <img src="https://loremflickr.com/560/350/film,party" alt="Fotograma tres" path="placeholder" data-library-category="bodas" data-asset-type="galeria" loading="lazy" />
      <span class="ci-galeria__codigo"><span>FR-03</span><b>OK</b></span>
      <figcaption hidden>Fotograma tres</figcaption>
    </figure>
    <figure class="ci-galeria__fotograma" data-ci-fotograma memory_type="image" memory_usage="custom" memory_source="library" memory_key="galeria-foto-4" tabindex="0" role="button" aria-label="Ampliar fotograma cuatro">
      <img src="https://loremflickr.com/560/350/sepia,dance" alt="Fotograma cuatro" path="placeholder" data-library-category="bodas" data-asset-type="galeria" loading="lazy" />
      <span class="ci-galeria__codigo"><span>FR-04</span><b>OK</b></span>
      <figcaption hidden>Fotograma cuatro</figcaption>
    </figure>
    <figure class="ci-galeria__fotograma" data-ci-fotograma memory_type="image" memory_usage="custom" memory_source="library" memory_key="galeria-foto-5" tabindex="0" role="button" aria-label="Ampliar fotograma cinco">
      <img src="https://loremflickr.com/560/350/indie,flowers" alt="Fotograma cinco" path="placeholder" data-library-category="bodas" data-asset-type="galeria" loading="lazy" />
      <span class="ci-galeria__codigo"><span>FR-05</span><b>OK</b></span>
      <figcaption hidden>Fotograma cinco</figcaption>
    </figure>
    <figure class="ci-galeria__fotograma" data-ci-fotograma memory_type="image" memory_usage="custom" memory_source="library" memory_key="galeria-foto-6" tabindex="0" role="button" aria-label="Ampliar fotograma seis">
      <img src="https://loremflickr.com/560/350/projector,night" alt="Fotograma seis" path="placeholder" data-library-category="bodas" data-asset-type="galeria" loading="lazy" />
      <span class="ci-galeria__codigo"><span>FR-06</span><b>OK</b></span>
      <figcaption hidden>Fotograma seis</figcaption>
    </figure>
  </div>

  <script>
    (function () {
      var root = document.currentScript ? document.currentScript.closest('section') : document.querySelector('.ci-galeria');
      if (!root) return;
      root.classList.add('ci-js');
      window.setTimeout(function () { root.classList.add('esta-visto'); }, 2500); // red de seguridad: nunca dejar contenido oculto

      var fotos = Array.prototype.slice.call(root.querySelectorAll('[data-ci-fotograma]'));
      var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
      if (('IntersectionObserver' in window) && !reduce) {
        var io = new IntersectionObserver(function (entries) {
          entries.forEach(function (entry) {
            if (!entry.isIntersecting) return;
            var i = fotos.indexOf(entry.target);
            entry.target.style.transitionDelay = (Math.min(i, 5) * 0.08).toFixed(2) + 's';
            entry.target.classList.add('esta-visto');
            io.unobserve(entry.target);
          });
        }, { threshold: 0.18 });
        fotos.forEach(function (f) { io.observe(f); });
      } else {
        fotos.forEach(function (f) { f.classList.add('esta-visto'); });
      }

      var lightbox = document.createElement('div');
      lightbox.className = 'ci-galeria__lightbox';
      lightbox.setAttribute('role', 'dialog');
      lightbox.setAttribute('aria-modal', 'true');
      lightbox.setAttribute('aria-label', 'Vista ampliada');
      lightbox.innerHTML =
        '<img alt="" />' +
        '<button type="button" class="ci-galeria__cerrar" aria-label="Cerrar">×</button>';
      root.appendChild(lightbox);
      var imgAmpliada = lightbox.querySelector('img');
      var botonCerrar = lightbox.querySelector('.ci-galeria__cerrar');

      function abrir(fig) {
        var foto = fig.querySelector('img');
        if (!foto) return;
        imgAmpliada.src = foto.src;
        imgAmpliada.alt = foto.alt;
        lightbox.classList.add('abierto');
      }
      function cerrar() { lightbox.classList.remove('abierto'); }

      fotos.forEach(function (fig) {
        fig.addEventListener('click', function () { abrir(fig); });
        fig.addEventListener('keydown', function (e) {
          if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); abrir(fig); }
        });
      });
      botonCerrar.addEventListener('click', cerrar);
      lightbox.addEventListener('click', function (e) { if (e.target === lightbox) cerrar(); });
    })();
  </script>

  <script>
    var moduleMetadata = {
      module_type: 'galeria',
      module_name: 'galeria-cine-contactos',
      style_name: 'Cine Indie — Contactos',

      tipo: 'galeria'
    };
  </script>
</section>
