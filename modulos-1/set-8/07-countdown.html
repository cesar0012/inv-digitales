<section
  class="tc-countdown"
  data-gemini-id="countdown-cantaro-tiempo"
  path="placeholder"
  memory_source="generated"
  memory_type="background"
  memory_usage="protected"
  data-countdown-target="YYYY-MM-DDTHH:MM:SS"
>
  <style>
    .tc-countdown {
      position: relative;
      isolation: isolate;
      overflow: hidden;
      box-sizing: border-box;
      min-height: 640px;
      display: grid;
      place-items: center;
      padding: clamp(3rem, 7vw, 5rem) clamp(1rem, 5vw, 3rem);
      background-color: var(--bg-color, #f6efe6);
      background-image: url('https://loremflickr.com/1600/900/pottery,warm');
      background-size: cover;
      background-position: center;
      color: var(--text-color, #3d2b22);
      text-align: center;
    }
    .tc-countdown *,
    .tc-countdown *::before,
    .tc-countdown *::after { box-sizing: border-box; }

    .tc-countdown::before {
      content: '';
      position: absolute;
      inset: 0;
      z-index: -1;
      background: color-mix(in srgb, var(--bg-color, #f6efe6) 90%, transparent);
    }

    .tc-countdown__etiqueta {
      margin: 0 0 0.55rem;
      font-family: Georgia, 'Times New Roman', serif;
      font-size: clamp(0.6rem, 1.15vw, 0.68rem);
      letter-spacing: 0.44em;
      text-transform: uppercase;
      color: var(--accent-color, #c26a4a);
    }
    .tc-countdown__titulo {
      margin: 0 0 0.4rem;
      font-family: Georgia, 'Times New Roman', serif;
      font-weight: 400;
      font-size: clamp(1.75rem, 4vw, 2.6rem);
      color: var(--primary-color, #3d2b22);
    }
    .tc-countdown__fecha {
      display: block;
      margin-bottom: clamp(1.5rem, 3.6vw, 2.2rem);
      font-family: Georgia, 'Times New Roman', serif;
      font-size: clamp(0.76rem, 1.5vw, 0.88rem);
      letter-spacing: 0.28em;
      text-transform: uppercase;
      color: var(--secondary-color, #8a6f5c);
    }

    .tc-countdown__cantaro {
      position: relative;
      width: clamp(180px, 27vw, 240px);
      margin: 0 auto clamp(1.4rem, 3.4vw, 2rem);
    }
    .tc-countdown__cantaro svg { display: block; width: 100%; height: auto; }
    .tc-countdown__asas { fill: none; stroke: color-mix(in srgb, var(--secondary-color, #8a6f5c) 55%, transparent); stroke-width: 2; }
    .tc-countdown__nivel-fondo { fill: none; stroke: color-mix(in srgb, var(--accent-color, #c26a4a) 28%, transparent); stroke-width: 8; }
    .tc-countdown__nivel {
      fill: none;
      stroke: var(--accent-color, #c26a4a);
      stroke-width: 8;
      stroke-linecap: round;
      transform: rotate(-90deg);
      transform-origin: 110px 110px;
      transition: stroke-dashoffset 0.5s linear;
    }
    .tc-countdown__agua {
      position: absolute;
      inset: 26%;
      display: grid;
      place-items: center;
      border-radius: 50%;
      background: var(--surface-color, #fdf8f1);
      border: 1px solid var(--surface-border-color, rgba(61, 43, 34, 0.18));
      font-family: Georgia, 'Times New Roman', serif;
      font-size: clamp(1.4rem, 3.2vw, 2rem);
      font-variant-numeric: tabular-nums;
      color: var(--primary-color, #3d2b22);
    }

    .tc-countdown__unidades {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: clamp(0.6rem, 1.8vw, 1rem);
      max-width: 600px;
      margin: 0 auto;
    }
    .tc-countdown__unidad {
      padding: clamp(0.9rem, 2.2vw, 1.3rem) 0.3rem;
      background: var(--surface-color, #fdf8f1);
      border: 1px solid var(--surface-border-color, rgba(61, 43, 34, 0.18));
      border-radius: 10px 10px 22px 22px;
    }
    .tc-countdown__numero {
      display: block;
      font-family: Georgia, 'Times New Roman', serif;
      font-size: clamp(1.5rem, 4vw, 2.4rem);
      font-variant-numeric: tabular-nums;
      line-height: 1;
      color: var(--primary-color, #3d2b22);
    }
    .tc-countdown__rotulo {
      display: block;
      margin-top: 0.45rem;
      font-family: Georgia, 'Times New Roman', serif;
      font-size: clamp(0.54rem, 1.05vw, 0.62rem);
      letter-spacing: 0.32em;
      text-transform: uppercase;
      color: var(--secondary-color, #8a6f5c);
    }

    @media (max-width: 560px) {
      .tc-countdown__unidades { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .tc-countdown { min-height: 580px; }
    }

    @media (prefers-reduced-motion: reduce) {
      .tc-countdown__nivel { transition: none; }
    }
  </style>

  <div class="tc-countdown__contenido">
    <p class="tc-countdown__etiqueta" memory_type="text" memory_usage="custom" memory_key="countdown-etiqueta">El cántaro se llena</p>
    <h2 class="tc-countdown__titulo" memory_type="text" memory_usage="custom" memory_key="countdown-titulo">Cuenta regresiva</h2>
    <time class="tc-countdown__fecha" datetime="YYYY-MM-DDTHH:MM:SS" memory_type="text" memory_usage="custom" memory_key="countdown-fecha">Fecha del evento</time>

    <div class="tc-countdown__cantaro" aria-hidden="true">
      <svg viewBox="0 0 220 220">
        <path class="tc-countdown__asas" d="M26 110 C6 110, 6 78, 30 72 M194 110 C214 110, 214 78, 190 72"/>
        <circle class="tc-countdown__nivel-fondo" cx="110" cy="110" r="88" stroke-dasharray="50 50" />
        <circle class="tc-countdown__nivel" data-tc-nivel cx="110" cy="110" r="88" stroke-dasharray="552.9" stroke-dashoffset="0" />
      </svg>
      <div class="tc-countdown__agua" data-tc-segundos>00</div>
    </div>

    <div class="tc-countdown__unidades" aria-label="Cuenta regresiva">
      <div class="tc-countdown__unidad"><span class="tc-countdown__numero" data-countdown-unit="days">--</span><span class="tc-countdown__rotulo">Días</span></div>
      <div class="tc-countdown__unidad"><span class="tc-countdown__numero" data-countdown-unit="hours">--</span><span class="tc-countdown__rotulo">Horas</span></div>
      <div class="tc-countdown__unidad"><span class="tc-countdown__numero" data-countdown-unit="minutes">--</span><span class="tc-countdown__rotulo">Min</span></div>
      <div class="tc-countdown__unidad"><span class="tc-countdown__numero" data-countdown-unit="seconds">--</span><span class="tc-countdown__rotulo">Seg</span></div>
    </div>
  </div>

  <script>
    (function () {
      var el = null;
      try { el = document.currentScript.closest('[data-gemini-id^="countdown"]'); } catch (e) {}
      if (!el) el = document.querySelector('[data-gemini-id^="countdown"]');
      if (!el) return;

      var nivel = el.querySelector('[data-tc-nivel]');
      var agua = el.querySelector('[data-tc-segundos]');
      var LONGITUD = nivel ? 2 * Math.PI * 88 : 0;
      var target = NaN;
      var attr = el.getAttribute('data-countdown-target');
      if (attr && attr.indexOf('YYYY') === -1) { var p = new Date(attr); if (!isNaN(p.getTime())) target = p.getTime(); }
      if (isNaN(target) && window.__countdownTarget) { var p1 = new Date(window.__countdownTarget); if (!isNaN(p1.getTime())) target = p1.getTime(); }
      if (isNaN(target) && window.countdown_target) { var p2 = new Date(window.countdown_target); if (!isNaN(p2.getTime())) target = p2.getTime(); }

      var intervalId = null;
      (window.__countdownIntervals = window.__countdownIntervals || []).forEach(clearInterval);
      window.__countdownIntervals = [];

      function pad2(n) { return n < 10 ? '0' + n : '' + n; }
      function setUnit(unit, value) {
        var node = el.querySelector('[data-countdown-unit="' + unit + '"]');
        if (node) node.textContent = value;
      }
      function tick() {
        if (!Number.isFinite(target)) return;
        var diff = Math.max(target - Date.now(), 0);
        setUnit('days', Math.floor(diff / 86400000));
        setUnit('hours', pad2(Math.floor((diff % 86400000) / 3600000)));
        setUnit('minutes', pad2(Math.floor((diff % 3600000) / 60000)));
        var s = Math.floor((diff % 60000) / 1000);
        setUnit('seconds', pad2(s));
        if (agua) agua.textContent = pad2(s);
        if (nivel) nivel.setAttribute('stroke-dashoffset', (LONGITUD * (1 - s / 60)).toFixed(2));
        if (diff === 0 && intervalId !== null) {
          clearInterval(intervalId);
          intervalId = null;
          window.__countdownIntervals = [];
        }
      }
      function start(newTarget) {
        if (newTarget) { var p = new Date(newTarget); if (!isNaN(p.getTime())) target = p.getTime(); }
        (window.__countdownIntervals || []).forEach(clearInterval);
        window.__countdownIntervals = [];
        intervalId = null;
        if (!Number.isFinite(target)) return;
        tick();
        if (target > Date.now()) {
          intervalId = setInterval(tick, 1000);
          window.__countdownIntervals.push(intervalId);
        }
      }
      start();
      window.updateCountdown = start;
    })();
  </script>

  <script>
    var moduleMetadata = {
      module_type: 'countdown',
      module_name: 'countdown-cantaro-tiempo',
      style_name: 'Cántaro de Tiempo',
      descripcion: 'Cántaro de barro con asas y anillo nivel que se vacía como el agua cada minuto, sobre cuatro tinajas de unidades.',
      tags: ['countdown', 'cuenta regresiva', 'cantaro', 'barro', 'mediterraneo', 'agua'],
      tipo: 'countdown'
    };
  </script>
</section>
