<section
  class="tc-confirmacion"
  data-gemini-id="confirmacion-texto"
  memory_type="background"
  memory_usage="protected"
  memory_source="generated"
  path="placeholder"
>
  <style>
    .tc-confirmacion {
      --primary-color: #3d2b22;
      --secondary-color: #8a6f5c;
      --accent-color: #c26a4a;
      --bg-color: #f6efe6;
      --surface-color: #fdf8f1;
      --surface-border-color: rgba(61, 43, 34, 0.18);
      --text-color: #3d2b22;

      position: relative;
      isolation: isolate;
      overflow: hidden;
      box-sizing: border-box;
      min-height: 72svh;
      display: grid;
      place-items: center;
      padding: clamp(3rem, 8vw, 6rem) clamp(1rem, 5vw, 4rem);
      background-color: var(--bg-color);
      background-image: url('https://loremflickr.com/1600/900/terracotta,pottery');
      background-size: cover;
      background-position: center;
      color: var(--text-color);
      text-align: center;
    }
    .tc-confirmacion *,
    .tc-confirmacion *::before,
    .tc-confirmacion *::after { box-sizing: border-box; }

    .tc-confirmacion::before {
      content: '';
      position: absolute;
      inset: 0;
      z-index: -1;
      background: color-mix(in srgb, var(--bg-color) 89%, transparent);
    }

    .tc-confirmacion__tablero {
      position: relative;
      z-index: 2;
      width: min(100%, 620px);
      padding: clamp(2.3rem, 5.5vw, 3.5rem) clamp(1.4rem, 4.5vw, 3rem);
      background: var(--surface-color);
      border: 1px solid var(--surface-border-color);
      border-radius: clamp(12px, 2vw, 16px);
      box-shadow: 0 26px 56px rgba(61, 43, 34, 0.18);
    }
    .tc-confirmacion__tablero::before {
      content: '';
      position: absolute;
      inset: 8px;
      border: 1px dashed color-mix(in srgb, var(--accent-color) 55%, transparent);
      border-radius: 8px;
      pointer-events: none;
    }

    .tc-confirmacion__sello {
      width: clamp(60px, 9vw, 74px);
      margin: 0 auto clamp(1rem, 2.4vw, 1.4rem);
      color: var(--accent-color);
      animation: tcConfirmacionEstampa 7s ease-in-out infinite;
    }
    @keyframes tcConfirmacionEstampa {
      0%, 100% { transform: rotate(-4deg); }
      50% { transform: rotate(4deg); }
    }

    .tc-confirmacion__etiqueta {
      margin: 0 0 0.7rem;
      font-family: Georgia, 'Times New Roman', serif;
      font-size: clamp(0.6rem, 1.15vw, 0.68rem);
      letter-spacing: 0.4em;
      text-transform: uppercase;
      color: var(--accent-color);
    }
    .tc-confirmacion__titulo {
      margin: 0 0 1rem;
      font-family: Georgia, 'Times New Roman', serif;
      font-weight: 400;
      font-size: clamp(1.65rem, 3.7vw, 2.3rem);
      color: var(--primary-color);
    }
    .tc-confirmacion__texto {
      margin: 0 auto 1.4rem;
      max-width: 46ch;
      font-family: Georgia, 'Times New Roman', serif;
      font-style: italic;
      font-size: clamp(0.88rem, 1.6vw, 1rem);
      line-height: 1.8;
      color: var(--secondary-color);
    }
    .tc-confirmacion__limite {
      display: inline-block;
      padding: 0.6rem 1.5rem;
      background: var(--primary-color);
      color: var(--bg-color);
      border-radius: 999px 999px 4px 4px;
      font-family: Georgia, 'Times New Roman', serif;
      font-size: clamp(0.7rem, 1.35vw, 0.8rem);
      letter-spacing: 0.22em;
      text-transform: uppercase;
    }
    .tc-confirmacion__limite time { color: #f0c9a8; }

    @media (max-width: 560px) {
      .tc-confirmacion { min-height: 62svh; }
      .tc-confirmacion__tablero { padding: 2.2rem 1.2rem; }
    }

    @media (prefers-reduced-motion: reduce) {
      .tc-confirmacion * { animation: none !important; }
    }
  </style>

  <div class="tc-confirmacion__tablero">
    <svg class="tc-confirmacion__sello" viewBox="0 0 80 80" fill="none" aria-hidden="true">
      <circle cx="40" cy="40" r="36" stroke="currentColor" stroke-width="1.8" stroke-dasharray="4 5"/>
      <path d="M40 18 C48 28, 54 32, 54 42 A14 14 0 1 1 26 42 C26 32, 32 28, 40 18 Z" stroke="currentColor" stroke-width="1.4"/>
      <circle cx="40" cy="46" r="5" stroke="currentColor" stroke-width="1.2"/>
    </svg>

    <p class="tc-confirmacion__etiqueta" memory_type="text" memory_usage="custom" memory_key="confirmacion-etiqueta">Confirma tu asistencia</p>
    <h2 class="tc-confirmacion__titulo" memory_type="text" memory_usage="custom" memory_key="confirmacion-titulo">Barro que quiere verte</h2>
    <p class="tc-confirmacion__texto" memory_type="text" memory_usage="custom" memory_key="confirmacion-texto">
      Como el barro que se moldea al fuego, tu confirmación da forma a esta mesa.
      Usa el enlace de tu invitación digital antes de la fecha marcada.
    </p>
    <p class="tc-confirmacion__limite" memory_type="text" memory_usage="custom" memory_key="confirmacion-rotulo">
      Antes del <time datetime="YYYY-MM-DD" memory_type="text" memory_usage="custom" memory_key="confirmacion-fecha">DD de mes</time>
    </p>
  </div>

  <script>
    var moduleMetadata = {
      module_type: 'confirmacion',
      module_name: 'confirmacion-texto',
      style_name: 'Terracota Mediterránea — Confirmación',
      descripcion: 'Tablero con cenefa punteada, sello de cántaro que se estampa suavemente y límite en placa de barro; RSVP informativo.',
      tags: ['confirmacion', 'rsvp', 'barro', 'sello', 'mediterraneo', 'artesanal'],
      tipo: 'confirmacion'
    };
  </script>
</section>
