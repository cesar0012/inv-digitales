<section
  class="tc-padres"
  data-gemini-id="padres-padre"
  memory_type="background"
  memory_usage="protected"
  memory_source="generated"
  path="placeholder"
>
  <style>
    .tc-padres {
      --primary-color: #3d2b22;
      --secondary-color: #8a6f5c;
      --accent-color: #c26a4a;
      --bg-color: #f6efe6;
      --surface-color: #fdf8f1;
      --surface-border-color: rgba(61, 43, 34, 0.18);
      --text-color: #3d2b22;

      position: relative;
      isolation: isolate;
      box-sizing: border-box;
      padding: clamp(3rem, 8vw, 6rem) clamp(1rem, 5vw, 4rem);
      background-color: var(--bg-color);
      background-image: url('https://loremflickr.com/1600/900/clay,texture');
      background-size: cover;
      background-position: center;
      color: var(--text-color);
      text-align: center;
    }
    .tc-padres *,
    .tc-padres *::before,
    .tc-padres *::after { box-sizing: border-box; }

    .tc-padres::before {
      content: '';
      position: absolute;
      inset: 0;
      z-index: -1;
      background: color-mix(in srgb, var(--bg-color) 91%, transparent);
    }

    .tc-padres__titulo {
      margin: 0 0 0.5rem;
      font-family: Georgia, 'Times New Roman', serif;
      font-weight: 400;
      font-size: clamp(1.7rem, 3.8vw, 2.4rem);
      color: var(--primary-color);
    }
    .tc-padres__intro {
      margin: 0 auto clamp(2rem, 5vw, 3rem);
      max-width: 50ch;
      font-family: Georgia, 'Times New Roman', serif;
      font-style: italic;
      font-size: clamp(0.86rem, 1.55vw, 0.96rem);
      line-height: 1.7;
      color: var(--secondary-color);
    }

    .tc-padres__olivos {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: clamp(1.6rem, 4.4vw, 3rem);
      width: min(100%, 860px);
      margin: 0 auto;
    }

    .tc-padres__olivo {
      position: relative;
      padding: clamp(1.8rem, 4vw, 2.6rem) clamp(1.2rem, 3vw, 1.9rem);
      background: var(--surface-color);
      border: 1px solid var(--surface-border-color);
      border-radius: 999px 999px clamp(12px, 2vw, 16px) clamp(12px, 2vw, 16px);
      box-shadow: 0 22px 48px rgba(61, 43, 34, 0.16);
      transition: opacity 0.5s ease, transform 0.5s cubic-bezier(0.22, 0.8, 0.3, 1);
    }
    .tc-padres.tc-js .tc-padres__olivo { opacity: 0; transform: translateY(22px); }
    .tc-padres .tc-padres__olivo.esta-visto { opacity: 1; transform: none; }

    .tc-padres__rama {
      position: absolute;
      top: 12px;
      width: 54px;
      color: var(--secondary-color);
      opacity: 0.75;
    }
    .tc-padres__rama--izq { left: 14px; }
    .tc-padres__rama--der { right: 14px; transform: scaleX(-1); }

    .tc-padres__retrato {
      width: clamp(100px, 14vw, 130px);
      margin: 0 auto 1rem;
      padding: 5px;
      background: var(--bg-color);
      border: 1px solid var(--surface-border-color);
      border-radius: 999px 999px 0 0;
      overflow: hidden;
    }
    .tc-padres__retrato img {
      color: transparent;
      display: block;
      width: 100%;
      height: auto;
      aspect-ratio: 1 / 1;
      object-fit: cover;
      border-radius: 999px 999px 0 0;
      filter: saturate(0.92);
    }

    .tc-padres__rol {
      margin: 0 0 0.35rem;
      font-family: Georgia, 'Times New Roman', serif;
      font-size: clamp(0.58rem, 1.1vw, 0.66rem);
      letter-spacing: 0.38em;
      text-transform: uppercase;
      color: var(--accent-color);
    }
    .tc-padres__nombres {
      margin: 0;
      font-family: Georgia, 'Times New Roman', serif;
      font-size: clamp(1.04rem, 2.1vw, 1.3rem);
      line-height: 1.3;
      color: var(--primary-color);
    }
    .tc-padres__subrayado {
      width: 70px;
      height: 10px;
      margin: 0.7rem auto 0;
      color: var(--accent-color);
    }
    .tc-padres__subrayado path {
      fill: none;
      stroke: currentColor;
      stroke-width: 2.2;
      stroke-linecap: round;
    }

    @media (max-width: 740px) {
      .tc-padres__olivos { grid-template-columns: 1fr; max-width: 390px; }
    }

    @media (prefers-reduced-motion: reduce) {
      .tc-padres * { transition: none !important; }
      .tc-padres__olivo { opacity: 1 !important; transform: none !important; }
    }
  </style>

  <header memory_type="text" memory_usage="custom" memory_key="padres-intro">
    <h2 class="tc-padres__titulo" memory_type="text" memory_usage="custom" memory_key="padres-titulo">Raíces de olivo</h2>
    <p class="tc-padres__intro" memory_type="text" memory_usage="custom" memory_key="padres-texto">Dos árboles añosos cuyas raíces se entrelazan bajo esta celebración.</p>
  </header>

  <div class="tc-padres__olivos">
    <article class="tc-padres__olivo" data-tc-olivo>
      <svg class="tc-padres__rama tc-padres__rama--izq" viewBox="0 0 54 40" fill="none" aria-hidden="true">
        <path d="M4 34 C 16 24, 30 16, 50 8" stroke="currentColor" stroke-width="1.4"/>
        <ellipse cx="18" cy="24" rx="4" ry="2.4" transform="rotate(-30 18 24)" fill="currentColor"/>
        <ellipse cx="32" cy="17" rx="4" ry="2.4" transform="rotate(-30 32 17)" fill="currentColor"/>
        <circle cx="44" cy="11" r="3" fill="currentColor"/>
      </svg>
      <figure class="tc-padres__retrato" memory_type="image" memory_usage="custom" memory_source="library" memory_key="padres-retrato-uno">
        <img src="https://loremflickr.com/380/380/family,sunset" alt="Retrato de la familia de la novia" path="placeholder" data-library-category="bodas" data-asset-type="retrato-familia" loading="lazy" />
        <figcaption hidden>Familia uno</figcaption>
      </figure>
      <div memory_type="text" memory_usage="custom" memory_key="padres-bloque-uno">
        <p class="tc-padres__rol">Padres de la novia</p>
        <h3 class="tc-padres__nombres">Nombre Papá &amp; Nombre Mamá</h3>
        <svg class="tc-padres__subrayado" viewBox="0 0 70 10" aria-hidden="true">
          <path d="M3 6 C 16 1, 30 9, 44 4 S 62 3, 67 6" />
        </svg>
      </div>
    </article>

    <article class="tc-padres__olivo" data-tc-olivo>
      <svg class="tc-padres__rama tc-padres__rama--der" viewBox="0 0 54 40" fill="none" aria-hidden="true">
        <path d="M4 34 C 16 24, 30 16, 50 8" stroke="currentColor" stroke-width="1.4"/>
        <ellipse cx="18" cy="24" rx="4" ry="2.4" transform="rotate(-30 18 24)" fill="currentColor"/>
        <ellipse cx="32" cy="17" rx="4" ry="2.4" transform="rotate(-30 32 17)" fill="currentColor"/>
        <circle cx="44" cy="11" r="3" fill="currentColor"/>
      </svg>
      <figure class="tc-padres__retrato" memory_type="image" memory_usage="custom" memory_source="library" memory_key="padres-retrato-dos">
        <img src="https://loremflickr.com/380/380/parents,field" alt="Retrato de la familia del novio" path="placeholder" data-library-category="bodas" data-asset-type="retrato-familia" loading="lazy" />
        <figcaption hidden>Familia dos</figcaption>
      </figure>
      <div memory_type="text" memory_usage="custom" memory_key="padres-bloque-dos">
        <p class="tc-padres__rol">Padres del novio</p>
        <h3 class="tc-padres__nombres">Nombre Papá &amp; Nombre Mamá</h3>
        <svg class="tc-padres__subrayado" viewBox="0 0 70 10" aria-hidden="true">
          <path d="M3 6 C 16 1, 30 9, 44 4 S 62 3, 67 6" />
        </svg>
      </div>
    </article>
  </div>

  <script>
    (function () {
      var root = document.currentScript ? document.currentScript.closest('section') : document.querySelector('.tc-padres');
      if (!root) return;
      root.classList.add('tc-js');
      window.setTimeout(function () { root.classList.add('esta-visto'); }, 2500); // red de seguridad: nunca dejar contenido oculto
      var olivos = Array.prototype.slice.call(root.querySelectorAll('[data-tc-olivo]'));
      var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
      if (reduce || !('IntersectionObserver' in window)) {
        olivos.forEach(function (o) { o.classList.add('esta-visto'); });
        return;
      }
      var io = new IntersectionObserver(function (entries) {
        entries.forEach(function (entry) {
          if (!entry.isIntersecting) return;
          var i = olivos.indexOf(entry.target);
          entry.target.style.transitionDelay = (Math.max(i, 0) * 0.15).toFixed(2) + 's';
          entry.target.classList.add('esta-visto');
          io.unobserve(entry.target);
        });
      }, { threshold: 0.25 });
      olivos.forEach(function (o) { io.observe(o); });
    })();
  </script>

  <script>
    var moduleMetadata = {

      tags: ['padres', 'familias', 'mediterraneo', 'olivo', 'arco', 'artesanal'],
      tipo: 'padres'
    };
  </script>
</section>
