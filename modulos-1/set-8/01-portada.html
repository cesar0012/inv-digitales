<section
  class="tc-portada"
  data-gemini-id="portada-nombre"
  memory_type="background"
  memory_usage="protected"
  memory_source="generated"
  path="placeholder"
  aria-labelledby="tc-portada-titulo"
>
  <style>
    .tc-portada {
      --primary-color: #3d2b22;
      --secondary-color: #8a6f5c;
      --accent-color: #c26a4a;
      --bg-color: #f6efe6;
      --surface-color: #fdf8f1;
      --surface-border-color: rgba(61, 43, 34, 0.18);
      --text-color: #3d2b22;

      position: relative;
      isolation: isolate;
      overflow: hidden;
      box-sizing: border-box;
      min-height: 100svh;
      display: grid;
      place-items: center;
      padding: clamp(2.5rem, 6vw, 5rem) clamp(1rem, 5vw, 4rem) clamp(4rem, 8vw, 6rem);
      background-color: var(--bg-color);
      background-image: url('https://loremflickr.com/1600/900/terracotta,wall');
      background-size: cover;
      background-position: center;
      color: var(--text-color);
      text-align: center;
    }
    .tc-portada *,
    .tc-portada *::before,
    .tc-portada *::after { box-sizing: border-box; }

    .tc-portada::before {
      content: '';
      position: absolute;
      inset: 0;
      z-index: -1;
      background: color-mix(in srgb, var(--bg-color) 90%, transparent);
    }

    .tc-portada__arco {
      position: relative;
      z-index: 2;
      width: min(100%, 640px);
      min-height: min(72svh, 560px);
      padding: clamp(2.6rem, 6vw, 4rem) clamp(1.4rem, 5vw, 3rem) clamp(2.4rem, 5vw, 3.4rem);
      display: grid;
      align-content: center;
      justify-items: center;
      background: var(--surface-color);
      border: 1px solid var(--surface-border-color);
      border-radius: 999px 999px clamp(14px, 2vw, 20px) clamp(14px, 2vw, 20px);
      box-shadow: 0 30px 66px rgba(61, 43, 34, 0.2);
    }
    .tc-portada__arco::before {
      content: '';
      position: absolute;
      inset: 9px;
      border: 1px dashed color-mix(in srgb, var(--accent-color) 55%, transparent);
      border-radius: 999px 999px 14px 14px;
      pointer-events: none;
    }

    .tc-portada__sol {
      width: clamp(58px, 9vw, 76px);
      margin-bottom: clamp(1rem, 2.5vw, 1.5rem);
      color: var(--accent-color);
      animation: tcPortadaGiro 40s linear infinite;
    }
    @keyframes tcPortadaGiro { to { transform: rotate(360deg); } }

    .tc-portada__eyebrow {
      margin: 0 0 1rem;
      font-family: Georgia, 'Times New Roman', serif;
      font-size: clamp(0.64rem, 1.2vw, 0.74rem);
      letter-spacing: 0.4em;
      text-transform: uppercase;
      color: var(--secondary-color);
    }

    .tc-portada__titulo {
      margin: 0;
      font-family: Georgia, 'Times New Roman', serif;
      font-weight: 400;
      font-size: clamp(2rem, 6vw, 4.1rem);
      line-height: 1.07;
      color: var(--primary-color);
    }
    .tc-portada__titulo span {
      display: inline-block;
      transition: opacity 0.5s ease, transform 0.5s cubic-bezier(0.22, 0.8, 0.3, 1);
    }
    .tc-portada.tc-js .tc-portada__titulo span { opacity: 0; transform: translateY(0.5em) scale(0.94); }
    .tc-portada.esta-visto .tc-portada__titulo span { opacity: 1; transform: none; }
    .tc-portada.esta-visto .tc-portada__titulo span:nth-child(1) { transition-delay: 0.08s; }
    .tc-portada.esta-visto .tc-portada__titulo span:nth-child(2) { transition-delay: 0.18s; }
    .tc-portada.esta-visto .tc-portada__titulo span:nth-child(3) { transition-delay: 0.28s; }

    .tc-portada__ampersand {
      display: block;
      margin: 0.12em 0;
      font-style: italic;
      color: var(--accent-color);
    }

    .tc-portada__garabato {
      width: clamp(150px, 34vw, 220px);
      margin: clamp(1rem, 2.6vw, 1.5rem) 0;
      color: var(--accent-color);
    }
    .tc-portada__garabato path {
      fill: none;
      stroke: currentColor;
      stroke-width: 2;
      stroke-linecap: round;
      stroke-dasharray: 320;
      stroke-dashoffset: 320;
      transition: stroke-dashoffset 0.5s ease 0.35s;
    }
    .tc-portada.esta-visto .tc-portada__garabato path { stroke-dashoffset: 0; }

    .tc-portada__fecha {
      display: inline-block;
      padding: 0.55rem 1.6rem;
      border: 1px solid var(--surface-border-color);
      border-radius: 999px;
      background: var(--bg-color);
      font-family: Georgia, 'Times New Roman', serif;
      font-size: clamp(0.72rem, 1.4vw, 0.86rem);
      letter-spacing: 0.3em;
      text-transform: uppercase;
      color: var(--primary-color);
    }

    .tc-portada__foto {
      position: absolute;
      z-index: 3;
      bottom: clamp(-1.4rem, -0.4vw, 0rem);
      left: clamp(0.4rem, 3vw, 2rem);
      width: clamp(110px, 15vw, 158px);
      margin: 0;
      padding: 7px 7px 16px;
      background: var(--surface-color);
      border: 1px solid var(--surface-border-color);
      border-radius: 12px;
      box-shadow: 0 18px 40px rgba(61, 43, 34, 0.24);
      transform: rotate(-5deg);
      transition: transform 0.5s ease;
    }
    .tc-portada__foto:hover { transform: rotate(-1deg) translateY(-4px); }
    .tc-portada__foto img {
      color: transparent;
      display: block;
      width: 100%;
      height: auto;
      aspect-ratio: 4 / 5;
      object-fit: cover;
      border-radius: 999px 999px 8px 8px;
      filter: saturate(0.95);
    }

    @media (max-width: 640px) {
      .tc-portada__foto { position: static; margin: 1.6rem auto 0; transform: rotate(-2deg); }
      .tc-portada__arco { min-height: 0; }
    }

    @media (prefers-reduced-motion: reduce) {
      .tc-portada * { animation: none !important; transition: none !important; }
      .tc-portada__titulo span { opacity: 1; transform: none; }
      .tc-portada__garabato path { stroke-dashoffset: 0; }
    }
  </style>

  <div class="tc-portada__arco">
    <svg class="tc-portada__sol" viewBox="0 0 80 80" fill="none" aria-hidden="true">
      <circle cx="40" cy="40" r="16" stroke="currentColor" stroke-width="1.6"/>
      <g stroke="currentColor" stroke-width="1.4" stroke-linecap="round">
        <path d="M40 6 V16 M40 64 V74 M6 40 H16 M64 40 H74 M16 16 L23 23 M57 57 L64 64 M64 16 L57 23 M23 57 L16 64"/>
      </g>
    </svg>

    <p class="tc-portada__eyebrow" memory_type="text" memory_usage="custom" memory_key="portada-encabezado">Hecho a mano, hecho con cal</p>

    <div memory_type="text" memory_usage="custom" memory_key="portada-nombres">
      <h1 id="tc-portada-titulo" class="tc-portada__titulo">
        <span>Nombre de la Novia</span>
        <span class="tc-portada__ampersand">&amp;</span>
        <span>Nombre del Novio</span>
      </h1>
    </div>

    <svg class="tc-portada__garabato" viewBox="0 0 220 30" aria-hidden="true">
      <path d="M6 15 C 30 2, 46 28, 70 15 S 110 2, 134 15 S 174 28, 198 15 L 214 15" />
    </svg>

    <time class="tc-portada__fecha" datetime="YYYY-MM-DD" memory_type="text" memory_usage="custom" memory_key="portada-fecha">Fecha del evento</time>
  </div>

  <figure class="tc-portada__foto" memory_type="image" memory_usage="custom" memory_source="library" memory_key="portada-foto">
    <img src="https://loremflickr.com/420/520/couple,sunset" alt="Retrato de los anfitriones" path="placeholder" data-library-category="bodas" data-asset-type="foto-pareja" loading="lazy" />
    <figcaption hidden>Retrato principal</figcaption>
  </figure>

  <script>
    (function () {
      var root = document.currentScript ? document.currentScript.closest('section') : document.querySelector('.tc-portada');
      if (!root) return;
      root.classList.add('tc-js');
      window.setTimeout(function () { root.classList.add('esta-visto'); }, 2500); // red de seguridad: nunca dejar contenido oculto
      var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
      if (reduce || !('IntersectionObserver' in window)) { root.classList.add('esta-visto'); return; }
      var io = new IntersectionObserver(function (entries) {
        entries.forEach(function (entry) {
          if (entry.isIntersecting) { root.classList.add('esta-visto'); io.disconnect(); }
        });
      }, { threshold: 0.22 });
      io.observe(root);
    })();
  </script>

  <script>
    var moduleMetadata = {
      module_type: 'portada',

      style_name: 'Terracota Mediterránea',

      tags: ['portada', 'hero', 'mediterraneo', 'terracota', 'arco', 'artesanal', 'garabato'],
      tipo: 'portada'
    };
  </script>
</section>
