      .tc-regalos__via { grid-column: 2; }
    }

    @media (prefers-reduced-motion: reduce) {

  <script>
    (function () {
      var root = document.currentScript ? document.currentScript.closest('section') : document.querySelector('.tc-regalos');
      if (!root) return;
      root.classList.add('tc-js');
      window.setTimeout(function () { root.classList.add('esta-visto'); }, 2500); // red de seguridad: nunca dejar contenido oculto

      var filas = Array.prototype.slice.call(root.querySelectorAll('[data-tc-fila]'));
      var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
      if (('IntersectionObserver' in window) && !reduce) {
        var io = new IntersectionObserver(function (entries) {
          entries.forEach(function (entry) {
            if (!entry.isIntersecting) return;
            filas.forEach(function (fila, i) { fila.style.transitionDelay = (i * 0.11).toFixed(2) + 's'; });
            filas.forEach(function (fila) { fila.classList.add('esta-visto'); });
            io.disconnect();
          });
        }, { threshold: 0.3 });
        io.observe(root.querySelector('[data-tc-lista]') || root);
      } else {
        filas.forEach(function (fila) { fila.classList.add('esta-visto'); });
      }

      var boton = root.querySelector('[data-tc-boton]');
      var texto = root.querySelector('[data-tc-boton-texto]');
      if (boton && texto) {
        boton.addEventListener('click', function () {
          var listo = boton.classList.toggle('esta-listo');
          texto.textContent = listo ? 'Regalo agendado' : 'Agendar regalo';
        });
      }
    })();
  </script>
