<section
  class="tc-vestimenta"
  data-gemini-id="vestimenta-glaze-tonos"
  memory_type="background"
  memory_usage="protected"
  memory_source="generated"
  path="placeholder"
>
  <style>
    .tc-vestimenta {
      --primary-color: #3d2b22;
      --secondary-color: #8a6f5c;
      --accent-color: #c26a4a;
      --bg-color: #f6efe6;
      --surface-color: #fdf8f1;
      --surface-border-color: rgba(61, 43, 34, 0.18);
      --text-color: #3d2b22;

      position: relative;
      isolation: isolate;
      box-sizing: border-box;
      min-height: 64svh;
      display: grid;
      place-items: center;
      padding: clamp(3rem, 8vw, 6rem) clamp(1rem, 5vw, 4rem);
      background-color: var(--bg-color);
      background-image: url('https://loremflickr.com/1600/900/ceramic,glaze');
      background-size: cover;
      background-position: center;
      color: var(--text-color);
      text-align: center;
    }
    .tc-vestimenta *,
    .tc-vestimenta *::before,
    .tc-vestimenta *::after { box-sizing: border-box; }

    .tc-vestimenta::before {
      content: '';
      position: absolute;
      inset: 0;
      z-index: -1;
      background: color-mix(in srgb, var(--bg-color) 89%, transparent);
    }

    .tc-vestimenta__panel {
      width: min(100%, 660px);
      padding: clamp(2rem, 5vw, 3.2rem) clamp(1.4rem, 4.5vw, 3rem);
      background: var(--surface-color);
      border: 1px solid var(--surface-border-color);
      border-radius: 14px;
      box-shadow: 0 26px 56px rgba(61, 43, 34, 0.18);
    }

    .tc-vestimenta__etiqueta {
      margin: 0 0 0.6rem;
      font-family: Georgia, 'Times New Roman', serif;
      font-size: clamp(0.6rem, 1.15vw, 0.68rem);
      letter-spacing: 0.4em;
      text-transform: uppercase;
      color: var(--accent-color);
    }
    .tc-vestimenta__titulo {
      margin: 0 0 0.8rem;
      font-family: Georgia, 'Times New Roman', serif;
      font-weight: 400;
      font-size: clamp(1.7rem, 3.8vw, 2.3rem);
      color: var(--primary-color);
    }
    .tc-vestimenta__texto {
      margin: 0 auto 1.8rem;
      max-width: 46ch;
      font-family: Georgia, 'Times New Roman', serif;
      font-style: italic;
      font-size: clamp(0.86rem, 1.55vw, 0.96rem);
      line-height: 1.75;
      color: var(--secondary-color);
    }

    .tc-vestimenta__esmaltes {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: clamp(0.8rem, 2.2vw, 1.3rem);
      margin-bottom: 1.6rem;
    }
    .tc-vestimenta__barniz {
      display: grid;
      justify-items: center;
      gap: 0.45rem;
      transition: opacity 0.5s ease, transform 0.5s cubic-bezier(0.22, 0.8, 0.3, 1);
    }
    .tc-vestimenta.tc-js .tc-vestimenta__barniz { opacity: 0; transform: translateY(16px) scale(0.85); }
    .tc-vestimenta .tc-vestimenta__barniz.esta-visto { opacity: 1; transform: none; }
    .tc-vestimenta__azulejo {
      position: relative;
      width: clamp(44px, 7.5vw, 56px);
      height: clamp(44px, 7.5vw, 56px);
      border-radius: 8px 8px 18px 8px;
      border: 1px solid var(--surface-border-color);
      background: var(--bg-color);
      box-shadow:
        inset 3px 3px 6px rgba(255, 255, 255, 0.55),
        inset -3px -3px 6px rgba(61, 43, 34, 0.14),
        0 10px 20px rgba(61, 43, 34, 0.16);
      transition: background-color 0.5s ease, transform 0.5s ease;
    }
    .tc-vestimenta__azulejo::after {
      content: '';
      position: absolute;
      top: 12%;
      left: 12%;
      width: 26%;
      height: 26%;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.55);
      filter: blur(1px);
    }
    .tc-vestimenta__barniz:hover .tc-vestimenta__azulejo { transform: translateY(-4px) rotate(-3deg); }

    .tc-vestimenta__leyenda {
      display: inline-block;
      padding: 0.55rem 1.5rem;
      border: 1px dashed var(--accent-color);
      border-radius: 999px;
      font-family: Georgia, 'Times New Roman', serif;
      font-size: clamp(0.62rem, 1.2vw, 0.7rem);
      letter-spacing: 0.3em;
      text-transform: uppercase;
      color: var(--primary-color);
    }

    @media (max-width: 480px) {
      .tc-vestimenta__azulejo { width: 40px; height: 40px; }
    }

    @media (prefers-reduced-motion: reduce) {
      .tc-vestimenta * { transition: none !important; }
      .tc-vestimenta__barniz { opacity: 1 !important; transform: none !important; }
    }
  </style>

  <div class="tc-vestimenta__panel">
    <p class="tc-vestimenta__etiqueta" memory_type="text" memory_usage="custom" memory_key="vestimenta-etiqueta">Código de vestimenta</p>
    <h2 class="tc-vestimenta__titulo" memory_type="text" memory_usage="custom" memory_key="vestimenta-titulo">Esmaltes de temporada</h2>
    <p class="tc-vestimenta__texto" memory_type="text" memory_usage="custom" memory_key="vestimenta-texto">
      Tonos de bizcocho y esmalte para inspirar tu atuendo; que la tierra te siente bien.
    </p>

    <div class="tc-vestimenta__esmaltes" data-tc-esmaltes aria-hidden="true"></div>

    <p class="tc-vestimenta__leyenda" memory_type="text" memory_usage="custom" memory_key="vestimenta-leyenda">Formal · tonos de tierra</p>
  </div>

  <script>
    (function () {
      var root = document.currentScript ? document.currentScript.closest('section') : document.querySelector('.tc-vestimenta');
      if (!root) return;
      root.classList.add('tc-js');
      window.setTimeout(function () { root.classList.add('esta-visto'); }, 2500); // red de seguridad: nunca dejar contenido oculto

      var esmaltes = root.querySelector('[data-tc-esmaltes]');
      if (esmaltes && !esmaltes.children.length) {
        var tonos = ['#c26a4a', '#a4462e', '#d9a566', '#7c8a5a', '#8a6f5c', '#e0c9a8'];
        for (var i = 0; i < tonos.length; i++) {
          var barniz = document.createElement('span');
          barniz.className = 'tc-vestimenta__barniz';
          barniz.style.transitionDelay = (i * 0.08).toFixed(2) + 's, ' + (i * 0.08).toFixed(2) + 's';
          var azulejo = document.createElement('span');
          azulejo.className = 'tc-vestimenta__azulejo';
          azulejo.setAttribute('data-tc-tono', tonos[i]);
          barniz.appendChild(azulejo);
          esmaltes.appendChild(barniz);
        }
      }

      var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
      function colorear() {
        root.querySelectorAll('[data-tc-tono]').forEach(function (a) {
          a.style.backgroundColor = a.getAttribute('data-tc-tono');
        });
      }
      if (reduce || !('IntersectionObserver' in window)) {
        root.querySelectorAll('.tc-vestimenta__barniz').forEach(function (b) { b.classList.add('esta-visto'); });
        colorear();
        return;
      }
      var io = new IntersectionObserver(function (entries) {
        entries.forEach(function (entry) {
          if (!entry.isIntersecting) return;
          root.querySelectorAll('.tc-vestimenta__barniz').forEach(function (b, i) {
            b.style.transitionDelay = (i * 0.08).toFixed(2) + 's, ' + (i * 0.08).toFixed(2) + 's';
            b.classList.add('esta-visto');
          });
          setTimeout(colorear, 240);
          io.disconnect();
        });
      }, { threshold: 0.3 });
      io.observe(root);
    })();
  </script>

  <script>
    var moduleMetadata = {
      module_type: 'vestimenta',
      module_name: 'vestimenta-glaze-tonos',
      style_name: 'Terracota Mediterránea — Vestimenta',
      descripcion: 'Azulejos de esmalte con brillo cocido que brotan escalonados y se colorean por JS; leyenda en sello punteado.',
      tags: ['vestimenta', 'dress code', 'azulejos', 'esmalte', 'paleta', 'terracota'],
      tipo: 'vestimenta'
    };
  </script>
</section>
