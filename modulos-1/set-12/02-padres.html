<section
  class="fe-padres"
  data-gemini-id="padres-padre"
  memory_type="background"
  memory_usage="protected"
  memory_source="generated"
  path="placeholder"
>
  <style>
    .fe-padres {
      --primary-color: #f5e9d7;
      --secondary-color: #b39a7d;
      --accent-color: #ffb347;
      --bg-color: #1a1410;
      --surface-color: #241c15;
      --surface-border-color: rgba(245, 233, 215, 0.16);
      --text-color: #f5e9d7;

      position: relative;
      isolation: isolate;
      box-sizing: border-box;
      padding: clamp(3.4rem, 8vw, 6rem) clamp(1rem, 5vw, 4rem) clamp(3rem, 8vw, 6rem);
      background-color: var(--bg-color);
      background-image: url('https://loremflickr.com/1600/900/tent,night');
      background-size: cover;
      background-position: center;
      color: var(--text-color);
      text-align: center;
    }
    .fe-padres *,
    .fe-padres *::before,
    .fe-padres *::after { box-sizing: border-box; }

    .fe-padres::before {
      content: '';
      position: absolute;
      inset: 0;
      z-index: -1;
      background: color-mix(in srgb, var(--bg-color) 90%, transparent);
    }

    .fe-padres__titulo {
      margin: 0 0 0.5rem;
      font-family: Georgia, 'Times New Roman', serif;
      font-weight: 400;
      font-size: clamp(1.7rem, 3.8vw, 2.4rem);
      color: var(--primary-color);
    }
    .fe-padres__intro {
      margin: 0 auto clamp(2rem, 5vw, 3rem);
      max-width: 50ch;
      font-family: Arial, Helvetica, sans-serif;
      font-size: clamp(0.84rem, 1.5vw, 0.94rem);
      line-height: 1.7;
      color: var(--secondary-color);
    }

    .fe-padres__casetas {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: clamp(1.4rem, 4vw, 2.6rem);
      width: min(100%, 860px);
      margin: 0 auto;
    }

    .fe-padres__caseta {
      position: relative;
      padding: clamp(1.8rem, 4vw, 2.6rem) clamp(1.2rem, 3vw, 1.9rem);
      background: var(--surface-color);
      border: 1px solid var(--surface-border-color);
      border-radius: 14px;
      box-shadow: 0 24px 50px rgba(0, 0, 0, 0.5);
      transition: opacity 0.5s ease, transform 0.5s cubic-bezier(0.22, 0.8, 0.3, 1);
    }
    .fe-padres.fe-js .fe-padres__caseta { opacity: 0; transform: translateY(20px); }
    .fe-padres .fe-padres__caseta.esta-visto { opacity: 1; transform: none; }

    .fe-padres__toldo {
      position: absolute;
      top: -2px;
      left: -2px;
      right: -2px;
      height: 18px;
      border-radius: 14px 14px 0 0;
      background:
        radial-gradient(circle at 18px -6px, transparent 24px, var(--accent-color) 24px 30px, transparent 31px) 0 0 / 36px 18px repeat-x,
        var(--surface-color);
      pointer-events: none;
    }

    .fe-padres__retrato {
      width: clamp(100px, 14vw, 128px);
      margin: 0 auto 1rem;
      padding: 5px;
      border: 1px dashed var(--accent-color);
      border-radius: 50%;
      background: var(--bg-color);
    }
    .fe-padres__retrato img {
      color: transparent;
      display: block;
      width: 100%;
      height: auto;
      aspect-ratio: 1 / 1;
      border-radius: 50%;
      object-fit: cover;
      filter: saturate(1.03);
    }

    .fe-padres__rol {
      margin: 0 0 0.35rem;
      font-family: 'Courier New', monospace;
      font-size: clamp(0.56rem, 1.05vw, 0.64rem);
      letter-spacing: 0.38em;
      text-transform: uppercase;
      color: var(--accent-color);
    }
    .fe-padres__nombres {
      margin: 0;
      font-family: Georgia, 'Times New Roman', serif;
      font-size: clamp(1.02rem, 2.05vw, 1.28rem);
      line-height: 1.3;
      color: var(--primary-color);
    }

    @media (max-width: 740px) {
      .fe-padres__casetas { grid-template-columns: 1fr; max-width: 390px; }
    }

    @media (prefers-reduced-motion: reduce) {
      .fe-padres * { transition: none !important; }
      .fe-padres__caseta { opacity: 1 !important; transform: none !important; }
    }
  </style>

  <header memory_type="text" memory_usage="custom" memory_key="padres-intro">
    <h2 class="fe-padres__titulo" memory_type="text" memory_usage="custom" memory_key="padres-titulo">Casetas de origen</h2>
    <p class="fe-padres__intro" memory_type="text" memory_usage="custom" memory_key="padres-texto">Las dos casetas que prendieron la primera luz de esta feria.</p>
  </header>

  <div class="fe-padres__casetas">
    <article class="fe-padres__caseta" data-fe-caseta>
      <span class="fe-padres__toldo" aria-hidden="true"></span>
      <figure class="fe-padres__retrato" memory_type="image" memory_usage="custom" memory_source="library" memory_key="padres-retrato-uno">
        <img src="https://loremflickr.com/380/380/family,fair" alt="Retrato de la familia de la novia" path="placeholder" data-library-category="bodas" data-asset-type="retrato-familia" loading="lazy" />
        <figcaption hidden>Familia uno</figcaption>
      </figure>
      <div memory_type="text" memory_usage="custom" memory_key="padres-bloque-uno">
        <p class="fe-padres__rol">Padres de la novia</p>
        <h3 class="fe-padres__nombres">Nombre Papá &amp; Nombre Mamá</h3>
      </div>
    </article>

    <article class="fe-padres__caseta" data-fe-caseta>
      <span class="fe-padres__toldo" aria-hidden="true"></span>
      <figure class="fe-padres__retrato" memory_type="image" memory_usage="custom" memory_source="library" memory_key="padres-retrato-dos">
        <img src="https://loremflickr.com/380/380/parents,lights" alt="Retrato de la familia del novio" path="placeholder" data-library-category="bodas" data-asset-type="retrato-familia" loading="lazy" />
        <figcaption hidden>Familia dos</figcaption>
      </figure>
      <div memory_type="text" memory_usage="custom" memory_key="padres-bloque-dos">
        <p class="fe-padres__rol">Padres del novio</p>
        <h3 class="fe-padres__nombres">Nombre Papá &amp; Nombre Mamá</h3>
      </div>
    </article>
  </div>

  <script>
    (function () {
      var root = document.currentScript ? document.currentScript.closest('section') : document.querySelector('.fe-padres');
      if (!root) return;
      root.classList.add('fe-js');
      window.setTimeout(function () { root.classList.add('esta-visto'); }, 2500); // red de seguridad: nunca dejar contenido oculto
      var casetas = Array.prototype.slice.call(root.querySelectorAll('[data-fe-caseta]'));
      var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
      if (reduce || !('IntersectionObserver' in window)) {
        casetas.forEach(function (c) { c.classList.add('esta-visto'); });
        return;
      }
      var io = new IntersectionObserver(function (entries) {
        entries.forEach(function (entry) {
          if (!entry.isIntersecting) return;
          var i = casetas.indexOf(entry.target);
          entry.target.style.transitionDelay = (Math.max(i, 0) * 0.15).toFixed(2) + 's';
          entry.target.classList.add('esta-visto');
          io.unobserve(entry.target);
        });
      }, { threshold: 0.25 });
      casetas.forEach(function (c) { io.observe(c); });
    })();
  </script>

  <script>
    var moduleMetadata = {
      module_type: 'padres',
      module_name: 'padres-padre',
      style_name: 'Feria Nocturna — Padres',
      descripcion: 'Casetas con toldo festoneado de acento, retratos circulares punteados y ascenso escalonado; feria nocturna.',
      tags: ['padres', 'familias', 'feria', 'caseta', 'toldo', 'nocturno'],
      tipo: 'padres'
    };
  </script>
</section>
