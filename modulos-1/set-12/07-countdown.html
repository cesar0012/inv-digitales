<section
  class="fe-countdown"
  data-gemini-id="countdown-marquesina-feria"
  path="placeholder"
  memory_source="generated"
  memory_type="background"
  memory_usage="protected"
  data-countdown-target="YYYY-MM-DDTHH:MM:SS"
>
  <style>
    .fe-countdown {
      position: relative;
      isolation: isolate;
      overflow: hidden;
      box-sizing: border-box;
      min-height: 680px;
      display: grid;
      place-items: center;
      padding: clamp(3rem, 7vw, 5rem) clamp(1rem, 5vw, 3rem);
      background-color: var(--bg-color, #1a1410);
      background-image: url('https://loremflickr.com/1600/900/carnival,night');
      background-size: cover;
      background-position: center;
      color: var(--text-color, #f5e9d7);
      text-align: center;
    }
    .fe-countdown *,
    .fe-countdown *::before,
    .fe-countdown *::after { box-sizing: border-box; }

    .fe-countdown::before {
      content: '';
      position: absolute;
      inset: 0;
      z-index: -1;
      background: color-mix(in srgb, var(--bg-color, #1a1410) 89%, transparent);
    }

    .fe-countdown__marquesina {
      width: min(100%, 720px);
      padding: clamp(2rem, 5vw, 3.2rem) clamp(1.4rem, 4.5vw, 3rem);
      background: var(--surface-color, #241c15);
      border: 3px solid var(--secondary-color, #b39a7d);
      border-radius: 18px;
      box-shadow: 0 0 44px color-mix(in srgb, var(--accent-color, #ffb347) 20%, transparent), inset 0 0 0 6px var(--bg-color, #1a1410), inset 0 0 0 7.5px var(--surface-border-color, rgba(245, 233, 215, 0.16));
      position: relative;
    }

    .fe-countdown__bombillas-marco {
      position: absolute;
      inset: 14px;
      pointer-events: none;
    }
    .fe-countdown__bmb {
      position: absolute;
      width: 9px;
      height: 9px;
      border-radius: 50%;
      background: radial-gradient(circle at 40% 30%, #fff6dd, var(--accent-color, #ffb347) 65%);
      box-shadow: 0 0 8px var(--accent-color, #ffb347);
      animation: feCountdownAlterna 1.6s ease-in-out infinite;
    }
    @keyframes feCountdownAlterna {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.25; }
    }

    .fe-countdown__etiqueta {
      margin: 0 0 0.55rem;
      font-family: 'Courier New', monospace;
      font-size: clamp(0.6rem, 1.15vw, 0.68rem);
      letter-spacing: 0.44em;
      text-transform: uppercase;
      color: var(--accent-color, #ffb347);
    }
    .fe-countdown__titulo {
      margin: 0 0 0.4rem;
      font-family: Georgia, 'Times New Roman', serif;
      font-weight: 400;
      font-size: clamp(1.75rem, 4vw, 2.7rem);
      color: var(--primary-color, #f5e9d7);
    }
    .fe-countdown__fecha {
      display: block;
      margin-bottom: clamp(1.5rem, 3.6vw, 2.2rem);
      font-family: 'Courier New', monospace;
      font-size: clamp(0.74rem, 1.5vw, 0.88rem);
      letter-spacing: 0.3em;
      text-transform: uppercase;
      color: var(--secondary-color, #b39a7d);
    }

    .fe-countdown__tablero {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: clamp(0.7rem, 2vw, 1.1rem);
      max-width: 620px;
      margin: 0 auto;
    }
    .fe-countdown__celda {
      padding: clamp(1rem, 2.4vw, 1.5rem) 0.3rem;
      background: var(--bg-color, #1a1410);
      border: 1px solid var(--surface-border-color, rgba(245, 233, 215, 0.16));
      border-radius: 8px;
    }
    .fe-countdown__numero {
      display: block;
      font-family: 'Courier New', monospace;
      font-size: clamp(1.7rem, 4.6vw, 2.8rem);
      font-variant-numeric: tabular-nums;
      line-height: 1;
      color: var(--primary-color, #f5e9d7);
      text-shadow: 0 0 16px color-mix(in srgb, var(--accent-color, #ffb347) 55%, transparent);
    }
    .fe-countdown__rotulo {
      display: block;
      margin-top: 0.45rem;
      font-family: 'Courier New', monospace;
      font-size: clamp(0.52rem, 1vw, 0.6rem);
      letter-spacing: 0.32em;
      text-transform: uppercase;
      color: var(--secondary-color, #b39a7d);
    }

    @media (max-width: 560px) {
      .fe-countdown__tablero { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .fe-countdown { min-height: 620px; }
    }

    @media (prefers-reduced-motion: reduce) {
      .fe-countdown__bmb { animation: none; }
    }
  </style>

  <div class="fe-countdown__marquesina">
    <div class="fe-countdown__bombillas-marco" data-fe-bombillas aria-hidden="true"></div>

    <p class="fe-countdown__etiqueta" memory_type="text" memory_usage="custom" memory_key="countdown-etiqueta">La feria abre en</p>
    <h2 class="fe-countdown__titulo" memory_type="text" memory_usage="custom" memory_key="countdown-titulo">Cuenta regresiva</h2>
    <time class="fe-countdown__fecha" datetime="YYYY-MM-DDTHH:MM:SS" memory_type="text" memory_usage="custom" memory_key="countdown-fecha">Fecha del evento</time>

    <div class="fe-countdown__tablero" aria-label="Cuenta regresiva">
      <div class="fe-countdown__celda"><span class="fe-countdown__numero" data-countdown-unit="days">--</span><span class="fe-countdown__rotulo">Días</span></div>
      <div class="fe-countdown__celda"><span class="fe-countdown__numero" data-countdown-unit="hours">--</span><span class="fe-countdown__rotulo">Horas</span></div>
      <div class="fe-countdown__celda"><span class="fe-countdown__numero" data-countdown-unit="minutes">--</span><span class="fe-countdown__rotulo">Min</span></div>
      <div class="fe-countdown__celda"><span class="fe-countdown__numero" data-countdown-unit="seconds">--</span><span class="fe-countdown__rotulo">Seg</span></div>
    </div>
  </div>

  <script>
    (function () {
      var el = null;
      try { el = document.currentScript.closest('[data-gemini-id^="countdown"]'); } catch (e) {}
      if (!el) el = document.querySelector('[data-gemini-id^="countdown"]');
      if (!el) return;

      var marco = el.querySelector('[data-fe-bombillas]');
      var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
      if (!reduce && marco && !marco.children.length) {
        var total = 26;
        for (var i = 0; i < total; i++) {
          var b = document.createElement('span');
          b.className = 'fe-countdown__bmb';
          var f = i / total;
          if (f < 0.25) { b.style.left = (f * 400) + '%'; b.style.top = '0'; }
          else if (f < 0.5) { b.style.right = '0'; b.style.top = ((f - 0.25) * 400) + '%'; }
          else if (f < 0.75) { b.style.left = ((0.75 - f) * 400) + '%'; b.style.bottom = '0'; }
          else { b.style.left = '0'; b.style.bottom = ((f - 0.75) * 400) + '%'; }
          b.style.animationDelay = (i % 2 === 0 ? 0 : 0.8) + 's';
          marco.appendChild(b);
        }
      }

      var target = NaN;
      var attr = el.getAttribute('data-countdown-target');
      if (attr && attr.indexOf('YYYY') === -1) { var p = new Date(attr); if (!isNaN(p.getTime())) target = p.getTime(); }
      if (isNaN(target) && window.__countdownTarget) { var p1 = new Date(window.__countdownTarget); if (!isNaN(p1.getTime())) target = p1.getTime(); }
      if (isNaN(target) && window.countdown_target) { var p2 = new Date(window.countdown_target); if (!isNaN(p2.getTime())) target = p2.getTime(); }

      var intervalId = null;
      (window.__countdownIntervals = window.__countdownIntervals || []).forEach(clearInterval);
      window.__countdownIntervals = [];

      function pad2(n) { return n < 10 ? '0' + n : '' + n; }
      function setUnit(unit, value) {
        var node = el.querySelector('[data-countdown-unit="' + unit + '"]');
        if (node) node.textContent = value;
      }
      function tick() {
        if (!Number.isFinite(target)) return;
        var diff = Math.max(target - Date.now(), 0);
        setUnit('days', Math.floor(diff / 86400000));
        setUnit('hours', pad2(Math.floor((diff % 86400000) / 3600000)));
        setUnit('minutes', pad2(Math.floor((diff % 3600000) / 60000)));
        setUnit('seconds', pad2(Math.floor((diff % 60000) / 1000)));
        if (diff === 0 && intervalId !== null) {
          clearInterval(intervalId);
          intervalId = null;
          window.__countdownIntervals = [];
        }
      }
      function start(newTarget) {
        if (newTarget) { var p = new Date(newTarget); if (!isNaN(p.getTime())) target = p.getTime(); }
        (window.__countdownIntervals || []).forEach(clearInterval);
        window.__countdownIntervals = [];
        intervalId = null;
        if (!Number.isFinite(target)) return;
        tick();
        if (target > Date.now()) {
          intervalId = setInterval(tick, 1000);
          window.__countdownIntervals.push(intervalId);
        }
      }
      start();
      window.updateCountdown = start;
    })();
  </script>

  <script>
    var moduleMetadata = {
      module_type: 'countdown',
      module_name: 'countdown-marquesina-feria',
      style_name: 'Marquesina de Feria',
      descripcion: 'Letrero de feria con marco de bombillas ámbar alternantes y tablero de cifras con glow; cuenta regresiva de apertura.',
      tags: ['countdown', 'cuenta regresiva', 'feria', 'marquesina', 'bombillas', 'glow'],
      tipo: 'countdown'
    };
  </script>
</section>
