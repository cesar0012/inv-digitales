    .fe-regalos *,

    .fe-regalos *::after { box-sizing: border-box; }

    .fe-regalos::before {

    .fe-regalos__etiqueta {

    .fe-regalos__intro {

      font-size: clamp(0.86rem, 1.5vw, 0.94rem);

    }

    .fe-regalos__lista { display: grid; gap: clamp(0.7rem, 2vw, 1rem); margin-bottom: 1.7rem; }
    .fe-regalos__fila {
      display: grid;
      grid-template-columns: auto 1fr auto;
      gap: 0.95rem;
      align-items: center;
      padding: clamp(0.85rem, 2.2vw, 1.1rem) clamp(1rem, 2.4vw, 1.3rem);
      background: var(--bg-color);
      border: 1px dashed var(--secondary-color);
      border-radius: 10px;
      transition: opacity 0.5s ease, transform 0.5s ease;
    }
    .fe-regalos.fe-js .fe-regalos__fila { opacity: 0; transform: translateY(10px); }
    .fe-regalos .fe-regalos__fila.esta-visto { opacity: 1; transform: none; }
    .fe-regalos__estrella {
      width: 16px;
      height: 16px;
      background: var(--accent-color);
      clip-path: polygon(50% 0, 61% 39%, 100% 50%, 61% 61%, 50% 100%, 39% 61%, 0 50%, 39% 39%);
      box-shadow: 0 0 10px var(--accent-color);

    .fe-regalos__nombre {

    .fe-regalos__puntos {

    .fe-regalos__zona-boton { text-align: center; }
    .fe-regalos__boton {
      min-width: 230px;
      padding: 0.9rem 2rem;
      border: 0;
      border-radius: 999px;
      background: linear-gradient(180deg, var(--accent-color), color-mix(in srgb, var(--accent-color) 70%, #a05e1a));
      color: var(--bg-color);
      font-family: 'Courier New', monospace;
      font-size: clamp(0.68rem, 1.3vw, 0.78rem);
      letter-spacing: 0.3em;
      text-transform: uppercase;
      cursor: pointer;
      box-shadow: 0 0 26px color-mix(in srgb, var(--accent-color) 50%, transparent);
      transition: transform 0.4s ease, filter 0.4s ease;
    }
    .fe-regalos__boton:hover { transform: translateY(-2px); filter: brightness(1.08); }
    .fe-regalos__boton.esta-listo { filter: saturate(0.65) brightness(1.1); }
    .fe-regalos__nota {
      margin-top: 0.9rem;
      font-family: 'Courier New', monospace;
      font-size: clamp(0.66rem, 1.25vw, 0.74rem);
      letter-spacing: 0.16em;
      color: var(--secondary-color);
    }

    @media (max-width: 520px) {
      .fe-regalos__fila { grid-template-columns: auto 1fr; }
      .fe-regalos__puntos { grid-column: 2; }
    }

    @media (prefers-reduced-motion: reduce) {
      .fe-regalos * { transition: none !important; }
      .fe-regalos__fila { opacity: 1 !important; transform: none !important; }
    }
  </style>

  <script>
    (function () {
      var root = document.currentScript ? document.currentScript.closest('section') : document.querySelector('.fe-regalos');
      if (!root) return;
      root.classList.add('fe-js');
      window.setTimeout(function () { root.classList.add('esta-visto'); }, 2500); // red de seguridad: nunca dejar contenido oculto

      var filas = Array.prototype.slice.call(root.querySelectorAll('[data-fe-fila]'));
      var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
      if (('IntersectionObserver' in window) && !reduce) {
        var io = new IntersectionObserver(function (entries) {
          entries.forEach(function (entry) {
            if (!entry.isIntersecting) return;
            filas.forEach(function (fila, i) { fila.style.transitionDelay = (i * 0.11).toFixed(2) + 's'; });
            filas.forEach(function (fila) { fila.classList.add('esta-visto'); });
            io.disconnect();
          });
        }, { threshold: 0.3 });
        io.observe(root.querySelector('[data-fe-lista]') || root);
      } else {
        filas.forEach(function (fila) { fila.classList.add('esta-visto'); });
      }

      var boton = root.querySelector('[data-fe-boton]');
      var texto = root.querySelector('[data-fe-boton-texto]');
      if (boton && texto) {
        boton.addEventListener('click', function () {
          var listo = boton.classList.toggle('esta-listo');
          texto.textContent = listo ? 'Regalo agendado' : 'Agendar regalo';
        });
      }
    })();
  </script>
