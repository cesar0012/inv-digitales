<section
  class="gl-vestimenta"
  data-gemini-id="vestimenta-cristal-gotas"
  memory_type="background"
  memory_usage="protected"
  memory_source="generated"
  path="placeholder"
>
  <style>
    .gl-vestimenta {
      --primary-color: #223038;
      --secondary-color: #5d7078;
      --accent-color: #8fb6c9;
      --bg-color: #eef4f7;
      --surface-color: rgba(255, 255, 255, 0.55);
      --surface-border-color: rgba(255, 255, 255, 0.75);
      --text-color: #223038;

      position: relative;
      isolation: isolate;
      box-sizing: border-box;
      min-height: 64svh;
      display: grid;
      place-items: center;
      padding: clamp(3rem, 8vw, 6rem) clamp(1rem, 5vw, 4rem);
      background-color: var(--bg-color);
      background-image: url('https://loremflickr.com/1600/900/droplets,glass');
      background-size: cover;
      background-position: center;
      color: var(--text-color);
      text-align: center;
    }
    .gl-vestimenta *,
    .gl-vestimenta *::before,
    .gl-vestimenta *::after { box-sizing: border-box; }

    .gl-vestimenta::before {
      content: '';
      position: absolute;
      inset: 0;
      z-index: -1;
      background: linear-gradient(160deg, color-mix(in srgb, var(--bg-color) 72%, transparent), color-mix(in srgb, var(--accent-color) 22%, transparent));
    }

    .gl-vestimenta__tarjeta {
      width: min(100%, 660px);
      padding: clamp(2rem, 5vw, 3.2rem) clamp(1.4rem, 4.5vw, 3rem);
      background: var(--surface-color);
      border: 1px solid var(--surface-border-color);
      border-radius: clamp(18px, 3vw, 28px);
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.9), 0 26px 58px rgba(34, 48, 56, 0.18);
      backdrop-filter: blur(13px);
      -webkit-backdrop-filter: blur(13px);
    }

    .gl-vestimenta__etiqueta {
      margin: 0 0 0.6rem;
      font-family: Arial, Helvetica, sans-serif;
      font-size: clamp(0.6rem, 1.15vw, 0.68rem);
      letter-spacing: 0.44em;
      text-transform: uppercase;
      color: var(--accent-color);
    }
    .gl-vestimenta__titulo {
      margin: 0 0 0.8rem;
      font-family: Georgia, 'Times New Roman', serif;
      font-weight: 400;
      font-size: clamp(1.7rem, 3.8vw, 2.3rem);
      color: var(--primary-color);
    }
    .gl-vestimenta__texto {
      margin: 0 auto 1.8rem;
      max-width: 46ch;
      font-family: Arial, Helvetica, sans-serif;
      font-size: clamp(0.86rem, 1.5vw, 0.94rem);
      line-height: 1.75;
      color: var(--secondary-color);
    }

    .gl-vestimenta__rocio {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: clamp(0.9rem, 2.6vw, 1.4rem);
      margin-bottom: 1.6rem;
    }
    .gl-vestimenta__gota-zona {
      display: grid;
      justify-items: center;
      gap: 0.5rem;
      transition: opacity 0.5s ease, transform 0.5s cubic-bezier(0.22, 0.8, 0.3, 1);
    }
    .gl-vestimenta.gl-js .gl-vestimenta__gota-zona { opacity: 0; transform: translateY(16px) scale(0.8); }
    .gl-vestimenta .gl-vestimenta__gota-zona.esta-visto { opacity: 1; transform: none; }
    .gl-vestimenta__gota {
      position: relative;
      width: clamp(44px, 8vw, 58px);
      height: clamp(44px, 8vw, 58px);
      border-radius: 50% 50% 50% 6px;
      transform: rotate(45deg);
      border: 1px solid var(--surface-border-color);
      background: var(--bg-color);
      box-shadow:
        inset 5px 5px 8px rgba(255, 255, 255, 0.85),
        inset -4px -4px 8px rgba(34, 48, 56, 0.12),
        0 12px 24px rgba(34, 48, 56, 0.18);
      transition: background 0.5s ease, transform 0.5s ease;
    }
    .gl-vestimenta__gota::after {
      content: '';
      position: absolute;
      top: 14%;
      left: 14%;
      width: 30%;
      height: 30%;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.8);
      filter: blur(1px);
    }
    .gl-vestimenta__gota-zona:hover .gl-vestimenta__gota { transform: rotate(45deg) translate(3px, -3px); }

    .gl-vestimenta__leyenda {
      display: inline-block;
      padding: 0.55rem 1.6rem;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.45);
      border: 1px solid var(--surface-border-color);
      font-family: Arial, Helvetica, sans-serif;
      font-size: clamp(0.62rem, 1.2vw, 0.7rem);
      letter-spacing: 0.32em;
      text-transform: uppercase;
      color: var(--secondary-color);
    }

    @media (max-width: 480px) {
      .gl-vestimenta__gota { width: 38px; height: 38px; }
    }

    @media (prefers-reduced-motion: reduce) {
      .gl-vestimenta * { transition: none !important; }
      .gl-vestimenta__gota-zona { opacity: 1 !important; transform: none !important; }
    }
  </style>

  <div class="gl-vestimenta__tarjeta">
    <p class="gl-vestimenta__etiqueta" memory_type="text" memory_usage="custom" memory_key="vestimenta-etiqueta">Código de vestimenta</p>
    <h2 class="gl-vestimenta__titulo" memory_type="text" memory_usage="custom" memory_key="vestimenta-titulo">Gotas de rocío</h2>
    <p class="gl-vestimenta__texto" memory_type="text" memory_usage="custom" memory_key="vestimenta-texto">
      Inspiración de tonos frescos y translúcidos para tu atuendo; que la luz juegue contigo.
    </p>

    <div class="gl-vestimenta__rocio" data-gl-rocio aria-hidden="true"></div>

    <p class="gl-vestimenta__leyenda" memory_type="text" memory_usage="custom" memory_key="vestimenta-leyenda">Formal · tonos cristalinos</p>
  </div>

  <script>
    (function () {
      var root = document.currentScript ? document.currentScript.closest('section') : document.querySelector('.gl-vestimenta');
      if (!root) return;
      root.classList.add('gl-js');
      window.setTimeout(function () { root.classList.add('esta-visto'); }, 2500); // red de seguridad: nunca dejar contenido oculto

      var rocio = root.querySelector('[data-gl-rocio]');
      if (rocio && !rocio.children.length) {
        var tonos = ['#7fa8bc', '#a9c3cf', '#8fb6c9', '#b8ccd4', '#6e93a6', '#c3d8e0'];
        for (var i = 0; i < tonos.length; i++) {
          var zona = document.createElement('span');
          zona.className = 'gl-vestimenta__gota-zona';
          zona.style.transitionDelay = (i * 0.08).toFixed(2) + 's, ' + (i * 0.08).toFixed(2) + 's';
          var gota = document.createElement('span');
          gota.className = 'gl-vestimenta__gota';
          gota.setAttribute('data-gl-tono', tonos[i]);
          zona.appendChild(gota);
          rocio.appendChild(zona);
        }
      }

      var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
      function colorear() {
        root.querySelectorAll('[data-gl-tono]').forEach(function (g) {
          g.style.background = g.getAttribute('data-gl-tono');
        });
      }
      if (reduce || !('IntersectionObserver' in window)) {
        root.querySelectorAll('.gl-vestimenta__gota-zona').forEach(function (z) { z.classList.add('esta-visto'); });
        colorear();
        return;
      }
      var io = new IntersectionObserver(function (entries) {
        entries.forEach(function (entry) {
          if (!entry.isIntersecting) return;
          root.querySelectorAll('.gl-vestimenta__gota-zona').forEach(function (z) {
            z.style.transitionDelay = (Array.prototype.indexOf.call(z.parentNode.children, z) * 0.08).toFixed(2) + 's, ' + (Array.prototype.indexOf.call(z.parentNode.children, z) * 0.08).toFixed(2) + 's';
            z.classList.add('esta-visto');
          });
          setTimeout(colorear, 240);
          io.disconnect();
        });
      }, { threshold: 0.3 });
      io.observe(root);
    })();
  </script>

  <script>
    var moduleMetadata = {
      module_type: 'vestimenta',
      module_name: 'vestimenta-cristal-gotas',
      style_name: 'Vidrio Esmerilado — Vestimenta',
      descripcion: 'Gotas de rocío facetadas que aparecen escalonadas y se colorean por JS, con brillo interior difuso y leyenda en pastilla.',
      tags: ['vestimenta', 'dress code', 'gotas', 'paleta', 'cristal', 'glassmorphism'],
      tipo: 'vestimenta'
    };
  </script>
</section>
