<section
  class="gl-countdown"
  data-gemini-id="countdown-cristal-tiempo"
  path="placeholder"
  memory_source="generated"
  memory_type="background"
  memory_usage="protected"
  data-countdown-target="YYYY-MM-DDTHH:MM:SS"
>
  <style>
    .gl-countdown {
      position: relative;
      isolation: isolate;
      overflow: hidden;
      box-sizing: border-box;
      min-height: 650px;
      display: grid;
      place-items: center;
      padding: clamp(3rem, 7vw, 5rem) clamp(1rem, 5vw, 3rem);
      background-color: var(--bg-color, #eef4f7);
      background-image: url('https://loremflickr.com/1600/900/frost,blue');
      background-size: cover;
      background-position: center;
      color: var(--text-color, #223038);
      text-align: center;
    }
    .gl-countdown *,
    .gl-countdown *::before,
    .gl-countdown *::after { box-sizing: border-box; }

    .gl-countdown::before {
      content: '';
      position: absolute;
      inset: 0;
      z-index: -1;
      background: linear-gradient(180deg, color-mix(in srgb, var(--bg-color, #eef4f7) 70%, transparent), color-mix(in srgb, var(--accent-color, #8fb6c9) 22%, transparent));
    }

    .gl-countdown__panel {
      width: min(100%, 760px);
      padding: clamp(2rem, 5vw, 3.4rem) clamp(1.3rem, 4.5vw, 3rem);
      background: var(--surface-color, rgba(255, 255, 255, 0.55));
      border: 1px solid var(--surface-border-color, rgba(255, 255, 255, 0.75));
      border-radius: clamp(20px, 3vw, 32px);
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.9), 0 30px 70px rgba(34, 48, 56, 0.2);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
    }

    .gl-countdown__etiqueta {
      margin: 0 0 0.55rem;
      font-family: Arial, Helvetica, sans-serif;
      font-size: clamp(0.6rem, 1.15vw, 0.68rem);
      letter-spacing: 0.44em;
      text-transform: uppercase;
      color: var(--accent-color, #8fb6c9);
    }
    .gl-countdown__titulo {
      margin: 0 0 0.4rem;
      font-family: Georgia, 'Times New Roman', serif;
      font-weight: 400;
      font-size: clamp(1.75rem, 4vw, 2.6rem);
      color: var(--primary-color, #223038);
    }
    .gl-countdown__fecha {
      display: block;
      margin-bottom: clamp(1.5rem, 3.6vw, 2.2rem);
      font-family: Arial, Helvetica, sans-serif;
      font-size: clamp(0.76rem, 1.5vw, 0.88rem);
      letter-spacing: 0.3em;
      text-transform: uppercase;
      color: var(--secondary-color, #5d7078);
    }

    .gl-countdown__dial {
      position: relative;
      width: clamp(180px, 26vw, 230px);
      margin: 0 auto clamp(1.4rem, 3.4vw, 2rem);
    }
    .gl-countdown__dial svg { display: block; width: 100%; height: auto; }
    .gl-countdown__cristales {
      fill: none;
      stroke: color-mix(in srgb, var(--primary-color, #223038) 30%, transparent);
      stroke-width: 1;
    }
    .gl-countdown__anillo-fondo {
      fill: none;
      stroke: color-mix(in srgb, var(--accent-color, #8fb6c9) 30%, transparent);
      stroke-width: 6;
    }
    .gl-countdown__anillo {
      fill: none;
      stroke: var(--accent-color, #8fb6c9);
      stroke-width: 6;
      stroke-linecap: round;
      filter: drop-shadow(0 0 6px color-mix(in srgb, var(--accent-color, #8fb6c9) 70%, transparent));
      transform: rotate(-90deg);
      transform-origin: 115px 115px;
      transition: stroke-dashoffset 0.5s linear;
    }
    .gl-countdown__centro {
      position: absolute;
      inset: 24%;
      display: grid;
      place-items: center;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.55);
      border: 1px solid var(--surface-border-color, rgba(255, 255, 255, 0.75));
      font-family: Georgia, 'Times New Roman', serif;
      font-size: clamp(1.5rem, 3.4vw, 2.1rem);
      font-variant-numeric: tabular-nums;
      color: var(--primary-color, #223038);
    }

    .gl-countdown__unidades {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: clamp(0.6rem, 1.8vw, 1rem);
      max-width: 560px;
      margin: 0 auto;
    }
    .gl-countdown__unidad {
      padding: clamp(0.9rem, 2.2vw, 1.3rem) 0.3rem;
      border-radius: 14px;
      background: rgba(255, 255, 255, 0.45);
      border: 1px solid var(--surface-border-color, rgba(255, 255, 255, 0.75));
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.9);
    }
    .gl-countdown__numero {
      display: block;
      font-family: Georgia, 'Times New Roman', serif;
      font-size: clamp(1.5rem, 4vw, 2.3rem);
      font-variant-numeric: tabular-nums;
      line-height: 1;
      color: var(--primary-color, #223038);
    }
    .gl-countdown__rotulo {
      display: block;
      margin-top: 0.4rem;
      font-family: Arial, Helvetica, sans-serif;
      font-size: clamp(0.54rem, 1.05vw, 0.62rem);
      letter-spacing: 0.34em;
      text-transform: uppercase;
      color: var(--secondary-color, #5d7078);
    }

    @media (max-width: 560px) {
      .gl-countdown__unidades { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .gl-countdown { min-height: 600px; }
    }

    @media (prefers-reduced-motion: reduce) {
      .gl-countdown__anillo { transition: none; }
    }
  </style>

  <div class="gl-countdown__panel">
    <p class="gl-countdown__etiqueta" memory_type="text" memory_usage="custom" memory_key="countdown-etiqueta">Cuenta regresiva</p>
    <h2 class="gl-countdown__titulo" memory_type="text" memory_usage="custom" memory_key="countdown-titulo">El cristal marca la hora</h2>
    <time class="gl-countdown__fecha" datetime="YYYY-MM-DDTHH:MM:SS" memory_type="text" memory_usage="custom" memory_key="countdown-fecha">Fecha del evento</time>

    <div class="gl-countdown__dial" aria-hidden="true">
      <svg viewBox="0 0 230 230">
        <g class="gl-countdown__cristales">
          <path d="M115 15 L115 45 M115 215 L115 185 M15 115 L45 115 M215 115 L185 115" />
          <path d="M44 44 L66 66 M186 186 L164 164 M186 44 L164 66 M44 186 L66 164" />
          <circle cx="115" cy="115" r="112" />
        </g>
        <circle class="gl-countdown__anillo-fondo" cx="115" cy="115" r="92" />
        <circle class="gl-countdown__anillo" data-gl-anillo cx="115" cy="115" r="92" stroke-dasharray="578.1" stroke-dashoffset="0" />
      </svg>
      <div class="gl-countdown__centro" data-gl-segundos>00</div>
    </div>

    <div class="gl-countdown__unidades" aria-label="Cuenta regresiva">
      <div class="gl-countdown__unidad"><span class="gl-countdown__numero" data-countdown-unit="days">--</span><span class="gl-countdown__rotulo">Días</span></div>
      <div class="gl-countdown__unidad"><span class="gl-countdown__numero" data-countdown-unit="hours">--</span><span class="gl-countdown__rotulo">Horas</span></div>
      <div class="gl-countdown__unidad"><span class="gl-countdown__numero" data-countdown-unit="minutes">--</span><span class="gl-countdown__rotulo">Min</span></div>
      <div class="gl-countdown__unidad"><span class="gl-countdown__numero" data-countdown-unit="seconds">--</span><span class="gl-countdown__rotulo">Seg</span></div>
    </div>
  </div>

  <script>
    (function () {
      var el = null;
      try { el = document.currentScript.closest('[data-gemini-id^="countdown"]'); } catch (e) {}
      if (!el) el = document.querySelector('[data-gemini-id^="countdown"]');
      if (!el) return;

      var anillo = el.querySelector('[data-gl-anillo]');
      var centro = el.querySelector('[data-gl-segundos]');
      var LONGITUD = anillo ? 2 * Math.PI * 92 : 0;
      var target = NaN;
      var attr = el.getAttribute('data-countdown-target');
      if (attr && attr.indexOf('YYYY') === -1) { var p = new Date(attr); if (!isNaN(p.getTime())) target = p.getTime(); }
      if (isNaN(target) && window.__countdownTarget) { var p1 = new Date(window.__countdownTarget); if (!isNaN(p1.getTime())) target = p1.getTime(); }
      if (isNaN(target) && window.countdown_target) { var p2 = new Date(window.countdown_target); if (!isNaN(p2.getTime())) target = p2.getTime(); }

      var intervalId = null;
      (window.__countdownIntervals = window.__countdownIntervals || []).forEach(clearInterval);
      window.__countdownIntervals = [];

      function pad2(n) { return n < 10 ? '0' + n : '' + n; }
      function setUnit(unit, value) {
        var node = el.querySelector('[data-countdown-unit="' + unit + '"]');
        if (node) node.textContent = value;
      }
      function tick() {
        if (!Number.isFinite(target)) return;
        var diff = Math.max(target - Date.now(), 0);
        setUnit('days', Math.floor(diff / 86400000));
        setUnit('hours', pad2(Math.floor((diff % 86400000) / 3600000)));
        setUnit('minutes', pad2(Math.floor((diff % 3600000) / 60000)));
        var s = Math.floor((diff % 60000) / 1000);
        setUnit('seconds', pad2(s));
        if (centro) centro.textContent = pad2(s);
        if (anillo) anillo.setAttribute('stroke-dashoffset', (LONGITUD * (1 - s / 60)).toFixed(2));
        if (diff === 0 && intervalId !== null) {
          clearInterval(intervalId);
          intervalId = null;
          window.__countdownIntervals = [];
        }
      }
      function start(newTarget) {
        if (newTarget) { var p = new Date(newTarget); if (!isNaN(p.getTime())) target = p.getTime(); }
        (window.__countdownIntervals || []).forEach(clearInterval);
        window.__countdownIntervals = [];
        intervalId = null;
        if (!Number.isFinite(target)) return;
        tick();
        if (target > Date.now()) {
          intervalId = setInterval(tick, 1000);
          window.__countdownIntervals.push(intervalId);
        }
      }
      start();
      window.updateCountdown = start;
    })();
  </script>

  <script>
    var moduleMetadata = {
      module_type: 'countdown',
      module_name: 'countdown-cristal-tiempo',
      style_name: 'Dial de Cristal',
      descripcion: 'Dial de cristal con arco luminoso de segundos sobre retícula facetada, panel esmerilado y cuatro pastillas translúcidas de unidades.',
      tags: ['countdown', 'cuenta regresiva', 'cristal', 'arco', 'glassmorphism', 'luminoso'],
      tipo: 'countdown'
    };
  </script>
</section>
