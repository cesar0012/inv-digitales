<section
  class="gl-padres"
  data-gemini-id="padres-padre"
  memory_type="background"
  memory_usage="protected"
  memory_source="generated"
  path="placeholder"
>
  <style>
    .gl-padres {
      --primary-color: #223038;
      --secondary-color: #5d7078;
      --accent-color: #8fb6c9;
      --bg-color: #eef4f7;
      --surface-color: rgba(255, 255, 255, 0.55);
      --surface-border-color: rgba(255, 255, 255, 0.75);
      --text-color: #223038;

      position: relative;
      isolation: isolate;
      box-sizing: border-box;
      padding: clamp(3rem, 8vw, 6rem) clamp(1rem, 5vw, 4rem);
      background-color: var(--bg-color);
      background-image: url('https://loremflickr.com/1600/900/ice,texture');
      background-size: cover;
      background-position: center;
      color: var(--text-color);
      text-align: center;
      perspective: 1100px;
    }
    .gl-padres *,
    .gl-padres *::before,
    .gl-padres *::after { box-sizing: border-box; }

    .gl-padres::before {
      content: '';
      position: absolute;
      inset: 0;
      z-index: -1;
      background: linear-gradient(180deg, color-mix(in srgb, var(--bg-color) 70%, transparent), color-mix(in srgb, var(--accent-color) 18%, transparent));
    }

    .gl-padres__titulo {
      margin: 0 0 0.5rem;
      font-family: Georgia, 'Times New Roman', serif;
      font-weight: 400;
      font-size: clamp(1.7rem, 3.8vw, 2.4rem);
      color: var(--primary-color);
    }
    .gl-padres__intro {
      margin: 0 auto clamp(2rem, 5vw, 3.2rem);
      max-width: 50ch;
      font-family: Arial, Helvetica, sans-serif;
      font-size: clamp(0.84rem, 1.5vw, 0.94rem);
      line-height: 1.7;
      color: var(--secondary-color);
    }

    .gl-padres__escena {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: clamp(1.4rem, 4vw, 2.8rem);
      width: min(100%, 880px);
      margin: 0 auto;
      align-items: start;
      transform-style: preserve-3d;
    }

    .gl-padres__panel {
      position: relative;
      padding: clamp(1.8rem, 4vw, 2.6rem) clamp(1.2rem, 3vw, 2rem);
      background: var(--surface-color);
      border: 1px solid var(--surface-border-color);
      border-radius: clamp(16px, 2.6vw, 24px);
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.9), 0 24px 54px rgba(34, 48, 56, 0.2);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      transition: opacity 0.5s ease, transform 0.5s cubic-bezier(0.22, 0.8, 0.3, 1);
    }
    .gl-padres.gl-js .gl-padres__panel { opacity: 0; transform: translateY(24px) translateZ(-30px); }
    .gl-padres .gl-padres__panel.esta-visto { opacity: 1; transform: translateY(var(--gl-flot, 0px)) translateZ(0); }
    .gl-padres__panel:nth-child(2) { --gl-flot: 26px; }

    .gl-padres__retrato {
      width: clamp(104px, 15vw, 138px);
      margin: 0 auto 1.1rem;
      padding: 6px;
      background: rgba(255, 255, 255, 0.5);
      border: 1px solid var(--surface-border-color);
      border-radius: 50%;
      box-shadow: 0 0 0 6px color-mix(in srgb, var(--accent-color) 28%, transparent), 0 12px 26px rgba(34, 48, 56, 0.16);
    }
    .gl-padres__retrato img {
      color: transparent;
      display: block;
      width: 100%;
      height: auto;
      aspect-ratio: 1 / 1;
      border-radius: 50%;
      object-fit: cover;
      filter: saturate(0.9);
    }

    .gl-padres__rol {
      margin: 0 0 0.4rem;
      font-family: Arial, Helvetica, sans-serif;
      font-size: clamp(0.58rem, 1.1vw, 0.66rem);
      letter-spacing: 0.42em;
      text-transform: uppercase;
      color: var(--accent-color);
    }
    .gl-padres__nombres {
      margin: 0;
      font-family: Georgia, 'Times New Roman', serif;
      font-size: clamp(1.08rem, 2.2vw, 1.38rem);
      line-height: 1.3;
      color: var(--primary-color);
    }

    @media (max-width: 740px) {
      .gl-padres__escena { grid-template-columns: 1fr; max-width: 400px; }
      .gl-padres__panel:nth-child(2) { --gl-flot: 0px; }
    }

    @media (prefers-reduced-motion: reduce) {
      .gl-padres * { transition: none !important; }
      .gl-padres__panel { opacity: 1 !important; transform: none !important; }
    }
  </style>

  <header memory_type="text" memory_usage="custom" memory_key="padres-intro">
    <h2 class="gl-padres__titulo" memory_type="text" memory_usage="custom" memory_key="padres-titulo">Familias que se unen</h2>
    <p class="gl-padres__intro" memory_type="text" memory_usage="custom" memory_key="padres-texto">Transparencias que se suman: dos hogares que se dejan ver y se convierten en uno.</p>
  </header>

  <div class="gl-padres__escena">
    <article class="gl-padres__panel" data-gl-panel>
      <figure class="gl-padres__retrato" memory_type="image" memory_usage="custom" memory_source="library" memory_key="padres-retrato-uno">
        <img src="https://loremflickr.com/380/380/family,warm" alt="Retrato de la familia de la novia" path="placeholder" data-library-category="bodas" data-asset-type="retrato-familia" loading="lazy" />
        <figcaption hidden>Familia uno</figcaption>
      </figure>
      <div memory_type="text" memory_usage="custom" memory_key="padres-bloque-uno">
        <p class="gl-padres__rol">Padres de la novia</p>
        <h3 class="gl-padres__nombres">Nombre Papá &amp; Nombre Mamá</h3>
      </div>
    </article>

    <article class="gl-padres__panel" data-gl-panel>
      <figure class="gl-padres__retrato" memory_type="image" memory_usage="custom" memory_source="library" memory_key="padres-retrato-dos">
        <img src="https://loremflickr.com/380/380/parents,happy" alt="Retrato de la familia del novio" path="placeholder" data-library-category="bodas" data-asset-type="retrato-familia" loading="lazy" />
        <figcaption hidden>Familia dos</figcaption>
      </figure>
      <div memory_type="text" memory_usage="custom" memory_key="padres-bloque-dos">
        <p class="gl-padres__rol">Padres del novio</p>
        <h3 class="gl-padres__nombres">Nombre Papá &amp; Nombre Mamá</h3>
      </div>
    </article>
  </div>

  <script>
    (function () {
      var root = document.currentScript ? document.currentScript.closest('section') : document.querySelector('.gl-padres');
      if (!root) return;
      root.classList.add('gl-js');
      window.setTimeout(function () { root.classList.add('esta-visto'); }, 2500); // red de seguridad: nunca dejar contenido oculto
      var paneles = Array.prototype.slice.call(root.querySelectorAll('[data-gl-panel]'));
      var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
      if (reduce || !('IntersectionObserver' in window)) {
        paneles.forEach(function (p) { p.classList.add('esta-visto'); });
        return;
      }
      var io = new IntersectionObserver(function (entries) {
        entries.forEach(function (entry) {
          if (!entry.isIntersecting) return;
          var i = paneles.indexOf(entry.target);
          entry.target.style.transitionDelay = (Math.max(i, 0) * 0.14).toFixed(2) + 's';
          entry.target.classList.add('esta-visto');
          io.unobserve(entry.target);
        });
      }, { threshold: 0.25 });
      paneles.forEach(function (p) { io.observe(p); });
    })();
  </script>

  <script>
    var moduleMetadata = {
      module_type: 'padres',
      module_name: 'padres-padre',
      style_name: 'Vidrio Esmerilado — Padres',
      descripcion: 'Paneles de cristal flotantes a distinta altura con translateZ, retratos circulares con anillo de luz y entrada desde la profundidad.',
      tags: ['padres', 'familias', 'cristal', 'glassmorphism', '3d', 'flotante', 'stagger'],
      tipo: 'padres'
    };
  </script>
</section>
