    .gl-padrinos *,

      width: min(100%, 860px);

    .gl-padrinos__repisa {

      gap: clamp(0.9rem, 2.4vw, 1.4rem);
      align-items: center;
      padding: clamp(1.1rem, 2.8vw, 1.6rem);
      text-align: left;
      background: var(--surface-color);
      border: 1px solid var(--surface-border-color);
      border-radius: 18px 18px 6px 6px;
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.9), 0 18px 40px rgba(34, 48, 56, 0.15);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      transition: opacity 0.5s ease, transform 0.5s cubic-bezier(0.22, 0.8, 0.3, 1);
    }
    .gl-padrinos.gl-js .gl-padrinos__repisa { opacity: 0; transform: translateY(26px); }
    .gl-padrinos .gl-padrinos__repisa.esta-visto { opacity: 1; transform: none; }
    .gl-padrinos__repisa::after {
      content: '';
      position: absolute;
      left: 8%;
      right: 8%;
      bottom: -9px;
      height: 8px;
      border-radius: 0 0 8px 8px;
      background: color-mix(in srgb, var(--accent-color) 45%, rgba(255, 255, 255, 0.4));
      box-shadow: 0 10px 18px rgba(34, 48, 56, 0.2);
    }

    .gl-padrinos__retrato {
      width: clamp(76px, 11vw, 100px);
      margin: 0;
      padding: 5px;
      background: rgba(255, 255, 255, 0.55);
      border: 1px solid var(--surface-border-color);
      border-radius: 50%;
      box-shadow: 0 0 0 4px color-mix(in srgb, var(--accent-color) 25%, transparent);
    }
    .gl-padrinos__retrato img {
      color: transparent;
      display: block;
      width: 100%;
      height: auto;
      aspect-ratio: 1 / 1;
      border-radius: 50%;
      object-fit: cover;
      filter: saturate(0.9);
    }

    .gl-padrinos__rol {
      margin: 0 0 0.25rem;

      font-size: clamp(0.56rem, 1.05vw, 0.64rem);

      text-transform: uppercase;
      color: var(--accent-color);
    }
    .gl-padrinos__nombre {
      margin: 0;
      font-family: Georgia, 'Times New Roman', serif;
      font-size: clamp(0.96rem, 1.9vw, 1.16rem);
      line-height: 1.3;
      color: var(--primary-color);
    }

    @media (max-width: 720px) {
      .gl-padrinos__repisas { grid-template-columns: 1fr; max-width: 400px; }
    }

    @media (prefers-reduced-motion: reduce) {
      .gl-padrinos * { transition: none !important; }
      .gl-padrinos__repisa { opacity: 1 !important; transform: none !important; }
    }
  </style>

  <script>
    (function () {
      var root = document.currentScript ? document.currentScript.closest('section') : document.querySelector('.gl-padrinos');
      if (!root) return;
      root.classList.add('gl-js');
      window.setTimeout(function () { root.classList.add('esta-visto'); }, 2500); // red de seguridad: nunca dejar contenido oculto
      var repisas = Array.prototype.slice.call(root.querySelectorAll('[data-gl-repisa]'));
      var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
      if (reduce || !('IntersectionObserver' in window)) {
        repisas.forEach(function (r) { r.classList.add('esta-visto'); });
        return;
      }
      var io = new IntersectionObserver(function (entries) {
        entries.forEach(function (entry) {
          if (!entry.isIntersecting) return;
          var i = repisas.indexOf(entry.target);
          entry.target.style.transitionDelay = (Math.max(i, 0) * 0.1).toFixed(2) + 's';
          entry.target.classList.add('esta-visto');
          io.unobserve(entry.target);
        });
      }, { threshold: 0.25 });
      repisas.forEach(function (r) { io.observe(r); });
    })();
  </script>
