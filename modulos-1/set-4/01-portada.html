<section
  class="gl-portada"
  data-gemini-id="portada-nombre"
  memory_type="background"
  memory_usage="protected"
  memory_source="generated"
  path="placeholder"
  aria-labelledby="gl-portada-titulo"
>
  <style>
    .gl-portada {
      --primary-color: #223038;
      --secondary-color: #5d7078;
      --accent-color: #8fb6c9;
      --bg-color: #eef4f7;
      --surface-color: rgba(255, 255, 255, 0.55);
      --surface-border-color: rgba(255, 255, 255, 0.75);
      --text-color: #223038;

      position: relative;
      isolation: isolate;
      overflow: hidden;
      box-sizing: border-box;
      min-height: 100svh;
      display: grid;
      place-items: center;
      padding: clamp(2.5rem, 6vw, 5rem) clamp(1rem, 5vw, 4rem);
      background-color: var(--bg-color);
      background-image: url('https://loremflickr.com/1600/900/frost,light');
      background-size: cover;
      background-position: center;
      color: var(--text-color);
      text-align: center;
      perspective: 1200px;
    }
    .gl-portada *,
    .gl-portada *::before,
    .gl-portada *::after { box-sizing: border-box; }

    .gl-portada::before {
      content: '';
      position: absolute;
      inset: 0;
      z-index: -1;
      background: linear-gradient(160deg, color-mix(in srgb, var(--bg-color) 65%, transparent), color-mix(in srgb, var(--accent-color) 22%, transparent) 55%, color-mix(in srgb, var(--bg-color) 70%, transparent));
    }

    .gl-portada__prisma {
      position: absolute;
      z-index: 0;
      width: clamp(200px, 42vw, 460px);
      color: var(--accent-color);
      opacity: 0.5;
      pointer-events: none;
      animation: glPortadaDeriva 16s ease-in-out infinite;
    }
    @keyframes glPortadaDeriva {
      0%, 100% { transform: translate(-6%, -4%) rotate(-4deg); }
      50% { transform: translate(4%, 5%) rotate(5deg); }
    }

    .gl-portada__panel {
      position: relative;
      z-index: 2;
      width: min(100%, 720px);
      padding: clamp(2.2rem, 6vw, 4rem) clamp(1.4rem, 5vw, 3.4rem);
      display: grid;
      justify-items: center;
      background: var(--surface-color);
      border: 1px solid var(--surface-border-color);
      border-radius: clamp(18px, 3vw, 30px);
      box-shadow:
        inset 0 1px 0 rgba(255, 255, 255, 0.9),
        0 30px 70px rgba(34, 48, 56, 0.22),
        0 4px 18px rgba(34, 48, 56, 0.1);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      transform: translateZ(40px);
      transform-style: preserve-3d;
    }
    .gl-portada__panel::before {
      content: '';
      position: absolute;
      inset: 10px;
      border: 1px solid rgba(255, 255, 255, 0.5);
      border-radius: clamp(14px, 2.4vw, 24px);
      pointer-events: none;
    }

    .gl-portada__lente {
      width: clamp(64px, 10vw, 84px);
      margin-bottom: clamp(1rem, 2.5vw, 1.5rem);
      color: var(--accent-color);
      animation: glPortadaGiro 24s linear infinite;
    }
    @keyframes glPortadaGiro { to { transform: rotate(360deg); } }

    .gl-portada__eyebrow {
      margin: 0 0 1rem;
      font-family: Arial, Helvetica, sans-serif;
      font-size: clamp(0.62rem, 1.2vw, 0.72rem);
      letter-spacing: 0.5em;
      text-transform: uppercase;
      color: var(--secondary-color);
    }

    .gl-portada__titulo {
      margin: 0;
      font-family: Georgia, 'Times New Roman', serif;
      font-weight: 400;
      font-size: clamp(2rem, 6vw, 4.2rem);
      line-height: 1.08;
      color: var(--primary-color);
    }
    .gl-portada__titulo span {
      display: inline-block;
      transition: opacity 0.5s ease, transform 0.5s cubic-bezier(0.22, 0.8, 0.3, 1), filter 0.5s ease;
    }
    .gl-portada.gl-js .gl-portada__titulo span { opacity: 0; transform: translateY(0.5em); filter: blur(6px); }
    .gl-portada.esta-visto .gl-portada__titulo span { opacity: 1; transform: none; filter: blur(0); }
    .gl-portada.esta-visto .gl-portada__titulo span:nth-child(1) { transition-delay: 0.08s; }
    .gl-portada.esta-visto .gl-portada__titulo span:nth-child(2) { transition-delay: 0.18s; }
    .gl-portada.esta-visto .gl-portada__titulo span:nth-child(3) { transition-delay: 0.28s; }

    .gl-portada__ampersand {
      display: block;
      margin: 0.12em 0;
      font-style: italic;
      color: var(--accent-color);
    }

    .gl-portada__luz {
      width: min(220px, 60%);
      height: 1px;
      margin: clamp(1.2rem, 3vw, 1.8rem) 0;
      background: linear-gradient(90deg, transparent, var(--accent-color), transparent);
    }

    .gl-portada__fecha {
      display: inline-block;
      padding: 0.6rem 1.7rem;
      border: 1px solid var(--surface-border-color);
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.35);
      font-family: Arial, Helvetica, sans-serif;
      font-size: clamp(0.7rem, 1.4vw, 0.82rem);
      letter-spacing: 0.38em;
      text-transform: uppercase;
      color: var(--text-color);
    }

    .gl-portada__foto {
      position: absolute;
      z-index: 3;
      right: clamp(0.6rem, 4vw, 3rem);
      bottom: clamp(1rem, 4vw, 2.6rem);
      width: clamp(110px, 15vw, 160px);
      margin: 0;
      padding: 7px;
      background: rgba(255, 255, 255, 0.5);
      border: 1px solid var(--surface-border-color);
      border-radius: 16px;
      box-shadow: 0 20px 44px rgba(34, 48, 56, 0.24);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      transform: rotate(4deg) translateZ(70px);
      transition: transform 0.5s ease;
    }
    .gl-portada__foto:hover { transform: rotate(0deg) translateZ(90px); }
    .gl-portada__foto img {
      color: transparent;
      display: block;
      width: 100%;
      height: auto;
      aspect-ratio: 4 / 5;
      object-fit: cover;
      border-radius: 10px;
      filter: saturate(0.92);
    }

    @media (max-width: 720px) {
      .gl-portada__foto { position: static; margin: 1.6rem auto 0; transform: rotate(-3deg); }
    }

    @media (prefers-reduced-motion: reduce) {
      .gl-portada * { animation: none !important; transition: none !important; }
      .gl-portada__titulo span { opacity: 1; transform: none; filter: none; }
    }
  </style>

  <svg class="gl-portada__prisma" viewBox="0 0 300 200" fill="none" aria-hidden="true">

    <path d="M150 12 L150 176 M150 12 L60 176 M150 12 L240 176" stroke="currentColor" stroke-width="0.7" opacity="0.7"/>
    <path d="M38 176 L0 200 M262 176 L300 200 M150 176 L150 200" stroke="currentColor" stroke-width="0.7" opacity="0.5"/>
    <circle cx="150" cy="94" r="34" stroke="currentColor" stroke-width="0.9" opacity="0.8"/>
  </svg>

  <div class="gl-portada__panel">
    <svg class="gl-portada__lente" viewBox="0 0 90 90" fill="none" aria-hidden="true">
      <circle cx="45" cy="45" r="40" stroke="currentColor" stroke-width="1.4"/>
      <circle cx="45" cy="45" r="26" stroke="currentColor" stroke-width="1"/>
      <path d="M45 5 A40 40 0 0 1 85 45" stroke="currentColor" stroke-width="2.4"/>
      <path d="M45 19 A26 26 0 0 1 71 45" stroke="currentColor" stroke-width="1.6"/>
    </svg>

    <p class="gl-portada__eyebrow" memory_type="text" memory_usage="custom" memory_key="portada-encabezado">A través del cristal</p>

    <div memory_type="text" memory_usage="custom" memory_key="portada-nombres">
      <h1 id="gl-portada-titulo" class="gl-portada__titulo">
        <span>Nombre de la Novia</span>
        <span class="gl-portada__ampersand">&amp;</span>
        <span>Nombre del Novio</span>
      </h1>
    </div>

    <div class="gl-portada__luz" aria-hidden="true"></div>

    <time class="gl-portada__fecha" datetime="YYYY-MM-DD" memory_type="text" memory_usage="custom" memory_key="portada-fecha">Fecha del evento</time>
  </div>

  <figure class="gl-portada__foto" memory_type="image" memory_usage="custom" memory_source="library" memory_key="portada-foto">
    <img
      src="https://loremflickr.com/420/520/couple,glass"
      alt="Retrato de los anfitriones"
      path="placeholder"
      data-library-category="bodas"
      data-asset-type="foto-pareja"
      loading="lazy"
    />
    <figcaption hidden>Retrato principal</figcaption>
  </figure>

  <script>
    (function () {
      var root = document.currentScript ? document.currentScript.closest('section') : document.querySelector('.gl-portada');
      if (!root) return;
      root.classList.add('gl-js');
      window.setTimeout(function () { root.classList.add('esta-visto'); }, 2500); // red de seguridad: nunca dejar contenido oculto
      var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
      if (reduce || !('IntersectionObserver' in window)) { root.classList.add('esta-visto'); return; }
      var io = new IntersectionObserver(function (entries) {
        entries.forEach(function (entry) {
          if (entry.isIntersecting) { root.classList.add('esta-visto'); io.disconnect(); }
        });
      }, { threshold: 0.22 });
      io.observe(root);
    })();
  </script>

  <script>

      tipo: 'portada'
    };
  </script>
</section>
