<section
  class="mu-galeria"
  data-gemini-id="galeria-museo-pasillo"
>
  <style>
    .mu-galeria {
      --primary-color: #2a2724;
      --secondary-color: #75705f;
      --accent-color: #b3925a;
      --bg-color: #f4f1ea;
      --surface-color: #fdfbf6;
      --surface-border-color: rgba(42, 39, 36, 0.16);
      --text-color: #2a2724;

      position: relative;
      isolation: isolate;
      box-sizing: border-box;
      padding: clamp(3rem, 8vw, 6rem) clamp(1rem, 5vw, 4rem);
      background-color: var(--bg-color);
      color: var(--text-color);
      text-align: center;
    }
    .mu-galeria *,
    .mu-galeria *::before,
    .mu-galeria *::after { box-sizing: border-box; }

    .mu-galeria__cabecera {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 1rem;
      width: min(100%, 1080px);
      margin: 0 auto clamp(1.8rem, 4vw, 2.6rem);
      border-bottom: 2px solid var(--primary-color);
      padding-bottom: 0.8rem;
      text-align: left;
    }
    .mu-galeria__titulo {
      margin: 0;
      font-family: Georgia, 'Times New Roman', serif;
      font-weight: 400;
      font-size: clamp(1.6rem, 3.6vw, 2.3rem);
      color: var(--primary-color);
    }
    .mu-galeria__folio {
      font-family: Georgia, 'Times New Roman', serif;
      font-size: clamp(0.6rem, 1.1vw, 0.7rem);
      letter-spacing: 0.3em;
      text-transform: uppercase;
      color: var(--accent-color);
    }

    .mu-galeria__pasillo {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(min(250px, 100%), 1fr));
      gap: clamp(1.4rem, 3.4vw, 2.4rem);
      width: min(100%, 1080px);
      margin: 0 auto;
    }

    .mu-galeria__lienzo {
      position: relative;
      margin: 0;
      transition: opacity 0.5s ease, transform 0.5s cubic-bezier(0.22, 0.8, 0.3, 1);
    }
    .mu-galeria.bh-js .mu-galeria__lienzo,
    .mu-galeria.mu-js .mu-galeria__lienzo { opacity: 0; transform: translateY(22px); }
    .mu-galeria .mu-galeria__lienzo.esta-visto { opacity: 1; transform: none; }

    .mu-galeria__lienzo img {
      color: transparent;
      display: block;
      width: 100%;
      height: auto;
      aspect-ratio: 4 / 5;
      object-fit: cover;
      border: 10px solid var(--surface-color);
      outline: 1px solid var(--surface-border-color);
      box-shadow: 0 22px 48px rgba(42, 39, 36, 0.2), inset 0 0 0 1px var(--surface-border-color);
      filter: saturate(0.9);
      cursor: pointer;
    }
    .mu-galeria__lienzo:nth-child(odd) img { transform: rotate(-1.2deg); }
    .mu-galeria__lienzo:nth-child(even) img { transform: rotate(1.2deg); }
    .mu-galeria__lienzo figcaption {
      margin-top: 0.8rem;
      display: grid;
      gap: 0.15rem;
    }
    .mu-galeria__titulo-obra {
      font-family: Georgia, 'Times New Roman', serif;
      font-size: clamp(0.84rem, 1.6vw, 0.96rem);
      color: var(--primary-color);
    }
    .mu-galeria__detalle-obra {
      font-family: Georgia, 'Times New Roman', serif;
      font-style: italic;
      font-size: clamp(0.66rem, 1.2vw, 0.74rem);
      color: var(--secondary-color);
    }

    .mu-galeria__lightbox {
      position: fixed;
      inset: 0;
      z-index: 9999;
      display: none;
      place-items: center;
      padding: clamp(1rem, 4vw, 3rem);
      background: color-mix(in srgb, var(--primary-color) 88%, black);
    }
    .mu-galeria__lightbox.abierto { display: grid; }
    .mu-galeria__lightbox img {
      max-width: min(920px, 92vw);
      max-height: 80svh;
      width: auto;
      height: auto;
      border: 12px solid var(--surface-color);
      box-shadow: 0 30px 80px rgba(0, 0, 0, 0.55);
    }
    .mu-galeria__cerrar {
      position: absolute;
      top: clamp(0.8rem, 2.5vw, 1.6rem);
      right: clamp(0.8rem, 2.5vw, 1.6rem);
      width: 44px;
      height: 44px;
      border: 1px solid var(--accent-color);
      border-radius: 50%;
      background: transparent;
      color: var(--accent-color);
      font-size: 1.2rem;
      line-height: 1;
      cursor: pointer;
      transition: transform 0.4s ease, background 0.4s ease;
    }
    .mu-galeria__cerrar:hover { transform: rotate(90deg); background: color-mix(in srgb, var(--accent-color) 25%, transparent); }

    @media (max-width: 560px) {
      .mu-galeria__pasillo { grid-template-columns: repeat(auto-fit, minmax(min(160px, 100%), 1fr)); gap: 1rem; }
      .mu-galeria__lienzo img { border-width: 7px; }
    }

    @media (prefers-reduced-motion: reduce) {
      .mu-galeria * { transition: none !important; }
      .mu-galeria__lienzo { opacity: 1 !important; transform: none !important; }
      .mu-galeria__lienzo img { transform: none !important; }
    }
  </style>

  <header class="mu-galeria__cabecera" memory_type="text" memory_usage="custom" memory_key="galeria-cabecera">
    <h2 class="mu-galeria__titulo" memory_type="text" memory_usage="custom" memory_key="galeria-titulo">Pasillo de recuerdos</h2>
    <span class="mu-galeria__folio" memory_type="text" memory_usage="custom" memory_key="galeria-folio">Sala permanente</span>
  </header>

      <img src="https://loremflickr.com/480/600/gala,dinner" alt="Obra dos" path="placeholder" data-library-category="bodas" data-asset-type="galeria" loading="lazy" />
      <figcaption>

    <figure class="mu-galeria__lienzo" data-mu-lienzo memory_type="image" memory_usage="custom" memory_source="library" memory_key="galeria-foto-3" tabindex="0" role="button" aria-label="Ampliar obra tres">
      <img src="https://loremflickr.com/480/600/gold,celebration" alt="Obra tres" path="placeholder" data-library-category="bodas" data-asset-type="galeria" loading="lazy" />
      <figcaption>

      <img src="https://loremflickr.com/480/600/museum,dance" alt="Obra cuatro" path="placeholder" data-library-category="bodas" data-asset-type="galeria" loading="lazy" />
      <figcaption>
        <span class="mu-galeria__titulo-obra" memory_type="text" memory_usage="custom" memory_key="galeria-titulo-4">«Danza final»</span>

      <img src="https://loremflickr.com/480/600/classic,flowers" alt="Obra cinco" path="placeholder" data-library-category="bodas" data-asset-type="galeria" loading="lazy" />

  <script>
    (function () {
      var root = document.currentScript ? document.currentScript.closest('section') : document.querySelector('.mu-galeria');
      if (!root) return;
      root.classList.add('mu-js');
      window.setTimeout(function () { root.classList.add('esta-visto'); }, 2500); // red de seguridad: nunca dejar contenido oculto

      var lienzos = Array.prototype.slice.call(root.querySelectorAll('[data-mu-lienzo]'));
      var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
      if (('IntersectionObserver' in window) && !reduce) {
        var io = new IntersectionObserver(function (entries) {
          entries.forEach(function (entry) {
            if (!entry.isIntersecting) return;
            var i = lienzos.indexOf(entry.target);
            entry.target.style.transitionDelay = (Math.min(i, 5) * 0.09).toFixed(2) + 's';
            entry.target.classList.add('esta-visto');
            io.unobserve(entry.target);
          });
        }, { threshold: 0.15 });
        lienzos.forEach(function (l) { io.observe(l); });
      } else {
        lienzos.forEach(function (l) { l.classList.add('esta-visto'); });
      }

      var lightbox = document.createElement('div');
      lightbox.className = 'mu-galeria__lightbox';
      lightbox.setAttribute('role', 'dialog');
      lightbox.setAttribute('aria-modal', 'true');
      lightbox.setAttribute('aria-label', 'Vista ampliada');
      lightbox.innerHTML =
        '<img alt="" />' +
        '<button type="button" class="mu-galeria__cerrar" aria-label="Cerrar">×</button>';
      root.appendChild(lightbox);
      var imgAmpliada = lightbox.querySelector('img');
      var botonCerrar = lightbox.querySelector('.mu-galeria__cerrar');

      function abrir(fig) {
        var foto = fig.querySelector('img');
        if (!foto) return;
        imgAmpliada.src = foto.src;
        imgAmpliada.alt = foto.alt;
        lightbox.classList.add('abierto');
      }
      function cerrar() { lightbox.classList.remove('abierto'); }

      lienzos.forEach(function (fig) {
        fig.querySelector('img').addEventListener('click', function () { abrir(fig); });
        fig.addEventListener('keydown', function (e) {
          if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); abrir(fig); }
        });
      });
      botonCerrar.addEventListener('click', cerrar);
      lightbox.addEventListener('click', function (e) { if (e.target === lightbox) cerrar(); });
    })();
  </script>
