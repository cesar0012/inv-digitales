<section
  class="mu-countdown"
  data-gemini-id="countdown-museo-cuenta"
  path="placeholder"
  memory_source="generated"
  memory_type="background"
  memory_usage="protected"
  data-countdown-target="YYYY-MM-DDTHH:MM:SS"
>
  <style>
    .mu-countdown {
      position: relative;
      isolation: isolate;
      overflow: hidden;
      box-sizing: border-box;
      min-height: 660px;
      display: grid;
      place-items: center;
      padding: clamp(3rem, 7vw, 5rem) clamp(1rem, 5vw, 3rem);
      background-color: var(--bg-color, #f4f1ea);
      background-image: url('https://loremflickr.com/1600/900/museum,gold');
      background-size: cover;
      background-position: center;
      color: var(--text-color, #2a2724);
      text-align: center;
      perspective: 900px;
    }
    .mu-countdown *,
    .mu-countdown *::before,
    .mu-countdown *::after { box-sizing: border-box; }

    .mu-countdown::before {
      content: '';
      position: absolute;
      inset: 0;
      z-index: -1;
      background:
        radial-gradient(60% 40% at 50% 0%, color-mix(in srgb, var(--accent-color, #b3925a) 20%, transparent), transparent 70%),
        color-mix(in srgb, var(--bg-color, #f4f1ea) 90%, transparent);
    }

    .mu-countdown__etiqueta {
      margin: 0 0 0.55rem;
      font-family: Georgia, 'Times New Roman', serif;
      font-size: clamp(0.6rem, 1.15vw, 0.68rem);
      letter-spacing: 0.44em;
      text-transform: uppercase;
      color: var(--accent-color, #b3925a);
    }
    .mu-countdown__titulo {
      margin: 0 0 0.4rem;
      font-family: Georgia, 'Times New Roman', serif;
      font-weight: 400;
      font-size: clamp(1.75rem, 4vw, 2.7rem);
      color: var(--primary-color, #2a2724);
    }
    .mu-countdown__fecha {
      display: block;
      margin-bottom: clamp(1.6rem, 4vw, 2.4rem);
      font-family: Georgia, 'Times New Roman', serif;
      font-size: clamp(0.76rem, 1.5vw, 0.88rem);
      letter-spacing: 0.3em;
      text-transform: uppercase;
      color: var(--secondary-color, #75705f);
    }

    .mu-countdown__flip {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: clamp(0.8rem, 2.2vw, 1.4rem);
      max-width: 680px;
      margin: 0 auto;
      transform-style: preserve-3d;
    }
    .mu-countdown__carta {
      position: relative;
      padding: clamp(1.3rem, 3.2vw, 2rem) 0.4rem clamp(1.1rem, 2.6vw, 1.6rem);
      background: var(--surface-color, #fdfbf6);
      border: 1px solid var(--surface-border-color, rgba(42, 39, 36, 0.16));
      box-shadow: 0 20px 44px rgba(42, 39, 36, 0.2);
      transform: rotateX(0deg);
      transition: transform 0.5s cubic-bezier(0.22, 0.8, 0.3, 1);
      transform-style: preserve-3d;
    }
    .mu-countdown__carta.giro { transform: rotateX(-38deg); }
    .mu-countdown__carta::before {
      content: '';
      position: absolute;
      left: 10%;
      right: 10%;
      top: 50%;
      height: 1px;
      background: color-mix(in srgb, var(--primary-color, #2a2724) 20%, transparent);
    }
    .mu-countdown__numero {
      display: block;
      font-family: Georgia, 'Times New Roman', serif;
      font-size: clamp(1.9rem, 5.2vw, 3.1rem);
      font-variant-numeric: tabular-nums;
      line-height: 1;
      color: var(--primary-color, #2a2724);
    }
    .mu-countdown__rotulo {
      display: block;
      margin-top: 0.55rem;
      font-family: Georgia, 'Times New Roman', serif;
      font-size: clamp(0.54rem, 1.05vw, 0.62rem);
      letter-spacing: 0.36em;
      text-transform: uppercase;
      color: var(--accent-color, #b3925a);
    }

    .mu-countdown__pie {
      margin-top: clamp(1.4rem, 3.4vw, 2rem);
      font-family: Georgia, 'Times New Roman', serif;
      font-style: italic;
      font-size: clamp(0.78rem, 1.5vw, 0.9rem);
      color: var(--secondary-color, #75705f);
    }

    @media (max-width: 560px) {
      .mu-countdown__flip { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .mu-countdown { min-height: 600px; }
    }

    @media (prefers-reduced-motion: reduce) {
      .mu-countdown__carta { transition: none; }
      .mu-countdown__carta.giro { transform: none; }
    }
  </style>

  <div class="mu-countdown__contenido">
    <p class="mu-countdown__etiqueta" memory_type="text" memory_usage="custom" memory_key="countdown-etiqueta">Inauguración en</p>
    <h2 class="mu-countdown__titulo" memory_type="text" memory_usage="custom" memory_key="countdown-titulo">Cuenta regresiva</h2>
    <time class="mu-countdown__fecha" datetime="YYYY-MM-DDTHH:MM:SS" memory_type="text" memory_usage="custom" memory_key="countdown-fecha">Fecha del evento</time>

    <div class="mu-countdown__flip" aria-label="Cuenta regresiva">
      <div class="mu-countdown__carta" data-mu-carta="days"><span class="mu-countdown__numero" data-countdown-unit="days">--</span><span class="mu-countdown__rotulo">Días</span></div>
      <div class="mu-countdown__carta" data-mu-carta="hours"><span class="mu-countdown__numero" data-countdown-unit="hours">--</span><span class="mu-countdown__rotulo">Horas</span></div>
      <div class="mu-countdown__carta" data-mu-carta="minutes"><span class="mu-countdown__numero" data-countdown-unit="minutes">--</span><span class="mu-countdown__rotulo">Min</span></div>
      <div class="mu-countdown__carta" data-mu-carta="seconds"><span class="mu-countdown__numero" data-countdown-unit="seconds">--</span><span class="mu-countdown__rotulo">Seg</span></div>
    </div>

    <p class="mu-countdown__pie" memory_type="text" memory_usage="custom" memory_key="countdown-pie">La sala abre sus puertas puntualmente.</p>
  </div>

  <script>
    (function () {
      var el = null;
      try { el = document.currentScript.closest('[data-gemini-id^="countdown"]'); } catch (e) {}
      if (!el) el = document.querySelector('[data-gemini-id^="countdown"]');
      if (!el) return;

      var previos = {};
      var target = NaN;
      var attr = el.getAttribute('data-countdown-target');
      if (attr && attr.indexOf('YYYY') === -1) { var p = new Date(attr); if (!isNaN(p.getTime())) target = p.getTime(); }
      if (isNaN(target) && window.__countdownTarget) { var p1 = new Date(window.__countdownTarget); if (!isNaN(p1.getTime())) target = p1.getTime(); }
      if (isNaN(target) && window.countdown_target) { var p2 = new Date(window.countdown_target); if (!isNaN(p2.getTime())) target = p2.getTime(); }

      var intervalId = null;
      (window.__countdownIntervals = window.__countdownIntervals || []).forEach(clearInterval);
      window.__countdownIntervals = [];

      function pad2(n) { return n < 10 ? '0' + n : '' + n; }
      function setUnit(unit, value) {
        var node = el.querySelector('[data-countdown-unit="' + unit + '"]');
        if (!node) return;
        node.textContent = value;
        if (previos[unit] !== undefined && previos[unit] !== String(value)) {
          var carta = el.querySelector('[data-mu-carta="' + unit + '"]');
          if (carta && !window.matchMedia('(prefers-reduced-motion: reduce)').matches) {
            carta.classList.add('giro');
            setTimeout(function () { carta.classList.remove('giro'); }, 300);
          }
        }
        previos[unit] = String(value);
      }
      function tick() {
        if (!Number.isFinite(target)) return;
        var diff = Math.max(target - Date.now(), 0);
        setUnit('days', Math.floor(diff / 86400000));
        setUnit('hours', pad2(Math.floor((diff % 86400000) / 3600000)));
        setUnit('minutes', pad2(Math.floor((diff % 3600000) / 60000)));
        setUnit('seconds', pad2(Math.floor((diff % 60000) / 1000)));
        if (diff === 0 && intervalId !== null) {
          clearInterval(intervalId);
          intervalId = null;
          window.__countdownIntervals = [];
        }
      }
      function start(newTarget) {
        if (newTarget) { var p = new Date(newTarget); if (!isNaN(p.getTime())) target = p.getTime(); }
        (window.__countdownIntervals || []).forEach(clearInterval);
        window.__countdownIntervals = [];
        intervalId = null;
        if (!Number.isFinite(target)) return;
        tick();
        if (target > Date.now()) {
          intervalId = setInterval(tick, 1000);
          window.__countdownIntervals.push(intervalId);
        }
      }
      start();
      window.updateCountdown = start;
    })();
  </script>

  <script>
    var moduleMetadata = {
      module_type: 'countdown',
      module_name: 'countdown-museo-cuenta',
      style_name: 'Cartas de Museo',
      descripcion: 'Cartas de estación con línea de pliegue central que giran en rotateX al cambiar de valor; foco dorado superior de sala.',
      tags: ['countdown', 'cuenta regresiva', 'museo', 'flip', '3d', 'cartas'],
      tipo: 'countdown'
    };
  </script>
</section>
