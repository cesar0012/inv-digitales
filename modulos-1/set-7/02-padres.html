<section
  class="mu-padres"
  data-gemini-id="padres-padre"
  memory_type="background"
  memory_usage="protected"
  memory_source="generated"
  path="placeholder"
>
  <style>
    .mu-padres {
      --primary-color: #2a2724;
      --secondary-color: #75705f;
      --accent-color: #b3925a;
      --bg-color: #f4f1ea;
      --surface-color: #fdfbf6;
      --surface-border-color: rgba(42, 39, 36, 0.16);
      --text-color: #2a2724;

      position: relative;
      isolation: isolate;
      box-sizing: border-box;
      padding: clamp(3rem, 8vw, 6rem) clamp(1rem, 5vw, 4rem);
      background-color: var(--bg-color);
      background-image: url('https://loremflickr.com/1600/900/gallery,marble');
      background-size: cover;
      background-position: center;
      color: var(--text-color);
      text-align: center;
      perspective: 1100px;
    }
    .mu-padres *,
    .mu-padres *::before,
    .mu-padres *::after { box-sizing: border-box; }

    .mu-padres::before {
      content: '';
      position: absolute;
      inset: 0;
      z-index: -1;
      background: color-mix(in srgb, var(--bg-color) 90%, transparent);
    }

    .mu-padres__titulo {
      margin: 0 0 0.5rem;
      font-family: Georgia, 'Times New Roman', serif;
      font-weight: 400;
      font-size: clamp(1.7rem, 3.8vw, 2.4rem);
      color: var(--primary-color);
    }
    .mu-padres__intro {
      margin: 0 auto clamp(2rem, 5vw, 3rem);
      max-width: 50ch;
      font-family: Georgia, 'Times New Roman', serif;
      font-size: clamp(0.86rem, 1.55vw, 0.98rem);
      line-height: 1.7;
      font-style: italic;
      color: var(--secondary-color);
    }

    .mu-padres__salas {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: clamp(1.6rem, 4.4vw, 3.2rem);
      width: min(100%, 880px);
      margin: 0 auto;
      transform-style: preserve-3d;
    }

    .mu-padres__sala {
      position: relative;
      padding: clamp(1.8rem, 4vw, 2.6rem) clamp(1.2rem, 3vw, 1.9rem) 0;
      background:
        radial-gradient(120% 55% at 50% 0%, color-mix(in srgb, var(--accent-color) 20%, transparent), transparent 62%),
        color-mix(in srgb, var(--surface-color) 96%, transparent);
      border: 1px solid var(--surface-border-color);
      border-bottom: none;
      box-shadow: inset 0 10px 26px rgba(42, 39, 36, 0.08);
      transition: opacity 0.5s ease, transform 0.5s cubic-bezier(0.22, 0.8, 0.3, 1);
      transform-style: preserve-3d;
    }
    .mu-padres.mu-js .mu-padres__sala { opacity: 0; transform: rotateX(26deg) translateY(22px); transform-origin: bottom center; }
    .mu-padres .mu-padres__sala.esta-visto { opacity: 1; transform: rotateX(0) translateY(0); }

    .mu-padres__pedestal {
      position: relative;
      width: clamp(110px, 15vw, 140px);
      margin: 0 auto;
      transform-style: preserve-3d;
    }
    .mu-padres__retrato {
      display: block;
      margin: 0;
      padding: 6px;
      background: var(--bg-color);
      border: 1px solid var(--surface-border-color);
      border-radius: 50%;
      box-shadow: 0 14px 30px rgba(42, 39, 36, 0.2);
      transform: translateZ(18px);
    }
    .mu-padres__retrato img {
      color: transparent;
      display: block;
      width: 100%;
      height: auto;
      aspect-ratio: 1 / 1;
      border-radius: 50%;
      object-fit: cover;
      filter: saturate(0.9);
    }
    .mu-padres__columna {
      height: clamp(46px, 7vw, 64px);
      margin-top: -8px;
      background:
        linear-gradient(90deg, color-mix(in srgb, var(--secondary-color) 55%, transparent) 0 12%, transparent 12% 88%, color-mix(in srgb, var(--secondary-color) 55%, transparent) 88%),
        repeating-linear-gradient(0deg, color-mix(in srgb, var(--surface-color) 90%, var(--secondary-color)) 0 12px, color-mix(in srgb, var(--surface-color) 70%, var(--secondary-color)) 12px 14px);
      border: 1px solid var(--surface-border-color);
      border-top: none;
      box-shadow: 0 16px 26px rgba(42, 39, 36, 0.18);
    }

    .mu-padres__placa {
      position: relative;
      margin: 0 auto;
      width: min(100%, 240px);
      padding: 0.6rem 0.9rem;
      transform: translateZ(10px);
      background: linear-gradient(180deg, color-mix(in srgb, var(--accent-color) 62%, #8a6d3b), color-mix(in srgb, var(--accent-color) 40%, #6d5527));
      color: #fdfbf6;
      border-radius: 3px;
      box-shadow: 0 8px 16px rgba(42, 39, 36, 0.3);
    }
    .mu-padres__rol {
      margin: 0 0 0.2rem;
      font-family: Georgia, 'Times New Roman', serif;
      font-size: clamp(0.56rem, 1vw, 0.64rem);
      letter-spacing: 0.3em;
      text-transform: uppercase;
      opacity: 0.85;
    }
    .mu-padres__nombres {
      margin: 0;
      font-family: Georgia, 'Times New Roman', serif;
      font-size: clamp(0.94rem, 1.9vw, 1.14rem);
      line-height: 1.3;
    }

    @media (max-width: 740px) {
      .mu-padres__salas { grid-template-columns: 1fr; max-width: 380px; }
    }

    @media (prefers-reduced-motion: reduce) {
      .mu-padres * { transition: none !important; }
      .mu-padres__sala { opacity: 1 !important; transform: none !important; }
    }
  </style>

  <header memory_type="text" memory_usage="custom" memory_key="padres-intro">
    <h2 class="mu-padres__titulo" memory_type="text" memory_usage="custom" memory_key="padres-titulo">Colección fundadora</h2>
    <p class="mu-padres__intro" memory_type="text" memory_usage="custom" memory_key="padres-texto">Las dos salas donde comienza todo: las familias que hicieron posible esta exposición.</p>
  </header>

  <div class="mu-padres__salas">
    <article class="mu-padres__sala" data-mu-sala>
      <figure class="mu-padres__pedestal" memory_type="image" memory_usage="custom" memory_source="library" memory_key="padres-retrato-uno">
        <span class="mu-padres__retrato">
          <img src="https://loremflickr.com/380/380/family,portrait" alt="Retrato de la familia de la novia" path="placeholder" data-library-category="bodas" data-asset-type="retrato-familia" loading="lazy" />
        </span>
        <figcaption hidden>Familia uno</figcaption>
      </figure>
      <div class="mu-padres__columna" aria-hidden="true"></div>
      <div class="mu-padres__placa" memory_type="text" memory_usage="custom" memory_key="padres-bloque-uno">
        <p class="mu-padres__rol">Padres de la novia</p>
        <h3 class="mu-padres__nombres">Nombre Papá &amp; Nombre Mamá</h3>
      </div>
    </article>

    <article class="mu-padres__sala" data-mu-sala>
      <figure class="mu-padres__pedestal" memory_type="image" memory_usage="custom" memory_source="library" memory_key="padres-retrato-dos">
        <span class="mu-padres__retrato">
          <img src="https://loremflickr.com/380/380/parents,love" alt="Retrato de la familia del novio" path="placeholder" data-library-category="bodas" data-asset-type="retrato-familia" loading="lazy" />
        </span>
        <figcaption hidden>Familia dos</figcaption>
      </figure>
      <div class="mu-padres__columna" aria-hidden="true"></div>
      <div class="mu-padres__placa" memory_type="text" memory_usage="custom" memory_key="padres-bloque-dos">
        <p class="mu-padres__rol">Padres del novio</p>
        <h3 class="mu-padres__nombres">Nombre Papá &amp; Nombre Mamá</h3>
      </div>
    </article>
  </div>

  <script>
    (function () {
      var root = document.currentScript ? document.currentScript.closest('section') : document.querySelector('.mu-padres');
      if (!root) return;
      root.classList.add('mu-js');
      window.setTimeout(function () { root.classList.add('esta-visto'); }, 2500); // red de seguridad: nunca dejar contenido oculto
      var salas = Array.prototype.slice.call(root.querySelectorAll('[data-mu-sala]'));
      var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
      if (reduce || !('IntersectionObserver' in window)) {
        salas.forEach(function (s) { s.classList.add('esta-visto'); });
        return;
      }
      var io = new IntersectionObserver(function (entries) {
        entries.forEach(function (entry) {
          if (!entry.isIntersecting) return;
          var i = salas.indexOf(entry.target);
          entry.target.style.transitionDelay = (Math.max(i, 0) * 0.16).toFixed(2) + 's';
          entry.target.classList.add('esta-visto');
          io.unobserve(entry.target);
        });
      }, { threshold: 0.25 });
      salas.forEach(function (s) { io.observe(s); });
    })();
  </script>

  <script>
    var moduleMetadata = {

      tipo: 'padres'
    };
  </script>
</section>
