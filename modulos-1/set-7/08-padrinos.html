    .mu-padrinos.mu-js .mu-padrinos__mural { opacity: 0; transform: translateY(24px) rotate(1.5deg); }

    .mu-padrinos.mu-js .mu-padrinos__mural:nth-child(even) { transform: translateY(24px) rotate(-1.5deg); }
    .mu-padrinos.mu-js .mu-padrinos__mural:nth-child(even).esta-visto { transform: none; }

    .mu-padrinos__marco {

    @media (max-width: 860px) {

    }
    @media (max-width: 440px) {

    }

    @media (prefers-reduced-motion: reduce) {
      .mu-padrinos * { transition: none !important; }

  <script>
    (function () {
      var root = document.currentScript ? document.currentScript.closest('section') : document.querySelector('.mu-padrinos');
      if (!root) return;
      root.classList.add('mu-js');
      window.setTimeout(function () { root.classList.add('esta-visto'); }, 2500); // red de seguridad: nunca dejar contenido oculto
      var murales = Array.prototype.slice.call(root.querySelectorAll('[data-mu-mural]'));
      var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
      if (reduce || !('IntersectionObserver' in window)) {
        murales.forEach(function (m) { m.classList.add('esta-visto'); });
        return;
      }
      var io = new IntersectionObserver(function (entries) {
        entries.forEach(function (entry) {
          if (!entry.isIntersecting) return;
          var i = murales.indexOf(entry.target);
          entry.target.style.transitionDelay = (Math.max(i, 0) * 0.12).toFixed(2) + 's';
          entry.target.classList.add('esta-visto');
          io.unobserve(entry.target);
        });
      }, { threshold: 0.2 });
      murales.forEach(function (m) { io.observe(m); });
    })();
  </script>
