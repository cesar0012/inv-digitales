  <style>
    .dc-portada {
      --primary-color: #1f1a17;
      --secondary-color: #6e6257;
      --accent-color: #b08d57;
      --bg-color: #f4efe6;
      --surface-color: #fbf7ee;
      --surface-border-color: rgba(31, 26, 23, 0.25);
      --text-color: #1f1a17;

      position: relative;
      isolation: isolate;
      overflow: hidden;
      box-sizing: border-box;
      min-height: 100svh;
      display: grid;
      place-items: center;
      padding: clamp(2.5rem, 6vw, 5rem) clamp(1rem, 5vw, 4rem);
      background-color: var(--bg-color);
      background-image: url('https://loremflickr.com/1600/900/gold,elegant');
      background-size: cover;
      background-position: center;
      color: var(--text-color);
      text-align: center;
    }
    .dc-portada *,
    .dc-portada *::before,
    .dc-portada *::after { box-sizing: border-box; }

    .dc-portada::before {
      content: '';
      position: absolute;
      inset: 0;
      z-index: -1;
      background: linear-gradient(180deg, color-mix(in srgb, var(--bg-color) 90%, transparent), color-mix(in srgb, var(--bg-color) 80%, transparent));
    }

    .dc-portada__sol {
      position: absolute;
      z-index: 0;
      top: 50%;
      left: 50%;
      width: min(130vw, 1080px);
      transform: translate(-50%, -54%);
      color: var(--accent-color);
      opacity: 0.16;
      pointer-events: none;
      animation: dcPortadaGiro 80s linear infinite;
    }
    @keyframes dcPortadaGiro { to { transform: translate(-50%, -54%) rotate(360deg); } }

    .dc-portada__escena {
      position: relative;
      z-index: 1;
      width: min(100%, 760px);
      padding: clamp(2.4rem, 6vw, 4.2rem) clamp(1.3rem, 5vw, 3.6rem);
      background: color-mix(in srgb, var(--surface-color) 93%, transparent);
      border: 1px solid var(--surface-border-color);
      box-shadow: 0 30px 70px rgba(31, 26, 23, 0.22);
    }
    .dc-portada__escena::before {
      content: '';
      position: absolute;
      inset: 10px;
      border: 1px solid var(--accent-color);
      pointer-events: none;
    }
    .dc-portada__escena::after {
      content: '';
      position: absolute;
      inset: 16px;
      border: 3px double var(--surface-border-color);
      pointer-events: none;
    }

    .dc-portada__arco {
      width: clamp(120px, 20vw, 170px);
      margin: 0 auto clamp(1.2rem, 3vw, 1.8rem);
      padding: 6px;
      border: 1px solid var(--surface-border-color);
      border-radius: 999px 999px 6px 6px;
      background: var(--bg-color);
      box-shadow: 0 14px 30px rgba(31, 26, 23, 0.18);
      transition: opacity 0.5s ease, transform 0.5s cubic-bezier(0.22, 0.8, 0.3, 1);
    }
    .dc-portada.dc-js .dc-portada__arco { opacity: 0; transform: translateY(14px); }
    .dc-portada.esta-visto .dc-portada__arco { opacity: 1; transform: none; }
    .dc-portada__arco img {
      color: transparent;
      display: block;
      width: 100%;
      height: auto;
      aspect-ratio: 4 / 5;
      object-fit: cover;
      border-radius: 999px 999px 4px 4px;
      filter: saturate(0.92);
    }

    .dc-portada__eyebrow {
      margin: 0 0 1rem;
      font-family: Arial, Helvetica, sans-serif;
      font-size: clamp(0.62rem, 1.2vw, 0.72rem);
      letter-spacing: 0.5em;
      text-transform: uppercase;
      color: var(--secondary-color);
    }

    .dc-portada__titulo {
      margin: 0;
      font-family: Georgia, 'Times New Roman', serif;
      font-weight: 400;
      font-size: clamp(2rem, 6.4vw, 4.4rem);
      line-height: 1.05;
      letter-spacing: 0.03em;
      color: var(--primary-color);
      text-shadow: 0.03em 0.03em 0 color-mix(in srgb, var(--accent-color) 45%, transparent);
    }
    .dc-portada__titulo span {
      display: inline-block;
      transition: opacity 0.5s ease, transform 0.5s cubic-bezier(0.22, 0.8, 0.3, 1);
    }
    .dc-portada.dc-js .dc-portada__titulo span { opacity: 0; transform: translateY(0.4em); }
    .dc-portada.esta-visto .dc-portada__titulo span { opacity: 1; transform: none; }
    .dc-portada.esta-visto .dc-portada__titulo span:nth-child(1) { transition-delay: 0.05s; }
    .dc-portada.esta-visto .dc-portada__titulo span:nth-child(2) { transition-delay: 0.15s; }
    .dc-portada.esta-visto .dc-portada__titulo span:nth-child(3) { transition-delay: 0.25s; }

    .dc-portada__ampersand {
      display: block;
      margin: 0.2em 0;
      font-style: italic;
      color: var(--accent-color);
    }

    .dc-portada__chevron {
      display: flex;
      justify-content: center;
      gap: 10px;
      margin: clamp(1.2rem, 3vw, 1.8rem) 0;
      color: var(--accent-color);
    }
    .dc-portada__chevron svg { width: 34px; }

    .dc-portada__fecha {
      display: inline-block;
      padding: 0.55rem 1.6rem;
      border-top: 1px solid var(--surface-border-color);
      border-bottom: 1px solid var(--surface-border-color);
      font-family: Arial, Helvetica, sans-serif;
      font-size: clamp(0.74rem, 1.5vw, 0.88rem);
      letter-spacing: 0.4em;
      text-transform: uppercase;
      color: var(--text-color);
    }

    @media (max-width: 560px) {
      .dc-portada { min-height: 100svh; }
      .dc-portada__escena { padding: 2.2rem 1.1rem; }
      .dc-portada__titulo span { display: block; }
      .dc-portada__sol { opacity: 0.1; }
    }

    @media (prefers-reduced-motion: reduce) {
      .dc-portada * { animation: none !important; transition: none !important; }
      .dc-portada__titulo span, .dc-portada__arco { opacity: 1; transform: none; }
    }
  </style>

  <script>
    (function () {
      var root = document.currentScript ? document.currentScript.closest('section') : document.querySelector('.dc-portada');
      if (!root) return;
      root.classList.add('dc-js');
      window.setTimeout(function () { root.classList.add('esta-visto'); }, 2500); // red de seguridad: nunca dejar contenido oculto
      var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
      if (reduce || !('IntersectionObserver' in window)) { root.classList.add('esta-visto'); return; }
      var io = new IntersectionObserver(function (entries) {
        entries.forEach(function (entry) {
          if (entry.isIntersecting) { root.classList.add('esta-visto'); io.disconnect(); }
        });
      }, { threshold: 0.22 });
      io.observe(root);
    })();
  </script>
