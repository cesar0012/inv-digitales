  <style>
    .dc-padres {
      --primary-color: #1f1a17;
      --secondary-color: #6e6257;
      --accent-color: #b08d57;
      --bg-color: #f4efe6;
      --surface-color: #fbf7ee;
      --surface-border-color: rgba(31, 26, 23, 0.25);
      --text-color: #1f1a17;

      position: relative;
      isolation: isolate;
      box-sizing: border-box;
      padding: clamp(3rem, 8vw, 6rem) clamp(1rem, 5vw, 4rem);
      background-color: var(--bg-color);
      background-image: url('https://loremflickr.com/1600/900/marble,texture');
      background-size: cover;
      background-position: center;
      color: var(--text-color);
      text-align: center;
    }
    .dc-padres *,
    .dc-padres *::before,
    .dc-padres *::after { box-sizing: border-box; }

    .dc-padres::before {
      content: '';
      position: absolute;
      inset: 0;
      z-index: -1;
      background: color-mix(in srgb, var(--bg-color) 88%, transparent);
    }

    .dc-padres__titulo {
      margin: 0 0 0.5rem;
      font-family: Georgia, 'Times New Roman', serif;
      font-weight: 400;
      font-size: clamp(1.7rem, 3.8vw, 2.5rem);
      letter-spacing: 0.04em;
      color: var(--primary-color);
    }
    .dc-padres__intro {
      margin: 0 auto clamp(2rem, 5vw, 3rem);
      max-width: 52ch;
      font-family: Arial, Helvetica, sans-serif;
      font-size: clamp(0.84rem, 1.5vw, 0.94rem);
      letter-spacing: 0.04em;
      line-height: 1.7;
      color: var(--secondary-color);
    }
    .dc-padres__filete {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 12px;
      margin-top: 1rem;
      color: var(--accent-color);
    }
    .dc-padres__filete::before,
    .dc-padres__filete::after {
      content: '';
      width: min(120px, 26vw);
      height: 1px;
      background: var(--accent-color);
    }

    .dc-padres__grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: clamp(1.4rem, 4vw, 2.6rem);
      width: min(100%, 880px);
      margin: 0 auto;
    }

    .dc-padres__panel {
      position: relative;
      padding: clamp(2.6rem, 5vw, 3.4rem) clamp(1.2rem, 3vw, 2rem) clamp(1.6rem, 3.5vw, 2.2rem);
      background: color-mix(in srgb, var(--surface-color) 95%, transparent);
      border: 1px solid var(--surface-border-color);
      border-radius: 999px 999px 0 0;
      box-shadow: 0 20px 48px rgba(31, 26, 23, 0.16);
      transition: opacity 0.5s ease, transform 0.5s cubic-bezier(0.22, 0.8, 0.3, 1);
    }
    .dc-padres.dc-js .dc-padres__panel { opacity: 0; transform: translateY(20px); }
    .dc-padres.esta-visto .dc-padres__panel { opacity: 1; transform: none; }
    .dc-padres.esta-visto .dc-padres__panel:nth-child(2) { transition-delay: 0.14s; }
    .dc-padres__panel::before {
      content: '';
      position: absolute;
      inset: 8px;
      border: 1px solid var(--surface-border-color);
      border-radius: 999px 999px 0 0;
      pointer-events: none;
    }

    .dc-padres__retrato {
      width: clamp(104px, 15vw, 136px);
      margin: 0 auto 1.1rem;
      padding: 5px;
      background: var(--bg-color);
      border: 1px solid var(--surface-border-color);
      border-radius: 50%;
      box-shadow: 0 0 0 5px color-mix(in srgb, var(--accent-color) 30%, transparent), 0 12px 26px rgba(31, 26, 23, 0.18);
    }
    .dc-padres__retrato img {
      color: transparent;
      display: block;
      width: 100%;
      height: auto;
      aspect-ratio: 1 / 1;
      border-radius: 50%;
      object-fit: cover;
      filter: saturate(0.9);
    }

    .dc-padres__rol {
      margin: 0 0 0.4rem;
      font-family: Arial, Helvetica, sans-serif;
      font-size: clamp(0.6rem, 1.1vw, 0.7rem);
      letter-spacing: 0.42em;
      text-transform: uppercase;
      color: var(--accent-color);
    }
    .dc-padres__nombres {
      margin: 0;
      font-family: Georgia, 'Times New Roman', serif;
      font-size: clamp(1.1rem, 2.3vw, 1.45rem);
      line-height: 1.3;
      color: var(--primary-color);
    }

    @media (max-width: 760px) {
      .dc-padres__grid { grid-template-columns: 1fr; max-width: 400px; }
      .dc-padres__panel { border-radius: 999px 999px 0 0; }
    }

    @media (prefers-reduced-motion: reduce) {
      .dc-padres * { transition: none !important; }
      .dc-padres__panel { opacity: 1; transform: none; }
    }
  </style>

  <script>
    (function () {
      var root = document.currentScript ? document.currentScript.closest('section') : document.querySelector('.dc-padres');
      if (!root) return;
      root.classList.add('dc-js');
      window.setTimeout(function () { root.classList.add('esta-visto'); }, 2500); // red de seguridad: nunca dejar contenido oculto
      var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
      if (reduce || !('IntersectionObserver' in window)) { root.classList.add('esta-visto'); return; }
      var io = new IntersectionObserver(function (entries) {
        entries.forEach(function (entry) {
          if (entry.isIntersecting) { root.classList.add('esta-visto'); io.disconnect(); }
        });
      }, { threshold: 0.2 });
      io.observe(root);
    })();
  </script>
