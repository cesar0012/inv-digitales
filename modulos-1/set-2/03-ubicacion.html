  <style>
    .dc-ubicacion {
      --primary-color: #1f1a17;
      --secondary-color: #6e6257;

      --surface-color: #fbf7ee;
      --surface-border-color: rgba(31, 26, 23, 0.25);
      --text-color: #1f1a17;

      position: relative;

      background-color: var(--bg-color);
      background-image: url('https://loremflickr.com/1600/900/architecture,elegant');

      text-align: center;
    }
    .dc-ubicacion *,

    .dc-ubicacion::before {

    .dc-ubicacion__sede {

    .dc-ubicacion__sede::before {

      border: 0;
      filter: saturate(0.85);

    .dc-ubicacion__figura {

    .dc-ubicacion__figura img {

      aspect-ratio: 4 / 3;
      object-fit: cover;
      filter: saturate(0.9);

    .dc-ubicacion__marcador {

      top: 18px;
      right: clamp(1.4rem, 4vw, 2.6rem);

      font-family: Arial, Helvetica, sans-serif;
      font-size: 0.62rem;
      letter-spacing: 0.26em;
      text-transform: uppercase;
      color: var(--text-color);
    }
    .dc-ubicacion__rombo {
      position: relative;
      width: 11px;
      height: 11px;
      transform: rotate(45deg);
      background: var(--accent-color);
    }
    .dc-ubicacion__rombo::after {
      content: '';
      position: absolute;
      inset: -7px;
      border: 1.4px solid var(--accent-color);
      opacity: 0;
      transform: scale(0.4);
    }
    .dc-ubicacion.esta-visto .dc-ubicacion__rombo::after { animation: dcUbicacionLatido 1.7s ease-out infinite; }
    @keyframes dcUbicacionLatido {
      0% { opacity: 0.9; transform: scale(0.4) rotate(0deg); }
      75% { opacity: 0.1; transform: scale(1.3) rotate(45deg); }
      100% { opacity: 0; transform: scale(1.4) rotate(45deg); }
    }

    .dc-ubicacion__acciones { margin-top: clamp(2.2rem, 5vw, 3rem); }
    .dc-ubicacion__boton {

      box-shadow: 5px 5px 0 color-mix(in srgb, var(--accent-color) 80%, transparent);
      transition: transform 0.4s ease, box-shadow 0.4s ease;
    }
    .dc-ubicacion__boton:hover { transform: translate(-2px, -2px); box-shadow: 8px 8px 0 color-mix(in srgb, var(--accent-color) 80%, transparent); }

    @media (max-width: 760px) {

      .dc-ubicacion__figura { position: static; margin: 0.8rem auto 0; transform: rotate(0deg); }
    }

    @media (prefers-reduced-motion: reduce) {
      .dc-ubicacion * { animation: none !important; transition: none !important; }
