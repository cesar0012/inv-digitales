<section
  class="pl-countdown"
  data-gemini-id="countdown-constelacion-tiempo"
  path="placeholder"
  memory_source="generated"
  memory_type="background"
  memory_usage="protected"
  data-countdown-target="YYYY-MM-DDTHH:MM:SS"
>
  <style>
    .pl-countdown {
      position: relative;
      isolation: isolate;
      overflow: hidden;
      box-sizing: border-box;
      min-height: 650px;
      display: grid;
      place-items: center;
      padding: clamp(3rem, 7vw, 5rem) clamp(1rem, 5vw, 3rem);
      background-color: var(--bg-color, #eef0f8);
      background-image: url('https://loremflickr.com/1600/900/starry,night');
      background-size: cover;
      background-position: center;
      color: var(--text-color, #1c2340);
      text-align: center;
    }
    .pl-countdown *,
    .pl-countdown *::before,
    .pl-countdown *::after { box-sizing: border-box; }

    .pl-countdown::before {
      content: '';
      position: absolute;
      inset: 0;
      z-index: -1;
      background: color-mix(in srgb, var(--bg-color, #eef0f8) 84%, transparent);
    }

    .pl-countdown__contenido { width: min(100%, 760px); }

    .pl-countdown__etiqueta {
      margin: 0 0 0.55rem;
      font-family: Arial, Helvetica, sans-serif;
      font-size: clamp(0.6rem, 1.15vw, 0.68rem);
      letter-spacing: 0.44em;
      text-transform: uppercase;
      color: var(--accent-color, #9aa7d0);
    }
    .pl-countdown__titulo {
      margin: 0 0 0.4rem;
      font-family: Georgia, 'Times New Roman', serif;
      font-weight: 400;
      font-size: clamp(1.75rem, 4vw, 2.7rem);
      color: var(--primary-color, #1c2340);
    }
    .pl-countdown__fecha {
      display: block;
      margin-bottom: clamp(1.5rem, 3.6vw, 2.2rem);
      font-family: Arial, Helvetica, sans-serif;
      font-size: clamp(0.76rem, 1.5vw, 0.88rem);
      letter-spacing: 0.28em;
      text-transform: uppercase;
      color: var(--secondary-color, #6b7395);
    }

    .pl-countdown__orbita {
      position: relative;
      width: clamp(170px, 26vw, 230px);
      margin: 0 auto clamp(1.4rem, 3.4vw, 2rem);
      color: var(--accent-color, #9aa7d0);
    }
    .pl-countdown__orbita svg { display: block; width: 100%; height: auto; }
    .pl-countdown__orbita-fondo {
      fill: none;
      stroke: color-mix(in srgb, var(--accent-color, #9aa7d0) 30%, transparent);
      stroke-width: 1.4;
      stroke-dasharray: 3 6;
    }
    .pl-countdown__orbita-segundo {
      fill: none;
      stroke: var(--primary-color, #1c2340);
      stroke-width: 3;
      stroke-linecap: round;
      transform: rotate(-90deg);
      transform-origin: 115px 115px;
      transition: stroke-dashoffset 0.5s linear;
    }
    .pl-countdown__satelite {
      position: absolute;
      top: 0;
      left: 50%;
      width: 14px;
      height: 14px;
      transform-origin: 50% calc(50% + var(--pl-radio, 115px) * 1px);
      transform: translate(-50%, calc(-1px * var(--pl-radio, 115px)));
      background: var(--primary-color, #1c2340);
      clip-path: polygon(50% 0, 61% 39%, 100% 50%, 61% 61%, 50% 100%, 39% 61%, 0 50%, 39% 39%);
    }
    .pl-countdown__centro {
      position: absolute;
      inset: 22%;
      display: grid;
      place-items: center;
      border: 1px dashed var(--accent-color, #9aa7d0);
      border-radius: 50%;
      background: color-mix(in srgb, var(--surface-color, #ffffff) 92%, transparent);
      font-family: Georgia, 'Times New Roman', serif;
      font-size: clamp(1.4rem, 3.2vw, 2rem);
      font-variant-numeric: tabular-nums;
      color: var(--primary-color, #1c2340);
    }

    .pl-countdown__constelacion {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: clamp(0.7rem, 2vw, 1.1rem);
      max-width: 620px;
      margin: 0 auto;
    }
    .pl-countdown__nodo {
      position: relative;
      padding: clamp(0.9rem, 2.2vw, 1.3rem) 0.4rem;
      background: color-mix(in srgb, var(--surface-color, #ffffff) 94%, transparent);
      border: 1px solid var(--surface-border-color, rgba(28, 35, 64, 0.2));
      box-shadow: 0 12px 28px rgba(28, 35, 64, 0.12);
      clip-path: polygon(0 0, calc(100% - 16px) 0, 100% 16px, 100% 100%, 0 100%);
    }
    .pl-countdown__nodo::before {
      content: '';
      position: absolute;
      top: 0;
      right: 0;
      width: 16px;
      height: 16px;
      background: linear-gradient(225deg, var(--bg-color, #eef0f8) 0 49%, color-mix(in srgb, var(--accent-color, #9aa7d0) 50%, var(--bg-color, #eef0f8)) 49% 100%);
      clip-path: polygon(100% 0, 0 0, 100% 100%);
    }
    .pl-countdown__numero {
      display: block;
      font-family: Georgia, 'Times New Roman', serif;
      font-size: clamp(1.6rem, 4.2vw, 2.5rem);
      font-variant-numeric: tabular-nums;
      line-height: 1;
      color: var(--primary-color, #1c2340);
    }
    .pl-countdown__rotulo {
      display: block;
      margin-top: 0.45rem;
      font-family: Arial, Helvetica, sans-serif;
      font-size: clamp(0.54rem, 1.1vw, 0.62rem);
      letter-spacing: 0.36em;
      text-transform: uppercase;
      color: var(--secondary-color, #6b7395);
    }

    @media (max-width: 560px) {
      .pl-countdown__constelacion { grid-template-columns: repeat(2, minmax(0, 1fr)); max-width: 360px; }
      .pl-countdown { min-height: 600px; }
    }

    @media (prefers-reduced-motion: reduce) {
      .pl-countdown__orbita-segundo { transition: none; }
      .pl-countdown__satelite { display: none; }
    }
  </style>

  <div class="pl-countdown__contenido">
    <p class="pl-countdown__etiqueta" memory_type="text" memory_usage="custom" memory_key="countdown-etiqueta">Cuenta regresiva</p>
    <h2 class="pl-countdown__titulo" memory_type="text" memory_usage="custom" memory_key="countdown-titulo">Las estrellas se alinean</h2>
    <time class="pl-countdown__fecha" datetime="YYYY-MM-DDTHH:MM:SS" memory_type="text" memory_usage="custom" memory_key="countdown-fecha">Fecha del evento</time>

    <div class="pl-countdown__orbita" aria-hidden="true">
      <svg viewBox="0 0 230 230" style="--pl-radio: 100;">
        <circle class="pl-countdown__orbita-fondo" cx="115" cy="115" r="100" />
        <circle class="pl-countdown__orbita-segundo" data-pl-orbita cx="115" cy="115" r="100" stroke-dasharray="628.3" stroke-dashoffset="0" />
      </svg>
      <span class="pl-countdown__satelite" data-pl-satelite></span>
      <div class="pl-countdown__centro" data-pl-segundos>00</div>
    </div>

    <div class="pl-countdown__constelacion" aria-label="Cuenta regresiva">
      <div class="pl-countdown__nodo"><span class="pl-countdown__numero" data-countdown-unit="days">--</span><span class="pl-countdown__rotulo">Días</span></div>
      <div class="pl-countdown__nodo"><span class="pl-countdown__numero" data-countdown-unit="hours">--</span><span class="pl-countdown__rotulo">Horas</span></div>
      <div class="pl-countdown__nodo"><span class="pl-countdown__numero" data-countdown-unit="minutes">--</span><span class="pl-countdown__rotulo">Min</span></div>
      <div class="pl-countdown__nodo"><span class="pl-countdown__numero" data-countdown-unit="seconds">--</span><span class="pl-countdown__rotulo">Seg</span></div>
    </div>
  </div>

  <script>
    (function () {
      var el = null;
      try { el = document.currentScript.closest('[data-gemini-id^="countdown"]'); } catch (e) {}
      if (!el) el = document.querySelector('[data-gemini-id^="countdown"]');
      if (!el) return;

      var orbita = el.querySelector('[data-pl-orbita]');
      var satelite = el.querySelector('[data-pl-satelite]');
      var centro = el.querySelector('[data-pl-segundos]');
      var LONGITUD = orbita ? 2 * Math.PI * 100 : 0;
      var target = NaN;
      var attr = el.getAttribute('data-countdown-target');
      if (attr && attr.indexOf('YYYY') === -1) { var p = new Date(attr); if (!isNaN(p.getTime())) target = p.getTime(); }
      if (isNaN(target) && window.__countdownTarget) { var p1 = new Date(window.__countdownTarget); if (!isNaN(p1.getTime())) target = p1.getTime(); }
      if (isNaN(target) && window.countdown_target) { var p2 = new Date(window.countdown_target); if (!isNaN(p2.getTime())) target = p2.getTime(); }

      var intervalId = null;
      (window.__countdownIntervals = window.__countdownIntervals || []).forEach(clearInterval);
      window.__countdownIntervals = [];

      function pad2(n) { return n < 10 ? '0' + n : '' + n; }
      function setUnit(unit, value) {
        var node = el.querySelector('[data-countdown-unit="' + unit + '"]');
        if (node) node.textContent = value;
      }
      function tick() {
        if (!Number.isFinite(target)) return;
        var diff = Math.max(target - Date.now(), 0);
        setUnit('days', Math.floor(diff / 86400000));
        setUnit('hours', pad2(Math.floor((diff % 86400000) / 3600000)));
        setUnit('minutes', pad2(Math.floor((diff % 3600000) / 60000)));
        var s = Math.floor((diff % 60000) / 1000);
        setUnit('seconds', pad2(s));
        if (centro) centro.textContent = pad2(s);
        var fraccion = s / 60;
        if (orbita) orbita.setAttribute('stroke-dashoffset', (LONGITUD * (1 - fraccion)).toFixed(2));
        if (satelite) satelite.style.transform = 'translate(-50%, -115px) rotate(' + (fraccion * 360).toFixed(1) + 'deg)';
        if (diff === 0 && intervalId !== null) {
          clearInterval(intervalId);
          intervalId = null;
          window.__countdownIntervals = [];
        }
      }
      function start(newTarget) {
        if (newTarget) { var p = new Date(newTarget); if (!isNaN(p.getTime())) target = p.getTime(); }
        (window.__countdownIntervals || []).forEach(clearInterval);
        window.__countdownIntervals = [];
        intervalId = null;
        if (!Number.isFinite(target)) return;
        tick();
        if (target > Date.now()) {
          intervalId = setInterval(tick, 1000);
          window.__countdownIntervals.push(intervalId);
        }
      }
      start();
      window.updateCountdown = start;
    })();
  </script>

  <script>
    var moduleMetadata = {
      module_type: 'countdown',
      module_name: 'countdown-constelacion-tiempo',
      style_name: 'Órbita Celeste',
      descripcion: 'Cuenta regresiva orbital: estrella satélite que gira sobre anillo punteado, arco de segundos y constelación de nodos plegados por unidad.',
      tags: ['countdown', 'cuenta regresiva', 'orbita', 'satelite', 'origami', 'celestial'],
      tipo: 'countdown'
    };
  </script>
</section>
