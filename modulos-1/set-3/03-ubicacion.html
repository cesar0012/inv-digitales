  <style>
    .pl-ubicacion {
      --primary-color: #1c2340;
      --secondary-color: #6b7395;
      --accent-color: #9aa7d0;
      --bg-color: #eef0f8;
      --surface-color: #ffffff;
      --surface-border-color: rgba(28, 35, 64, 0.2);
      --text-color: #1c2340;

      position: relative;
      isolation: isolate;
      box-sizing: border-box;
      padding: clamp(3rem, 8vw, 6rem) clamp(1rem, 5vw, 4rem);
      background-color: var(--bg-color);
      background-image: url('https://loremflickr.com/1600/900/map,journey');
      background-size: cover;
      background-position: center;
      color: var(--text-color);
    }
    .pl-ubicacion *,
    .pl-ubicacion *::before,
    .pl-ubicacion *::after { box-sizing: border-box; }

    .pl-ubicacion::before {
      content: '';
      position: absolute;
      inset: 0;
      z-index: -1;
      background: color-mix(in srgb, var(--bg-color) 88%, transparent);
    }

    .pl-ubicacion__grid {
      display: grid;
      grid-template-columns: minmax(0, 6fr) minmax(0, 6fr);
      gap: clamp(1.6rem, 4vw, 3rem);
      align-items: center;
      width: min(100%, 1060px);
      margin: 0 auto;
    }

    .pl-ubicacion__sobre {
      position: relative;
      padding: clamp(1.8rem, 4.5vw, 2.8rem) clamp(1.4rem, 3.5vw, 2.4rem);
      background: color-mix(in srgb, var(--surface-color) 96%, transparent);
      border: 1px solid var(--surface-border-color);
      box-shadow: 0 22px 50px rgba(28, 35, 64, 0.16);
      clip-path: polygon(0 0, calc(100% - 40px) 0, 100% 40px, 100% 100%, 0 100%);
    }
    .pl-ubicacion__sobre::before {
      content: '';
      position: absolute;
      top: 0;
      right: 0;
      width: 40px;
      height: 40px;
      background: linear-gradient(225deg, var(--bg-color) 0 49%, color-mix(in srgb, var(--accent-color) 50%, var(--bg-color)) 49% 100%);
      clip-path: polygon(100% 0, 0 0, 100% 100%);
    }

    .pl-ubicacion__etiqueta {
      margin: 0 0 0.6rem;
      font-family: Arial, Helvetica, sans-serif;
      font-size: clamp(0.6rem, 1.15vw, 0.68rem);
      letter-spacing: 0.44em;
      text-transform: uppercase;
      color: var(--accent-color);
    }
    .pl-ubicacion__titulo {
      margin: 0 0 1rem;
      font-family: Georgia, 'Times New Roman', serif;
      font-weight: 400;
      font-size: clamp(1.7rem, 3.8vw, 2.4rem);
      color: var(--primary-color);
    }
    .pl-ubicacion__direccion {
      margin: 0 0 1.3rem;
      font-family: Arial, Helvetica, sans-serif;
      font-style: normal;
      font-size: clamp(0.88rem, 1.6vw, 0.98rem);
      line-height: 1.75;
      color: var(--secondary-color);
    }

    .pl-ubicacion__marcador {
      display: inline-flex;
      align-items: center;
      gap: 0.6rem;
      margin-bottom: 1.4rem;
      font-family: Arial, Helvetica, sans-serif;
      font-size: clamp(0.64rem, 1.2vw, 0.72rem);
      letter-spacing: 0.22em;
      text-transform: uppercase;
      color: var(--text-color);
    }
    .pl-ubicacion__estrella {
      position: relative;
      width: 16px;
      height: 16px;
      background: var(--accent-color);
      clip-path: polygon(50% 0, 61% 39%, 100% 50%, 61% 61%, 50% 100%, 39% 61%, 0 50%, 39% 39%);
    }
    .pl-ubicacion__estrella::after {
      content: '';
      position: absolute;
      inset: -8px;
      background: var(--accent-color);
      clip-path: polygon(50% 0, 61% 39%, 100% 50%, 61% 61%, 50% 100%, 39% 61%, 0 50%, 39% 39%);
      opacity: 0;
      transform: scale(0.4);
    }
    .pl-ubicacion.esta-visto .pl-ubicacion__estrella::after { animation: plUbicacionBrillo 1.9s ease-out infinite; }
    @keyframes plUbicacionBrillo {
      0% { opacity: 0.85; transform: scale(0.4); }
      75% { opacity: 0.12; transform: scale(1.3); }
      100% { opacity: 0; transform: scale(1.45); }
    }

    .pl-ubicacion__postal {
      margin: 1.4rem 0 1.6rem;
      padding: 5px;
      background: var(--bg-color);
      border: 1px solid var(--surface-border-color);
      box-shadow: 0 10px 22px rgba(28, 35, 64, 0.14);
      transform: rotate(-1.6deg);
    }
    .pl-ubicacion__postal img {
      color: transparent;
      display: block;
      width: 100%;
      height: auto;
      aspect-ratio: 16 / 9;
      object-fit: cover;
      filter: saturate(0.9);
    }

    .pl-ubicacion__boton {
      display: inline-block;
      padding: 0.78rem 1.9rem;
      background: var(--primary-color);
      color: var(--bg-color);
      font-family: Arial, Helvetica, sans-serif;
      font-size: clamp(0.68rem, 1.3vw, 0.78rem);
      letter-spacing: 0.3em;
      text-transform: uppercase;
      text-decoration: none;
      clip-path: polygon(10px 0, 100% 0, 100% calc(100% - 10px), calc(100% - 10px) 100%, 0 100%, 0 10px);
      transition: background 0.4s ease, transform 0.4s ease;
    }
    .pl-ubicacion__boton:hover { background: color-mix(in srgb, var(--accent-color) 80%, var(--primary-color)); transform: translateY(-2px); }

    .pl-ubicacion__mapa-zona {
      position: relative;
      margin: 0;
      padding: 9px;
      background: var(--surface-color);
      border: 1px solid var(--surface-border-color);
      box-shadow: 0 24px 54px rgba(28, 35, 64, 0.2);
      transform: rotate(1.4deg);
    }
    .pl-ubicacion__mapa-zona figcaption {
      display: flex;
      justify-content: space-between;
      margin-bottom: 8px;
      font-family: Arial, Helvetica, sans-serif;
      font-size: 0.6rem;
      letter-spacing: 0.26em;
      text-transform: uppercase;
      color: var(--secondary-color);
    }
    .pl-ubicacion__mapa {
      overflow: hidden;
      border: 1px solid var(--surface-border-color);
    }
    .pl-ubicacion__mapa iframe {
      display: block;
      width: 100%;
      aspect-ratio: 4 / 3;
      border: 0;
      filter: saturate(0.82);
    }
    .pl-ubicacion__grulla {
      position: absolute;
      top: -20px;
      right: -14px;
      width: 52px;
      padding: 6px;
      background: var(--surface-color);
      border: 1px solid var(--surface-border-color);
      border-radius: 50%;
      box-shadow: 0 10px 22px rgba(28, 35, 64, 0.2);
      color: var(--accent-color);
      animation: plUbicacionPlanea 7s ease-in-out infinite;
    }
    @keyframes plUbicacionPlanea {
      0%, 100% { transform: translateY(0) rotate(0deg); }
      50% { transform: translateY(-7px) rotate(-4deg); }
    }

    @media (max-width: 880px) {
      .pl-ubicacion__grid { grid-template-columns: 1fr; }
      .pl-ubicacion__mapa-zona { transform: rotate(0deg); max-width: 460px; margin: 0 auto; }
    }

    @media (prefers-reduced-motion: reduce) {
      .pl-ubicacion * { animation: none !important; transition: none !important; }
    }
  </style>

  <script>
    (function () {
      var root = document.currentScript ? document.currentScript.closest('section') : document.querySelector('.pl-ubicacion');
      if (!root) return;
      var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
      if (reduce || !('IntersectionObserver' in window)) { root.classList.add('esta-visto'); return; }
      var io = new IntersectionObserver(function (entries) {
        entries.forEach(function (entry) {
          if (entry.isIntersecting) { root.classList.add('esta-visto'); io.disconnect(); }

      }, { threshold: 0.3 });
      io.observe(root);
    })();
  </script>
