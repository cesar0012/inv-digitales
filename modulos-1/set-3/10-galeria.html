<section
  class="pl-galeria"
  data-gemini-id="galeria-plegado-figuras"
>
  <style>
    .pl-galeria {
      --primary-color: #1c2340;
      --secondary-color: #6b7395;
      --accent-color: #9aa7d0;
      --bg-color: #eef0f8;
      --surface-color: #ffffff;
      --surface-border-color: rgba(28, 35, 64, 0.2);
      --text-color: #1c2340;

      position: relative;
      isolation: isolate;
      box-sizing: border-box;
      padding: clamp(3rem, 8vw, 6rem) clamp(1rem, 5vw, 4rem);
      background-color: var(--bg-color);
      color: var(--text-color);
      text-align: center;
    }
    .pl-galeria *,
    .pl-galeria *::before,
    .pl-galeria *::after { box-sizing: border-box; }

    .pl-galeria__titulo {
      margin: 0 0 0.5rem;
      font-family: Georgia, 'Times New Roman', serif;
      font-weight: 400;
      font-size: clamp(1.7rem, 3.8vw, 2.4rem);
      color: var(--primary-color);
    }
    .pl-galeria__nota {
      margin: 0 auto clamp(2rem, 5vw, 3rem);
      font-family: Arial, Helvetica, sans-serif;
      font-size: clamp(0.62rem, 1.2vw, 0.7rem);
      letter-spacing: 0.4em;
      text-transform: uppercase;
      color: var(--secondary-color);
    }

    .pl-galeria__mosaico {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(min(220px, 100%), 1fr));
      gap: clamp(1rem, 2.6vw, 1.6rem);
      width: min(100%, 1060px);
      margin: 0 auto;
    }

    .pl-galeria__figura {
      position: relative;
      margin: 0;
      padding: 8px;
      background: var(--surface-color);
      border: 1px solid var(--surface-border-color);
      box-shadow: 0 16px 36px rgba(28, 35, 64, 0.15);
      cursor: pointer;
      transition: opacity 0.5s ease, transform 0.5s cubic-bezier(0.22, 0.8, 0.3, 1), box-shadow 0.5s ease;
    }
    .pl-galeria.pl-js .pl-galeria__figura { opacity: 0; transform: translateY(18px); }
    .pl-galeria.esta-visto .pl-galeria__figura { opacity: 1; transform: none; }
    .pl-galeria__figura:hover { box-shadow: 0 24px 48px rgba(28, 35, 64, 0.24); }

    .pl-galeria__figura:nth-child(1) img { clip-path: polygon(0 0, calc(100% - 34px) 0, 100% 34px, 100% 100%, 0 100%); }
    .pl-galeria__figura:nth-child(2) img { clip-path: polygon(50% 0, 100% 26%, 100% 100%, 0 100%, 0 26%); }
    .pl-galeria__figura:nth-child(3) img { clip-path: polygon(0 0, 100% 0, 100% calc(100% - 34px), calc(100% - 34px) 100%, 0 100%); }
    .pl-galeria__figura:nth-child(4) img { clip-path: polygon(26% 0, 100% 0, 100% 74%, 74% 100%, 0 100%, 0 26%); }
    .pl-galeria__figura:nth-child(5) img { clip-path: polygon(0 22%, 100% 0, 100% 100%, 0 100%); }
    .pl-galeria__figura:nth-child(6) img { clip-path: polygon(0 0, 100% 0, 100% 100%, 34px 100%, 0 calc(100% - 34px)); }

    .pl-galeria__figura img {
      color: transparent;
      display: block;
      width: 100%;
      height: auto;
      aspect-ratio: 4 / 5;
      object-fit: cover;
      filter: saturate(0.9);
    }
    .pl-galeria__pie {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-top: 8px;
      font-family: Arial, Helvetica, sans-serif;
      font-size: 0.58rem;
      letter-spacing: 0.24em;
      text-transform: uppercase;
      color: var(--secondary-color);
    }
    .pl-galeria__pie i {
      width: 9px;
      height: 9px;
      background: var(--accent-color);
      clip-path: polygon(50% 0, 61% 39%, 100% 50%, 61% 61%, 50% 100%, 39% 61%, 0 50%, 39% 39%);
    }

    .pl-galeria__lightbox {
      position: fixed;
      inset: 0;
      z-index: 9999;
      display: none;
      place-items: center;
      padding: clamp(1rem, 4vw, 3rem);
      background: color-mix(in srgb, var(--primary-color) 82%, black);
    }
    .pl-galeria__lightbox.abierto { display: grid; }
    .pl-galeria__lightbox img {
      max-width: min(920px, 92vw);
      max-height: 82svh;
      width: auto;
      height: auto;
      border: 6px solid var(--surface-color);
      box-shadow: 0 30px 80px rgba(0, 0, 0, 0.5);
    }
    .pl-galeria__cerrar {
      position: absolute;
      top: clamp(0.8rem, 2.5vw, 1.6rem);
      right: clamp(0.8rem, 2.5vw, 1.6rem);
      width: 44px;
      height: 44px;
      border: 1px solid var(--surface-color);
      border-radius: 50%;
      background: transparent;
      color: var(--surface-color);
      font-size: 1.2rem;
      line-height: 1;
      cursor: pointer;
      transition: transform 0.4s ease, background 0.4s ease;
    }
    .pl-galeria__cerrar:hover { transform: rotate(90deg); background: color-mix(in srgb, var(--surface-color) 18%, transparent); }

    @media (max-width: 560px) {
      .pl-galeria__mosaico { grid-template-columns: repeat(auto-fit, minmax(min(150px, 100%), 1fr)); gap: 0.8rem; }
    }

    @media (prefers-reduced-motion: reduce) {
      .pl-galeria * { transition: none !important; }
      .pl-galeria__figura { opacity: 1; transform: none; }
    }
  </style>

  <header memory_type="text" memory_usage="custom" memory_key="galeria-cabecera">
    <h2 class="pl-galeria__titulo" memory_type="text" memory_usage="custom" memory_key="galeria-titulo">Figuras de papel</h2>
    <p class="pl-galeria__nota" memory_type="text" memory_usage="custom" memory_key="galeria-nota">Galería plegada</p>
  </header>

  <div class="pl-galeria__mosaico">
    <figure class="pl-galeria__figura" data-pl-figura memory_type="image" memory_usage="custom" memory_source="library" memory_key="galeria-foto-1" tabindex="0" role="button" aria-label="Ampliar figura uno">
      <img src="https://loremflickr.com/480/600/stars,couple" alt="Figura uno" path="placeholder" data-library-category="bodas" data-asset-type="galeria" loading="lazy" />
      <span class="pl-galeria__pie"><span>N.º 01</span><i aria-hidden="true"></i></span>

    </figure>
    <figure class="pl-galeria__figura" data-pl-figura memory_type="image" memory_usage="custom" memory_source="library" memory_key="galeria-foto-2" tabindex="0" role="button" aria-label="Ampliar figura dos">
      <img src="https://loremflickr.com/480/600/night,dance" alt="Figura dos" path="placeholder" data-library-category="bodas" data-asset-type="galeria" loading="lazy" />
      <span class="pl-galeria__pie"><span>N.º 02</span><i aria-hidden="true"></i></span>
      <figcaption hidden>Figura dos</figcaption>
    </figure>
    <figure class="pl-galeria__figura" data-pl-figura memory_type="image" memory_usage="custom" memory_source="library" memory_key="galeria-foto-3" tabindex="0" role="button" aria-label="Ampliar figura tres">
      <img src="https://loremflickr.com/480/600/ceremony,stars" alt="Figura tres" path="placeholder" data-library-category="bodas" data-asset-type="galeria" loading="lazy" />
      <span class="pl-galeria__pie"><span>N.º 03</span><i aria-hidden="true"></i></span>
      <figcaption hidden>Figura tres</figcaption>
    </figure>
    <figure class="pl-galeria__figura" data-pl-figura memory_type="image" memory_usage="custom" memory_source="library" memory_key="galeria-foto-4" tabindex="0" role="button" aria-label="Ampliar figura cuatro">
      <img src="https://loremflickr.com/480/600/party,lights" alt="Figura cuatro" path="placeholder" data-library-category="bodas" data-asset-type="galeria" loading="lazy" />
      <span class="pl-galeria__pie"><span>N.º 04</span><i aria-hidden="true"></i></span>
      <figcaption hidden>Figura cuatro</figcaption>
    </figure>
    <figure class="pl-galeria__figura" data-pl-figura memory_type="image" memory_usage="custom" memory_source="library" memory_key="galeria-foto-5" tabindex="0" role="button" aria-label="Ampliar figura cinco">
      <img src="https://loremflickr.com/480/600/love,night" alt="Figura cinco" path="placeholder" data-library-category="bodas" data-asset-type="galeria" loading="lazy" />
      <span class="pl-galeria__pie"><span>N.º 05</span><i aria-hidden="true"></i></span>
      <figcaption hidden>Figura cinco</figcaption>

    <figure class="pl-galeria__figura" data-pl-figura memory_type="image" memory_usage="custom" memory_source="library" memory_key="galeria-foto-6" tabindex="0" role="button" aria-label="Ampliar figura seis">
      <img src="https://loremflickr.com/480/600/elegant,evening" alt="Figura seis" path="placeholder" data-library-category="bodas" data-asset-type="galeria" loading="lazy" />
      <span class="pl-galeria__pie"><span>N.º 06</span><i aria-hidden="true"></i></span>
      <figcaption hidden>Figura seis</figcaption>
    </figure>
  </div>

  <script>
    (function () {
      var root = document.currentScript ? document.currentScript.closest('section') : document.querySelector('.pl-galeria');
      if (!root) return;
      root.classList.add('pl-js');
      window.setTimeout(function () { root.classList.add('esta-visto'); }, 2500); // red de seguridad: nunca dejar contenido oculto

      var figuras = Array.prototype.slice.call(root.querySelectorAll('[data-pl-figura]'));
      var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
      if (('IntersectionObserver' in window) && !reduce) {
        var io = new IntersectionObserver(function (entries) {
          entries.forEach(function (entry) {
            if (!entry.isIntersecting) return;
            var i = figuras.indexOf(entry.target);
            entry.target.style.transitionDelay = (Math.min(i, 5) * 0.08).toFixed(2) + 's';
            root.classList.add('esta-visto');
            io.unobserve(entry.target);
          });
        }, { threshold: 0.18 });
        figuras.forEach(function (f) { io.observe(f); });
      } else {
        root.classList.add('esta-visto');
      }

      var lightbox = document.createElement('div');
      lightbox.className = 'pl-galeria__lightbox';
      lightbox.setAttribute('role', 'dialog');
      lightbox.setAttribute('aria-modal', 'true');
      lightbox.setAttribute('aria-label', 'Vista ampliada');
      lightbox.innerHTML =
        '<img alt="" />' +
        '<button type="button" class="pl-galeria__cerrar" aria-label="Cerrar">×</button>';
      root.appendChild(lightbox);
      var imgAmpliada = lightbox.querySelector('img');
      var botonCerrar = lightbox.querySelector('.pl-galeria__cerrar');

      function abrir(fig) {
        var foto = fig.querySelector('img');
        if (!foto) return;
        imgAmpliada.src = foto.src;
        imgAmpliada.alt = foto.alt;
        lightbox.classList.add('abierto');
      }
      function cerrar() { lightbox.classList.remove('abierto'); }

      figuras.forEach(function (fig) {
        fig.addEventListener('click', function () { abrir(fig); });
        fig.addEventListener('keydown', function (e) {
          if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); abrir(fig); }
        });
      });
      botonCerrar.addEventListener('click', cerrar);
      lightbox.addEventListener('click', function (e) { if (e.target === lightbox) cerrar(); });
    })();
  </script>

  <script>
    var moduleMetadata = {
      module_type: 'galeria',

      tipo: 'galeria'
    };
  </script>
</section>
