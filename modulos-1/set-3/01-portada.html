<section
  class="pl-portada"
  data-gemini-id="portada-nombre"
  memory_type="background"
  memory_usage="protected"
  memory_source="generated"
  path="placeholder"
  aria-labelledby="pl-portada-titulo"
>
  <style>
    .pl-portada {
      --primary-color: #1c2340;
      --secondary-color: #6b7395;
      --accent-color: #9aa7d0;
      --bg-color: #eef0f8;
      --surface-color: #ffffff;
      --surface-border-color: rgba(28, 35, 64, 0.2);
      --text-color: #1c2340;

      position: relative;
      isolation: isolate;
      overflow: hidden;
      box-sizing: border-box;
      min-height: 100svh;
      display: grid;
      place-items: center;
      padding: clamp(2.5rem, 6vw, 5rem) clamp(1rem, 5vw, 4rem) clamp(6rem, 14vw, 9rem);
      background-color: var(--bg-color);
      background-image: url('https://loremflickr.com/1600/900/paper,blue');
      background-size: cover;
      background-position: center;
      color: var(--text-color);
      text-align: center;
    }
    .pl-portada *,
    .pl-portada *::before,
    .pl-portada *::after { box-sizing: border-box; }

    .pl-portada::before {
      content: '';
      position: absolute;
      inset: 0;
      z-index: -1;
      background: linear-gradient(180deg, color-mix(in srgb, var(--bg-color) 90%, transparent), color-mix(in srgb, var(--bg-color) 76%, transparent));
    }

    .pl-portada__carta {
      position: relative;
      width: min(100%, 740px);
      padding: clamp(2.2rem, 5.5vw, 3.8rem) clamp(1.3rem, 5vw, 3.2rem);
      background: color-mix(in srgb, var(--surface-color) 96%, transparent);
      border: 1px solid var(--surface-border-color);
      box-shadow: 0 26px 60px rgba(28, 35, 64, 0.2);
      transform-style: preserve-3d;
      perspective: 1000px;
    }
    .pl-portada__carta::before {
      content: '';
      position: absolute;
      top: 0;
      right: 0;
      width: 74px;
      height: 74px;
      background: linear-gradient(225deg, var(--bg-color) 0 49.5%, color-mix(in srgb, var(--accent-color) 55%, var(--bg-color)) 49.5% 100%);
      clip-path: polygon(100% 0, 0 0, 100% 100%);
      box-shadow: -6px 6px 12px rgba(28, 35, 64, 0.12);
    }

    .pl-portada__estrellas {
      position: absolute;
      inset: 0;
      z-index: 0;
      pointer-events: none;
      overflow: hidden;
    }
    .pl-portada__estrella {
      position: absolute;
      width: 4px;
      height: 4px;
      background: var(--accent-color);
      clip-path: polygon(50% 0, 62% 38%, 100% 50%, 62% 62%, 50% 100%, 38% 62%, 0 50%, 38% 38%);
      opacity: 0;
    }
    .pl-portada.esta-visto .pl-portada__estrella { animation: plPortadaTitila 6s ease-in-out infinite; }
    @keyframes plPortadaTitila {
      0%, 100% { opacity: 0.15; }
      50% { opacity: 0.85; }
    }

    .pl-portada__constelacion {
      width: clamp(150px, 26vw, 210px);
      margin: 0 auto clamp(1rem, 2.5vw, 1.5rem);
      color: var(--accent-color);
    }
    .pl-portada__constelacion circle { fill: currentColor; }
    .pl-portada__constelacion path {
      fill: none;
      stroke: currentColor;
      stroke-width: 1;
      stroke-dasharray: 300;
      stroke-dashoffset: 300;
      transition: stroke-dashoffset 0.5s ease 0.3s;
    }
    .pl-portada.esta-visto .pl-portada__constelacion path { stroke-dashoffset: 0; }

    .pl-portada__eyebrow {
      margin: 0 0 0.9rem;
      font-family: Arial, Helvetica, sans-serif;
      font-size: clamp(0.62rem, 1.2vw, 0.72rem);
      letter-spacing: 0.44em;
      text-transform: uppercase;
      color: var(--secondary-color);
    }

    .pl-portada__titulo {
      margin: 0;
      font-family: Georgia, 'Times New Roman', serif;
      font-weight: 400;
      font-size: clamp(2rem, 6vw, 4.2rem);
      line-height: 1.06;
      color: var(--primary-color);
    }
    .pl-portada__titulo span {
      display: inline-block;
      transition: opacity 0.5s ease, transform 0.5s cubic-bezier(0.22, 0.8, 0.3, 1);
    }
    .pl-portada.pl-js .pl-portada__titulo span { opacity: 0; transform: translateY(0.5em) rotateX(70deg); }
    .pl-portada.esta-visto .pl-portada__titulo span { opacity: 1; transform: none; }
    .pl-portada.esta-visto .pl-portada__titulo span:nth-child(1) { transition-delay: 0.1s; }
    .pl-portada.esta-visto .pl-portada__titulo span:nth-child(2) { transition-delay: 0.2s; }
    .pl-portada.esta-visto .pl-portada__titulo span:nth-child(3) { transition-delay: 0.3s; }

    .pl-portada__ampersand {
      display: block;
      margin: 0.15em 0;
      font-style: italic;
      color: var(--accent-color);
    }

    .pl-portada__fecha {
      display: inline-block;
      margin-top: clamp(1.2rem, 3vw, 1.8rem);
      padding: 0.55rem 1.5rem;
      border-top: 1px dashed var(--accent-color);
      border-bottom: 1px dashed var(--accent-color);
      font-family: Arial, Helvetica, sans-serif;
      font-size: clamp(0.72rem, 1.5vw, 0.86rem);
      letter-spacing: 0.34em;
      text-transform: uppercase;
      color: var(--text-color);
    }

    .pl-portada__foto {
      position: absolute;
      left: clamp(-1.4rem, -0.5vw, 0rem);
      bottom: clamp(-1.6rem, -0.5vw, 0rem);
      width: clamp(120px, 18vw, 168px);
      margin: 0;
      padding: 7px 7px 20px;
      background: var(--surface-color);
      border: 1px solid var(--surface-border-color);
      box-shadow: 0 16px 34px rgba(28, 35, 64, 0.25);
      transform: rotate(-5deg);
      transition: transform 0.5s ease;
    }
    .pl-portada__foto:hover { transform: rotate(-1deg) translateY(-5px); }
    .pl-portada__foto img {
      color: transparent;
      display: block;
      width: 100%;
      height: auto;
      aspect-ratio: 1 / 1;
      object-fit: cover;
      clip-path: polygon(0 0, 100% 0, 100% 100%, 0 100%);
      filter: saturate(0.9);
    }
    .pl-portada__washi {
      position: absolute;
      top: -10px;
      left: 50%;
      width: 66px;
      height: 20px;
      transform: translateX(-50%) rotate(-4deg);
      background: color-mix(in srgb, var(--accent-color) 55%, transparent);
      box-shadow: 0 3px 8px rgba(28, 35, 64, 0.18);
    }

    .pl-portada__diorama {
      position: absolute;
      left: 0;
      right: 0;
      bottom: 0;
      height: clamp(70px, 12vw, 110px);
      z-index: 1;
      pointer-events: none;
    }
    .pl-portada__capa {
      position: absolute;
      left: -2%;
      right: -2%;
      background: color-mix(in srgb, var(--surface-color) 82%, transparent);
      border-top: 1px solid var(--surface-border-color);
    }
    .pl-portada__capa--1 {
      bottom: 0;
      height: 60%;
      clip-path: polygon(0 62%, 12% 34%, 26% 58%, 42% 20%, 58% 52%, 74% 28%, 88% 56%, 100% 38%, 100% 100%, 0 100%);
      box-shadow: 0 -8px 20px rgba(28, 35, 64, 0.08);
    }
    .pl-portada__capa--2 {
      bottom: 0;
      height: 42%;
      clip-path: polygon(0 46%, 16% 76%, 34% 40%, 52% 70%, 68% 34%, 84% 62%, 100% 44%, 100% 100%, 0 100%);
      background: color-mix(in srgb, var(--accent-color) 26%, var(--bg-color));
    }

    @media (max-width: 640px) {
      .pl-portada { padding-bottom: 7rem; }
      .pl-portada__foto { width: 108px; }
      .pl-portada__titulo span { display: block; }
    }

    @media (prefers-reduced-motion: reduce) {
      .pl-portada * { animation: none !important; transition: none !important; }
      .pl-portada__titulo span { opacity: 1; transform: none; }
      .pl-portada__constelacion path { stroke-dashoffset: 0; }
    }
  </style>

  <div class="pl-portada__estrellas" aria-hidden="true"></div>

  <div class="pl-portada__carta">
    <svg class="pl-portada__constelacion" viewBox="0 0 200 70" aria-hidden="true">
      <path d="M14 52 L52 24 L92 44 L136 14 L186 34" />
      <circle cx="14" cy="52" r="3"/>
      <circle cx="52" cy="24" r="2.4"/>
      <circle cx="92" cy="44" r="3.2"/>
      <circle cx="136" cy="14" r="2.2"/>
      <circle cx="186" cy="34" r="2.8"/>
    </svg>

    <p class="pl-portada__eyebrow" memory_type="text" memory_usage="custom" memory_key="portada-encabezado">Una historia escrita en el cielo</p>

    <div memory_type="text" memory_usage="custom" memory_key="portada-nombres">
      <h1 id="pl-portada-titulo" class="pl-portada__titulo">
        <span>Nombre de la Novia</span>
        <span class="pl-portada__ampersand">&amp;</span>
        <span>Nombre del Novio</span>
      </h1>
    </div>

    <time class="pl-portada__fecha" datetime="YYYY-MM-DD" memory_type="text" memory_usage="custom" memory_key="portada-fecha">Fecha del evento</time>

    <figure class="pl-portada__foto" memory_type="image" memory_usage="custom" memory_source="library" memory_key="portada-foto">
      <span class="pl-portada__washi" aria-hidden="true"></span>
      <img
        src="https://loremflickr.com/420/420/couple,sky"
        alt="Retrato de los anfitriones"
        path="placeholder"
        data-library-category="bodas"
        data-asset-type="foto-pareja"
        loading="lazy"
      />
      <figcaption hidden>Retrato principal</figcaption>
    </figure>
  </div>

  <div class="pl-portada__diorama" aria-hidden="true">
    <span class="pl-portada__capa pl-portada__capa--1"></span>
    <span class="pl-portada__capa pl-portada__capa--2"></span>
  </div>

  <script>
    (function () {
      var root = document.currentScript ? document.currentScript.closest('section') : document.querySelector('.pl-portada');
      if (!root) return;
      root.classList.add('pl-js');
      window.setTimeout(function () { root.classList.add('esta-visto'); }, 2500); // red de seguridad: nunca dejar contenido oculto

      var cielo = root.querySelector('.pl-portada__estrellas');
      if (cielo && !cielo.children.length) {
        for (var i = 0; i < 14; i++) {
          var estrella = document.createElement('span');
          estrella.className = 'pl-portada__estrella';
          estrella.style.left = (4 + Math.random() * 92) + '%';
          estrella.style.top = (5 + Math.random() * 55) + '%';
          estrella.style.animationDelay = (Math.random() * 5).toFixed(2) + 's';
          cielo.appendChild(estrella);
        }
      }

      var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
      if (reduce || !('IntersectionObserver' in window)) { root.classList.add('esta-visto'); return; }
      var io = new IntersectionObserver(function (entries) {
        entries.forEach(function (entry) {
          if (entry.isIntersecting) { root.classList.add('esta-visto'); io.disconnect(); }
        });
      }, { threshold: 0.22 });
      io.observe(root);
    })();
  </script>

  <script>
    var moduleMetadata = {
      module_type: 'portada',

      tags: ['portada', 'hero', 'origami', 'celestial', 'constelacion', 'papel', 'diorama'],
      tipo: 'portada'
    };
  </script>
</section>
