<section
  class="pl-vestimenta"
  data-gemini-id="vestimenta-plegado-gemas"
  memory_type="background"
  memory_usage="protected"
  memory_source="generated"
  path="placeholder"
>
  <style>
    .pl-vestimenta {
      --primary-color: #1c2340;
      --secondary-color: #6b7395;
      --accent-color: #9aa7d0;
      --bg-color: #eef0f8;
      --surface-color: #ffffff;
      --surface-border-color: rgba(28, 35, 64, 0.2);
      --text-color: #1c2340;

      position: relative;
      isolation: isolate;
      box-sizing: border-box;
      min-height: 64svh;
      display: grid;
      place-items: center;
      padding: clamp(3rem, 8vw, 6rem) clamp(1rem, 5vw, 4rem);
      background-color: var(--bg-color);
      background-image: url('https://loremflickr.com/1600/900/pastel,paper');
      background-size: cover;
      background-position: center;
      color: var(--text-color);
      text-align: center;
    }
    .pl-vestimenta *,
    .pl-vestimenta *::before,
    .pl-vestimenta *::after { box-sizing: border-box; }

    .pl-vestimenta::before {
      content: '';
      position: absolute;
      inset: 0;
      z-index: -1;
      background: color-mix(in srgb, var(--bg-color) 85%, transparent);
    }

    .pl-vestimenta__tarjeta {
      width: min(100%, 660px);
      padding: clamp(2rem, 5vw, 3.2rem) clamp(1.4rem, 4.5vw, 3rem);
      background: color-mix(in srgb, var(--surface-color) 95%, transparent);
      border: 1px solid var(--surface-border-color);
      box-shadow: 0 24px 52px rgba(28, 35, 64, 0.16);
      clip-path: polygon(0 0, calc(100% - 38px) 0, 100% 38px, 100% 100%, 0 100%);
    }
    .pl-vestimenta__tarjeta::before {
      content: '';
      position: absolute;
      top: 0;
      right: 0;
      width: 38px;
      height: 38px;
      background: linear-gradient(225deg, var(--bg-color) 0 49%, color-mix(in srgb, var(--accent-color) 52%, var(--bg-color)) 49% 100%);
      clip-path: polygon(100% 0, 0 0, 100% 100%);
    }

    .pl-vestimenta__etiqueta {
      margin: 0 0 0.6rem;
      font-family: Arial, Helvetica, sans-serif;
      font-size: clamp(0.6rem, 1.15vw, 0.68rem);
      letter-spacing: 0.44em;
      text-transform: uppercase;
      color: var(--accent-color);
    }
    .pl-vestimenta__titulo {
      margin: 0 0 0.8rem;
      font-family: Georgia, 'Times New Roman', serif;
      font-weight: 400;
      font-size: clamp(1.7rem, 3.8vw, 2.3rem);
      color: var(--primary-color);
    }
    .pl-vestimenta__texto {
      margin: 0 auto 1.8rem;
      max-width: 46ch;
      font-family: Arial, Helvetica, sans-serif;
      font-size: clamp(0.86rem, 1.5vw, 0.94rem);
      line-height: 1.75;
      color: var(--secondary-color);
    }

    .pl-vestimenta__enjambre {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: clamp(0.9rem, 2.6vw, 1.4rem);
      margin-bottom: 1.7rem;
    }
    .pl-vestimenta__gema-zona {
      display: grid;
      justify-items: center;
      gap: 0.5rem;
      transition: opacity 0.5s ease, transform 0.5s cubic-bezier(0.22, 0.8, 0.3, 1);
    }
    .pl-vestimenta.pl-js .pl-vestimenta__gema-zona { opacity: 0; transform: translateY(12px) scale(0.85); }
    .pl-vestimenta.esta-visto .pl-vestimenta__gema-zona { opacity: 1; transform: none; }
    .pl-vestimenta__gema {
      position: relative;
      width: clamp(42px, 7.5vw, 56px);
      height: clamp(42px, 7.5vw, 56px);
      background: var(--bg-color);
      clip-path: polygon(50% 0, 100% 32%, 82% 100%, 18% 100%, 0 32%);
      box-shadow: 0 10px 20px rgba(28, 35, 64, 0.18);
      transition: background 0.5s ease, transform 0.5s ease;
    }
    .pl-vestimenta__gema::after {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(150deg, rgba(255, 255, 255, 0.4) 0 38%, transparent 38% 62%, rgba(0, 0, 0, 0.16) 62% 100%);
    }
    .pl-vestimenta__gema-zona:hover .pl-vestimenta__gema { transform: translateY(-5px) rotate(4deg); }
    .pl-vestimenta__sombra {
      width: clamp(30px, 5.5vw, 40px);
      height: 4px;
      border-radius: 50%;
      background: color-mix(in srgb, var(--primary-color) 25%, transparent);
      filter: blur(2px);
    }

    .pl-vestimenta__leyenda {
      display: inline-block;
      padding: 0.55rem 1.6rem;
      border-top: 1px dashed var(--accent-color);
      border-bottom: 1px dashed var(--accent-color);
      font-family: Arial, Helvetica, sans-serif;
      font-size: clamp(0.64rem, 1.25vw, 0.74rem);
      letter-spacing: 0.32em;
      text-transform: uppercase;
      color: var(--secondary-color);
    }

    @media (max-width: 480px) {
      .pl-vestimenta__gema { width: 38px; height: 38px; }
    }

    @media (prefers-reduced-motion: reduce) {
      .pl-vestimenta * { transition: none !important; }
      .pl-vestimenta__gema-zona { opacity: 1; transform: none; }
    }
  </style>

  <div class="pl-vestimenta__tarjeta">
    <p class="pl-vestimenta__etiqueta" memory_type="text" memory_usage="custom" memory_key="vestimenta-etiqueta">Código de vestimenta</p>
    <h2 class="pl-vestimenta__titulo" memory_type="text" memory_usage="custom" memory_key="vestimenta-titulo">Gemas de inspiración</h2>
    <p class="pl-vestimenta__texto" memory_type="text" memory_usage="custom" memory_key="vestimenta-texto">
      Estos tonos pliegan la atmósfera de la noche; tómalos como inspiración para tu atuendo.
    </p>

    <div class="pl-vestimenta__enjambre" data-pl-enjambre aria-hidden="true"></div>

    <p class="pl-vestimenta__leyenda" memory_type="text" memory_usage="custom" memory_key="vestimenta-leyenda">Formal · tonos crepusculares</p>
  </div>

  <script>
    (function () {
      var root = document.currentScript ? document.currentScript.closest('section') : document.querySelector('.pl-vestimenta');
      if (!root) return;
      root.classList.add('pl-js');
      window.setTimeout(function () { root.classList.add('esta-visto'); }, 2500); // red de seguridad: nunca dejar contenido oculto

      var enjambre = root.querySelector('[data-pl-enjambre]');
      if (enjambre && !enjambre.children.length) {
        var tonos = ['#5a6b8c', '#8c7a9e', '#7d8ca6', '#a4899c', '#6e8291', '#938fb0'];
        for (var i = 0; i < tonos.length; i++) {
          var zona = document.createElement('span');
          zona.className = 'pl-vestimenta__gema-zona';
          zona.style.transitionDelay = (i * 0.08).toFixed(2) + 's, ' + (i * 0.08).toFixed(2) + 's';
          var gema = document.createElement('span');
          gema.className = 'pl-vestimenta__gema';
          gema.setAttribute('data-pl-tono', tonos[i]);
          var sombra = document.createElement('span');
          sombra.className = 'pl-vestimenta__sombra';
          zona.appendChild(gema);
          zona.appendChild(sombra);
          enjambre.appendChild(zona);
        }
      }

      var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
      function colorear() {
        root.querySelectorAll('[data-pl-tono]').forEach(function (g) {
          g.style.background = g.getAttribute('data-pl-tono');
        });
      }
      if (reduce || !('IntersectionObserver' in window)) {
        root.classList.add('esta-visto');
        colorear();
        return;
      }
      var io = new IntersectionObserver(function (entries) {
        entries.forEach(function (entry) {
          if (!entry.isIntersecting) return;
          root.classList.add('esta-visto');
          setTimeout(colorear, 220);
          io.disconnect();
        });
      }, { threshold: 0.3 });
      io.observe(root);
    })();
  </script>

  <script>
    var moduleMetadata = {
      module_type: 'vestimenta',
      module_name: 'vestimenta-plegado-gemas',
      style_name: 'Plegado Celeste — Vestimenta',
      descripcion: 'Gemas de origami facetadas que se despliegan y colorean por JS al entrar en pantalla, con sombras difuminadas y leyenda punteada.',
      tags: ['vestimenta', 'dress code', 'gemas', 'paleta', 'origami', 'celestial'],
      tipo: 'vestimenta'
    };
  </script>
</section>
