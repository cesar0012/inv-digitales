<section
  class="pl-corte"
  data-gemini-id="corte-plegado-acordeon"
>
  <style>
    .pl-corte {
      --primary-color: #1c2340;
      --secondary-color: #6b7395;
      --accent-color: #9aa7d0;
      --bg-color: #eef0f8;
      --surface-color: #ffffff;
      --surface-border-color: rgba(28, 35, 64, 0.2);
      --text-color: #1c2340;

      position: relative;
      isolation: isolate;
      box-sizing: border-box;
      padding: clamp(3rem, 8vw, 6rem) clamp(1rem, 5vw, 4rem);
      background-color: var(--bg-color);
      color: var(--text-color);
    }
    .pl-corte *,
    .pl-corte *::before,
    .pl-corte *::after { box-sizing: border-box; }

    .pl-corte__grid {
      display: grid;
      grid-template-columns: minmax(0, 7fr) minmax(0, 5fr);
      gap: clamp(1.8rem, 4.5vw, 3.4rem);
      align-items: center;
      width: min(100%, 1060px);
      margin: 0 auto;
    }

    .pl-corte__escena {
      position: relative;
      margin: 0;
      overflow: hidden;
      border: 1px solid var(--surface-border-color);
      box-shadow: 0 26px 58px rgba(28, 35, 64, 0.2);
    }
    .pl-corte__escena img {
      color: transparent;
      display: block;
      width: 100%;
      height: auto;
      aspect-ratio: 16 / 10;
      object-fit: cover;
      filter: saturate(0.92);
      transform: scale(1.07);
      transition: transform 0.5s ease;
    }
    .pl-corte.esta-visto .pl-corte__escena img { transform: scale(1); }

    .pl-corte__acordeon {
      position: absolute;
      inset: 0;
      z-index: 2;
      display: none;
      pointer-events: none;
    }
    .pl-corte.pl-js .pl-corte__acordeon { display: flex; }
    .pl-corte__pliegue {
      flex: 1;
      background: repeating-linear-gradient(90deg,
        color-mix(in srgb, var(--surface-color) 97%, transparent) 0 16px,
        color-mix(in srgb, var(--accent-color) 26%, var(--bg-color)) 16px 22px);
      box-shadow: inset 0 0 26px rgba(28, 35, 64, 0.12);
      transition: transform 0.5s cubic-bezier(0.22, 0.8, 0.3, 1), opacity 0.45s ease;
    }
    .pl-corte__pliegue:nth-child(1) { transition-delay: 0s; }
    .pl-corte__pliegue:nth-child(2) { transition-delay: 0.06s; }
    .pl-corte__pliegue:nth-child(3) { transition-delay: 0.12s; }
    .pl-corte__pliegue:nth-child(4) { transition-delay: 0.18s; }
    .pl-corte__pliegue:nth-child(5) { transition-delay: 0.24s; }
    .pl-corte.esta-visto .pl-corte__pliegue:nth-child(odd) { transform: translateY(-102%); }
    .pl-corte.esta-visto .pl-corte__pliegue:nth-child(even) { transform: translateY(102%); }

    .pl-corte__estrella {
      position: absolute;
      z-index: 3;
      top: 50%;
      left: 50%;
      width: 58px;
      transform: translate(-50%, -50%);
      color: var(--primary-color);
      background: var(--surface-color);
      border: 1px solid var(--surface-border-color);
      border-radius: 50%;
      padding: 9px;
      box-shadow: 0 12px 26px rgba(28, 35, 64, 0.25);
      transition: opacity 0.4s ease, transform 0.5s ease;
      animation: plCorteGira 14s linear infinite;
      display: none;
    }
    .pl-corte.pl-js .pl-corte__estrella { display: block; }
    @keyframes plCorteGira { to { transform: translate(-50%, -50%) rotate(360deg); } }
    .pl-corte.esta-visto .pl-corte__estrella { opacity: 0; }

    .pl-corte__contenido { text-align: left; }
    .pl-corte__etiqueta {
      margin: 0 0 0.6rem;
      font-family: Arial, Helvetica, sans-serif;
      font-size: clamp(0.6rem, 1.15vw, 0.68rem);
      letter-spacing: 0.44em;
      text-transform: uppercase;
      color: var(--accent-color);
    }
    .pl-corte__titulo {
      margin: 0 0 0.9rem;
      font-family: Georgia, 'Times New Roman', serif;
      font-weight: 400;
      font-size: clamp(1.85rem, 4.2vw, 2.7rem);
      line-height: 1.1;
      color: var(--primary-color);
    }
    .pl-corte__texto {
      margin: 0 0 1.2rem;
      font-family: Arial, Helvetica, sans-serif;
      font-size: clamp(0.88rem, 1.6vw, 0.98rem);
      line-height: 1.8;
      color: var(--secondary-color);
    }
    .pl-corte__firma {
      display: inline-flex;
      align-items: center;
      gap: 0.7rem;
      font-family: Georgia, 'Times New Roman', serif;
      font-style: italic;
      font-size: clamp(0.86rem, 1.6vw, 0.98rem);
      color: var(--primary-color);
    }
    .pl-corte__firma::after {
      content: '';
      width: 46px;
      height: 1px;
      background: var(--accent-color);
    }

    @media (max-width: 880px) {
      .pl-corte__grid { grid-template-columns: 1fr; }
      .pl-corte__contenido { text-align: center; }
      .pl-corte__firma { justify-content: center; }
    }

    @media (prefers-reduced-motion: reduce) {
      .pl-corte * { transition: none !important; animation: none !important; }
      .pl-corte .pl-corte__acordeon, .pl-corte .pl-corte__estrella { display: none !important; }
      .pl-corte__escena img { transform: none; }
    }
  </style>

  <div class="pl-corte__grid">
    <figure class="pl-corte__escena" memory_type="image" memory_usage="custom" memory_source="library" memory_key="corte-foto">
      <img
        src="https://loremflickr.com/960/600/celebration,night"
        alt="Momento del corte bajo las estrellas"
        path="placeholder"
        data-library-category="bodas"
        data-asset-type="corte"
        loading="lazy"
      />
      <span class="pl-corte__acordeon" aria-hidden="true">
        <span class="pl-corte__pliegue"></span>
        <span class="pl-corte__pliegue"></span>
        <span class="pl-corte__pliegue"></span>
        <span class="pl-corte__pliegue"></span>
        <span class="pl-corte__pliegue"></span>
      </span>
      <svg class="pl-corte__estrella" viewBox="0 0 48 48" fill="none" aria-hidden="true">
        <path d="M24 5 L28 19 L42 15 L31 24 L42 33 L28 29 L24 43 L20 29 L6 33 L17 24 L6 15 L20 19 Z" stroke="currentColor" stroke-width="1.3"/>
      </svg>
      <figcaption hidden>Momento del corte</figcaption>
    </figure>

    <div class="pl-corte__contenido" memory_type="text" memory_usage="custom" memory_key="corte-texto">
      <p class="pl-corte__etiqueta" memory_type="text" memory_usage="custom" memory_key="corte-etiqueta">Instante estelar</p>
      <h2 class="pl-corte__titulo" memory_type="text" memory_usage="custom" memory_key="corte-titulo">El corte de la noche</h2>
      <p class="pl-corte__texto">
        Los pliegues se abren para revelar la escena más dulce: el corte que marca el
        comienzo de nuestra nueva historia. Queremos vivirlo contigo.
      </p>
      <p class="pl-corte__firma" memory_type="text" memory_usage="custom" memory_key="corte-firma">Un deseo, una estrella.</p>
    </div>
  </div>

  <script>
    (function () {
      var root = document.currentScript ? document.currentScript.closest('section') : document.querySelector('.pl-corte');
      if (!root) return;
      root.classList.add('pl-js');
      window.setTimeout(function () { root.classList.add('esta-visto'); }, 2500); // red de seguridad: nunca dejar contenido oculto
      var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
      if (reduce || !('IntersectionObserver' in window)) { root.classList.add('esta-visto'); return; }
      var io = new IntersectionObserver(function (entries) {
        entries.forEach(function (entry) {
          if (entry.isIntersecting) { root.classList.add('esta-visto'); io.disconnect(); }
        });
      }, { threshold: 0.35 });
      io.observe(root.querySelector('.pl-corte__escena') || root);
    })();
  </script>

  <script>
    var moduleMetadata = {
      module_type: 'corte',
      module_name: 'corte-plegado-acordeon',
      style_name: 'Plegado Celeste — Corte',
      descripcion: 'Revelado en acordeón: cinco pliegues de papel alternos que se abren hacia arriba y abajo, con estrella giratoria que se desvanece.',
      tags: ['corte', 'acordeon', 'revelado', 'origami', 'papel', 'celestial'],
      tipo: 'corte'
    };
  </script>
</section>
