    .ma-regalos__cofre::before {

      height: 5px;
      margin: -1.6rem -1.6rem 1.8rem;
      border-radius: 999px;
      background: linear-gradient(90deg, transparent, var(--accent-color), transparent);
      box-shadow: 0 0 14px var(--accent-color);
    }

    .ma-regalos__etiqueta {

    .ma-regalos__moneda {

      border-radius: 50%;
      background: radial-gradient(circle at 32% 30%, color-mix(in srgb, var(--accent-color) 80%, white), var(--accent-color));
      box-shadow: 0 0 10px color-mix(in srgb, var(--accent-color) 60%, transparent);

    .ma-regalos__nombre {

      font-size: clamp(0.68rem, 1.3vw, 0.78rem);
      letter-spacing: 0.3em;
      text-transform: uppercase;
      cursor: pointer;
      box-shadow: 0 12px 26px color-mix(in srgb, var(--accent-color) 40%, transparent);
      transition: transform 0.4s ease, filter 0.4s ease;
    }
    .ma-regalos__boton:hover { transform: translateY(-2px); filter: brightness(1.08); }
    .ma-regalos__boton.esta-listo { filter: saturate(0.6) brightness(1.12); }
    .ma-regalos__nota {
      margin-top: 0.9rem;
      font-family: Arial, Helvetica, sans-serif;
      font-size: clamp(0.76rem, 1.4vw, 0.86rem);
      color: var(--secondary-color);
    }

    @media (prefers-reduced-motion: reduce) {
      .ma-regalos * { transition: none !important; }
      .ma-regalos__fila { opacity: 1 !important; transform: none !important; }
    }
  </style>

  <script>
    (function () {
      var root = document.currentScript ? document.currentScript.closest('section') : document.querySelector('.ma-regalos');
      if (!root) return;
      root.classList.add('ma-js');
      window.setTimeout(function () { root.classList.add('esta-visto'); }, 2500); // red de seguridad: nunca dejar contenido oculto

      var filas = Array.prototype.slice.call(root.querySelectorAll('[data-ma-fila]'));
      var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
      if (('IntersectionObserver' in window) && !reduce) {
        var io = new IntersectionObserver(function (entries) {
          entries.forEach(function (entry) {
            if (!entry.isIntersecting) return;
            filas.forEach(function (fila, i) { fila.style.transitionDelay = (i * 0.11).toFixed(2) + 's'; });
            filas.forEach(function (fila) { fila.classList.add('esta-visto'); });
            io.disconnect();
          });
        }, { threshold: 0.3 });
        io.observe(root.querySelector('[data-ma-lista]') || root);
      } else {
        filas.forEach(function (fila) { fila.classList.add('esta-visto'); });
      }

      var boton = root.querySelector('[data-ma-boton]');
      var texto = root.querySelector('[data-ma-boton-texto]');
      if (boton && texto) {
        boton.addEventListener('click', function () {
          var listo = boton.classList.toggle('esta-listo');
          texto.textContent = listo ? 'Regalo agendado' : 'Agendar regalo';
        });
      }
    })();
  </script>
