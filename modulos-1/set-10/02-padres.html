<section
  class="ma-padres"
  data-gemini-id="padres-padre"
  memory_type="background"
  memory_usage="protected"
  memory_source="generated"
  path="placeholder"
>
  <style>
    .ma-padres {
      --primary-color: #e8f2f4;
      --secondary-color: #9dbcc4;
      --accent-color: #5fc4cf;
      --bg-color: #0e1b22;
      --surface-color: #14232b;
      --surface-border-color: rgba(232, 242, 244, 0.16);
      --text-color: #e8f2f4;

      position: relative;
      isolation: isolate;
      box-sizing: border-box;
      padding: clamp(3rem, 8vw, 6rem) clamp(1rem, 5vw, 4rem);
      background-color: var(--bg-color);
      background-image: url('https://loremflickr.com/1600/900/coral,sea');
      background-size: cover;
      background-position: center;
      color: var(--text-color);
      text-align: center;
    }
    .ma-padres *,
    .ma-padres *::before,
    .ma-padres *::after { box-sizing: border-box; }

    .ma-padres::before {
      content: '';
      position: absolute;
      inset: 0;
      z-index: -1;
      background: linear-gradient(180deg, color-mix(in srgb, var(--bg-color) 60%, transparent), color-mix(in srgb, var(--bg-color) 93%, transparent));
    }

    .ma-padres__titulo {
      margin: 0 0 0.5rem;
      font-family: Georgia, 'Times New Roman', serif;
      font-weight: 400;
      font-size: clamp(1.7rem, 3.8vw, 2.4rem);
      color: var(--primary-color);
    }
    .ma-padres__intro {
      margin: 0 auto clamp(2rem, 5vw, 3rem);
      max-width: 50ch;
      font-family: Arial, Helvetica, sans-serif;
      font-size: clamp(0.84rem, 1.5vw, 0.94rem);
      line-height: 1.7;
      color: var(--secondary-color);
    }

    .ma-padres__arrecife {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: clamp(1.6rem, 4.4vw, 3.2rem);
      width: min(100%, 860px);
      margin: 0 auto;
      align-items: end;
    }

    .ma-padres__coral {
      position: relative;
      padding: clamp(1.8rem, 4vw, 2.5rem) clamp(1.2rem, 3vw, 1.9rem);
      background: color-mix(in srgb, var(--surface-color) 88%, transparent);
      border: 1px solid var(--surface-border-color);
      border-radius: 58% 42% 34% 66% / 12% 16% 8% 10%;
      box-shadow: 0 24px 52px rgba(0, 0, 0, 0.45);
      transition: opacity 0.5s ease, transform 0.5s cubic-bezier(0.22, 0.8, 0.3, 1);
    }
    .ma-padres.ma-js .ma-padres__coral { opacity: 0; transform: translateY(26px) rotate(-2deg); }
    .ma-padres .ma-padres__coral.esta-visto { opacity: 1; transform: none; }
    .ma-padres__coral:nth-child(2) { border-radius: 42% 58% 66% 34% / 16% 12% 10% 8%; }

    .ma-padres__retrato {
      width: clamp(100px, 14vw, 130px);
      margin: 0 auto 1rem;
      padding: 5px;
      border: 1px solid var(--accent-color);
      border-radius: 54% 46% 52% 48% / 48% 54% 46% 52%;
      overflow: hidden;
      box-shadow: 0 0 24px color-mix(in srgb, var(--accent-color) 30%, transparent);
    }
    .ma-padres__retrato img {
      color: transparent;
      display: block;
      width: 100%;
      height: auto;
      aspect-ratio: 1 / 1;
      object-fit: cover;
      border-radius: 54% 46% 52% 48% / 48% 54% 46% 52%;
      filter: saturate(0.95);
    }

    .ma-padres__rol {
      margin: 0 0 0.35rem;
      font-family: Arial, Helvetica, sans-serif;
      font-size: clamp(0.58rem, 1.1vw, 0.66rem);
      letter-spacing: 0.4em;
      text-transform: uppercase;
      color: var(--accent-color);
    }
    .ma-padres__nombres {
      margin: 0;
      font-family: Georgia, 'Times New Roman', serif;
      font-size: clamp(1.04rem, 2.1vw, 1.3rem);
      line-height: 1.3;
      color: var(--primary-color);
    }

    @media (max-width: 740px) {
      .ma-padres__arrecife { grid-template-columns: 1fr; max-width: 390px; }
    }

    @media (prefers-reduced-motion: reduce) {
      .ma-padres * { transition: none !important; }
      .ma-padres__coral { opacity: 1 !important; transform: none !important; }
    }
  </style>

  <header memory_type="text" memory_usage="custom" memory_key="padres-intro">
    <h2 class="ma-padres__titulo" memory_type="text" memory_usage="custom" memory_key="padres-titulo">Formaciones madre</h2>
    <p class="ma-padres__intro" memory_type="text" memory_usage="custom" memory_key="padres-texto">Los arrecifes que nos dieron refugio; esta inmersion también es suya.</p>
  </header>

  <div class="ma-padres__arrecife">
    <article class="ma-padres__coral" data-ma-coral>
      <figure class="ma-padres__retrato" memory_type="image" memory_usage="custom" memory_source="library" memory_key="padres-retrato-uno">
        <img src="https://loremflickr.com/380/380/family,sea" alt="Retrato de la familia de la novia" path="placeholder" data-library-category="bodas" data-asset-type="retrato-familia" loading="lazy" />
        <figcaption hidden>Familia uno</figcaption>
      </figure>
      <div memory_type="text" memory_usage="custom" memory_key="padres-bloque-uno">
        <p class="ma-padres__rol">Padres de la novia</p>
        <h3 class="ma-padres__nombres">Nombre Papá &amp; Nombre Mamá</h3>
      </div>
    </article>

    <article class="ma-padres__coral" data-ma-coral>
      <figure class="ma-padres__retrato" memory_type="image" memory_usage="custom" memory_source="library" memory_key="padres-retrato-dos">
        <img src="https://loremflickr.com/380/380/parents,ocean" alt="Retrato de la familia del novio" path="placeholder" data-library-category="bodas" data-asset-type="retrato-familia" loading="lazy" />
        <figcaption hidden>Familia dos</figcaption>
      </figure>
      <div memory_type="text" memory_usage="custom" memory_key="padres-bloque-dos">
        <p class="ma-padres__rol">Padres del novio</p>
        <h3 class="ma-padres__nombres">Nombre Papá &amp; Nombre Mamá</h3>
      </div>
    </article>
  </div>

  <script>
    (function () {
      var root = document.currentScript ? document.currentScript.closest('section') : document.querySelector('.ma-padres');
      if (!root) return;
      root.classList.add('ma-js');
      window.setTimeout(function () { root.classList.add('esta-visto'); }, 2500); // red de seguridad: nunca dejar contenido oculto
      var corales = Array.prototype.slice.call(root.querySelectorAll('[data-ma-coral]'));
      var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
      if (reduce || !('IntersectionObserver' in window)) {
        corales.forEach(function (c) { c.classList.add('esta-visto'); });
        return;
      }
      var io = new IntersectionObserver(function (entries) {
        entries.forEach(function (entry) {
          if (!entry.isIntersecting) return;
          var i = corales.indexOf(entry.target);
          entry.target.style.transitionDelay = (Math.max(i, 0) * 0.16).toFixed(2) + 's';
          entry.target.classList.add('esta-visto');
          io.unobserve(entry.target);
        });
      }, { threshold: 0.25 });
      corales.forEach(function (c) { io.observe(c); });
    })();
  </script>

  <script>
    var moduleMetadata = {
      module_type: 'padres',
      module_name: 'padres-padre',
      style_name: 'Marino de Profundidad — Padres',
      descripcion: 'Formaciones de coral con contornos blob asimétricos y retratos orgánicos con halo cian; ascenso desde el fondo del arrecife.',
      tags: ['padres', 'familias', 'marino', 'coral', 'blob', 'organico'],
      tipo: 'padres'
    };
  </script>
</section>
