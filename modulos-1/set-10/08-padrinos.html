    .ma-padrinos .ma-padrinos__faro.esta-visto { opacity: 1; transform: none; }

    .ma-padrinos__linterna {
      width: 12px;
      height: 12px;
      margin: 0 auto 0.9rem;

      background: var(--accent-color);
      box-shadow: 0 0 18px var(--accent-color);
      animation: maPadrinosParpadeo 4s ease-in-out infinite;

    .ma-padrinos__faro:nth-child(2) .ma-padrinos__linterna { animation-delay: 1s; }

    .ma-padrinos__faro:nth-child(4) .ma-padrinos__linterna { animation-delay: 3s; }
    @keyframes maPadrinosParpadeo {
      0%, 100% { opacity: 0.35; }
      50% { opacity: 1; }
    }

    .ma-padrinos__retrato {

      border-radius: 999px 999px 8px 8px;

    .ma-padrinos__retrato img {

    .ma-padrinos__rol {

    .ma-padrinos__nombre {

      line-height: 1.3;
      color: var(--primary-color);
    }

    @media (max-width: 860px) {

    }
    @media (max-width: 440px) {
      .ma-padrinos__faros { grid-template-columns: 1fr; max-width: 250px; }
    }

    @media (prefers-reduced-motion: reduce) {
      .ma-padrinos * { transition: none !important; animation: none !important; }
      .ma-padrinos__faro { opacity: 1 !important; transform: none !important; }
    }

      if (reduce || !('IntersectionObserver' in window)) {

          entry.target.classList.add('esta-visto');
          io.unobserve(entry.target);
