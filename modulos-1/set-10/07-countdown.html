<section
  class="ma-countdown"
  data-gemini-id="countdown-marea-tiempo"
  path="placeholder"
  memory_source="generated"
  memory_type="background"
  memory_usage="protected"
  data-countdown-target="YYYY-MM-DDTHH:MM:SS"
>
  <style>
    .ma-countdown {
      position: relative;
      isolation: isolate;
      overflow: hidden;
      box-sizing: border-box;
      min-height: 660px;
      display: grid;
      place-items: center;
      padding: clamp(3rem, 7vw, 5rem) clamp(1rem, 5vw, 3rem);
      background-color: var(--bg-color, #0e1b22);
      background-image: url('https://loremflickr.com/1600/900/deep,sea');
      background-size: cover;
      background-position: center;
      color: var(--text-color, #e8f2f4);
      text-align: center;
    }
    .ma-countdown *,
    .ma-countdown *::before,
    .ma-countdown *::after { box-sizing: border-box; }

    .ma-countdown::before {
      content: '';
      position: absolute;
      inset: 0;
      z-index: -1;
      background: linear-gradient(180deg, color-mix(in srgb, var(--bg-color, #0e1b22) 60%, transparent), color-mix(in srgb, var(--bg-color, #0e1b22) 94%, transparent));
    }

    .ma-countdown__contenido { width: min(100%, 760px); position: relative; z-index: 2; }

    .ma-countdown__etiqueta {
      margin: 0 0 0.55rem;
      font-family: Arial, Helvetica, sans-serif;
      font-size: clamp(0.6rem, 1.15vw, 0.68rem);
      letter-spacing: 0.44em;
      text-transform: uppercase;
      color: var(--accent-color, #5fc4cf);
    }
    .ma-countdown__titulo {
      margin: 0 0 0.4rem;
      font-family: Georgia, 'Times New Roman', serif;
      font-weight: 400;
      font-size: clamp(1.75rem, 4vw, 2.7rem);
      color: var(--primary-color, #e8f2f4);
    }
    .ma-countdown__fecha {
      display: block;
      margin-bottom: clamp(1.5rem, 3.6vw, 2.2rem);
      font-family: Arial, Helvetica, sans-serif;
      font-size: clamp(0.76rem, 1.5vw, 0.88rem);
      letter-spacing: 0.3em;
      text-transform: uppercase;
      color: var(--secondary-color, #9dbcc4);
    }

    .ma-countdown__reloj-marea {
      position: relative;
      width: clamp(190px, 28vw, 250px);
      margin: 0 auto clamp(1.4rem, 3.4vw, 2rem);
    }
    .ma-countdown__reloj-marea svg { display: block; width: 100%; height: auto; }
    .ma-countdown__esfera { fill: color-mix(in srgb, var(--surface-color, #14232b) 92%, transparent); stroke: var(--surface-border-color, rgba(232, 242, 244, 0.16)); stroke-width: 1.5; }
    .ma-countdown__marcas { stroke: color-mix(in srgb, var(--secondary-color, #9dbcc4) 55%, transparent); stroke-width: 1.4; }
    .ma-countdown__ola-arco {
      fill: none;
      stroke: var(--accent-color, #5fc4cf);
      stroke-width: 5;
      stroke-linecap: round;
      transform: rotate(-90deg);
      transform-origin: 115px 115px;
      transition: stroke-dashoffset 0.5s linear;
      filter: drop-shadow(0 0 8px color-mix(in srgb, var(--accent-color, #5fc4cf) 70%, transparent));
    }
    .ma-countdown__ola-centro {
      position: absolute;
      inset: 22%;
      display: grid;
      place-items: center;
      border-radius: 46% 54% 52% 48% / 52% 46% 54% 48%;
      background: color-mix(in srgb, var(--surface-color, #14232b) 95%, transparent);
      border: 1px solid var(--surface-border-color, rgba(232, 242, 244, 0.16));
      font-family: 'Courier New', monospace;
      font-size: clamp(1.5rem, 3.4vw, 2.1rem);
      font-variant-numeric: tabular-nums;
      color: var(--primary-color, #e8f2f4);
      animation: maCountdownRespira 5s ease-in-out infinite;
    }
    @keyframes maCountdownRespira {
      0%, 100% { border-radius: 46% 54% 52% 48% / 52% 46% 54% 48%; }
      50% { border-radius: 54% 46% 48% 52% / 46% 54% 48% 52%; }
    }

    .ma-countdown__unidades {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: clamp(0.6rem, 1.8vw, 1rem);
      max-width: 620px;
      margin: 0 auto;
    }
    .ma-countdown__unidad {
      padding: clamp(0.9rem, 2.2vw, 1.3rem) 0.3rem;
      background: color-mix(in srgb, var(--surface-color, #14232b) 90%, transparent);
      border: 1px solid var(--surface-border-color, rgba(232, 242, 244, 0.16));
      border-radius: 18px 18px 8px 8px;
    }
    .ma-countdown__numero {
      display: block;
      font-family: 'Courier New', monospace;
      font-size: clamp(1.5rem, 4vw, 2.4rem);
      font-variant-numeric: tabular-nums;
      line-height: 1;
      color: var(--primary-color, #e8f2f4);
    }
    .ma-countdown__rotulo {
      display: block;
      margin-top: 0.45rem;
      font-family: Arial, Helvetica, sans-serif;
      font-size: clamp(0.54rem, 1.05vw, 0.62rem);
      letter-spacing: 0.34em;
      text-transform: uppercase;
      color: var(--secondary-color, #9dbcc4);
    }

    @media (max-width: 560px) {
      .ma-countdown__unidades { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .ma-countdown { min-height: 600px; }
    }

    @media (prefers-reduced-motion: reduce) {
      .ma-countdown__ola-arco { transition: none; }
      .ma-countdown__ola-centro { animation: none; }
    }
  </style>

  <div class="ma-countdown__contenido">
    <p class="ma-countdown__etiqueta" memory_type="text" memory_usage="custom" memory_key="countdown-etiqueta">La marea sube</p>
    <h2 class="ma-countdown__titulo" memory_type="text" memory_usage="custom" memory_key="countdown-titulo">Cuenta regresiva</h2>
    <time class="ma-countdown__fecha" datetime="YYYY-MM-DDTHH:MM:SS" memory_type="text" memory_usage="custom" memory_key="countdown-fecha">Fecha del evento</time>

    <div class="ma-countdown__reloj-marea" aria-hidden="true">
      <svg viewBox="0 0 230 230">
        <circle class="ma-countdown__esfera" cx="115" cy="115" r="108"/>
        <g class="ma-countdown__marcas">
          <path d="M115 12 V24 M115 206 V218 M12 115 H24 M206 115 H218"/>
          <path d="M43 43 L51 51 M187 187 L179 179 M187 43 L179 51 M43 187 L51 179"/>
        </g>
        <circle class="ma-countdown__ola-arco" data-ma-arco cx="115" cy="115" r="92" stroke-dasharray="578.1" stroke-dashoffset="0"/>
      </svg>
      <div class="ma-countdown__ola-centro" data-ma-segundos>00</div>
    </div>

    <div class="ma-countdown__unidades" aria-label="Cuenta regresiva">
      <div class="ma-countdown__unidad"><span class="ma-countdown__numero" data-countdown-unit="days">--</span><span class="ma-countdown__rotulo">Días</span></div>
      <div class="ma-countdown__unidad"><span class="ma-countdown__numero" data-countdown-unit="hours">--</span><span class="ma-countdown__rotulo">Horas</span></div>
      <div class="ma-countdown__unidad"><span class="ma-countdown__numero" data-countdown-unit="minutes">--</span><span class="ma-countdown__rotulo">Min</span></div>
      <div class="ma-countdown__unidad"><span class="ma-countdown__numero" data-countdown-unit="seconds">--</span><span class="ma-countdown__rotulo">Seg</span></div>
    </div>
  </div>

  <script>
    (function () {
      var el = null;
      try { el = document.currentScript.closest('[data-gemini-id^="countdown"]'); } catch (e) {}
      if (!el) el = document.querySelector('[data-gemini-id^="countdown"]');
      if (!el) return;

      var arco = el.querySelector('[data-ma-arco]');
      var centro = el.querySelector('[data-ma-segundos]');
      var LONGITUD = arco ? 2 * Math.PI * 92 : 0;
      var target = NaN;
      var attr = el.getAttribute('data-countdown-target');
      if (attr && attr.indexOf('YYYY') === -1) { var p = new Date(attr); if (!isNaN(p.getTime())) target = p.getTime(); }
      if (isNaN(target) && window.__countdownTarget) { var p1 = new Date(window.__countdownTarget); if (!isNaN(p1.getTime())) target = p1.getTime(); }
      if (isNaN(target) && window.countdown_target) { var p2 = new Date(window.countdown_target); if (!isNaN(p2.getTime())) target = p2.getTime(); }

      var intervalId = null;
      (window.__countdownIntervals = window.__countdownIntervals || []).forEach(clearInterval);
      window.__countdownIntervals = [];

      function pad2(n) { return n < 10 ? '0' + n : '' + n; }
      function setUnit(unit, value) {
        var node = el.querySelector('[data-countdown-unit="' + unit + '"]');
        if (node) node.textContent = value;
      }
      function tick() {
        if (!Number.isFinite(target)) return;
        var diff = Math.max(target - Date.now(), 0);
        setUnit('days', Math.floor(diff / 86400000));
        setUnit('hours', pad2(Math.floor((diff % 86400000) / 3600000)));
        setUnit('minutes', pad2(Math.floor((diff % 3600000) / 60000)));
        var s = Math.floor((diff % 60000) / 1000);
        setUnit('seconds', pad2(s));
        if (centro) centro.textContent = pad2(s);
        if (arco) arco.setAttribute('stroke-dashoffset', (LONGITUD * (1 - s / 60)).toFixed(2));
        if (diff === 0 && intervalId !== null) {
          clearInterval(intervalId);
          intervalId = null;
          window.__countdownIntervals = [];
        }
      }
      function start(newTarget) {
        if (newTarget) { var p = new Date(newTarget); if (!isNaN(p.getTime())) target = p.getTime(); }
        (window.__countdownIntervals || []).forEach(clearInterval);
        window.__countdownIntervals = [];
        intervalId = null;
        if (!Number.isFinite(target)) return;
        tick();
        if (target > Date.now()) {
          intervalId = setInterval(tick, 1000);
          window.__countdownIntervals.push(intervalId);
        }
      }
      start();
      window.updateCountdown = start;
    })();
  </script>

  <script>
    var moduleMetadata = {
      module_type: 'countdown',
      module_name: 'countdown-marea-tiempo',
      style_name: 'Reloj de Marea',
      descripcion: 'Esfera abisal con arco luminoso de marea, centro orgánico que respira contorneando blob y unidades en peceras.',
      tags: ['countdown', 'cuenta regresiva', 'marea', 'abisal', 'blob', 'marino'],
      tipo: 'countdown'
    };
  </script>
</section>
