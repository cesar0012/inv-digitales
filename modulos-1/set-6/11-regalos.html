    .bh-regalos__boton::after {

      right: 10px;
      top: 50%;
      width: 0;
      height: 0;
      transform: translateY(-50%);
      border-left: 9px solid currentColor;
      border-top: 6px solid transparent;
      border-bottom: 6px solid transparent;

      transition: opacity 0.4s ease;

  <script>
    (function () {
      var root = document.currentScript ? document.currentScript.closest('section') : document.querySelector('.bh-regalos');
      if (!root) return;
      root.classList.add('bh-js');
      window.setTimeout(function () { root.classList.add('esta-visto'); }, 2500); // red de seguridad: nunca dejar contenido oculto

      var filas = Array.prototype.slice.call(root.querySelectorAll('[data-bh-fila]'));
      var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
      if (('IntersectionObserver' in window) && !reduce) {
        var io = new IntersectionObserver(function (entries) {
          entries.forEach(function (entry) {
            if (!entry.isIntersecting) return;
            filas.forEach(function (fila, i) { fila.style.transitionDelay = (i * 0.11).toFixed(2) + 's'; });
            filas.forEach(function (fila) { fila.classList.add('esta-visto'); });
            io.disconnect();
          });
        }, { threshold: 0.3 });
        io.observe(root.querySelector('[data-bh-lista]') || root);
      } else {
        filas.forEach(function (fila) { fila.classList.add('esta-visto'); });
      }

      var boton = root.querySelector('[data-bh-boton]');
      var texto = root.querySelector('[data-bh-boton-texto]');
      if (boton && texto) {
        boton.addEventListener('click', function () {
          var listo = boton.classList.toggle('esta-listo');
          texto.textContent = listo ? 'Regalo agendado' : 'Agendar regalo';
        });
      }
    })();
