    .bh-padrinos__celda:nth-child(1) { background: color-mix(in srgb, var(--accent-color) 10%, var(--surface-color)); }
    .bh-padrinos__celda:nth-child(4) { background: color-mix(in srgb, var(--secondary-color) 12%, var(--surface-color)); }

    .bh-padrinos__retrato {

    .bh-padrinos__celda:nth-child(1) .bh-padrinos__retrato { border-radius: 50%; }
    .bh-padrinos__celda:nth-child(2) .bh-padrinos__retrato { border-radius: 0; }
    .bh-padrinos__celda:nth-child(3) .bh-padrinos__retrato { border-radius: 50% 50% 0 0; }
    .bh-padrinos__celda:nth-child(4) .bh-padrinos__retrato { border-radius: 0 0 50% 50%; }

    @media (max-width: 680px) {

    @media (prefers-reduced-motion: reduce) {

  <script>
    (function () {
      var root = document.currentScript ? document.currentScript.closest('section') : document.querySelector('.bh-padrinos');
      if (!root) return;
      root.classList.add('bh-js');
      window.setTimeout(function () { root.classList.add('esta-visto'); }, 2500); // red de seguridad: nunca dejar contenido oculto
      var celdas = Array.prototype.slice.call(root.querySelectorAll('[data-bh-celda]'));
      var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
      if (reduce || !('IntersectionObserver' in window)) {
        celdas.forEach(function (c) { c.classList.add('esta-visto'); });
        return;
      }
      var io = new IntersectionObserver(function (entries) {
        entries.forEach(function (entry) {
          if (!entry.isIntersecting) return;
          var i = celdas.indexOf(entry.target);
          entry.target.style.transitionDelay = (Math.max(i, 0) * 0.11).toFixed(2) + 's';
          entry.target.classList.add('esta-visto');
          io.unobserve(entry.target);
        });
      }, { threshold: 0.25 });
      celdas.forEach(function (c) { io.observe(c); });
    })();
  </script>
