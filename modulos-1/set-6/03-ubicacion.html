  <style>
    .bh-ubicacion {
      --primary-color: #22242a;
      --secondary-color: #6d7078;

      --surface-color: #fbfaf7;
      --surface-border-color: rgba(34, 36, 42, 0.18);
      --text-color: #22242a;

      position: relative;
      isolation: isolate;
      box-sizing: border-box;
      padding: clamp(3rem, 8vw, 6rem) clamp(1rem, 5vw, 4rem);
      background-color: var(--bg-color);
      background-image: url('https://loremflickr.com/1600/900/architecture,minimal');
      background-size: cover;
      background-position: center;
      color: var(--text-color);
    }
    .bh-ubicacion *,
    .bh-ubicacion *::before,
    .bh-ubicacion *::after { box-sizing: border-box; }

    .bh-ubicacion::before {

      inset: 0;
      z-index: -1;
      background: color-mix(in srgb, var(--bg-color) 93%, transparent);

    .bh-ubicacion__grid {

      margin: 0 auto;

    .bh-ubicacion__info {

      align-content: center;
      gap: 1rem;
      padding: clamp(1.6rem, 4vw, 2.6rem);
      background: var(--surface-color);
      border: 1px solid var(--surface-border-color);
    }
    .bh-ubicacion__rotulo {

      align-items: center;
      gap: 0.7rem;
      font-family: Arial, Helvetica, sans-serif;
      font-size: clamp(0.6rem, 1.15vw, 0.68rem);

      text-transform: uppercase;
      color: var(--secondary-color);

    .bh-ubicacion__rotulo i {

    .bh-ubicacion__punto {

      font-family: Arial, Helvetica, sans-serif;
      font-size: clamp(0.62rem, 1.2vw, 0.7rem);
      letter-spacing: 0.26em;
      text-transform: uppercase;
      color: var(--primary-color);

    .bh-ubicacion__diana {
      position: relative;
      width: 14px;
      height: 14px;
      border-radius: 50%;
      background: var(--accent-color);
    }
    .bh-ubicacion__diana::after {
      content: '';
      position: absolute;
      inset: -7px;
      border: 2px solid var(--primary-color);
      border-radius: 50%;
      opacity: 0;
      transform: scale(0.4);
    }
    .bh-ubicacion.esta-visto .bh-ubicacion__diana::after { animation: bhUbicacionBlanco 1.8s ease-out infinite; }
    @keyframes bhUbicacionBlanco {
      0% { opacity: 0.85; transform: scale(0.4); }
      75% { opacity: 0.1; transform: scale(1.3); }
      100% { opacity: 0; transform: scale(1.4); }
    }
    .bh-ubicacion__boton {
      justify-self: start;
      display: inline-flex;
      align-items: center;
      gap: 0.7rem;
      padding: 0.78rem 1.8rem;
      background: var(--primary-color);
      color: var(--bg-color);
      font-family: Arial, Helvetica, sans-serif;

      letter-spacing: 0.3em;
      text-transform: uppercase;

    }
    .bh-ubicacion__boton:hover { background: var(--accent-color); }

    .bh-ubicacion__mapa-zona {

    .bh-ubicacion__mapa-cinta {

      padding: 0.7rem 1rem;
      background: var(--primary-color);

      font-family: Arial, Helvetica, sans-serif;
      font-size: clamp(0.58rem, 1.1vw, 0.66rem);
      letter-spacing: 0.3em;
      text-transform: uppercase;
    }
    .bh-ubicacion__mapa-cinta b {
      display: inline-block;
      width: 16px;
      height: 16px;
      border-radius: 50%;
      background: var(--accent-color);
    }
    .bh-ubicacion__mapa { min-height: 0; }
    .bh-ubicacion__mapa iframe {
      display: block;
      width: 100%;
      height: 100%;
      min-height: 320px;
      aspect-ratio: 16 / 10;
      border: 0;
      filter: saturate(0.8);
    }
    .bh-ubicacion__postal {
      position: absolute;
      bottom: -16px;
      right: -12px;
      width: clamp(110px, 15vw, 150px);
      margin: 0;
      border: 1px solid var(--surface-border-color);
      background: var(--surface-color);
      padding: 5px;
      box-shadow: 6px 6px 0 color-mix(in srgb, var(--accent-color) 55%, transparent);
      transform: rotate(2deg);
    }
    .bh-ubicacion__postal img {
      color: transparent;
      display: block;
      width: 100%;
      height: auto;
      aspect-ratio: 4 / 3;
      object-fit: cover;
      filter: saturate(0.9);
    }

    @media (max-width: 880px) {
      .bh-ubicacion__grid { grid-template-columns: 1fr; }
      .bh-ubicacion__postal { right: 8px; }
    }

    @media (prefers-reduced-motion: reduce) {
      .bh-ubicacion * { animation: none !important; transition: none !important; }
    }
  </style>

  <script>
    (function () {
      var root = document.currentScript ? document.currentScript.closest('section') : document.querySelector('.bh-ubicacion');
      if (!root) return;
      root.classList.add('bh-js');
      window.setTimeout(function () { root.classList.add('esta-visto'); }, 2500); // red de seguridad: nunca dejar contenido oculto
      var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
      if (reduce || !('IntersectionObserver' in window)) { root.classList.add('esta-visto'); return; }

      io.observe(root);
    })();
  </script>
