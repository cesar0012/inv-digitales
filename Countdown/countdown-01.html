<section
  class="countdown-central"
  data-gemini-id="countdown-central-classic"
  path="placeholder"
  memory_source="generated"
  memory_type="background"
  memory_usage="protected"
  data-countdown-target="YYYY-MM-DDTHH:MM:SS"
>
  <style>
    .countdown-central {
      --countdown-panel: color-mix(in srgb, var(--bg-color) 82%, transparent);
      position: relative;
      isolation: isolate;
      min-height: clamp(28rem, 62vw, 44rem);
      display: grid;
      place-items: center;
      padding: clamp(3rem, 8vw, 7rem) clamp(1rem, 5vw, 4rem);
      overflow: hidden;
      background-color: var(--bg-color);
      background-image: url('https://loremflickr.com/1600/900/celebration,elegant');
      background-position: center;
      background-size: cover;
      color: var(--text-color);
      text-align: center;
    }

    .countdown-central::before {
      content: '';
      position: absolute;
      inset: 0;
      z-index: -1;
      background: var(--countdown-panel);
    }

    .countdown-central__content { width: min(100%, 62rem); }
    .countdown-central__heading {
      margin: 0 0 .65rem;
      font-size: clamp(1.5rem, 3.8vw, 2.7rem);
      color: var(--primary-color);
    }
    .countdown-central__date {
      display: block;
      margin-bottom: clamp(2rem, 6vw, 4rem);
      font-size: clamp(.9rem, 2vw, 1.1rem);
      color: var(--text-color);
    }
    .countdown-central__timer {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: clamp(.4rem, 2vw, 1.5rem);
    }
    .countdown-central__unit { min-width: 0; }
    .countdown-central__number {
      display: block;
      font-size: clamp(2rem, 7vw, 5rem);
      line-height: .95;
      font-variant-numeric: tabular-nums;
      color: var(--primary-color);
    }
    .countdown-central__label {
      display: block;
      margin-top: .75rem;
      font-size: clamp(.62rem, 1.5vw, .9rem);
      letter-spacing: .12em;
      text-transform: uppercase;
      color: var(--text-color);
    }
  </style>

  <div class="countdown-central__content">
    <h2 class="countdown-central__heading" memory_type="text" memory_usage="custom" memory_key="countdown-strip-heading">Falta poco</h2>
    <time class="countdown-central__date" datetime="YYYY-MM-DDTHH:MM:SS" memory_type="text" memory_usage="custom" memory_key="countdown-event-date">Fecha del evento</time>
    <div class="countdown-central__timer" aria-label="Cuenta regresiva">
      <div class="countdown-central__unit"><span class="countdown-central__number" data-countdown-unit="days">--</span><span class="countdown-central__label">Días</span></div>
      <div class="countdown-central__unit"><span class="countdown-central__number" data-countdown-unit="hours">--</span><span class="countdown-central__label">Horas</span></div>
      <div class="countdown-central__unit"><span class="countdown-central__number" data-countdown-unit="minutes">--</span><span class="countdown-central__label">Min</span></div>
      <div class="countdown-central__unit"><span class="countdown-central__number" data-countdown-unit="seconds">--</span><span class="countdown-central__label">Seg</span></div>
    </div>
  </div>
</section>

<script>
  (function () {
    var el = null;
    try { el = document.currentScript.closest('[data-gemini-id^="countdown"]'); } catch(e) {}
    if (!el) el = document.querySelector('[data-gemini-id^="countdown"]');
    if (!el) return;
    var targetAttr = el.getAttribute('data-countdown-target');
    var target = NaN;
    if (targetAttr && targetAttr.indexOf('YYYY') === -1) {
      var parsed = new Date(targetAttr);
      if (!isNaN(parsed.getTime())) target = parsed.getTime();
    }
    if (isNaN(target)) {
      if (window.__countdownTarget) { var _p = new Date(window.__countdownTarget); if (!isNaN(_p.getTime())) target = _p.getTime(); }
      else if (window.countdown_target) { var _p2 = new Date(window.countdown_target); if (!isNaN(_p2.getTime())) target = _p2.getTime(); }
    }
    console.log('[COUNTDOWN-MODULE] el encontrado=', !!el, 'target=', targetAttr, 'targetMs=', isNaN(target) ? 'NaN' : target);
    var intervalId = null;
    var _t0 = false;
    (window.__countdownIntervals = window.__countdownIntervals || []).forEach(clearInterval);
    window.__countdownIntervals = [];
    function pad2(n) { return n < 10 ? '0' + n : '' + n; }
    function setUnit(unit, value) { var node = el.querySelector('[data-countdown-unit="' + unit + '"]'); if (node) node.textContent = value; }
    function tick() {
      var diff = target - Date.now();
      if (!_t0) { console.log('[COUNTDOWN-MODULE] primer tick diff=', diff); _t0 = true; }
      if (diff < 0) diff = 0;
      setUnit('days', Math.floor(diff / 86400000));
      setUnit('hours', pad2(Math.floor((diff % 86400000) / 3600000)));
      setUnit('minutes', pad2(Math.floor((diff % 3600000) / 60000)));
      setUnit('seconds', pad2(Math.floor((diff % 60000) / 1000)));
      if (diff === 0 && intervalId !== null) { clearInterval(intervalId); intervalId = null; window.__countdownIntervals = []; }
    }
    function start(newTarget) {
      if (newTarget) target = new Date(newTarget).getTime();
      (window.__countdownIntervals || []).forEach(clearInterval);
      window.__countdownIntervals = [];
      intervalId = null;
      if (!Number.isFinite(target)) return;
      tick();
      if (target > Date.now()) { intervalId = setInterval(tick, 1000); window.__countdownIntervals.push(intervalId); }
    }
    start();
    window.updateCountdown = start;
  })();
</script>
