    }
    .countdown-editorial__unit {

      padding: clamp(1.5rem, 4vw, 3rem) clamp(.25rem, 2vw, 1.5rem);
      text-align: center;
    }
    .countdown-editorial__unit + .countdown-editorial__unit { border-left: 1px solid color-mix(in srgb, var(--accent-color) 50%, transparent); }
    .countdown-editorial__number {

      font-size: clamp(3rem, 10vw, 8rem);

      .countdown-editorial__number { font-size: clamp(3.2rem, 20vw, 5.5rem); }

  </div>
