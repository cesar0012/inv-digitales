<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Invitación Fixture</title>
  <style>
    :root {
      --primary-color: #deadbe;
      --legacy-var: 7;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: system-ui, -apple-system, sans-serif; }
  </style>
</head>
<body>
  <section
    class="fixture-count"
    data-gemini-id="countdown-fixture"
    memory_type="background"
    memory_usage="protected"
    data-countdown-target="2026-12-31T00:00:00"
  >
    <style>
      .fixture-count {
        --panel: color-mix(in srgb, var(--bg-color) 82%, transparent);
        background-color: var(--bg-color);
        color: var(--text-color);
        padding: 2rem;
        text-align: center;
      }
      .fixture-count h4 { color: var(--primary-color); }
    </style>
    <h4 memory_type="text" memory_usage="custom" memory_key="fixture-count-title">Cuenta regresiva</h4>
  </section>

  <section
    class="fixture-literales"
    data-gemini-id="detalles-regalo"
    memory_type="background"
    memory_usage="protected"
    memory_source="generated"
    path="placeholder"
  >
    <style>
      .fixture-literales {
        --primary-color: #123456;
        --text-color: #654321;
        --panel-tone: #abcdef;
        background-color: #112233;
        color: #445566;
        font-family: 'Comic Sans MS', cursive;
        border: 3px dotted #999999;
        padding: 2rem;
      }
      .fixture-literales .nota { color: var(--accent-color); }
    </style>

    <div class="fixture-literales__content" memory_type="text" memory_usage="custom" memory_key="fixture-content">
      <style>
        .fixture-literales .tarjeta {
          color: #333333;
          background-color: #fff7ee;
          border-color: #cccccc;
          border: 2px solid #c99999;
          font-family: Georgia, serif;
          padding: 1rem;
        }
      </style>
      <h3 memory_type="text" memory_usage="custom" memory_key="fixture-title" style="color: #a11a11; font-family: 'Times New Roman', serif;">Título editable</h3>
      <p style="background-color: #ffeecc;">Texto editable</p>
      <div style="background: rgba(0,0,0,.5); color: #222222;">Overlay semitransparente (el rgba debe preservarse)</div>
    </div>
  </section>
</body>
</html>
